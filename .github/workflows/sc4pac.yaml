name: sc4pac CI

on:
  push:
    branches: [ "main", "action" ]
  pull_request:
    branches: [ "main" ]

# permissions:
#   contents: read

jobs:
  channel:
    uses: memo33/sc4pac-actions/.github/workflows/sc4pac-channel.yaml@v2
    with:
      path: src/yaml
      channel-label: ${{ vars.CHANNEL_LABEL }}
      deploy-repository: sebamarynissen/simtropolis-channel
      channel-artifact-name: channel-artifact.zip
      skip-build-website: false
      skip-test: false
      skip-url-check: false
      skip-deploy: true
    permissions:
      pages: write                   # to deploy to GitHub Pages
      id-token: write                # to verify the deployment originates from an appropriate source