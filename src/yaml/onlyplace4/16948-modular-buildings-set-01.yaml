info:
  summary: Modular Buildings Set 01
  description: |-
    **Warning:** This is not one for the feint hearted or for those who do not have a certain amount of experience with the Lot Editor.

    For a long time now I have been BATting buildings that have recurring forms, patterns or sections within them as a series of sections that I subsequently click together to make the full building. It was with this in mind that I then thought "hey, maybe I could do much the same thing with props". This is the result.

    This set consists of 67 props, an SC4Model file and a test lot so you can see that the things actually work. There is a full readme and tutorial included as the executable readme included in the download. This is a complied HTML file and has been virus scanned. Please make sure that you read this file in it's entirety before you use the props as it explains how they are to be positioned, and how to use the SC4Model file.

    It would be interesting to see your creations with this pack, so please feel free to post pictures in the BLaM MB01 Support Thread which you can find on SimTropolis and SimCities (ST: [https://www.simtropolis.com/forum/messageview.cfm?catid=154&threadid=82307&enterthread=y](https://www.simtropolis.com/forum/messageview.cfm?catid=154&threadid=82307&enterthread=y) SC: [http://simcities.com/forum/index.php?topic=695](http://simcities.com/forum/index.php?topic=695))

    As this pack is a series of props please do not include any of the props with any creations you decide to release, but instead please point to this file as a dependency. Many thanks.

    Finally, I personally hope that this download will give those of you who cannot get to grips with the BAT, or simply don't want to make your own BATs the opportunity to make unique buildings for your game.

    Please note that the pictures above show the test Lot included in the pack.

    **To instal**

    BLaM recommends the making of a folder named BLaM within your plugins folder. The contents of the folder contained within the download zip archive may then be dragged directly to that folder.

    **Credits**

    Thanks to KT3, Lou and other BLaM members for testing this, to BLaM as a whole for their input and support, and my sons for pointing out things I could have made better.

    **Disclaimer**

    All BLaM releases are tested and seen to work. However, in some cases conflicts may occur. BLaM cannot be held responsible for such conflicts and this download is used by the user on an 'as-is' basis.

    Release Notes

    All BLaM releases are available on the SimTropolis Exchange (STEX) and the SimCities Exchange (SCExchange). Individual members may release at other locations in addition to these. Please check the relevant readme file(s).

    *BLaM Modular Buildings Set 01*
