group: tiepinl
name: irm-expansions-and-addons
version: "1.0.0"
subfolder: 400-industrial
info:
  summary: Collection of all IRM expansion, W2W and addon lots
  description: |-
    A collection of the Industrial Revolution Mod (IRM) lots by T Wrecks that expand `pkg=memo:industrial-revolution-mod`: the IRM W2W base pack, the I-D and I-M addon sets, and the IRM Expansion and IRM W2W Expansion lots based on BATs by other artists. It also includes the IRM lot blockers.

    Without CAM, the original lots by T Wrecks are installed. Where available, you can choose between standard and quadrupled job numbers with the `toroca:industry-quadrupler:capacity` variant.

    With CAM, the CAM edition of these lots by nos.17 is installed instead. Only version A of this edition is offered: it keeps T Wrecks' distribution of I-M lots between medium-density and high-density industrial zones on the basis of appearance, and it matches `pkg=memo:industrial-revolution-mod`. Version B, which allocates all I-HT lots to high-density zones and all I-M lots to medium-density zones, is not available.

    Which anchor lots are allowed to grow (regular IRM lots, IRM W2W lots or both) is controlled with the variant of `pkg=t-wrecks:irm-lot-blockers`.
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/35792-irm-expansions-and-addons-cam-edition/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2023_12/IRM_CAM_TitleImage.png.fb816e05139040203d7d2b23feba4d0c.png

# Work in progress: the remaining IRM expansion packages are added as they are created.
