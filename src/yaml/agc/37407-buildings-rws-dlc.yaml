info:
  summary: Buildings RWS DLC
  description: |-
    This DLC contains buildings without lots (it is a dependency for future lots).

    Special thanks to @Bobelboy, @brancra, @IDS2, @Nikolaux and [@Tyberius06](https://community.simtropolis.com/profile/660284-tyberius06/) for the support.

    You can find them as AGC\_Buildings\_

    I will update this DLC constantly so you must be on the lookout.

    Scale of the models: 133% on z axis (vertical scaling).

    Thanks to everyone who donates! I'll start exporting exclusive BATs to my donors, just send me a DM.

    https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU
