    - https://www.simtropolis.com/objects/screens/monthly_2025_03/image44.PNG.027b7cdeabf8a2f18ed6b806e69a1027.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2025_03/67d46ab8c0fb3_Sinttulo.png.3b76f597f57943ea8902608263f2a43b.png
