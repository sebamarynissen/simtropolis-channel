group: agc
name: 8-canada-square-01
version: "1.0.0"
subfolder: 300-commercial
info:
  summary: 8 Canada Square 01
  description: |-
    Thanks to [@Bobelboy](https://community.simtropolis.com/profile/138427-bobelboy/), [@Tyberius06](https://community.simtropolis.com/profile/660284-tyberius06/) and users who have donated to me.

    **Specs**

    - 5x5 Landmark and Ploppable CO$$$.
    - CAM Stage: 11
    - Tileset: Euro - Houston
    - CAM & Maxis Growable version included (the CAM variant installs the CAM version, otherwise the Maxis growable version is installed).
    - This is the version with the logo. A version without the logo is available as [8 Canada Square 01 (No Logo)](pkg=agc:8-canada-square-01-no-logo). You can use both versions at the same time.

    Darknite only.

    Scale of the models: 133% (z axis).

    If you like my work, you can make a donation to fund my other projects!

    https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU

    Thanks to the few people who have donated to me.
  author: Barroco Hispano
  website: https://community.simtropolis.com/files/file/36827-agc-8-canada-square-01/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2026_06/6a40df2bc6cbe_8CanadaCONoLogo.JPG.fa03beb233cbee5f095b71bec9e7555d.JPG
    - https://www.simtropolis.com/objects/screens/monthly_2026_06/6a40df2c5b53d_8CanadaCO.JPG.057e4c6a254d76f18e9dddc613f5a48f.JPG
    - https://www.simtropolis.com/objects/screens/monthly_2026_06/6a40df2ceaf58_8CanadaLM.JPG.ab1c1c7e82fe3241ec4d18e351bf125b.JPG
    - https://www.simtropolis.com/objects/screens/monthly_2026_06/6a40df2d80065_8CanadaLMNoLogo.JPG.9efb7ec157894269a18a3aa6d03dfbb3.JPG
    - https://www.simtropolis.com/objects/screens/monthly_2026_06/6a40e2c8cc268_8CanadaN.JPG.21c8fc7b0db2180fbaacaed26ecdd011.JPG
  conflicts: Only a DarkNite model exists, so the same model is installed with either nightmode setting.
assets:
  - assetId: agc-8-canada-square-01

variants:
  - variant: { nightmode: standard, CAM: "yes" }
    dependencies:
      - bsc:essentials
    assets:
      - assetId: agc-8-canada-square-01-cam
  - variant: { nightmode: standard, CAM: "no" }
    assets:
      - assetId: agc-8-canada-square-01-grow
  - variant: { nightmode: dark, CAM: "yes" }
    dependencies:
      - bsc:essentials
      - simfox:day-and-nite-mod
    assets:
      - assetId: agc-8-canada-square-01-cam
  - variant: { nightmode: dark, CAM: "no" }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: agc-8-canada-square-01-grow

