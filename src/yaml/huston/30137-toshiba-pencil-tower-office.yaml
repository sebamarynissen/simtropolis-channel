info:
  summary: Toshiba Pencil Tower Office, a 1x1 W2W corner office
  description: |-
    This W2W corner office occupies 1x1 tiles, has 24 floors and is pretty much the definition of the average pencil tower, which seem to be breaking out in the world's most modernized cities. It was completed at the request of the original modeler, who is credited as "SimCity 4 builder".

    **Stats**

    *Growable CS$$$*

    - Lot size: 1x1
    - Stage: 8
    - Capacity: CS$ 341, CS$$ 87, CS$$$ 37

    *Landmark (functional, CO$$)*

    - Lot size: 1x1
    - Plop cost: 25,000
    - Capacity: CO$$ 153

    *Landmark (non-functional)*

    - Lot size: 1x1
    - Plop cost: 50,000
    - Monthly cost: 170
