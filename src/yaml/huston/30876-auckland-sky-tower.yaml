info:
  summary: Auckland Sky Tower, a landmark with white lighting
  description: |-
    Standing at over 328 meters, the Sky Tower in Auckland, New Zealand is one of the tallest man-made structures in the Southern Hemisphere. It boasts a restaurant and nightlife, complemented by an observation deck to look over the downtown Auckland area and the city's skyline. It also functions as a broadcasting tower, with a mast that adorns the tower.

    This version only includes the white lighting for the meantime. The BAT was initially meant to have 6 color schemes, which may be implemented in the future.

    **Stats**

    *Landmark (non-functional), Dark Nite*

    - Lot size: 3x3
    - Plop cost: 385,900, monthly cost 435, landmark effect 40 over 20 tiles
    - Plop cost: 350,000, monthly cost 435, landmark effect 80 over 25 tiles

    *Landmark (non-functional), Maxis Nite*

    - Lot size: 3x3
    - Plop cost: 385,900, monthly cost 435, landmark effect 40 over 20 tiles
    - Plop cost: 5,700, monthly cost 55, landmark effect 40 over 20 tiles
