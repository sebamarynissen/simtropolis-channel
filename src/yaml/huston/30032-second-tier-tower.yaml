info:
  summary: Huston Corporation Second Tier Tower, an office tower with a helipad
  description: |-
    Leading in various fields, chiefly in experimental, pseudo and technological developments, the Huston Corporation aims to innovate, educate, develop and further scientific and technological understanding. With heavy investment in R&D, many breakthroughs have been met and shared with the world. Despite its allegedly "evil" reputation, the corporation is anything but, and is only devoted to the betterment of the lives of people.

    Fun fact: this BAT has a custom LOD, and has been manipulated to be friendly with object placement on its helipad. Lotters will enjoy knowing that a helicopter, or other aircraft-like vehicle, can land on the building without mysteriously disappearing or crashing.

    The growable lots are lotted in place over Wren Insurance, so they may grow like a weed in your cities.

    **Stats**

    *Growable CO$$$*

    - Lot size: 4x3
    - Stage: 8
    - Capacity: CO$$ 6,084, CO$$$ 4,256

    *Landmark (non-functional)*

    - Lot size: 4x3
    - Plop cost: 311,500
    - Monthly cost: 800
    - Landmark effect: 2,500 over 25 tiles
