  summary: Lasmariñas Cagayan Provincial Assembly, a brutalist landmark
  description: |-
    The Cagayan Provincial Assembly in the city of Lasmariñas is a brutalist structure reminiscent of the Philippines. It holds a provincial assembly and acts as the regional administration center for the greater Cagayan provincial region. The brutalist architectural style implies a largely windowless façade, which is a common style across many Philippine cities that were built during the latter half of the 20th century. This building is fictitious, but largely influenced by the Philippine brutalist styles of many administration and commercial architectures.

    **Stats**

    *Landmark*

    - Lot size: 6x6
    - Plop cost: 40,800
    - Monthly cost: 90
    - Landmark effect: 40 over 20 tiles

    *Park version*

    - Lot size: 6x5
    - Plop cost: 40
    - Monthly cost: 5

    **Bonus content**

    The upload also includes prop models of a motorized tricycle (two angles) and a district jeepney, which are not used by the lots but may be used by lotters.

    This building only comes in a Dark Nite version.
