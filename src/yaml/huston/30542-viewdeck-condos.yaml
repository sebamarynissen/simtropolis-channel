info:
  summary: Viewdeck Condos, a Vancouver condo complex
  description: |-
    Featured in ME:TMW's episode 70.1 as a background condo structure. Among Vancouver's many residential condos and apartment complexes, the actual condos are several decades old, have been refurbished numerous times, and have been given numerous renovations and additions to the building complex. The apartments (once) provided the comforts and ambience of a 21st century loft or condo apartment, while giving the tenant a view of the crowding metropolitan skyline of the ever-growing city of Vancouver. The in-game lot has 5 varieties, with a few ground decorative variations.

    **Stats**

    *Growable R$$ / R$$$*

    - Lot size: 3x6
    - Stage: 7 to 8
    - Capacity: R$ 5,352, R$$ 2,956, R$$$ 1,293 (the R$$ lots without R$$$)

    This building only comes in a Dark Nite version.
  author: Huston
  website: https://community.simtropolis.com/files/file/30542-metmw-viewdeck-condos/
