info:
  summary: 105 Lélio Gama, a bank tower in Rio de Janeiro
  description: |-
    Owned by Brazil's national banking conglomerate Banco do Brasil, 105 Lélio Gama is a building in the city of Rio de Janeiro. Completed in 1980, the tower is approximately 145 meters tall with 40 accessible floors. It is currently the second tallest building in Rio.

    **Stats**

    *Landmark (non-functional)*

    - Lot size: 4x3
    - Plop cost: 175,000
    - Monthly cost: 35

    *Growable CO$$* (Dark Nite only)

    - Lot size: 4x3
    - Stage: 8
    - Capacity: CO$$ 4,827

    The growable lot of the Maxis Nite version is not installed, because it refers to a Maxis office building instead of its own building.
  author: Huston
  website: https://community.simtropolis.com/files/file/30973-gbt-105-l%C3%A9lio-gama/
