group: moonlinght
name: jpn-street-overwrite-sam1-props
version: "1.0.0"
subfolder: 100-props-textures
info:
  summary: Planter props of the JPN Street Mod for SAM1
  description: |-
    The props file of Moonlight's `ML JPN Street overwrite SAM1` (`ML JPN street chg SAM1 prop.dat`), which contains street planter props used by lots.

    Only this props file is installed. It adds new props and does not override any NAM SAM texture. The texture and T21 overrides of the original mod are not included.
  author: moonlinght
  website: https://community.simtropolis.com/files/file/36926-moonlight-compilation/
assets:
  - assetId: moonlinght-sc4-compilation-2025
    include:
      - "/ML JPN street chg SAM1 prop\\.dat$"

