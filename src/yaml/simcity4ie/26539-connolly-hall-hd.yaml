  summary: Connolly Hall, a modern union office building in Cork City
  description: |-
    Located at Lapp's Quay, Cork City, Connolly Hall is a modern workers' union SIPTU office constructed from interesting dark, reflecting glass beside the river Lee. A brief walk from the city centre, and overlooking the Elysian Tower directly opposite the river, lies Connolly Hall.

    A custom UI icon was created for the BAT as well.

    **Stats**

    - CO$$, stage 5
    - Lot size: 1x3
    - HD
    - Generic PIM-X tool stats

