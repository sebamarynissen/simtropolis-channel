info:
  summary: The Spire of Dublin ("Monument of Light"), a 1x1 landmark in HD
  description: |-
    This is a remake of the Dublin Spire by Glenni. Since his was four times larger than it actually is, I made it to its realistic size.

    The landmark stands on O'Connell Street among the old buildings and picturesque statues in Dublin, Ireland. The Spire of Dublin, officially titled the "Monument of Light", or "An Túr Solais", is a large, stainless steel, pin-like monument 121.2 metres (398 ft) in height, located on the site of the former Nelson's Pillar on O'Connell Street in Dublin, Ireland. It was erected in 2003 to replace the previous location of Nelson's Pillar, which was blown up by the IRA in 1966. It has since won many awards for design.

    **Stats**

    - Landmark
    - Lot size: 1x1
    - HD
    - PIM-X stats
