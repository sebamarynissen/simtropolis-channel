info:
  summary: Metropol Parasol
  description: |-
    Metropol Parasol is a wooden structure located at La Encarnación square, in the old quarter of Seville, Spain. It was designed by the German architect Jürgen Mayer and completed in April 2011. It has dimensions of 150 by 70 metres (490 by 230 ft) and an approximate height of 26 metres (85 ft) and claims to be the largest wooden structure in the world. Its appearance, location, delays and cost overruns in construction resulted in much public controversy. The building is popularly known as Las Setas de la Encarnación (Incarnation's mushrooms). (Wikipedia, 2019)

    The package contains a landmark lot with no jobs and a ploppable lot with Cs$$ 720 jobs in your landmarks menu.

    Unfortunately there is no night lighting like all my other uploads :(
