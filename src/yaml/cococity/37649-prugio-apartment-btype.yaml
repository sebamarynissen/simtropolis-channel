  summary: Prugio apartment tower (type B) in Growable R$$ and Landmark versions
  description: |-
    **PRUGIO** is a well-established apartment brand in Korea. This model was designed in two types, and this is type B (type A: 27 floors, type B: 29 floors, see `pkg=cococity:prugio-apartment-atype`).

    **Information**

    *Growable R$$*

    - Stage: 7
    - Capacity: R$$ 1,231, R$ 2,227
    - Lot size: 3x3

    *Landmark*

    - Plop cost: 50,000
    - Monthly cost: 80
    - Landmark effect: 60
    - Lot size: 3x3
