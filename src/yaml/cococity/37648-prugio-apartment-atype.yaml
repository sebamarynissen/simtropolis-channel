info:
  summary: Prugio apartment tower (type A) in Growable R$$ and Landmark versions
  description: |-
    **PRUGIO** is a well-established apartment brand in Korea. This model was designed in two types, and this is type A (type A: 27 floors, type B: 29 floors, see `pkg=cococity:prugio-apartment-btype`).

    **Information**

    *Growable R$$*

    - Stage: 7
    - Capacity: R$$ 1,057, R$ 1,913
    - Lot size: 3x2

    *Landmark*

    - Plop cost: 50,000
    - Monthly cost: 80
    - Landmark effect: 60
    - Lot size: 3x2
