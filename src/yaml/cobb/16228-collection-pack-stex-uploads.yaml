info:
  summary: Included in `pkg=cobb:collection-pack`
  description: |-
    The Cobb32118 lots from the individual Simtropolis uploads are included in `pkg=cobb:collection-pack`, which is part of the SC4Evermore channel. Installing this package installs that collection.

    The collection has the same buildings and the same lot IDs as the original uploads, but the lots have been updated to be CAM-compatible: growth stages, capacities, costs and occupant groups are adjusted. Because the lot IDs are the same, install either an original upload or the collection, not both.

    Growable lots with a stage above 8 only exist with `CAM: yes`. Without CAM, the collection only has the ploppable versions of Altura Tower, Emerald Park, Emperador, Galleria and Oceanic, and nothing at all for 13th Street Condos, Atlantic, Park Plaza, Shoreline and Veinte.

    The collection also has seven additional commercial lots (hotels and offices) that use the same buildings.

    **Included uploads**

    The Cobb Altura Tower, Atlantic, Central Park West, Emerald Park, Emperador, 5th Avenue, Europa, Galleria, Grand Plaza, Oceanic, Park Plaza, Regency, Riviera, Royale, Seaside Villa, Shoreline, Tower, Troglodyte Complex and Veinte Building, and The 13th Street Condos.
