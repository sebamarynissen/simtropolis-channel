variantInfo:
  - variantId: cobb:harbor-village:tweaks
    description: Choose the tweaks that are applied to the lots. All options remove the base textures in the water and add a 1x3 land/water junction without base texture.
    values:
      - value: landmarks
        default: true
        description: The lots stay in the Landmarks menu, as originally created, with the original specs. This is the quick fix, and the safest choice for cities that already contain the original lots.
      - value: seaport-menu
        description: Moves the lots to the Water Transportation menu, with the standard Maxis parks query window and the query sound and plop sound of the Maxis marina. The plop costs become $1 to $13 in the original menu order, and the lots can be renamed in the game. The budget item department, line and purpose are removed, as they no longer apply.
      - value: seaport-neutral
        description: Same as seaport-menu, and also sets the bulldoze cost to $1, removes all pollution, power consumption and flammability (the lots still need power for their night lights), and removes the landmark effect (+40 over 20 tiles) and the +10 mayor rating over 256 tiles. Only use this if you have never plopped the original lots.

