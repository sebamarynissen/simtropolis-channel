info:
  summary: Harbor Village, twelve landmark lots for a village in the water
  description: |-
    Twelve lots comprising a village that you can plop out in the water in any configuration you like.

    Are your sims tired of their sim rat-race, and looking for a more tranquil retreat? Offer them an alternative with the Harbor Village.

    The twelve lots are:

    1. Large blue house
    1. Medium red house
    1. Small modern green house
    1. Small cabin
    1. Marketplace
    1. Marina
    1. Lighthouse
    1. 2-tile dock
    1. Corner dock
    1. Center junction dock
    1. End dock
    1. Land/water junction

    Version 2 is a major overhaul done entirely by Andreas Roth, who manages the website simszone.de. He made the power usage more reasonable, changed the query sound, and made very attractive and useful menu icons.

    The lots cost 25 simoleans each to plop. They function only as landmarks and do not contain residents or jobs, so at this stage they are only for appearance. A growable version is unfortunately not possible for water lots. Water lots are difficult to position properly, so it may take some practice. Also note that the land/water junction lot may show up strangely unless your terrain is relatively low and level.

    **Fixes by CorinaMarie and Cyclone Boom**

    The original lots all have a base texture which shows through shallow water and goes wrong in data views, like the water bug. The tweaks created by Equinox for this are no longer available online, so CorinaMarie and Cyclone Boom made similar exemplar overrides in three options, which this package includes. You choose between them with the `tweaks` variant.

    The package also includes an additional starter piece by CorinaMarie: a 1x3 land/water junction with a wood landing prop, as another option for visually connecting the village to streets or roads. Its specs match the `seaport-neutral` option, but it can be used with all of them. With the `landmarks` option, it is the only piece in the Seaport menu.

    The building exemplars in the original `.SC4Desc` files are not referenced by any lot, so they are not installed.
