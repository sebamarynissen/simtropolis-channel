info:
  summary: Luminary Park, a ploppable flower garden with illuminated trees
  description: |-
    A park with an attractive appearance in the night skyline. The Cobb Luminary Park is a great place for sims to unwind after a night on the town, or during the day it would be a great setting for sim weddings. It functions exactly as a large flower garden, and does not replace the original in the game.

    Thanks to Brenda_Xne for modeling the trees, which were modified slightly to illuminate them.

    **Stats**

    - Lot size: 3x3
    - Plop cost: 310
    - Monthly cost: 35

    **What's new in v2**

    - Fixed a very small problem with the way the trees rendered.
