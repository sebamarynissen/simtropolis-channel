  summary: Typical city bank branch, 2x2 corner lot
  description: |-
    A typical city bank branch by kei_jpn.

    - Size: 2x2 (corner lot)
    - Type: CO$$
    - Growth stage: 6

    The sign has been slightly tweaked. If you have the original, please compare it. In addition to "Mizuho Bank" created by Kei, Tokyo Mitsubishi, UFJ, Sumitomo Mitsui and Resona Bank will also appear.

    Production date: 2004 · Released on March 9, 2015 · Revised on December 31, 2015

    **Note:** the original website, gobanboshi (`http://gobanboshi.s25.xrea.com/SimCity/hokan-kei/kei_CO%24%246_kadochi-bank.zip`), is down permanently. This is a preservation upload of the original download. The files are unchanged, only the folder name was replaced by an English one. The above description is based on a Google Translate of the original Japanese description.
