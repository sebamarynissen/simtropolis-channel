  summary: Mid-rise office building "Daito New City"
  description: |-
    A mid-rise office building by kei_jpn.

    - Size: 2x2, 2x3
    - Type: CO$$
    - Growth stage: 6

    It's a relatively new building, built as part of a redevelopment project sometime after the 1990s. There's a Starbucks on the first floor, but the texture is distorted and you can't see it...

    Production date: 2004 · Released on March 9, 2015

    **Note:** the original website, gobanboshi (`http://gobanboshi.s25.xrea.com/SimCity/hokan-kei/kei_co_office01-daito.zip`), is down permanently. This is a preservation upload of the original download. The files are unchanged, only the folder name was replaced by an English one. The above description is based on a Google Translate of the original Japanese description.
