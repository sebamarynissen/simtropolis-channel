  summary: Mels Tea Room
  description: |-
    Mel's Tea Room is a cafe/restaurant in Sackville, New Brunswick. Mel's is a long standing Sackville institution and hasn't changed significantly in decades. Today it's a popular hang-out for Mount Allison University students. It shares the building with a locally owned Sears affiliate that sells and repairs appliances.  
      
    Mel's Tea Room fits w2w and is compatible with JBSimio's small-town set. There are two lots; a growable Cs$$ and a plop Cs$$. Mel's is part of my Atlantic Canada bat set, which are bats from the smaller cities and towns around the region. A growable and a plop are included in this upload. See the readme for complete details.
