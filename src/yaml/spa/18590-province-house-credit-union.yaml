info:
  summary: Province House Credit Union
  description: |-
    Here's a goldy oldy. Province House Credit Union is a bank in downtown Halifax across from the provincial legislature on Granville Street. It caters exclusively to Nova Scotia provincial government employees and is part of a larger network of credit unions in Atlantic Canada. The idea behind credit unions is that the customers own the company and share in the profits, which explains Province House Credit Union's slogan "maybe your next bank shouldn't be a bank." Desite not being a "bank" Province House Credit offers full service from basic day to day deposits and withdrawals to mortgages. It is one of the few surviving old buildings on the Brinks Block.  
      
    Province House Credit Union is part of my downtown Halifax set. It comes as Cs$$$, Co$$$ and as a plop. It fits w2w and the lot is compatible with JBSimio's small town set. See the readme for complete details.
