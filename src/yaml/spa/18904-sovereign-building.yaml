  summary: Sovereign Building
  description: |-
    The Sovereign Building is a stately old building on Halifax's Spring Garden Road next to the Winsbys shoe store. The building is a brick structure with a stone facade. The building is home to several shops including Maritime Frame It, the Running Room, Deco Restaurant and Life Salon and Spa. The upstairs offices houses a variety of tenants including Sports Nova Scotia (owners of the electronic bill board), Da Tang Language School and Sun Holidays. The Sovereign Building is typically a hub of activity because of the bus stop right in front of it.  
      
    The Sovereign Building fits w2w and is designed for a fairly urban setting. There are three lots; a growable Co$$, a growable Cs$$ and a plop Cs$$. The Sovereign Building is part of my Spring Garden Road set. See the readme for complete details.
