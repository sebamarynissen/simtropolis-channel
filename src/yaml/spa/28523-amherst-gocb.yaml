  summary: Amherst GOCB
  description: |-
    The Amherst Government of Canada Building is a federal government building in Amherst, Nova Scotia. Constructed in 1975, the building is located at the corner of Havelock and Prince Arthur Streets and serves as the regional headquarters for the Department of Indian and Northern Affairs. Given its small town location, the Amherst GOCB is notable for being a rather large office building. Amherst has just under 10,000 people, but, like Moncton, its location on the Trans-Canada Highway near the geographic centre of the Maritimes makes the town an attractive location for industry and federal government departments.

    The Amherst GOCB comes to SimCity as 5x5 corner lot (a left and right corner version).
