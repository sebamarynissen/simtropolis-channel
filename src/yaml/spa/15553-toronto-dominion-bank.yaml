  summary: Toronto Dominion Bank
  description: |-
    The Toronto Dominion Bank (official name Toronto Dominion Canada Trust) is Canada's second largest bank. It dates back to as early as 1855. Its present name came from the merger of the Bank of Toronto and the Dominion Bank in 1954 and the 2000 merger with Canada Trust. The bank boasts the longest hours of the five major Canadian banks so the nightlighting on this BAT is appropriate. However, generally all the useful staff are still on "bankers hours" and are gone at 5:00 or earlier.  
      
    This BAT is part of my five BAT set of Canadian bank branches that is designed to help relieve some of the monotony of small Maxis commercial service buildings. This is actually the first BAT I ever completed. It is based on a real TD branch located on Spring Garden Road in Halifax, Nova Scotia. Included in this upload is a growable and a ploppable version with identical stats. Both come on a 2x3 lot and provide120 Cs$$. The growable appears on the New York and Houston tilesets.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
