  summary: Corner Gas
  description: |-
    Well here’s another piece of Canadiana. Straight from Dog River, Saskatchewan, it’s Corner Gas. This roadside gas station and café caters to the needs of weary travellrs and the bored locals. Road weary sims can get Brent or Wanda to fill up their gas tank, clean their windshield and change their oil while they enjoy a chilli cheese dog or a Ruby Club at the attached Ruby Café. Ruby owner Lacey Bourghs is always happy to feed travelers and top up their coffee, just don’t touch the announcements board or mention the air show and whatever you do please, please, please leave your balloons outside. If you stay long enough, there might even be a little excitement if Karen and Davis stop by for a police drill or Hank gets talking about fishing. Who knows, you might even decide that this is a good place to hangout when there’s not a lot goin’ on…..  
      
    To clue in any non-Canadian out there that don't have a the slightest idea what I'm babbling about, Corner Gas is a hugely successful TV show in Canada and this is a BAT of the main set located in Rouleau, Saskatchewan. The show is aired on CTV, but it's now also available on the Comedy Network so perhaps Americans might eventually see it on Comedy Central? The cast is pictured above on the right.  
      
    Stats: 3X2 stage 3 growable with 90 Cs$$jobs. Grows on the New York and Chicago tile sets on a corner lot. Also included is a 3x2 ploppable with identical stats. See the readme for installation instructions and detailed stats.  
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
