  summary: Saint John Customs Building
  description: |-
    The Saint John Customs Building is a federal government office building in Saint John, New Brunswick, Canada. The building is located in historic Uptown Saint John and is bound by Prince William, Water and Duke Streets. The building is actually the third Customs Building to grace the Saint John waterfront. The first Customs Building was lost, along with the rest of Saint John, in the Great Fire of 1877. After the fire, a bigger and better Customs Building was constructed. The second Customs Building was an architectural masterpiece that boasted ornate stone carvings, a large central dome and two towers. Sadly, in an act of architectural vandalism, it was demolished and was replaced with the current Customs Building in the late 1950s. All that remains of the second Customs Building is part of the massive stone foundation, which is being used as a retaining wall in the property's parking lot. The modern Customs Building provides space for 11 different federal departments and agencies: Veteran Affairs Canada, Public Works and Government Services Canada, Industry Canada, Citizenship and Immigration, Canada Border Services Agency, Royal Canadian Mounted Police, Department of National Defense, Environment Canada, Health Canada, Canadian Food Inspection Agency and Transport Canada.

    The Customs Building comes to SC4 as a growable and ploppable on a 4x3 lot.
