  description: |-
    The Family Vision Centre is an optometrist in Wolfville, Nova Scotia. The building is just off Main Street on Central Avenue and draws its customers from the Town and the surrounding communities. After all the students at Acadia University need to be able to see the front of the class room.  
      
    The Family Vision Centre fits w2w and is compatible with the small-town set. There are two lots; a growable Cs$$$ and a plop Cs$$$. The Family Vision Centre is part of my Atlantic Canada bat set. A growable and a plop are included in this upload. See the readme for complete details.
