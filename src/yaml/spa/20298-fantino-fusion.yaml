  summary: Fantino Fusion
  description: |-
    Fantino Fusion is located on Stephen Avenue in downtown Calgary. The Stephen Avenue streetscape is a national historic site because of its concentration of old buildings, most of which are built of sandstone. The street is a pedestrian mall and features a mix of retail, tourist shops, restaurants and bars. Fantino Fusion is one of the street’s many restaurants and offers a mix of Mediterranean and Latin cuisine. Fantino Fusion comes on a 1x2 lot that matches the style I have previously used on my 1x2s and that JBSimio used in his small town set. Included are a growable and a ploppable that provide 38 Cs$$$.
