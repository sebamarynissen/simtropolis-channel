  summary: Ardmore Tea Room
  description: |-
    Are your Sims tired of Deppiesse's Diner? Well help is now here, the Ardmore Tea Room is ready to open loactions in your city. The Ardmore Tea Room is a real business located on Quinpool Road in Halifax, NS, Canada. The place is a traditional style diner that has operated for 54 years and has survived change, fires and a hurricane. The business has grown to become a Halifax institution and a well known local landmark. Besides being a great place to eat (be forewarned, the Lumberjack Special isn't for the faint of heart) the building is also home for the Cormier family that owns and operates the diner. In Sept 2003 the Cormiers became local heros when hurricane Juan roared through Halifax leaving large sections of the city without power for weeks. The Ardmore is located in what was one of the worst hit sections of the city and it too was without power. Realizing that the power was going to be out for days and all the perishable food would have to be thrown out, the Cormiers decided to give it away instead. The Cormiers, the Ardmore staff and several volunteers, held a giant neighbourhood barbeque in the Lawtons Drug Store parking lot next door to the diner and fed over 2,000 people for two days until they ran out of food. They worked all day and never charged a penny for any of it. A great example of Maritime hospitality.  
      
    The Ardmore Tea Room is the first entry in my series of Quinpool Road BATs and is part of my continuing effort to diversify our options for small commercial buildings. It comes in a growable and plopable 2x2 lot. The growable appears on corners on the Chicago and New York tilesets and provides Cs$$ jobs. It fits w2w.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
