  description: |-
    What was old is new again in Garrison Woods. Garrison Woods is a new urbanist subdivision located in Calgary, AB, Canada. Garrison Woods was developed on former military land by the Canada Lands Company, a crown corporation whose role is to redevelop surplus government land. Garrison Woods is unapologetically new urbanist. The development consists primarily of townhouses, but also includes a few detached homes, a commercial development and a seniors' residence. The whole community is linked together by pedestrian walkways and ample greenspace. Parking is provided on the street and, in some residences, in rear garages. The community is designed to be walkabe but it's location in southwest Calgary means there is very little to walk to, making it an automobile dependent suburb despite design attempts to the contrary. The architecture attempts to replicate traditional styles, which is why these rowhouses will no doubt be familiar to people from the UK. The development also pays homage to its military past in its park and street names; every street and park is named for a Canadian World War One battle. If you want to check out pictures of the community there are many available on the development's website [http://www.garrisonwoods.com](http://www.garrisonwoods.com/)  
      
    This is the third entry in my Garrison Woods set. Phase3 grows on a 1x2 lot on any tile set and comes inseveral different combinations.Phase 3provides ahomes for R$$.
