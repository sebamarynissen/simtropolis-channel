  summary: Saint Leonard GOCB
  description: |-
    The St. Leonard Government of Canada Building (GOCB) is a small federal office building in St. Leonard, New Brunswick. It was built in 1939 as a post office, but was abandoned by Canada Post in the 1980s. After the departure of Canada Post, the building was given a new lease on life and was extensively renovated to accommodate the Department of Fisheries and Oceans. DFO fisheries officers have operated from the small building ever since.  
      
    The St. Leonard GOCB is part of my collection of bats from small-town Atantic Canada. It isn't quite w2w (narrow alley on each side) and fits with JBSimo's small-town set in style. There is a plop and a growable lot included in this upload. See the readme for complete details.
