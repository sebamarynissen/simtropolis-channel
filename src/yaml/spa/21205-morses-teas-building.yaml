  summary: Morses Teas Building
  description: |-
    The Morse's Teas Building is a surviving piece of Halifax's old industrial waterfront. The site was occupied from about the time of Halifax's founding back in 1749 by the Jerusalem Coffee House. After fire destroyed the original Coffee House in 1873, the present Morse's Teas Building rose from the ashes. In 1910, after a string of different owners, the building was purchased by Morse's Teas to serve as the company's head office. The building has been known as the Morse's Teas Building ever since, largely because of the faded old advertisements just below the 6th floor windows. Morse's Tea is no longer based in the building, but their tea still graces grocery store shelves in Atlantic Canada. Until recently, the Morse's Teas Building was home to the Nova Scotia College of Art and Design (NSCAD), but NSCAD has relocated to a new facility at Pier 21. Starfish Properties, a developer with a long history of restoring old buildings in Halifax, purchased the building and is renovating it to accommodate general office space.  
      
    The Morse's Teas Building comes as a corner 2x3 C lot (two version, one left corner and one right corner) and provides 506 Co$$. Also included is a plop.
