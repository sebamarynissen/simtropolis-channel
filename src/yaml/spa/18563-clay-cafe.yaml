  description: |-
    The cheerful Clay Cafe is a make your own pottery studio on Halifax’s Quinpool Road. The building is located just up from the Ardmore Tea Room and just down from the Royal Bank and BMO branches. Now the Clay Café is ready to expand into your city. Soon your yuppie sims will be able to inflict horrible pottery gifts on each other. “Oh what a pretty ash tray."

    The Clay Café is my fourth bat from Halifax’s Quinpool Road. It comes as a growable and a plop and is part of my Quinpool Road set. It fits w2w and the lot is made to match JBSimio's small town series. See the readme for complete details.
