  summary: Canada Permanent Insurance
  description: |-
    The Canada Permanent Insurance Building is a modern high-rise on Barrington Street in downtown Halifax, NS. The building extends along the edge of a narrow city block and actually backs onto trendy Argyle Street. The structure is a great example of International Style architecture. It was built in 1950 and is significant because it was one of the very first modern high-rises in downtown Halifax. Heritage advocates have argued that the building contrasts with its nearby 19th and early 20th century neighbours, but I think it adds some contrast and visual interest to Barrington. Recently the building was converted into residential units, but the Mercury Bar, the Tim Hortons and the small convenience store have all remained on the ground level. Despite the conversion to residential, my SimCity version is a Co$$ office building since it would look out of place popping up in residential zones!

    Included in this upload are two versions a 1x2 and a 1x3. The 1x3 is fairly true to the real building whereas the 1x2 is a shortened version. Both come with a plop and growable that fit wall-to-wall on both sides. Both versions provide Co$$ jobs.
