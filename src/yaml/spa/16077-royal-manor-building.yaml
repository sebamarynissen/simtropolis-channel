info:
  summary: Royal Manor Building
  description: |-
    Another streetside commercial BAT. The Royal Manor Building is based on an actual building on 17th Avenue in Calgary. The building boasts spacious upstairs offices and ground floor retail. The streetside shops include a Flight Centre travel agency, a Bernard Callebaut Chocolate Shop and Krei Spa and Salon.  
      
    This is the first BAT in what will eventually be a series of BATs from 17th Avenue in Calgary and is part of my continuing effort to diversify our options for small and mid-sized commercial buildings. The Royal Manor grows on a 2x3 lot on the Houston and Euro tile sets. It provides CS$$$ jobs and fits w2w.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
