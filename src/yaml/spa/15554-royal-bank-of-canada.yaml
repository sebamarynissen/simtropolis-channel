  summary: Royal Bank of Canada
  description: |-
    The Royal Bank of Canada (RBC or just the Royal Bank) is the country's largest bank and has been for decades. It operates internationally throughout the United States and even owns the arena where the Carolina Hurricanes play. In 2004, the bank suffered a serious technical problem when computer software failed to recognize deposits and withdrawals by customers. The problem cost the bank $9 million Canadian to fix and damaged the bank's reputation.  
      
    This BAT is part of my five BAT set of Canadian bank branches that is designed to help relieve some of the monotony of small Maxis commercial service buildings.It is based on a realRBC branch located on Quinpool Road in Halifax, Nova Scotia.This bat fits its lot snugly and can work as a w2w building or it can function fine without being smack up against another building since there are details on the sides. Included in this upload is a growable and a ploppable version with identical stats. Both come on a 2x3 lot and provide 90 Cs$$. The growable version does work although it doesn't seem to grow as often as the other banks I uploaded (stage 3, New York and Chicago tilesets). See the readme for more detailed stat information and installation instructions.  
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
