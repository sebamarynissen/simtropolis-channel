  summary: Winsbys
  description: |-
    Winsbys is a luxury shoe store from Halifax, Nova Scotia, Canada. It is located on the city’s trendy Spring Garden Road. Besides shoes the building is also home to several residents who live in upstairs apartments.  
      
    This is my fourth bat in my Spring Garden Road series. It grows w2w on a 2x2 lot in the New York and Chicago tile sets. The lot is compatible with JBSimio's small town set.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
