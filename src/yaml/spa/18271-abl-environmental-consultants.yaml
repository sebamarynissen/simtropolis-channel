  summary: ABL Environmental Consultants
  description: |-
    ABL Environmental Consultants Ltd. is a small engineering firm from the Dartmouth side of Halifax Harbour. Founded over a decade ago, the firm has slowly grown fomr the original three engineers and now employs over 10 people. The firm specializes in wastewater treatment and has designed and operated water treatment plants throughout the Maritime provinces and the Caribbean. The firm also has its own patented line of small water treatment plants. For more information check out the firm's website [here](http://www.ablenvironmental.com/). This is my first bat from Downtown Dartmouth, but it likely won't be the last. See the readme for complete details.
