  summary: Pier 1 Imports
  description: |-
    Pier 1 Import is a retailer based in Fort Worth, Texas. The chain has over 1,200 stores across North America that sell a variety of home decor and furnishing. This is a bat of the Pier 1 store on Yonge Street in downtown Toronto. Included in this upload is a growable and a ploppable lot. The building fits wall-to-wall and both 1x2 lots match the style I have used on my previous creations and JBSimio’s small town series in terms of setback, fencing and textures.
