info:
  summary: Richland Building
  description: |-
    The Richland Building is an actual building in Calgary’s Kensington neighbourhood. It’s an interesting building in the way that the streetscape has effectively spread up to the second floor. The second floor store fronts face onto a deck that is accessible from stairways on either side and from the back of the building. The Richland Building is home to several business which are:  
      
    Cyber Park (internet and gaming café)  
    Blue Nile (Ethiopian restaurant and unofficial night club)  
    Box, Paper Scissors (Stationary Store)  
    Taste of Ginger (Chinese restaurant)  
    Rejuve (body consultants or plastic surgeons or something)  
    Richland Development (developer’s offices)  
    B & Donna Fashions (clothing store)  
    Kensington Dental Care  
      
    This is the 7th entry in my series of Kensington BATs and is part of my continuing effort to diversify our options for small commercial buildings. The Richland Building grows on a 4x3 lot on the Houston and Euro tile sets. It provides Cs$$ jobs.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
