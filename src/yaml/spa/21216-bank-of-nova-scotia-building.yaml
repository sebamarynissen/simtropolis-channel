info:
  summary: Bank of Nova Scotia Building
  description: |-
    The Bank of Nova Scotia Building sits near the centre of Halifax directly across from the Nova Scotia legislature on Hollis Street. The beaux-art building was designed by Canadian architect John Lyle and was built in 1930 to house the bank's main office. Scotiabank still owns the building and the structure still houses the bank's formal headquarters. As far as I can tell,maintaining the bank's formal headquarters on Hollis Street is strictly a ceremonial and legal thing as well as a nod to the bank's Maritime roots since the actual corporate headquarters moved to Toronto decades ago. The Bank of Nova Scotia Building is a finely detailed piece of architecture of national significance. On the exterior stone panels and throughout the interior of the building there are carefully crafted scenes of Canada's economic history. It is one of Halifax's finest building, if not the finest.

    The Bank of Nova Scotia Building comes as a plop and a growable with several different lots (2x3 and 2x4). It fits wall-to-wall on the sides and is very snug all the way around on the 2x3. The Bank provides 502 Co$$$ jobs.
