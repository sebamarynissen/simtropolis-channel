  summary: Video Difference
  description: |-
    Video Difference is a small video rental chain based in Canada's Maritime provinces. The flagship store (this bat) is located in a converted house on Halifax's Quinpool Road and is the world's best video store. The place is open 24 hours, has a wide selection of movies including an impressive assortment of foreign and independent films, rents kids movies for free during the week, has a food for fines program tied to the Metro Food Bank and actually accepts Canadian Tire Money as currency. The place is a definite Halifax landmark.

    Video Difference fits w2w on one side and has a narrow alley on the other. It matches the small town set and comes with a growable and a ploppable landmark. See the readme for comlete details.
