  summary: Trend Fashions
  description: |-
    Trend Fashions is clothing store in Calgary’s Kensington neighbourhood that sells designer clothing. The shop shares the space with a business consulting firm (Core Parnters) and some upstairs office suites. However, my bat is twice as big as the real building and includes Bead Works and Tower Cleaners. Bead Works and Tower Cleaners are also real Kensington businesses, but in reality they’re located in a separate building a block further up 10th street.  
      
    Trend Fashions is the fifth entry in my Kensington BATs series and is part of my continuing effort to diversify our options for small commercial buildings. Trend Fashions grows on a 2x3 lot on the Houston and Euro tile sets. It provides CS$$ jobs and fits w2w.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
