info:
  summary: Foreign Affair
  description: |-
    Foreign Affair is a high-end clothing store from Halifax, Nova Scotia, Canada. The chain operates two outlets in the downtown, one on Barrington Street and one on Spring Garden Road. This is a bat of the Spring Garden Road location. Foreign Affair shares the building with a Tim Horton’s outlet and a hair salon and spa.  
      
    This is the third bat in my Spring Garden Road series. It grows w2w on a 1x2 lot in the New York and Houston tile sets. The lot is compatible with JBSimio's small town set.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
