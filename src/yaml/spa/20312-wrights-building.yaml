  summary: Wrights Building
  description: |-
    Wright’s Building is a historic office building on Barrington Street in downtown Halifax that, due to its red marble colonnettes, is also known as the Marble Building. It was built in 1896 by George Wright, a successful local entrepreneur who made his fortune publishing business guide books. Wright was lost with the Titanic in 1912, but his building has survived to the present day. Wright’s Building has been wonderfully preserved and currently provides office space on the upper floors and a home to a Greco Pizza parlour on the ground floor.

    Included in this upload are two 1x2 lots, a growable and a ploppable, that provide 86 Co$$$. Wright’s Building fits wall-to-wall and is made to match my earlier 2 deep lots and JBSimio’s small town set in terms of alley lot texture and setbacks.
