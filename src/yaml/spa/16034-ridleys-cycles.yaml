info:
  summary: Ridleys Cycles
  description: |-
    So you've built your sims some bike paths, but the question remains, where are they going to buy a bike? Answer Ridley's Cycles. This BAT is a real building in Calgary's Kensington neighbourhood. Upstairs the building also has a gym (Kensington Fitness Studio) and a tatoo/jewellery parlour (Arthouse). Up until a few months ago there was also a bookstore, but it went under and Ridley's now occupies the entire ground floor.  
      
    This BAT is the second in my Kensington BATs set. This BAT is based on a real building in Calgary's Kensington neighbourhood and is my first BAT in what will eventually be a whole series of buildings from that neighbourhood. It includes a growable 2x3 lot and a plopable. The growable appear on the Houston and Euro tile set. Ridley’s fits w2w. See the readme for more detailed stats.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0)for detailed information about the updates or my future projects.
