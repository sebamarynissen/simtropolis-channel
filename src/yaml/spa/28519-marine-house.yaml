  summary: Marine House
  description: |-
    Marine House is a federal government office building located in Downtown Dartmouth, Nova Scotia, Canada. The building has sat on the corner of Portland Street and Alderney Drive since the 1980s. Built on the site of a used car dealership, it started out as the Dartmouth Medical Centre and provided office space for a number of doctors. The federal government purchased the building in the early 2000s and converted it to general office space. Under government ownership, the building was renamed Marine House in honour of the major federal tenant, the Department of Fisheries and Oceans. To feed and coffee all the office workers, there is a small privately run cafe on the ground floor.

    Marine House comes to SimCity as a 4x3 growable and a ploppable.
