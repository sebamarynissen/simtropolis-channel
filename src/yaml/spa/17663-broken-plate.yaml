  description: |-
    The Broken Plate is a real building from Calgary, AB, Canada. It is located on 10th street NW just down from the Sunnyside C-Train station in the city’s bustling Kensington neighbourhood. The restaurant stays open late and frequently features live music. The building is also home to the Take Ten Café and a law firm occupies the upstairs office space.  
      
    This is my 8th bat in my Kensington set. Broken Plate grows on a 2x3 corner lots and provides space for Cs$$.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
