  summary: St. Paul's Building
  description: |-
    The St. Paul’s Building is an historic office building located at the corner of Barrington and Prince Streets in Downtown Halifax, Nova Scotia, Canada. Named for nearby St. Paul’s church, the five storey building was built in 1897 for prominent Halifax entrepreneur, George Wright. Wright made his fortune in guide books and invested in real estate, including the Marble Building (aka Wright’s Building) two doors down. The Dumaresq family, whose four generations of architects have shaped Halifax, designed the St. Paul’s Building. Over its 107 year history, the building has housed a variety of prominent commercial tenants including the Continental and Lloyds bank branches and the Belgian, Argentinian, Italian and Chilean consulates. As Barrington Street declined in the face of competition for retail and office space from the suburbs, the St. Paul’s Building stopped being a highly sought after address. For much of its recent history,  the first three floor housed Halifax’s largest used bookstore, J.W. Dohl. Dohl moved to the suburbs two years ago and the space has been vacant ever since. The upper two floors currently house a variety of professional and legal offices.

    The St. Paul's Building comes to SimCity on a 1x2 corner lot (both left and right versions). The St. Paul's Building fits wall-to-wall and in setback, textures and style, matches my other bats and JBSimio’s small town set.
