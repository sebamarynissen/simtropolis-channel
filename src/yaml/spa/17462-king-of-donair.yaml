  summary: King of Donair
  description: |-
    King of Donair is a chain of pizza parlours in Halifax, NS, Canada. The chain began in the 1970s on Quinpool Road and has expanded to now include several other locations. The chain gained publicity in the last few years after being featured in the hit Canadian series, The Trailer Park Boys. This bat is of the downtown KOD. It sits just off Spring Garden Road on the corner of Grafton and Blowers Streets. It shares the intersection with Sicilian Pizza and the European Food Store, which gives the area its well-known local name, Pizza Corner. Pizza Corner is a Halifax landmark and is where lunch begins and a night at the bar ends. Recently, the city installed a surveillance camera on the roof of a nearby building on Grafton Street to record activity in the intersection to try and deter late night violence between drunks. Besides pizza, the KOD building is also home to students who live in the cheap apartments above. If you look closely, you can see a Canadian flag being used as curtain by some penniless med student.  
      
    This is the first entry in what will be a series of BATs from Halifax's Spring Garden Road area. KOD grows on 1x2 corner lots and provides space for Cs$$. There is one dependency [BSC Spa Essentials](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746) See the readme for more detailed stats and instructions.  
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
