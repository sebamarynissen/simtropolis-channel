info:
  summary: Paddys Brew Pub
  description: |-
    Paddy's Brew Pub is a pub in tiny Wolfville, Nova Scotia. Wolfville is dominated by Acadia University. The university keeps the town alive and the yearly influx of students keeps bars like Paddy's rolling in the dough. Rumor has it that the grilled chicken is to die for.  
      
    Paddy's is the second entry in my Atlantic Canada BAT set, which is a set of bats from the various small towns scattered across the region. Paddy's fits w2w on one side and fits with JBSimio's small town set. Paddy's isn't w2w on both sides to allow an alleyway midblock in the small town set. A growable and a plop are included in this upload. See the readme for complete details.
