  summary: Dominion Public Building
  description: |-
    The Dominion Public Building is a Canadian federal government office building located on Bedford Row in Halifax, Nova Scotia. It's also known as the Old Post Office Building because it was built in the 1930s to serve as city's main postal station. It is also sometimes referred to as the original skyscraper because it was Halifax's tallest for over 30 years. Built during the height of the art deco movement in the 1930s, the Dominion Public Building is a one-of-a-kind structure. It's richly adorned with marine inspired stonework, including several large seahorse statutes at the top of the tower. A four storey addition was added onto the building in the 1960s to provide the postal service with additional administrative space. In the later half of the 20th century, changes in mail technology and in Canada Post's operations left the Dominion Public Building largely vacant. In 1993 it was transferred to Public Works and Government Services Canada's control and the department undertook a major retrofit to convert the space into general office use. The retrofit included glassing over the old 5-7th floor window well to create more contiguous floor plates and a really impressive atrium. Today, the Dominion Public Building is almost fully occupied by PWGSC and the building serves as the department's Regional Headquarters.

    The Dominion Public Building comes to SimCity as a 5x3, a 6x3 and an 8x3. Two versions, one with an underground garage and one without.
