  summary: JW Johnston Building
  description: |-
    The J.W. Johnston Building is a provincial government office building in Downtown Halifax, Nova Scotia, Canada. The building is named for James William Johnston. Johnston was prominent public figure and politician when Responsible Government dawned in Nova Scotia (birth of Canadian democracy). Johnston led the fledgling provincial government as Conservative Premier from 1857-1860 and again from 1863-1864 before becoming a judge. The building that bears his name, however,was not always home to government office workers. The building was built in 1928 to house an Eatons Department Store. At the time, it was the largest department store in Halifax and it cemented Barrington Street's status as the City's main retail strip of the pre-WWII era. Eatons relocated to the suburbs in the 1960s and Woods Department Store briefly occupied the space. The Nova Scotia government acquired the building in the 1970s and has completed several major refits. The Johnston Building is one of the best preserved heritage buildings in Downtown Halifax.

    Included in this upload are three versions, 1 ploppable and two growables. One of the growables has an alley in back while the other has a plaza. All lots are 2x4 and provide 542 Co$$$ jobs.
