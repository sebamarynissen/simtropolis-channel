  summary: Tandoori Hut
  description: |-
    The Tandoori Hut is restaurant in Calgary’s Kensington neighbourhood that serves decent Indian food for a reasonable price. The restaurant shares the space with a nail parlour (Shari’s) and a tattoo parlour (Body Inc). The building is right next door to Ridley’s Cycles and just up the street from Trend Fashions.  
      
    This is the fourth entry in my series of Kensington BATs and is part of my continuing effort to diversify our options for small commercial buildings. The Tandoori Hut grows on a 2x3 lot on the Houston and Euro tile sets. It provides CS$$ jobs and fits w2w.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
