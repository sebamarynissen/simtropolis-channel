info:
  summary: Mills Brothers
  description: |-
    Mills Brothers is the premier high-end boutique in Halifax, Nova Scotia, Canada. You can buy clothes and household items for high, high prices. Located on Spring Garden Road, Mills Brothers has been serving Halifax’s wealthy since 1912. Architecturally, the building is a strange mix of traditional Maritime designs with English Tudor styles grafted onto it. As a result, it doesn’t really fit in either category. This Tudoresque look is a product of its time. I suspect it was suppose to appeal to wealthy Haligonians at a time when Canada was still a British colony in spirit by conjuring up images of an English high-street.  
      
    This is my fifth bat in my Spring Garden Road set. Mills Brothers grows on a 2x3 lot in the New York and Chicago tile sets and provides space for Cs$$$. The lot is compatible with JBSimio's small town set.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y)
