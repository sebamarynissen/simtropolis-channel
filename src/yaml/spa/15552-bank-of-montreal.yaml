  summary: Bank of Montreal
  description: |-
    The Bank of Montreal (BMO) is Canada's oldest bank. It was founded in Montreal in 1817. Until the creation of the Bank of Canada in 1935, the Bank of Montreal served as Canada's central bank. Today, BMO has lost its dominant position and is the smallest of Canada's five major banks. Its Toronto headquarters is the largest office tower in Canada.  
      
    This BAT is part of my five BAT set of Canadian bank branches that is designed to help relieve some of the monotony of small Maxis commercial service buildings. It is based on a real BMO branch located on Quinpool Road in Halifax, Nova Scotia. Included in this upload is a growable and a ploppable version with identical stats. Both come on a 2x2 lot and provide 90 Cs$$. The growable version does work and grows easily (stage 3, Houston and Euro tilesets).
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects
