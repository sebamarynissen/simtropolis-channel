  summary: Kingsway Shops Pack 1
  description: |-
    This set of small w2w commercial shops come from the Kingsway neighbourhood in Toronto. The Kingsway is an old pre-ww2 suburb justover the Humber River along Bloor Street. It is a fairly wealthy area that includes a main street area with a large number of bars and restaurants. This pack includes 4 shops: The Bake Sale, My Thai Kitchen, Henry the 8th Ale House and Sempre Pizza and Pasta. The buildings match the small town set. Included are 12 lots, 3 for each shop. Each shop has a 1x1 plop, a 1x1 growable and a 1x2 growable. The growables count towards the applicableBSC reward chain. See the readme for complete details.
