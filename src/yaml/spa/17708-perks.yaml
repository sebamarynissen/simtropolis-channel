  description: |-
    Perks is a small coffee chain in Halifax, Nova Scotia, Canada. The chain operates three outlets in the city, one on Lower Water Street by the ferry terminal and two on Quinpool Road. The small local chain is now facing increased competition with the addition of Timothy’s and Starbucks into the Halifax market. However, Perks’ superb geographic locations will likely allow the chain to weather the storm. This bat is based on the Perks’ Quinpool Road location.  
      
    It is my second bat in my series of bats from Halifax’s Quinpool Road. Perks grows on a 1x2 corner lots and provides space for Cs$$. The Perks lot is compatible with JBSimio's small town set.
