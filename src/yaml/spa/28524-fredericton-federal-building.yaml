  summary: Fredericton Federal Building
  description: |-
    The Fredericton Federal Building is a Government of Canada Building in Fredericton, New Brunswick. The building occupies a prominent corner in Downtown Fredericton at the intersection of Queen and Regent Streets and currently provides office space for Human Resources and Skills Development Canada. The Federal Building was constructed in 1950 and its "stripped classical" style is apparent from its symmetrical design, third floor setback, extruded entranceway, limestone construction and relative lack of ornate detailing. The window insets also harken back to classical styles as their regular spacing and height creates an almost column like appearance. The Federal Building's interior has been modernized over the years, but the lobby still retains its authentic 1950s green Vitrolite tiles. The Federal Building is architecturally significant because it exemplifies a transition in architecture from classical forms to the new International style. A few short years after its construction, the Canadian government embraced modernity, making the Fredericton Federal Building one of the last classical buildings constructed by the federal government.

    The Fredericton Federal Building comes to SimCity as a 4x3 growable and 4x3 ploppable.
