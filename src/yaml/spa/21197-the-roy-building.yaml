  summary: The Roy Building
  description: |-
    The Roy is located in the heart of Halifax, Nova Scotia. It's the largest old building on Barrington Street, but it has unfortunately lost a lot of its luster over the last several decades. The Roy was built by James Roy in 1897 who made his fortune in organ and piano manufacturing (go figure) and speculated successfully in Halifax real estate. The large building streatchs across the middle of an entire block and actually backs onto Granville Street. It was built in three phases starting in 1897, continuing in 1918 after a fire burned much of the original and concluding in 1928. The building is home to a number of small offices and I have heard it said that the interior feels like a 1930s detective movie set. The Roy's century long stay on Barrington Street, however, is nearly over. There is currently a proposal to redevelop the site that will see the building levelled (a demolition permit has already been issued and several tenants evicted). The building's owner is proposing to build a replica of the Roy that will have a large office tower on top. The developer's consultants have indicated that the Roy's original facade is too far gone and too damaged to be restored. It's too bad since this section of Barrington Street is one of the few streetscapes that is still intact in Halifax and the Roy Building is one of the city's few large old building's that has survived. In SimCity, however, the Roy is back and restored to its original glory complete with awnings.

    The Roy comes as a growable and a plop that provides 1,922 Co$$ jobs on a 4x4 lot.
