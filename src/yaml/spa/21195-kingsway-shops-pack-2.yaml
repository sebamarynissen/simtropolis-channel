info:
  summary: Kingsway Shops Pack 2
  description: |-
    This the second edition of small shops from Toronto’s Kingsway. Variations of this style of building can be found throughout Toronto and particularly along Bloor Street from the Kingsway to Korea Town. Kingsway Shops 2 consists of 10 different small shops and includes bars and restaurants (Crème de la Crème, Gabby’s, Ottimo Pizzeria), two clothing stores (Grenview’s, Rico’s of Italy), two home furnishing shops (Kingsmill Kitchen and Bath, Fine Craft Upholstery) a golf shop (Golf Gallery), a Health store (Health Garden) and a hair salon (Linea Hair).  
      
    The shops are narrow and fit two on a 1x2 or 1x1 lot. Each shop will share its lot with one of two possible neighbours. There is also a 5x2 and a 5x1 version that contains all the shops together for an instant all in one Main Street. All the 2 deep lots have an alley in back. Kingsway Shops 2 is compatible in texture and style with my earlier 2 deep lots and JBSimio’s small town set.  
      
    See the readme for complete details and links.
