  summary: Jennifers of Nova Scotia SPA BSC
  description: |-
    Jennifer’s of Nova Scotia is a real store from Halifax, Nova Scotia, Canada. The store specializes in Nova Scotia crafts and does a brisk business with tourists. It occupies an old wooden building on Spring Garden Road that is typical of traditional architecture in Atlantic Canada. This bat is based on that building, but it is not an exact replica.  
      
    It is my second bat from Halifax’s Spring Garden Road area.Jennifer’s grows on a 1x2 corner lots and provides space for Cs$$$. The Jennifer's lot is compatible with JBSimio's small town set.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
