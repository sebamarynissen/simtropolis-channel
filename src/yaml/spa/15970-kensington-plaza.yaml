info:
  summary: Kensington Plaza
  description: |-
    Introducing Kensington Plaza. This BAT brings streetside commercial services to your sims. The building has a collection of store front retail that includes: Merle's Delicatessen, Charlie's Bakery, Janice Beaton's Fine Cheeses, Kensington Wine Market (the anchor store), Honey Bee's Antiques and Crafts, Si Senor Pizza and Lather Hair Salon. Above the stores and accessible from the back is office space.  
      
    This BAT is based on a real building in Calgary's Kensington neighbourhood and is my first BAT in what will eventually be a whole series of buildings from that neighbourhood. This BAT includes two growable corner lots (3X4 and 4X3) and a ploppable. All are stage 4 commercial with 170 CS$$ jobs. Growables appear on the Houston and Euro tile set. One wall of each lot fits in a w2w setting. See the readme for more detailed stats.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
