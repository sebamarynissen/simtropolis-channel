info:
  summary: Lougheed Building
  description: |-
    The Lougheed Building is based on an actual building on 4th Street SWin Calgary, AB, Canada (it's just around the corner from 17th avenue). The building is home to a Sushi Restaurant and a liquour store. The upstairs offices are occupied by several companies.  
      
    The Lougheed Building is the second entry in my 17th avenue bat set. It fits w2w on one side and fairly close on the other. A growable and a plop are included in this upload. See the readme for complete details.
