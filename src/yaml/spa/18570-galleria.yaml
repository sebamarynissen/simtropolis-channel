  description: |-
    The distinctive blue Galleria is a high-end craft and furniture shop on Halifax’s Gottingen Street. Gottingen Street was once Halifax’s main retail strip, but it has been in decline since the 1950s-1970s. Today it’s a strip of social agencies, vacant lots and empty storefronts and has continued to stagnate despite gentrification on neighbouring Agricola, Creighton and Brunswick Streets. The street’s reputation is so bad that Haligonians often refer to it as “gottagun street.” However, artists and students have started to move into the area attracting shops like the Galleria. The Galleria may just be in the vanguard of a Gottingen Street renaissance.  
      
    The Galleria is part of my collection of bats from downtown Halifax. It fits w2w and is made to match JBSimio's small town series. It comes as a growable and a plop. See the readme for complete details.
