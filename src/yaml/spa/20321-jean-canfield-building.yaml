  summary: Jean Canfield Building
  description: |-
    The Jean Canfield Building is a federal government building in Charlottetown, Prince Edward Island, Canada. The building is practically brand new, having only opened in April 2008. It’s a state of the art facility that was built as a concept building to be as environmentally friendly as possible. Environmental measures in place include a reflective roof material, massive solar panels, passive solar, minimal hvac requirements and recycling rainwater. The building was also an urban infill project on a brownfield site that had been previously occupied by a gas station. The building is named for Jean Canfield, the first female member of Prince Edward Island’s provincial legislature and it provides space to a number of different government departments.

    There are 6 versions of the Jean Canfield Building included in this upload (2 growables, 2 plops and 2 diagonal plops). All versions provide 2,487 Co$$. The two growable lots measure 8x5. There are 5 dependencies, of which I consider 2 optional. See the readme for complete details and a tutorial on how to best use the two diagonal plops.
