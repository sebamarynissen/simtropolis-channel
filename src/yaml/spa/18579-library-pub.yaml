info:
  summary: Library Pub
  description: |-
    The Library Pub is a bar and restaurant in tiny Wolfville, Nova Scotia. The Pub is located on the corner of Main and Elm Streets. The bar shares the building with a coffee shop. The Library Pub is the first entry in my Atlantic Canada BAT set, which is a set of bats from the various small towns scattered across the region. The Library Pub fits w2w on both sides and the lot is made to match JBSimio's small town series. A plop and a growable landmark with jobs are included in this upload. See the readme for complete details.
