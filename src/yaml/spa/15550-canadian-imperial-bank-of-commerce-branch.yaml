  summary: Canadian Imperial Bank of Commerce Branch
  description: |-
    **Updated July 28, 2007!** All my old files are being updated and re-released to fix a host of minor issues and mistakes I made when I was still learning. The lot and desc files are the same the original meaning that the new version will replace the old one in your cities without any brown boxes as long as you delete the previous version. A BSC Cleanitol file will be available on [SC4Devotion](http://www.sc4devotion.com)'s BSC exchange as soon as I have all the updated files released, which will make the job of deleting the old versions easy.

    Stretching back to the 1860s the Canadian Imperial Bank of Commerce (CIBC) is Canada's fourth largest bank. The bank's name came about from the 1960s merger of the Canadian Bank of Commerce and the Imperial Bank. The bank has been quick to embrace new technology being the first bank in Canada to introduce ATMs. However, in 2004 CIBC was embarrassed when it became public that a technical error had resulted in the bank faxing customer records to a junkyard in West Virginia. Now in its ever expanding drive to internationalize its business, the bank is ready to open a branch in your city.

    This BAT is part of my five BAT set of Canadian bank branches that is designed to help relieve some of the monotony of small Maxis commercial service buildings. It is based on a real CIBC branch on Spring Garden Road in Halifax, Nova Scotia. Included in the upload is both a growable and a ploppable version with identical stats. Both come on a 2X3 lot and grow on theHouston and Euro tile sets.

    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
