  summary: Bank of Nova Scotia
  description: |-
    More commonly known as Scotiabank, the Bank of Nova Scotia began in 1832 in Halifax, Nova Scotia. It is the third largest bank in Canada and is the most international of the country's five major banks. Scotiabank has extensive operations abroad, especially in Mexico and the Caribbean. This is both an advantage and a disadvantage since when Argentina defaulted on its loans and sent the country's economy tumbling in 2001, Scotiabank lost some major change. Losses in Argentina has not deterred the bank's international expansion and it is now ready to set up a branch in your city.  
      
    This BAT is part of my five BAT set of Canadian bank branches that is designed to help relieve some of the monotony of small Maxis commercial service buildings. It is based on a real Scotiabank branch on Spring Garden Road in Halifax, Nova Scotia. Despite the look of it, as far as I know the building was never a church. Included in this upload is a growable and a ploppable version with identical stats. Both come on a 2X2 lot and provide 100 Cs$$. The growable version does appears at stage 3 on theChicago and New York tile sets.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
