  summary: Sam the Record Man
  description: |-
    **Updated March 3, 2008!** Sam the Record Man is truly no more. After going out of business Ryerson University bought the site. It's now sadly a hole in the ground ![:(](https://community.simtropolis.com/assets/emoticons/Sad.gif)  
      
    Here's a loud place where your sims can pick-up some tunes. Sam the Record Man is an actual store on Yonge Street in Toronto. The company is a well-known Canadian business and its Yonge Street store is a Toronto landmark. The business began in 1936 when Sam Sniderman opened a record department in his family's radio store. The business took off and in 1961 Sniderman opened the company's flagship store on Yonge Street, complete with the iconic giant spinning neon records. Over the years the store outgrew its tiny space and expanded into Steele's Tavern (the middle portion of my bat) in 1985 and the old CIBC Bank (the corner part) in 1991. Unsurprisingly, this expand and add approach over time has given the building a slightly disorganized look. At one point the Sam the Record Man chain had over 30 locations and 11 franchises throughout Canada, but in 2001, tough competition, poor management and the internet pushed the company into bankruptcy. Every store, except the independently owned franchises, was closed. After being shut-down for a year the Yonge Street location reopened in 2002 under the ownership of Sniderman's son and it is still operating today. The reopening has included renovations and the addition of a cafe/ice cream stand on the Gould Street side.  
      
    Sam the Record Man is the first BAT in what will eventually be a series of commercial BATs from Toronto's Yonge Street. It grows on a 3x3 corner lot on the Houston and Euro tile sets. It provides CS$$ jobs and fits w2w on one side.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
