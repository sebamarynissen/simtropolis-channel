  summary: Canadian Broadcasting Centre
  description: |-
    My 50th building and the finale to this weeks release party! The Canadian Broadcasting Centre is a special purpose office building in downtown Toronto. Completed in 1993, the building is the heart of the Canadian Broadcasting Corporation (CBC), Canada’s publicly owned television and radio network. Most of CBC’s English programming and a significant portion of the network’s French shows are produced in the building (television in the roof studios and radio on the floors below). To accommodate television and radio production, the building is built on a series of rubber pads that minimize unwanted vibrations. In total, the Broadcasting Centre is home to 3 radio studios, 19 production studios, 3 television studios, 2 local television studios, 2 all purpose studios and one national news studio. Besides the CBC, the building is also home to the International Academy of Design and Technology. Perhaps though the structure’s signature feature is the 13 storey Barbara Frum Atrium, named in honour of former CBC news anchor Barbara Frum. In 2006, several Canadian police forces and the Canadian Security Intelligence Agency cracked an Islamic terrorist cell and potentially averted an attack on the Broadcasting Centre. The 17 suspected terrorists had a long list of potential targets and had considered attempting to storm the building, take hostages and seize control of the air waves.  
      
    The Canadian Broadcasting Centre comes to SimCity with a growable and a ploppable lot that measure 7x7 and provide 3,718 Co$$$.
