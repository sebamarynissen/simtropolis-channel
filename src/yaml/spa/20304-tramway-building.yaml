  summary: Tramway Building
  description: |-
    The Tramway Building is a unique gem from Halifax’s Barrington Street. Built in 1916 to house the Nova Scotia Tramways and Power Company, the operators of Halifax’s now defunct streetcar network, the structure is one of city’s only modern neo-gothic buildings. The use of concrete as the building’s main material was, in 1916, well ahead of its time. Today the Tramway Building’s upper floors provide office space to an animation company, while the ground floor is home to Frozen Ocean (clothes) and Venus Envy (bookstore/sex shop). The building is a definite local landmark and is generally known as the building with the faces (blown up pictures of peoples faces fill most of the windows on the second floor). Included in this upload are three lots, a 1x2 growable and ploppable and a 1x3 growable. All lots provide 107 Co$$ and have been done to conform with the style I have used previously and JBSimio’s small town set.
