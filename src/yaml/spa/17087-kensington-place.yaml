info:
  summary: Kensington Place
  description: |-
    Kensington Place is based on an actual building in Calgary’s Kensington neighbourhood. The front of this bat is identical to the real building, but the sides and the back are out of my imagination. Kensington Place is mainly office space, but it does include some ground-floor retail on the street side. The stores in the building are a UPS Store, Peppino’s (an Italian deli), Sushi Club and Skribbles (a hair salon). Parking for office workers is provided in an underground garage, but customers have to park on the street or come by transit.  
      
    This is the sixth entry in my series of Kensington BATs and is part of my continuing effort to diversify our options for small and mid-sized commercial buildings. Kensington Place grows on a 5x4 lot on the Houston and Euro tile sets. It provides CO$$ and CO$$$ jobs.
      
    Check out my bat thread [here](https://www.simtropolis.com/forum/messageview.cfm?catid=37&threadid=73597&enterthread=y) or on [SC4devotion](https://www.sc4devotion.com/forums/index.php?topic=573.0) for detailed information about the updates or my future projects.
