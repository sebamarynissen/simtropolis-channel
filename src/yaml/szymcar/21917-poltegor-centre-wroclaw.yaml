  description: |-
    Poltegor Centre (formerly Poltegor) was the highest building in Wroc?aw. It was built in 1982 and the name originates from a company called Poltegor (an acronym for Polska Technika Górnicza) dealing in mining. On January 18, 2007, Poltegor (along with the neighboring land) was bought by a local businessman, Leszek Czarnecki. Czarnecki has decided to demolish the building on June 2, 2007

