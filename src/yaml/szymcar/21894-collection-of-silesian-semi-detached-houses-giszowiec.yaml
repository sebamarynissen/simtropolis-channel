  summary: Collection of Silesian Semi-Detached Houses (Giszowiec)
  description: |-
    It is a pack of 24 typical silesian miners semi-detached houses built

    in beggining of XX century, when Silesia was in Germany until to 1922.

    In 1970 communist government of Poland decided to destroy

    settlement for build new commieblocks, but many inhabitants

    opposed to this decision, so we have today a awful

    mix of german and polish (under soviet influance) architecture.

    Enjoy!

    Localization: Katowice, Poland,

    All models have R$$, 2x2 or 2x3 LOTs

    Only dependency is:

    BSC MEGA Props - SG Vol 01

