  summary: The Palmolive Building
  description: |-
    I have never made a real building or something old before so I thought I'd give it a try. This is a recreation of the Palmolive Building located at 919 North Michigan Avenue in Chicago. It is accurate to how it looks except for two changes:

    - I have tried to make the lobby look like how it was in the 30s before the renovation.
    - I have removed part of the left side to make the building symmetrical and eliminate the 15 story tall blank wall.

    **History**

    The Palmolive Building, formerly 919 North Michigan Avenue, is a 37-story Art Deco building at 919 N. Michigan Avenue in Chicago. Built by Holabird & Root, it was completed in 1929 and was home to Colgate-Palmolive-Peet.

    The Palmolive Building came to be known as the Playboy Building when it was home to Playboy magazine from 1965 to 1989. When Playboy moved out, the name of the building changed to 919 North Michigan Avenue. It was designated a Chicago Landmark in 2000, and it was added to the National Register of Historic Places in 2003.

    Today, the building has been converted for residential use by developer Draper and Kramer. The first two floors were renovated to house upscale office and retail space. High-end condos make up the rest of the building. Notable residents of the building include Vince Vaughn and Lou Piniella.

