info:
  summary: XyloCorp World Headquarters
  description: |-
    I'm expanding my corporate empire and looking for a new city to call home. You can build my corporate headquarters in your city today! You can also move in your BATing company to the ample rentable space in the building. Amenities include a large outdoor plaza, two green roofs, and ample underground parking. Get your office space at XyloCorp today!

    **What's included**

    - Landmark lot
    - CO$$$ lot
    - Ploppable landmark lot with jobs

    **Landmark lot**

    - Size: 8x5
    - Pollution: 10 of each, except radiation, over 10 tiles
    - Plop cost: $10,000
    - Landmark/mayor rating effect: 15 over 15 tiles

    **Commercial lot**

    - Size: 8x5
    - Pollution: 10 of each, except radiation, over 10 tiles
    - Stage: 8
    - Jobs: 2500 (1500 CO$$, 1000 CO$$$)

    **Ploppable job lot**

    Same stats as the two lots above combined.
