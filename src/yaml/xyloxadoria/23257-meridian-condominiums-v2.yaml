info:
  summary: Meridian Condominiums V2
  description: |-
    This is V2 of my Meridian Condominiums. There are a few reasons for a redo of this. The main reason being that with the new version of BAT4Max 2k edition v4.5 TruNite works for me now (some weird thing made it not work for v1 of this building), so now the nightlighting has been improved.

    Also some people have been reporting that the building abandons, I have fixed what seemed to be the cause of that. If you were one of those people, then replace this with the old version and it should grow without errors.

    There is also now a diagonal version included. It only comes as a landmark, as diagonals can't grow.

    **R$$ and R$$$ lots**

    - Stage: 8
    - Residents: 800
    - Construction time: 100 days
    - Pollution: 5 of each except radiation over 5 tiles
    - Water consumption: 5
    - Power consumption: 5
    - Lot size: both 4x2

    **Landmark lot, straight and diagonal**

    - Plop cost: 5000
    - Monthly cost: 20
    - Landmark effect: 20 over 20 tiles
    - Mayor effect: 20 over 20 tiles
    - Pollution: 5 of each except radiation over 5 tiles
    - Water consumption: 5
    - Power consumption: 5
    - Lot size: straight is 4x2, diagonal 1x2
