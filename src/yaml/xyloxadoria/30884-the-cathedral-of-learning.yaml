info:
  summary: The Cathedral of Learning
  description: |-
    Built in 1926, the Cathedral of Learning is a 42 story 163m tall Gothic Revival skyscraper located in Pittsburgh, USA. The building is on the National Register of Historic Places, and is an iconic example of the Gothic Revival style. It is the second tallest educational building in the world, and the tallest in the US.

    I have tried to create the building as close to real life as possible, the only things not on the real building are the stairs on the back side.

    **Lot stats**

    There are three lots to choose from.

    Landmark:

    - Landmark effect: 20 over 30
    - Mayor rating effect: 20 over 30
    - Plop cost: $100000
    - Power and water: 40
    - Monthly cost: 275
    - Pollution: 5 of each over 5 tiles

    Landmark with jobs:

    - CO$$ jobs: 1000
    - CO$$$ jobs: 200
    - (Please note that CO$ jobs do not exist)

    College:

    - Student capacity: 18000
    - Monthly cost: 1500
