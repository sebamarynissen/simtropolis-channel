info:
  summary: Fixed Underfunded Notices (FUN), improved advisor messages for underfunded civic lots
  description: |-
    Here's a FUN little mod that CorinaMarie and Cyclone Boom (CB) have crafted. No, really. It's the Fixed Underfunded Notices mod.

    **Introduction**

    It all started as a simple fix for a bug in the *Local Hospital Pockets Picked* message, where the link to jump to the troublesome hospital or clinic would most times select the wrong one. Then, as CB and CorinaMarie tested and tweaked, they came up with more enhancements, improved other messages and revived (and rewrote) a couple of unused ones. Along with fixing that issue, the messages are now more useful by providing new options to manage low funding for civic lots.

    **Who will benefit**

    This mod will likely only appeal to people who use narrow margins when budgeting for medical and educational facilities. If your itemized master budgets are tweaked to have sufficient funding with no wasted expense, then this is an ideal enhancement for your game.

    **The solution included in this mod**

    The LText and its embedded code were rewritten to give multiple options, and the Lua trigger was fixed. The links in the messages do the following:

    - **Jump to the Medical Facility:** takes you to the building, but leaves the game at the current running speed and changes your cursor to the Query Tool.
    - **Same with Pause Toggle** (on the same row of the message): takes you to the building, changes your cursor to the Query Tool, and toggles the Pause button. If the game is already paused, use the regular Jump, or it will start time running.
    - **Adjust Funding without Jumping:** opens the building's Query Box, but doesn't move the world. This allows you to handle the problem without losing concentration on whatever you were working on. It also leaves the time speed alone and does not change what's on your cursor.
    - **Jump to and Adjust Funding:** good if you want to fix the problem, but also go to the location to see what might be growing nearby. It changes your cursor to the Query Tool as well and leaves the game running speed alone.
    - **Same with Pause Toggle** (on the same row of the message): like the one above, except that this also stops time if it was running. This starts time if the game was paused, so use the previous option in that case.
    - **Adjust Master Budget:** does not jump, but simply opens the Budget Overview, where you can then get to the Master Budget. This is handy if you'd like to scroll through all the facilities, checking for funding discrepancies throughout your city.

    **Priority**

    In the vanilla game, the *Pockets Picked* and the *Teachers Threaten to Strike* messages are set to a Medium-High priority. This means they only show in the News (unless you are playing on Easy difficulty, in which case the Advisor pops them up).

    The mod comes in two flavors, which you can choose with the `priority` variant: one with Medium-High priority for the underfunding (non-strike) messages, and one with all of them set to Urgent priority. With the Urgent version you don't need to keep an eye on the News ticker and can deal with funding situations immediately.

    The SC4 System Integration Module of CAM (`pkg=cam:sc4-system-integration-module`) already includes the Urgent version of these files. If you use CAM, the `urgent` variant is therefore redundant, and the `medium-high` variant overrides the Urgent priorities of CAM.

    **Considerations**

    - Any time a message in the News Box expires (when the main text turns dim gray), the links are no longer clickable. If you are running the game on Cheetah speed, messages time out quickly.
    - On Cheetah speed, a strike message might pop up again and again when closing it if you don't pause time. This is the Maxis code, so it is not something the mod can fix.
    - The underlying code for strikes is the way Maxis created it. If you have more than one strike for the same facility class, the message only jumps to one of them, and you won't get a new popup for the other strike(s) for a very long while. However, the new underfunding message still triggers, so that works as a fix for the Maxis code.
    - The Library and Museum Underfunded messages are News only, no matter which difficulty you play (in the Medium-High version). In the vanilla game, underfunded libraries and museums are never even noticed.
    - In the Medium-High version, underfunded hospitals/clinics and schools are popups on Easy difficulty, and News items on Medium and Hard difficulty.
    - Strikes are popups for all difficulties, just like in the vanilla game.
