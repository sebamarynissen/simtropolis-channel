variantInfo:
  - variantId: kel9509:rci-query-upgrade:style
    description: Choose the style of the building query UI.
    values:
      - value: vertical-bold-tooltips
        description: "v3.1B: vertical layout, bold font, building styles shown in a tooltip. City + region information is below the building information."
        default: true
      - value: vertical-bold-full
        description: "v3.1A: vertical layout, bold font, full list of building styles."
      - value: vertical-light-tooltips
        description: "v3.1E: vertical layout, light font, building styles shown in a tooltip."
      - value: vertical-light-full
        description: "v3.1D: vertical layout, light font, full list of building styles."
      - value: horizontal-bold
        description: "v3.1C: horizontal layout, bold font. City + region information is to the right of the building information."
      - value: mini-vertical-bold
        description: "v3.1 MINI-A: compact vertical layout, bold font, short list of building styles. Capacities, workforce, demand and occupancy are left out."
      - value: mini-vertical-light
        description: "v3.1 MINI-D: compact vertical layout, light font, short list of building styles. Capacities, workforce, demand and occupancy are left out."

