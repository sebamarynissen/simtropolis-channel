          - "/RCI DLL Query v3.1A - Vertical Bold Full Building Styles/"
  - variant: { kel9509:rci-query-upgrade:style: "vertical-light-tooltips" }
    assets:
      - assetId: kel9509-rci-query-upgrade
        include:
          - "/RCI DLL Query v3.1E - Vertical Light Tooltips Building Styles/"
  - variant: { kel9509:rci-query-upgrade:style: "vertical-light-full" }
    assets:
      - assetId: kel9509-rci-query-upgrade
        include:
