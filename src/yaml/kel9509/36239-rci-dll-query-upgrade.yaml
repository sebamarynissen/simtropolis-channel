variants:
  # simplify the installation options - only provide two of the five choices for the ui
  # `hugues-aroux:ui-carbon-skin` also uses this variant, so if this is expanded later then update that package too
  - variant: { kel9509:rci-dll-query-upgrade:orientation: "vertical" }
    assets:
      - assetId: kel9509-rci-dll-query-upgrade
        include:
        - "/RCI DLL Query v3.1B - Vertical Bold Tooltips Building Styles/"
  - variant: { kel9509:rci-dll-query-upgrade:orientation: "horizontal" }
    assets:
      - assetId: kel9509-rci-dll-query-upgrade
        include:
        - "/RCI DLL Query v3.1C - Horizontal Bold/"

variantInfo:
  - variantId: kel9509:rci-dll-query-upgrade:orientation
    description: Choose the orientation of the building query UI.
    values:
      - value: vertical
        description: City + region information is below the building information.
        default: true
      - value: horizontal
        description: City + region information is to the right of the building information.
    
