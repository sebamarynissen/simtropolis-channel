group: kel9509
name: rpl-query-upgrade-bsc-queries
version: 1.0.0-1
subfolder: 900-overrides
info:
  summary: Optional BSC queries of `pkg=kel9509:rpl-query-upgrade`
  description: |-
    Certain BSC queries are nearly identical to the standard Maxis park, landmark or reward queries, with their logo or a different color. These queries have been adapted to show the additional information of `pkg=kel9509:rpl-query-upgrade`, in the same style with the BSC logo and applicable color.

    It covers the queries of the BLS School University, the BSC RT CdS Parks and Missions Church, the BSC Nut Squad Park, the Deadwoods Dark Green Park, the BSC Park, the Cruise Ship Port, the MBEAR Orange Park, Courthouse, Radio Station and University, the MBEAR BSC Main Library, the CAS landmark, University and Park, the BSC SNM Essentials University and the BRT Blue Park.
  author: Kel9509
  website: https://community.simtropolis.com/files/file/37326-rpl-dll-query-upgrade/
dependencies:
  - kel9509:rpl-query-upgrade
assets:
  - assetId: kel9509-rpl-query-upgrade
    include:
      - "/BSC Queries/"

