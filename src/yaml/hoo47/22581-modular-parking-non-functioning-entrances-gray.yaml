info:
  summary: Modular Parking Non-Functioning Entrances Gray
  description: |-
    This is a series of eighteen 1x1 lots that work in conjunction with the original sets (see dependencies below for links) to add more variation to the parking lots you can create.  This set consists of all the entrance lots from the first three sets redone so they are non-functioning eye candy lots.   They still make a street connection, but all other transit properties have been removed.  The original entrance lots were all functioning parking lots.  This set is basically useless without at least having HH Modular Parking Gray (Version 2) installed.

    They are installed as individual lots, so you can delete any that you don't want.  They use the same icons as the original lots, except the lettering is italicized, and appear in the menu right after the equivalent functioning lot.

    Stats are as follows:

    | **Non Shrubs Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Plop cost: | § 5 |
    | Bulldoze cost: | § 2 |

    
    | **Shrubs Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Plop cost: | § 6 |
    | Bulldoze cost: | § 1 |

    Special thanks to RippleJet for his invaluable assistance.

    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues. I will attempt to answer them to the best of my knowledge, and as quickly as possible.

    Also available in black.  You can find all my  lots [here](../../stex/index.cfm?p=files&keyword=hooha47&view=all), or by searching on the STEX for hooha47.
