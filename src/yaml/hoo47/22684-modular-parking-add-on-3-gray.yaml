info:
  summary: Modular Parking Add On 3 Gray
  description: |-
    This is a series of 31 1x1 lots that work in conjunction with the original set (available [](../../stex/details.cfm?id=22528)[here](../../stex/details.cfm?id=22527)) to add dropoff/pick-up areas to your parking lots.  This set includes 3 (available in regular and [shrubs](../../stex/details.cfm?id=22544), for a total of 6) new pieces to interface with the dropoffs, and 5 dropoff pieces available in 5 different styles.  As in the other sets, the entrance lots are functioning parking lots with a capacity of 1,500. The other lots are eye candy.  These can be used with airports, hospitals, shopping center/malls, schools and anywhere else you see fit.  The pieces include one with a crosswalk so your sims can cross safely from the parking lot and one with taxi cabs (especially useful for airports).  Each taxi lot has 3 taxis that are in a prop family where each of the 6 taxis in the family appears during a different part of the day (feel free to send me a pm if you want me to explain that sentence).

    The 5 different styles are each installed in their own folder, so if there are any you don't want, you can just delete the entire folder.

    Stats are as follows:

    | Non-Shrubs **Entrance Lots:**|     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Jobs: | Jobs $ : 2 |
    | Plop cost: | § 30 |
    | Bulldoze cost: | § 2 |
    | Monthly cost: | § 1 |
    | Capacity: | 1,500 |

    | Shrubs **Entrance Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Jobs: | Jobs $ : 2 |
    | Plop cost: | § 35 |
    | Bulldoze cost: | § 2 |
    | Monthly cost: | § 2 |
    | Capacity: | 1,500 |
    
    | **Other Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Plop cost: | § 6 |
    | Bulldoze cost: | § 1 |

    Look for more coming soon, including MML and DAMN.

    Special thanks to RippleJet for his invaluable assistance.  
      
    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues. I will attempt to answer them to the best of my knowledge, and as quickly as possible.  
      
    Also available in black.  You can find all my  lots [here](../../stex/index.cfm?p=files&keyword=hooha47&view=all), or by searching on the STEX for hooha47.
