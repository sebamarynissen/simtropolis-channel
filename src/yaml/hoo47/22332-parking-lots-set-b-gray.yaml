info:
  summary: Parking Lots Set B (Gray)
  description: |-
    Ten 3 x and 4 x  parking lots in various configurations for use in your cities.  They are all functional parking lots, with capacities ranging from 2,250 to 4,000.  They are available as separate lots, so you can delete any you don't want.  They show up at the end of the Misc. Transit menu, with custom icons making it easy to identify the individual lots.

    There are four 3 x 3 lots, one 4 x 3 lot and five 4 x 4 lots in various configurations.

    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues.

    Special thanks to RippleJet for his invaluable assistance.

    Also available in black.
