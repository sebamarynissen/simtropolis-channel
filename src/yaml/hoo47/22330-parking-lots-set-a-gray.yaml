info:
  summary: Parking Lots Set A (Gray)
  description: |-
    Seven small parking lots for use in your cities.  They are all functional parking lots, with capacities ranging from 1,000 to 3,000.  Individual stats for each listed in the read me.  They are available as separate lots, so you can delete any you don't want.  They show up at the end of the Misc. Transit menu, with custom icons making it easy to identify the individual lots.

    Sizes are 1x2, 1x3, 1x4, 3x2, 4x2, 5x2 and 6x2.

    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues.

    Special thanks to RippleJet for his invaluable assistance.

    Also available in black.
