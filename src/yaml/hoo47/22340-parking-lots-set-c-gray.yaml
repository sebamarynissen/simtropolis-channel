info:
  summary: Parking Lots Set C (Gray)
  description: |-
    Twelve 5 tile wide parking lots in various configurations for use in your cities.  They are all functional parking lots, with capacities ranging from 3,750 to 6,250.  They are available as separate lots, so you can delete any you don't want.  They show up at the end of the Misc. Transit menu, with custom icons making it easy to identify the individual lots.

    There are four 5 x 3 lots, three 5 x 4 lots and five 5 x 5 lots in various configurations.

    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues.

    Special thanks to RippleJet for his invaluable assistance.

    Also available in black.
