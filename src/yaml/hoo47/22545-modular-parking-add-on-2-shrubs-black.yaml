info:
  summary: Modular Parking Add On 2 (Shrubs) Black
  description: |-
    This is a series of fifteen 1x1 lots that work in conjunction with the original set (available [here](../../stex/details.cfm?id=22528)) to add more variation to the parking lots you can create. This set adds shrubs to the entrances and ends of rows so you can make greener parking lots.  There are 8 new entrance lots, each with a capacity of 1,500, and 7 eyecandy lots.   You must have the original set in order to use this set properly.

    There will be additional add-on sets coming soon.

    Stats are as follows:

    | **Entrance Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Jobs: | Jobs $ : 2 |
    | Plop cost: | § 35 |
    | Bulldoze cost: | § 2 |
    | Monthly cost: | § 2 |
    | Capacity: | 1,500 |

    
    | **Other Lots:** |     |
    | --- | --- |
    | Lot size: | 1 x 1 tiles |
    | Menu position: | Building: Transportation,Building: MiscTransit |
    | Plop cost: | § 6 |
    | Bulldoze cost: | § 1 |

    Special thanks to RippleJet for his invaluable assistance.

    Please see my [Building Thread](https://www.sc4devotion.com/forums/index.php?topic=8523.0) on [SC4Devotion](http://www.sc4devotion.com/) for any feedback or support issues. I will attempt to answer them to the best of my knowledge, and as quickly as possible.

    Also available in gray.  You can find all my  lots [here](../../stex/index.cfm?p=files&keyword=hooha47&view=all), or by searching on the STEX for hooha47.
