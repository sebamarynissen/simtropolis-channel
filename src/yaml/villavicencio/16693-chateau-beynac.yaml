info:
  summary: Chateau Beynac Grand Cru farm 7x6
  description: |-
    A big I-r2 farm to change the look of the others. Beynac castle is a property that manufactures great wine; "Grand Cru" is a name for big wine.

    Sorry, on the picture the cows are saved at the neighboring farm, but they are not in the lot.

    The lot uses the Villavicencio textures stoneClearRustic and stoneClearRusticDemie, which are installed from `pkg=villavicencio:chateau-beynac-textures`.
