  summary: Telstra Corporate Centre, Melbourne, Australia
  description: |-
    Telstra Corporate Centre is an office skyscraper in Melbourne, Australia that opened in 1992. Standing 219m high with 47 floors, it is in the top ten tallest in Melbourne. Located at 242 Exhibition Street, it is the world headquarters for Telstra and includes a small retail precinct located on the ground floor towards the Little Lonsdale St side.

    The building was designed by Perrott Lyon Mathieson, the architect of Rialto Towers. The new reception area features Australia's largest indoor vertical live garden.

    (source: Wikipedia)

    This is my 26th BAT.

    The Telstra Corporate Centre is a Landmark, costs §110,000 to build and occupies 5x6 lot space.
