info:
  summary: Collins Place, Melbourne, Australia
  description: |-
    Collins Place is a shopping and office complex in Melbourne, Victoria, Australia. Built in 1981, it comprises two office buildings (35 and 55 Collins Street) and a shopping mall in between. Also located at 35 Collins Street is Sofitel Melbourne on Collins.

    Collins Place was built in seven stages, taking approximately ten years to complete at a cost of A$270 million.

    Both towers were built on a square plan at 45 degree angles to the Hoddle Grid. At 35 Collins Street, Sofitel Melbourne on Collins occupies the top 15 floors. All floors of 55 Collins Street are completely leased to ANZ Bank. In the Collins Place shopping area there's a food court and cinemas.

    (source: Wikipedia)

    This is my 23rd BAT.

    Collins Place is a 6x9 Landmark.
