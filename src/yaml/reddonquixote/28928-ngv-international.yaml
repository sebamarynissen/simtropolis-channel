  summary: Melbourne Arts Precinct Part One - NGV International
  description: |-
    **NGV International, Melbourne, Australia**

    National Gallery of Victoria (NGV) International is an art museum located on St Kilda Road in the heart of the Melbourne Arts Precinct of Southbank. Designed by Sir Roy Grounds, it opened in 1968 and was renovated by Mario Bellini and reopened in 2003.

    One of the features of the building is the Leonard French stained glass ceiling, one of the world's largest pieces of suspended stained glass, which casts colourful light on the floor below. The water-wall entrance is another well-known feature of the building. (Source: Wikipedia)

    This is my 10th BAT.

    NGV International is made up of 2 separate lots:

    1. NGV International main gallery, lot size 12x6. Is a Major Art Museum, provides 800 exhibitions and 24000 exhibition tickets. NGV International costs §13,000 to build with a monthly cost of §250.
    2. NGV International annex garden is a triangular lot 12x6x6, costs §100 to build and a monthly maintenance cost of §15. Built as a park, it reduces air pollution by -15.

    Both are available in Darknite and Maxis night versions.

    Part two of the Melbourne Arts Precinct is [Arts Centre Melbourne](pkg=reddonquixote:arts-centre-melbourne).
