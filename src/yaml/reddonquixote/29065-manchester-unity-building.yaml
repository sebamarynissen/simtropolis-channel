  summary: Manchester Unity Building, Melbourne, Australia
  description: |-
    I'm supporting NYBT's Art Deco Month with a series of three Melbourne Art Deco buildings.

    **#1 Manchester Unity Building**

    The Manchester Unity Building is located on the north-west corner of the intersection of Collins Street and Swanston Street.

    The building's opening was celebrated on 12 December 1932 and for the first time the lights illuminating the tower and spire were turned on.

    The building is of concrete-encased steel construction, with the exterior cladding of terracotta faience tiles.

    (source: Wikipedia)

    This is my 15th BAT.

    The Manchester Unity Building is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 2x3, Medium Wealth Commercial Services, provides 863 jobs and costs §110,000 to build.

    Also in this Art Deco series are:

    - [The Century Building](pkg=reddonquixote:century-building)
    - [The Palais Theatre](pkg=reddonquixote:palais-theatre)
