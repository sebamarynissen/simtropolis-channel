info:
  summary: Eureka Tower, Melbourne, Australia
  description: |-
    Eureka Tower is a 297m, 91 storey residential apartment building located in Southbank, Melbourne. Completed in 2006, Eureka Tower is distinctive for its blue and white striping, as well as its 24 carat gold plated glass windows on the top 10 floors of the building.

    The 88th floor of the Eureka Tower is the highest public observation deck in a building in the Southern Hemisphere. (source: Wikipedia)

    This is a ploppable non-functional landmark. The lot is 5x6. High Wealth, costing §110,000 to build and §150 a month.

    Available in both Darknite and Maxis night versions.
