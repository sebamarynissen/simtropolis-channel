info:
  summary: 530 Collins, Melbourne, Australia - Diagonal
  description: |-
    530 Collins is a 167m, 40 floor office building located on the corner of Collins and King Streets and was completed in 1991.

    It is a Premium Landmark offering a central location halfway between the old Paris End and the new Docklands end of Collins Street.
    Source: www.530collinsstreet.com.au

    This is my 8th BAT.

    This package contains the diagonal version of 530 Collins only: a Functional Landmark, lot size 4x6, High Wealth Commercial Office, which provides 2000 jobs and costs §110,000 to build. The prop is included.

    The ploppable and growable versions are available in [530 Collins Street](pkg=reddonquixote:530-collins-street).

    Both Darknite and Maxis night versions are available.
