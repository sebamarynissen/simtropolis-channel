info:
  summary: Bourke Place, Melbourne, Australia
  description: |-
    Bourke Place is a 254m, 51 floor office building located at 600 Bourke Street, Melbourne. Bourke Place tenancies are predominantly used for office space, including numerous law firms, with various retail shops and eateries located throughout the ground floor.

    Completed in 1991, it is the 4th tallest building in Melbourne and the 5th tallest building in Australia. (source: Wikipedia)

    This is my fourth BAT.

    Bourke Place is a Functional Landmark. The lot is 4x6. Medium Wealth Commercial Offices, provides 5376 jobs and costs §110,000 to build.

    Available in both Darknite and Maxis night versions.
