info:
  summary: Century Building, Melbourne, Australia
  description: |-
    I'm supporting NYBT's Art Deco Month with a series of three Melbourne Art Deco buildings.

    **#2 The Century Building**

    Completed in 1938, the Century Building at 125-133 Swanston Street is one of the most notable examples of an interwar commercial office block in the Moderne style in Melbourne. The building's vertical ribbing and corner tower are in the tradition of the American stylised Gothic Art Deco skyscrapers of the 1920s and 1930s. Designed by Marcus Barlow, it complements his more strongly Gothic Manchester Unity Building at the other end of the same block, completed six years earlier.

    (source: eMelbourne)

    This is my 16th BAT.

    The Century Building is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 2x4, Medium Wealth Commercial Services, provides 838 jobs and costs §110,000 to build.

    Also in this Art Deco series are:

    - [The Manchester Unity Building](pkg=reddonquixote:manchester-unity-building)
    - [The Palais Theatre](pkg=reddonquixote:palais-theatre)
