info:
  summary: Shrine of Remembrance, Melbourne, Australia
  description: |-
    **A Remembrance Day Tribute**

    The sanctuary contains the marble Stone of Remembrance, upon which is engraved the words "Greater love hath no man". Once a year, on 11 November at 11 a.m. (Remembrance Day), a ray of sunlight shines through an aperture in the roof to light up the word "Love" in the inscription.

    The Shrine of Remembrance, located in Kings Domain on St Kilda Road, Melbourne, Australia, was built as a memorial to the men and women of Victoria who served in World War I and is a site of annual observances of ANZAC Day (25 April) and Remembrance Day (11 November) and is one of the largest war memorials in Australia.

    The Shrine is in a classical style, being based on the Tomb of Mausolus at Halicarnassus and the Parthenon in Athens.

    (Source: Wikipedia)

    This is my 14th BAT.

    The Melbourne Shrine of Remembrance is a non-functional landmark. Lot size 6x6, costs §2500 to build and has a monthly cost of §150.
