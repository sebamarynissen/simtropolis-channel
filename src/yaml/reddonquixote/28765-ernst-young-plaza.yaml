info:
  summary: Ernst & Young Plaza, Melbourne, Australia
  description: |-
    Ernst & Young Plaza is a 165m, 40 floor office building located on the corner of Flinders and Exhibition Streets and was completed in 2005 (depending which source you read!).

    The historic Herald and Weekly Times building has been a landmark in the city of Melbourne since 1923. In 2002, redevelopment of the site included construction of the new Ernst & Young Tower and the heritage street front buildings were also to be converted into the new 'Herald Living Apartments'.

    Integral to redevelopment was the retention of close to two thirds of the original heritage listed aspects of the building, including the distinctive neon Herald Sun sign.

    The north-eastern corner of the site is now home to the Ernst & Young building. The building itself gives the impression of four individual towers.

    (Source: Australian National Construction Review)

    This is Part 2 of my seventh BAT. Part 1 is [The Herald and Weekly Times Building](pkg=reddonquixote:herald-and-weekly-times-building), which does not include the Ernst & Young towers.

    Ernst & Young Plaza is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 4x5, High Wealth Commercial Office, provides 2000 jobs and costs §110,000 to build.
    - A diagonal version Functional Landmark, same specs (prop included).
    - A growable version.

    All are available in both Darknite and Maxis night versions.
