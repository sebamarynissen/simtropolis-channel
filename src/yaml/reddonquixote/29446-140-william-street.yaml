version: "1.0"
subfolder: 360-landmark
info:
  summary: 140 William Street, Melbourne, Australia
  description: |-
    140 William Street (formerly BHP House) is a skyscraper in Melbourne, Australia. It is one of a few heritage registered skyscrapers in Melbourne. It is located at 140 William Street and is situated on the corner of Bourke Street, in the central business district, and was completed in 1972.

    As an early plot ratio building, it features a large open plaza and public artworks and is an example of the modern style.

    (source: Wikipedia)

    This is my 22nd BAT.

    140 William Street is a 3x3 Landmark.
  author: Reddonquixote
  website: https://community.simtropolis.com/files/file/29446-140-william-street-melbourne-australia/
