info:
  summary: Cristo Redentor, Rio de Janeiro, Brazil
  description: |-
    The Rio 2016 Olympic Project is proud to present...

    **Christ the Redeemer**

    Cristo Redentor is a 30 metre Art Deco statue of Jesus Christ in Rio de Janeiro, Brazil, created by French sculptor Paul Landowski and built by the Brazilian engineer Heitor da Silva Costa, in collaboration with the French engineer Albert Caquot.

    The statue is located at the peak of the Corcovado mountain in the Tijuca Forest National Park overlooking the city of Rio. As a symbol of Brazilian Christianity, the statue has become an icon for Rio de Janeiro and Brazil. It is made of reinforced concrete and soapstone, and was constructed between 1922 and 1931.

    (Source: Wikipedia)

    This is the first BAT release for the Rio 2016 Project.

    Cristo Redentor is a Landmark that comes in several versions. It's a pretty complicated BAT, I've tried to keep it simple...

    **Versions**

    1. Statue with Observation Deck, an overhanging prop that sits on a 1x1 lot. Costs §5000 to build and §150 per month. This version has the statue and plinth atop the stone viewing platform that sits on top of the mountain. It comes with a separate staircase, on a 2x1 lot (zero effect, zero cost).
    2. A standalone version on a 1x1 lot. This version has only the statue and plinth standing directly on the ground.

    You can use both!

    The statue comes in 7 different colours, selected with the `colour` variant. Only one colour can be installed at a time.

    Disclaimer: I have tried to test all of these but there are so many versions I may have missed something. If you find a problem please let me know.

    This is my 30th BAT.
