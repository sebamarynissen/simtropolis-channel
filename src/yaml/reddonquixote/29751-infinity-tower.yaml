group: reddonquixote
name: infinity-tower
version: "1.0"
subfolder: 360-landmark
info:
  summary: Infinity Tower, Brisbane, Australia
  description: |-
    The Infinity Tower is a 249-metre skyscraper by Meriton recently constructed at 43 Herschel Street, Brisbane, Australia. It has been the tallest building in Brisbane since surpassing Soleil in 2013.

    It contains 81 levels of serviced apartments and residential apartments totalling 549 units.

    When measured by roof, the Infinity Tower is the third tallest building in Australia behind the Eureka Tower and the Rialto Towers which are both located in Melbourne, Australia. It is also currently the tallest building to roof in Queensland after surpassing the Q1 although the Q1 is still taller by spire.

    (source: Wikipedia)

    This is my 27th BAT.

    The Infinity Tower is a Landmark, costs §110,000 to build and occupies 3x3 lot space.

    There are two versions of the tower, one with palm trees and one without. This package contains the version without palm trees. The version with palm trees is [Infinity Tower Tropical](pkg=reddonquixote:infinity-tower-tropical). As far as I'm aware there are no conflicts with using both versions at the same time.

    Thanks to everyone who helped me with finding references for this building, the building is so new there weren't many references available :thumb:
