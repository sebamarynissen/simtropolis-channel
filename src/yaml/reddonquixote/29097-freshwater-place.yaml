  summary: Freshwater Place, Melbourne, Australia
  description: |-
    Freshwater Place is located across the river from the Melbourne CBD, positioned next to the Eureka Tower and Crown Casino with a view of the Yarra River and most of the Melbourne CBD.

    Freshwater Place is a high-rise residential skyscraper in Southbank. The building stands at 205 metres and has a total of 536 apartment units.

    (source: Wikipedia)

    This is my 18th BAT.

    Freshwater Place is made available in the following versions:

    - A growable R$$$ residential, lot size 5x4.
    - A ploppable Non-Functional Landmark. Lot size 5x4 and costs §110,000 to build.

    Both Darknite and Maxis night versions are available.
