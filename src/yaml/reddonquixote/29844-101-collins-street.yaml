group: reddonquixote
name: 101-collins-street
version: "2.1"
subfolder: 300-commercial
info:
  summary: 101 Collins Street, Melbourne, Australia
  description: |-
    101 Collins Street is a 260-metre skyscraper located in Melbourne, Australia. The 57 storey building was completed in 1991.

    The tower is currently the 4th tallest building in Australia and the 125th tallest building in the world when measured up to the tallest architectural point which is the 60 metre tall spire. (source: Wikipedia)

    This is version 2 of my sixth BAT.

    This version fixes issues identified with the modding and scale, with an entirely newly created and improved model, textures and nightlights.

    101 Collins Street is made available in the following versions:

    - Functional Landmark. Lot size 4x6, High Wealth Commercial Office.
    - Non-Functional Landmark. Lot size 4x6.
    - A Growable CO$$$ Stage 8.
    - Functional Ploppable CO$$$ Diagonal Landmark. Lot size 4x2.

    All are available in both Darknite and Maxis night versions.

    **STATS for Growable**

    - Lot Size: 4x6
    - Stage: 8
    - Capacity Satisfied: CO$$$ 4665 (CO$$ 6668 when dilapidated)
    - Bulldoze Cost: §3710
    - Pollution at Center: 24 / 24 / 9
    - Pollution Radius: 6 / 7 / 0
    - Water Consumed: 1747 Gallons
    - Power Consumed: 162 MwH

    **STATS for the functional Ploppable CO$$ landmark**

    - Lot Size: 4x6
    - Capacity Satisfied: CO$$ 7327
    - Plop Cost: §110000
    - Bulldoze Cost: §3595
    - Pollution at Center: 24 / 24 / 12
    - Pollution Radius: 6 / 7 / 0
    - Water Consumed: 1220 Gallons
    - Power Consumed: 122 MwH

    **STATS for the functional Ploppable CO$$$ DIAGONAL landmark version**

    - Lot Size: 4x2
    - Capacity Satisfied: CO$$$ 5126 (CO$$ 7327 when dilapidated)
    - Plop Cost: §110000
    - Bulldoze Cost: §3710
    - Pollution at Center: 25 / 25 / 10
    - Pollution Radius: 6 / 7 / 0
    - Water Consumed: 1830 Gallons
    - Power Consumed: 170 MwH
  author: Reddonquixote
