group: reddonquixote
name: optus-centre
version: "1.0"
subfolder: 300-commercial
info:
  summary: Optus Centre, Melbourne, Australia
  description: |-
    The Optus Centre is located at 367 Collins Street, Melbourne. Standing 153 metres tall, it incorporates 34 floors, and was completed in 1975. (source: Wikipedia)

    Built in the Internationalist style, with sheer concrete wall and recessed Corbusian window motifs adding depth to the facade. (source: Walking Melbourne)

    This is my 13th BAT.

    Optus Centre is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 3x5, Medium Wealth Commercial Office, provides 2000 jobs and costs §110,000 to build.
    - A growable version.

    Both are available in Darknite and Maxis night versions.
  author: Reddonquixote
  website: https://community.simtropolis.com/files/file/28956-optus-centre-melbourne-australia/
