  description: |-
    I'm supporting NYBT's Art Deco Month with a series of three Melbourne Art Deco buildings.

    **#3 The Palais Theatre**

    The Palais Theatre is a former cinema, now functioning exclusively as a concert venue, located in St Kilda, Victoria, Australia. With a capacity of 2,896 people, it is the largest seated theatre in Australia.

    The building, which retains many of its original features, is considered one of the finest examples of Art Deco architecture in Australia and is on the Victorian Heritage Register.

    (source: Wikipedia)

    This is my 17th BAT.

    The Palais Theatre is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 6x3, Medium Wealth Commercial Services, provides 1268 jobs and costs §110,000 to build.

    Also in this Art Deco series are:

    - [The Manchester Unity Building](pkg=reddonquixote:manchester-unity-building)
    - [The Century Building](pkg=reddonquixote:century-building)
