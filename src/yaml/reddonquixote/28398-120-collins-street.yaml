  summary: 120 Collins Street, Melbourne, Australia
  description: |-
    120 Collins Street is a 265m, 50 storey office building located in Collins Street, Melbourne.

    Completed in 1991, 120 Collins Street is built on the site of, and integrated with, existing historic buildings including St. Michael's Uniting Church.

    St. Michael's Uniting Church is a National Trust building dating back to 1866 and is built in the Lombardic architectural style, with multi-coloured exterior brickwork, open cloisters on the side of the building and Romanesque arches.

    (source: Wikipedia)

    This is my 3rd BAT.

    120 Collins Street is a Functional Landmark. The lot is 5x7. Medium Wealth Commercial Office, provides 19442 jobs and costs §110,000 to build.

    Available in both Darknite and Maxis night versions.

    I look forward to hearing your comments.

    Again, enormous thanks to everyone who provided advice and support... and the occasional lifeline... along the way. I hope you enjoy it!
