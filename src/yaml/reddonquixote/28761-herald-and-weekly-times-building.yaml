info:
  summary: The Herald and Weekly Times Building, Melbourne, Australia
  description: |-
    The Herald and Weekly Times Building is located on the corner of Flinders and Exhibition Streets and was constructed in stages between 1921 and 1928.

    The building is five storeys with a neo-classical facade of giant order Ionic pilasters. Other notable external details include the bracketed lights at the base of each pier, and in 1930 the twin steel radio towers were added for the radio station 3DB which broadcast from the building. (source: Walking Melbourne)

    In 2007 this building was made into the podium of the Ernst & Young Tower. This version does not include the EY towers, which are in [Ernst & Young Plaza](pkg=reddonquixote:ernst-young-plaza).

    This is my seventh BAT.

    The Herald and Weekly Times Building is made available in the following versions:

    - A ploppable Functional Landmark. Lot size 4x5, Medium Wealth Commercial Services, provides 2000 jobs and costs §110,000 to build.
    - A diagonal version Functional Landmark, same specs (prop included).
    - A growable version.

    All are available in both Darknite and Maxis night versions.
