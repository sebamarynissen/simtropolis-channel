group: reddonquixote
name: westpac-building
version: "1.0"
subfolder: 360-landmark
info:
  summary: Westpac Building, Melbourne, Australia
  description: |-
    The Westpac Building is a 142m, 38 storey office building located at 360 Collins Street, Melbourne.

    It was built in 1978 in the Modern style, featuring vertical fins which balance the horizontal strip windows.

    (Source: Walking Melbourne)

    This is my 29th BAT.

    The Westpac Building is a Landmark, costs §110,000 to build and occupies 3x3 lot space.
  author: Reddonquixote
  website: https://community.simtropolis.com/files/file/29868-westpac-building-melbourne-australia/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_08_2014/83ca6e67660d7b2f1d0d3dad305fdf44-360_collins_street_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_08_2014/5f56ad28ea34a4c1aeee750b12dc12f8-360_collins_street_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_08_2014/d4a8ce7c7e9f2610d885abcecb56bbce-360_collins_street_00.jpg
