  summary: Melbourne Central, Melbourne, Australia
  description: |-
    Melbourne Central is a large shopping centre, office, and public transport hub in the city of Melbourne, Australia. The complex includes the Melbourne Central Shopping Centre; the Melbourne Central railway station (a part of the City Loop underground railway); and the 211-metre high office tower with its distinctive black colour and two communications masts.

    The Melbourne Central shopping and office development was designed by Japanese architect Kisho Kurokawa in the Metabolist style and constructed between 1986 and 1991.

    The Glass Cone is the largest glass structure of its type in the world. The cone is 20 storeys high, weighs 490 tonnes and has 92 glass panes. The Coops Shot Tower is the focal point of the shopping centre, with the cone purposefully built to protect the National Trust building.

    The upper levels of the centre house a Hoyts Cinema complex as well as ten-pin bowling, bars, and the Melbourne Central Lion Hotel, an English style pub.

    (source: Wikipedia)

    This is my 24th BAT... and it's a biggie!

    Melbourne Central is a multi-functional puzzle lot, occupying 14x6 lot space.

    Included are:

    1. Melbourne Central Shopping Centre (Mandatory) - This piece contains the actual model and is an overhanging prop piece, occupying 5x9 lot space. Provides 2000 CS$$ jobs and costs §6500 to build.
    2. ME Bank Tower (Optional) - Placed as a 4x6 lot filler piece, it provides 2000 CO$$ jobs and costs §6500 to build.
    3. Melbourne Central Subway Station (Optional) - 1x1 subway piece with a capacity of 2000.
    4. A 1x1 cement filler piece - included in case you don't have something already.

    The recommended assembly pattern is shown in the last image, but you can assemble it any way you want :)
