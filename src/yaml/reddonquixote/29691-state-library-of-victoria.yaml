  summary: State Library of Victoria, Melbourne, Australia
  description: |-
    The State Library of Victoria is the central library of the state of Victoria, Australia, located in Melbourne.

    The library originally opened in 1856, and underwent major refurbishments between 1990 and 2004, designed by architects Ancher Mortlock & Woolley. As a result of the redevelopment, the State Library of Victoria can now be considered one of the largest exhibiting libraries in the world.

    A number of statues are in the entrance area. There are statues of Mr Justice Sir Redmond Barry, Q.C., designed by James Gilbert and built by Percival Ball, installed in 1887; Saint George and the Dragon, by the English sculptor Sir Joseph Edgar Boehm, installed in 1889; Jeanne d'Arc (Joan of Arc), a replica of the statue by French sculptor Emmanuel Frémiet, installed in 1907; and Charles La Trobe, by Australian sculptor Peter Corlett, installed in 2006.

    **The Dome**

    The landmark Domed Reading Room, which opened in 1913 and was designed by Norman G. Peebles. Its octagonal space was designed to hold over a million books and up to 500 readers. It is 34.75m in both diameter and height, and its oculus is nearly 5m wide. The dome was the largest of its type in the world on completion.

    (source: Wikipedia)

    This is my 25th BAT.

    The State Library of Victoria is a Main City Library, occupying 13x6 lot space.

