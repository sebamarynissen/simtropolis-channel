info:
  summary: 333 Collins Street, Melbourne, Australia
  description: |-
    333 Collins Street is a 129m, 33 floor office building located in Collins Street, Melbourne, built in 1991.

    The 333 Collins Street project maintains the original banking chamber dome dating back to 1891. On top of this, the building adds a mass of granite and glass in a step back form and culminates in a copper dome.

    The Collins Street facade was modelled to a semblance of the original Victorian classical building, with granite stonework and large brass lanterns.

    "An impressive post-modern skyscraper which spares no expense in recreating the grandeur of Victorian Melbourne, whilst achieving a timelessness all of its own." (source: Walking Melbourne)

    This is my 5th BAT.

    333 Collins Street is a Functional Landmark. The lot is 3x6. High Wealth Commercial Services, provides 2000 jobs and costs §110,000 to build.

    Available in both Darknite and Maxis night versions.
