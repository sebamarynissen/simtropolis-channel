info:
  summary: RDQ Venus Arcology
  description: |-
    In December 2014 I took up the challenge to design my own building, and the resulting creation subsequently languished on my hard drive for the next 3 years... until now.

    During a recent stroll down memory lane, I rediscovered this BAT and decided it's not as bad as I remembered, and a few tweaks later, I present it to you now for download. It's still far from perfect but good enough I think. :)

    Oh, and it's called Venus Arcology because someone thought it looked like something from the Venus Project and someone else thought it looked like an arcology. Hence, Venus Arcology. (I must have used up all my creativity designing the building.)

    This is my 42nd BAT.

    RDQ Venus Arcology comes as a 4x4 growable R$$$ residential lot and a 4x4 ploppable CO$$$ lot, in both Darknite and Maxis night versions.
