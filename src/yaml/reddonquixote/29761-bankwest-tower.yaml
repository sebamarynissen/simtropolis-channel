subfolder: 360-landmark
info:
  summary: BankWest Tower, Perth, Australia
  description: |-
    108 St Georges Terrace (formerly known as Bankwest Tower) is a 50-storey office tower in Perth, Western Australia. Completed in 1988, the building measures 247 metres to the tip of its communications antenna. It was the tallest building in Perth from its completion in 1988 until 1992 when it was overtaken in height by Central Park. As of 2009, it remains the second-tallest building in the city. The concrete tower has a distinctive profile, with a triangular plan.

    The site was originally occupied by the Palace Hotel. When the tower was approved, the plan retained much of the Palace Hotel.

    (source: Wikipedia)

    This is my 28th BAT.

    BankWest Tower is a Landmark, costs §110,000 to build and occupies 3x3 lot space.
