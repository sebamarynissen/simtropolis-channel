info:
  summary: Melbourne Arts Precinct Part Two - Arts Centre
  description: |-
    **Arts Centre Melbourne, Australia**

    The Arts Centre Melbourne is a performing arts centre consisting of a complex of theatres and concert halls in the Melbourne Arts Precinct, located in the central Melbourne suburb of Southbank. It was designed by architect Sir Roy Grounds.

    **The Spire**

    The new spire was completed in 1996, and reaches 162 metres. The spire is illuminated with some 6,600 metres (21,653 feet) of optic fibre tubing, 150 metres (492 feet) of neon tubing on the mast and 14,000 incandescent lamps on the spire's skirt.

    **Hamer Hall**

    Hamer Hall is a 2,661 seat concert hall – the largest venue in the Arts Centre complex, used for orchestra and contemporary music performances. It was opened in 1982 and was later renamed Hamer Hall in honour of Sir Rupert Hamer (the 39th Premier of Victoria) shortly after his death in 2004.

    Source: Wikipedia

    This is my 11th BAT.

    The Arts Centre Spire & Hamer Hall occupies a tile space of 16x6. It is an Opera House, and costs §68,000 to build with a monthly cost of §330. Opera Houses provide an educational boost to older Sims.

    Also included are:

    1. A separate Hamer Hall filler lot. Hamer Hall is also an opera house, but has no associated costs, all costs are attached to the main lot. Place it directly under the Hamer Hall prop.
    2. A small power generator. For some reason the BAT doesn't light easily with the standard city electrical grid. To get it to light up it may need its own generator, placed directly next to the Spire/Hamer Hall lot (hide it under the prop). It's small so will not be noticeable in-game. It outputs 6000 power but does not cost anything extra.

    The City Road Underpass (tunnel entrance) is a separate package, [Arts Centre Melbourne City Road Underpass](pkg=reddonquixote:arts-centre-melbourne-city-road-underpass). It is only for anyone that wants to build a road tunnel under the Arts Centre complex, as in real life. In-game, there are no costs and it's not lit.

    The Arts Centre Melbourne comes in four colours (Blue, Red, Green & Purple), selected with the `colour` variant. All four colours are available in Darknite and Maxis night versions.

    Part one of the Melbourne Arts Precinct is [NGV International](pkg=reddonquixote:ngv-international).
