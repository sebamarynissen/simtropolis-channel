info:
  summary: Melbourne Star Observation Wheel, Melbourne, Australia
  description: |-
    The Melbourne Star Observation Wheel (previously Southern Star) is a giant Ferris wheel in the Docklands, Melbourne.

    It is 120m tall and has seven spokes, reflecting the seven-pointed star of the Australian flag.

    It opened two years behind schedule in December 2008, but closed 40 days later due to structural defects, and was subsequently dismantled for major repairs. The wheel itself was scrapped and replaced, but the original support structure and passenger cabins were retained. It did not reopen until 23 December 2013.

    One complete rotation takes 30 minutes and provides uninterrupted 360-degree views of up to 40 kilometres, encompassing the Docklands precinct, Melbourne's CBD, Port Phillip Bay and as far as Mount Macedon and the Dandenong Ranges.

    (source: Wikipedia)

    This is my 20th BAT.

    Melbourne Star Observation Wheel is an overhanging prop Landmark, occupying approximately 7x9 lot space.
