info:
  summary: Six ploppable CP palms as MMPs
  description: |-
    A selection of six ploppable palms made as Mayor Mode Ploppables (MMPs) from c.p.'s models, ready to use without waiting for them to grow.
    Includes the CP Date Palm, CP Fan Palm and CP Royal Palm, each in a medium and a large size.
    All six palms share one icon in the Mayor Mode flora menu: click one or more times to cycle through them in that order.
  author: kergelen
