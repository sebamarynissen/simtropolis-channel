group: kergelen
name: iberiada-set-re-lotted
version: "1.0"
subfolder: 200-residential
info:
  summary: Re-lotted Iberiada Set for Mediterranean cities
  description: |-
    A big set of growable lots for Mediterranean cities using the Iberiada Set models by Jack (SimCityPolska).
    Includes 51 R$ lots, 28 R$$ lots and 10 R$$$ lots (stages 1 to 7), plus 11 CS$$ corner lots (stages 3 to 7),
    in sizes 1x1, 1x2, 2x2, 2x4, 3x4, 4x4 and 4x2. All lots grow only in the European tileset and in medium density residential zones.
    The 2x4, 3x4 and 4x4 lots are designed to form eye candy pedestrian streets between the buildings.
    Every model also has a building-as-prop version and prop families, and most models are sorted into building families.
    Compatible with Paeng's and Gobias' sidewalk mods.
  conflicts: |-
    If you use the BSC No Maxis files or another Maxis building blocker, make sure you have enough other custom lots for the first stages (1, 2 and 3).
  author: kergelen
  website: https://community.simtropolis.com/files/file/28399-iberiada-set-re-lotted/
