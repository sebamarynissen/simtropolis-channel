# props, which include all models and the Police Box and Village Pump props.
# The lots reference nothing but Maxis files and the British Boxes props/models.
dependencies:
  - bombardiere:british-boxes-props

assets:
  - assetId: bombardiere-british-boxes
    include:
      - "\\.SC4Lot$"

