info:
  summary: "Murimk Farm Addons for SPAM Vol1: Barns"
  description: |-
    This is a set which contains five versions of a new barn/stable, designed to blend in with the SPAM by Pegasus and the Pegprod Team.  
      
      
      
    **CONTENT**  
      
    \* Barn v1 - brown brick  
    \* Barn v2 - grey stone  
    \* Barn v3 - red brick  
    \* Barn v4 - red painted wood  
    \* Barn v5 - unpainted wood  
      
      
    **Note: There are no lots in this set, only props!**  
      
      
    **DEPENDENCIES**  
      
    There are no dependencies to this set, but it's likely to be used as a dependency for other sets. :wink:  
      
      
    **DEVELOPER NOTES**  
      
    You can choose to use only one of the models, or you can use the included prop family which contains all the five barns.  
      
    The footprint/bounding box is slightly larger than 1x3 tiles, meaning it will only fit on a 2x3 tile lot or bigger.  
      
    As mentioned above - these are just props that can be used to make any lot you like. Do not include them in your upload though - please point to this pack as a dependency.  
      
      
      
    **CREDITS**  
      
    **BATting:** Murimk  
    **Testing and advice:** Fellow NightOwls Paeng and Abcvs  
      
      
    **SUPPORT**  
      
    Should you need support for these items please visit  
    [PLEX on the STEX](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)
