    **Introduction / Overview**

    **Harbour Green**, this is Phase 2 of the two part complex. Phase one will be coming soon.

    Hong Kong people are proud of the world-renowned Victoria Harbour's scenery, featuring world-class architecture along the coastline which further illuminates the harbour. To enhance this exclusive harbour environment, projects on both sides of the harbour were strategically built by Sun Hung Kai Properties (SHKP) to provide residents with the best living standard.

    To highlight these flawless buildings and the commitment to perfect living, a "Harbour Living Gallery" has been set up at One ifc titled "World-Class Architecture, World-Class Harbour". Today's opening ceremony was officiated by Sun Hung Kai Real Estate Agency Senior Project Manager Tim Mak, Marketing Director Edgar Yang and Executive Director Eric Chow.

    The gallery comprises two parts - "World-Class Harbour Buildings" and "World-Class Living". Five landmark projects will be glimmering beside Victoria Harbour, each with attractive views of the splendid harbour. The five projects include Harbour Gateway, which consists of ifc and Mega Tower, and 3 residential projects - The Arch, Harbour Green and Manhattan Hill.

    The ifc has become a focal point of Hong Kong's world class financial expertise. The elegantly streamlined project is made up of the internationally renowned commercial building and a large-scale shopping complex. Two ifc, an 88-storey building, is the tallest in Hong Kong. Located in Kowloon Station, Mega Tower will be one of the tallest buildings in the world and it will undoubtedly become another landmark for Hong Kong.

    Of the residential developments, The Arch - with its unique and distinctive architectural design and the Sky Club equipped with a pool 500 ft. above sea level - demonstrates a bold yet tasteful statement of "World-Class Architecture". In close proximity, the Harbour Green is a pioneer of "CEO Living" - a new living concept overlooking Victoria Harbour. Manhattan Hill, a blend of contemporary "Manhattan" attitude with glittering harbour views, is another sparkling project that creates an energetic cosmopolitan lifestyle.

    Sun Hung Kai Real Estate Agency Marketing Director Edgar Yang said: "With the natural harbour and a selection of world-class architecture, Victoria Harbour is the most popular scenic attraction in Hong Kong. The resplendent night view of the harbour truly reflects the character of Hong Kong elites - energetic, trend-setting, worldly and full of know-how."

    [Harbour Green Official website](http://www.harbourgreen.com.hk/)

