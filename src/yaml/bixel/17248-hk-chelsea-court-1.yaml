    * * *

    ## Introduction / Overview

    Chelsea Court is a brand new residential complex composed of two main towers on a common base that are situated at an angle towards each other. The complex was completed in 2005 and tops out at 56 storeys.

    For SimCity 4, Chelsea Court has been rendered at two different angles so that you can decide which version you like better. Of course, you can also use both without any problem.

    **Chelsea Court 1** has the lower of the two towers oriented parallel to the front of the lot, whereas the taller tower to the left of it sits on a part of the base that moves back from the front at an angle of approx. 45 degrees.

    **Chelsea Court 2** has the taller tower oriented parallel to the front of the lot, and the lower tower to the right of it sits on the part of the base that moves back from the front of the lot.

    The following lots are included:

    Growable R$$ Landmark (normal version) Special Edition overhanging landmark lot for use with diagonal roadsAll landmark versions feature individual custom icons that are grouped conveniently together (unless other custom buildings happen to interfere) and labeled properly. In addition to this, the description texts (icon hover queries) will tell you the most important things you need to know. If you use both versions of Chelsea Court, you will find the icons for Chelsea Court 1 and 2 neatly lined up.

    The landmarks are intended to be the centerpieces of popular residential districts, so they have been modded to provide an additional park effect (which affects residential zones) rather than only a landmark effect (which affects only commercial zones).

    * * *

