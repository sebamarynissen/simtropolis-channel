    * * *

    **Introduction / Overview**

    This is the third and for now the final building in the CS series. It was inspired by a photo that turned out to be of the Shanghai Commercial Bank, hence the SCB logo on the building. However, the reference photo was not the best, and when more photos appeared, it turned out that the building looked rather different from the BAT after all. Still, the BAT looked to good not to be released, so here it is: A building roughly inspired by a real-world structure and simply called "SCB Building" in game. It's another mid-rise building that will provide 350 CS$$$ jobs.

    The SCB Building has been modded to serve two functions:

    -   Ploppable functional CS$$$
    -   Growable CS$$$

    All lots share the same basic design, but flora and people on them are randomized and will change every time the building grows or is plopped.  
      
    The ploppable version can be found towards the bottom of your landmarks menu, together with the other HKABT ploppables.

    * * *

