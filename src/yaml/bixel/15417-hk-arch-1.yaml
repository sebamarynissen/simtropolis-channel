info:
  summary: HK Arch 1
  description: |-
    This is the corrected 2021 release (centered model, own IIDs for the TE lots). If your cities contain these lots from the original 2006 release, bulldoze them and let them regrow or replop them after updating.

    The Hong Kong BAT Team
    presents  
      
    The Arch  
    Hong Kong China  
      
    BAT created by bixel  
    Modding, lot design, readme & custom menu icons by T Wrecks  
    2021 technical updated version by Tyberius06

    -   **IMPORTANT NOTE (update: 24.06.2021):** there are two significant changes in this upload comparing to the originally released version by Bixel and T Wrecks back in 2006.
        -   The original HK The Arch 1.SC4Model was rendered and exported slightly off-centered (approx 8 or 12 meters on the X-axis), which made it extremely hard to lot it on a tighter lot (how it was meant to be). These original LOTs in this pack were working fine, though the lotter of the CAM version of the The Arch 1 had used different modding technique and this off-centered nature of the model caused a modding error, which led to the so-called Immortal Lot Syndrome on the CAM version (released only on LEX in the CAM LOTS BXL1 set).   
            **In order to fix this issue and prevent possible issues in the future, I used the Model Tweaker and made the model centered (also recompiled the HKABT Bixel Mega Props vol08 with the modified model), then fixed the position of the building on the lots to match with the changed model. It had to be done on all the The Arch 1 lots both in this set and in the CAM version as well.**
        -   The second change what I've applied: I've noticed that both the TE and non-transit enabled LOTs are using the same IIDs per group (R$$ grow and R$$$ grow), and according to the default load order the TE versions would get into the game. I gave the TE lots a different IID, so now they are unique, and now you can really use all of the lots simultaneously.  

    -   **You need to bulldoze and rebuild (re-grow/re-plop) all the lots in order to get the proper results.**

    \- Tyberius06 (STEX Custodian)

