    **Dependencies**  
      
    It was very hard to whip up a lot that would look like a seamless extension of the main building, thus anchoring it on the ground in a natural way. However, I am glad to announce that I managed to use no more than one dependency for The Arch 1 (none for The Arch 2), namely Cerulean's base texture set, which is one of the best-known texture sets and has been used for many other buildings (including BSC and HKBT) already. This texture is a part of the: BSC Textures MEGA Pack Vol 01  
    [https://www.sc4devotion.com/csxlex/lex\_filedesc.php?lotGET=90](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=90)

    I also added some additional light cones which will enhance the look of the lot at night. This, however, is by no means an essential dependency. The lamps will look just fine without it, but even a tad better with it. So if you don't want to download the file, you won't be missing much. If you don't mind downloading the file, here's the link:  
      
    PEG MTP Mountain Theme Pack  
    [https://community.simtropolis.com/files/file/14025-peg-mtp\-mountain-theme-pack/](https://community.simtropolis.com/files/file/14025-peg-mtp-mountain-theme-pack/)

    Alternatively you can use **[HKABT Bixel Mega Props vol08](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=903) v2** with these lots, but in that case you should remove the HK The Arch 1.SC4Model and HK The Arch 2.SC4Model model files (or just run the cleanitol file which comes with the mega prop pack).

    If you wish to use the CAM version of this lot, you can download it from LEX: **[HKABT BXL CAMeLots vol01-15 (CAM LOTS BXL1)](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1087)**.

