    **Install**:

    **First of all, if you already had these lots in your cities, go into your cities and bulldoze them, before installing this updated version of this upload to prevent any nasty side-effects. Also you must completely remove all the previously released versions of these lots and models (before 24.06.2021). If you have the models and the lots DATpacked, then you must re-do the datpacking process with these updated models and lots from this updated upload.**

    **To install it**, simply copy/extract the HKABT parent folder into your plugins. You should keep the \_Documents folder somewhere outside of your plugins.

    To uninstall a version you don't like, first bulldoze all instances of that version in your cities, then save the cities and exit. Now you can safely remove the version without running any risk to get crashes or facing any other inconvenience.

    Mod Edit: Updated dependency links.

