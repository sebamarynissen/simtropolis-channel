    **Introduction / Overview**

    The Mandarin Oriental is a 5-star hotel in Hong Kong, the first and flagship hotel of the Mandarin Oriental Hotel Group. It opened in September 1963 as The Mandarin, located at 5 Connaught Road Central in Central, Hong Kong Island, Hong Kong's financial and banking district. The hotel is the first in Hong Kong to feature in-hotel business facilities, catering to traveling business people.

    **History**

    The hotel, completed in 1963, was built on the site of the pre-war colonial Queen's Building.

    Although the hotel was criticised by Hong Kong and Macau residents during the early days of operation as it bore an extravagant character and identity, it quickly established itself as an award winning hotel. It has been used by diplomats, politicians and celebrities such as Kate Moss, Kevin Costner, Tom Cruise, The Sultan of Brunei, the late Princess Diana, former US Presidents Nixon, Ford and George H. W. Bush.

    After an extensive 9-month renovation, the Mandarin Oriental re-opened on 28 September 2006. The renovated hotel features 502 guestrooms and suites, with guest-centred technology, nine restaurants and bars, a holistic spa, traditional barber, hair salon, sky-lit fitness facility with pool and banqueting facilities.

    **Incidents**

    Leslie Cheung, a famous singer and movie star in Asian cinemas committed suicide by leaping off the 24th floor of the hotel building on 1 April 2003. The hotel site has now become a place where his fans pay their respects every year on 1 April.

