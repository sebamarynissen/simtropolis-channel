    **The Hong Kong / Asia BAT Team** presents **The Sorrento**

    BAT created by **bixel**

    Modding, menu icons & lot design by **T Wrecks**

    readme by **bixel**

    [Check out the Hong Kong /Asia BAT Team room at Simtropolis](../../forum/categories.cfm?catid=153&forumid=1)

    **Introduction / Overview****Sorrento** is a residential complex on the reclamation in west of [Jordan](https://en.wikipedia.org/wiki/Jordan%2C_Hong_Kong "Jordan, Hong Kong"), [Kowloon](https://en.wikipedia.org/wiki/Kowloon "Kowloon"), [Hong Kong](https://en.wikipedia.org/wiki/Hong_Kong "Hong Kong"). At 256 metres (841 feet) with 75 floors, it is the tallest residential building of Hong Kong, and fifth-tallest residential building in the world.

    Located at the [MTR](https://en.wikipedia.org/wiki/MTR "MTR") [Kowloon Station](https://en.wikipedia.org/wiki/Kowloon_%28MTR%29 "Kowloon (MTR)"), Sorrento is comprised of five towers with ascending height. Units are usually sold for between HK$6,000 and HK$10,000 per square foot. Completed in 2003, it was built by [the Wharf Estate Development Ltd.](https://en.wikipedia.org/wiki/The_Wharf "The Wharf") and [MTR Corporation](https://en.wikipedia.org/wiki/MTR_Corporation "MTR Corporation").

    All five towers were designed by Wong & Ouyang (HK) Ltd and follow the same design however reduced in height consecutively with the tallest being Sorrento 1 and the shortest being Sorrento 6. A tower named Sorrento 4 has not been constructed however there is a gap between Sorrento 2 and Sorrento 3.

    More pictures: [Here](http://img86.imageshack.us/img86/9595/sorrentocompletedaytk0.jpg) & [Here](http://img86.imageshack.us/img86/4334/sorrentocompletenightmo5.jpg)

    The following lots are included:

    -   Growable R$$
    -   Landmark

