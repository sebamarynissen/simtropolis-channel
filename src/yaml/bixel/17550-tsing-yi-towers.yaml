    [Check out the Hong Kong /Asia BAT Team room at Simtropolis](../../forum/categories.cfm?catid=153&forumid=1)

    **Introduction / Overview**I was working on my Hong Kong map and just couldn’t help but want more HK style towers, so I made some. 2 kinds based on the same design but with different colors. They are a little tricky to grow but their slim size (6x2) can make for some interesting zoning variations. Tsing Yi is an island near Hong Kong proper…I just named these two towers after the neighborhoods there. You get Chun Fa Luk Court and Tam Kon Shan Court. They are approximately 38 stories tall and I find the color variation pleasing.

    The following lots are included:

    -   Growable R$$

