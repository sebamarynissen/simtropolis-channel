    **Introduction / Overview**

    **Caribbean Coast** Caribbean Coast (traditional Chinese: ???) is a multiphase residential and commercial development in Tung Chung as part of the station development of Tung Chung MTR Station. It was developed by Cheung Kong (Holdings) Limited, and Hutchison Whampoa Limited. As the grantee of the lot, MTR Corporation was retained as the property manager overseeing the estate.

    The tower is the 91st tallest building in the world when measured up to the highest architectural point. This is just Monertey Cove, a 4 Tower section of the entire 13 Tower complex. The rest of Caribbean Coast will come soon.

    The following lots are included:

    -   Growable R$$$

