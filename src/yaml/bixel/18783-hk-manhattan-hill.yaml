    **Introduction / Overview  
    \*\*\*UPDATED\*\*\*  
    see below****Manhattan Hill** is located in Hong Kong on Po Lun Street in Lai Chi Kok. The height of the building was increased from 186.6m to 197.7m, and the number of flats decreased from around 1300 to 1100, so as to provide larger units. It tops out at 48 stories and its height is 197.7 m.

    I have provided both a Maxis normal growth R$$ LOT and a CAM LOT. For those non-CAM using do not- absolutely do not have the CAM folder in your plugins directory.

    [Midland Properties Site on Manhattan Hill](http://www.midland.com.hk/eng/developer_project/E000003571/)

    [Photo of Manhattan Hill](http://www.midland.com.hk/eng/developer_project/E000003571/main_lg.jpg) [Official Website](http://www.manhattan-hill.com.hk/)The following lots are included:

    -   Growable R$$
    -   Landmark

    **Dependencies** NONE!!!

