    **Introduction / Overview**

    **Intercontinental Hotel** is part of the New World Centre. The New World Centre is a shopping centre on Salisbury Road, Tsim Sha Tsui, Kowloon, Hong Kong. It is located near the Sogo Department Store and the Hong Kong Space Museum, opposite the East Tsim Sha Tsui Station of the East Rail Line.

    [New World Centre Website](http://http//www.nwc.com.hk/html/eng/index.aspx//)

