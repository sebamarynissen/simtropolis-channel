    ## Introduction / Overview

    Island Harbourview is one of the largest private housing estates in Tai Kok Tsui, Kowloon, Hong Kong. It is one of the property projects in MTR Olympic Station Phase I. Developed by MTR Corporation, Sino Land, Bank of China (Hong Kong), Kerry Properties, China Overseas Land and Investment and Capitaland Commercial Limited, it comprises 9 high-rise buildings, which were completed in 1998 and 1999.

      
    You will find the following versions:

    -   growable RS$$

    ## Notes from Bixel

    I've had this one for a long time - so long it was before I started doing TruNight for my models. Anyway I was hopeing and hopeing somebody in the transit modding community would create a special avenue for the odd degree diagonal this building has. I even created all the textures for the modders but nobody will do it! Well I finally got tired of waiting and this is the result. As you can see from the pic I used Jeronjis park set to spruce up the area, please refer to the many images I provide for proper zoning and schemes.

