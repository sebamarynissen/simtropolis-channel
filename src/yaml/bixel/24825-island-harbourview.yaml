    ## Installation

    First of all, it is recommended to unzip the entire content of this ZIP into some archive folder where you keep all building versions, readme, and screenshots, and maybe even back it up onto a CD or an external HD together with your other SC4 stuff. This way, if you need to clean your HD and reinstall your OS, you can simply copy the stuff from your backup archive into your plugins folder instead of having to download all plugins anew.

    That said, in order to use this building in game, I suggest you first go to your plugins folder and make a sub-folder for this download.  
    Then, simply copy the .sc4model file(s) (the actual building model) plus the lot file(s) of whatever version(s) you'd like to use into the newly created folder.

    To uninstall a version you don't like *after it has grown in your cities*, first bulldoze all instances of that version in your cities, then save the cities and exit. Now you can safely remove the version without running any risk to experience crashes or any other inconvenience.

