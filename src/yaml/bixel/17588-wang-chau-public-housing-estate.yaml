    **Introduction / Overview**

    I was working on my Hong Kong map and just couldn’t help but want more HK style towers, so I made some more!! This is a midrise Y Block based on Public Housing Estates in a district called Wang Chau in Hong Kong. There are 2 lots included and typically you will want to zone the 4x5 lot on the Left side and the 5x5 Lot on the Right side inorder to get the same result in the Day and Night pictures. Feel free to make your own lots, this building shape is fun to be creative with. Enjoy!

    **The following lot is included:**

    -   Growable R$

    * * *

    **Dependencies**

    NONE!!!

