    **Introduction / Overview**

    **Hutchison House** was built in 1975 and has 24 floors. Hutchison Whampoa Limited (HWL) is among the largest companies listed on the main board of the Hong Kong Stock Exchange. Flagship companies include Hutchison Port Holdings, Hutchison Whampoa Properties, A S Watson, Cheung Kong Infrastructure and Hutchison Telecom.

    The following lots are included:

    -   Ploppable landmark
    -   Ploppable functional CO$$
    -   Growable CO$$

