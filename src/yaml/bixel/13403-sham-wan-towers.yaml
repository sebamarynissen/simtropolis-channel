    INTRODUCTION

    This is a second version of the Sham Wan Towers, which features several improvements. The original version had a non-functional road BATted through the building, and its stats were pretty problematic. New stats have been included in another download, but this was not a really user-freindly approach.

    Now Sham Wan Towers are back, and this time they come in 5 different versions, 3 of which are transit-enabled! The building, too, has undergone some changes. The BATted road has gone, and some details have been added. Now the building features two access roads to built-in parking space, and if you use the transit-enabled versions, these roads (well, one road and one street, actually) will connect to your existing network!

