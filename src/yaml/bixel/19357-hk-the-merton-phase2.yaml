    Based off of the real building in HK, I present you with The Merton! Architect: Ronald Lu & Partners. The Merton is a high-class residence located in Western District Harbour besides with the invincible sea scenery industry development in cooperation with New World Development Co. and Urban Renewal Authority Ltd.  
      
    The Merton is constructed in three high-rise residential blocks; the first is total 49 storey with 392 residence units, the second is total 45 storey with 360 residence units; the approximate of area ranging from 630sq. ft. to 880 sq. ft., the third is total 43 storey with 430 residence units; the approximate of area ranging from 400sq. ft. to 800 sq. ft., the most unit establishes Balconies and Utility Platforms approximate of area, the practical rate amounts to 80%.  
      
    The front of Building faces southwest to views the Tsing Ma Bridge and enjoys beautiful Victoria Harbour view and Hong Kong Disney's Firework Show, the visual field is vast. The Merton owns the Comprehensive School-Net and covers great many Well-Known Schools, including Primary school in 11 districts, Secondary school (in Western District).  
      
    This is only Tower 2 & 3. Tower 1 wil come soon  
      
