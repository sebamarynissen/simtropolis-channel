    **Introduction / Overview**

    **Cayman Rise** sits at the foot of Mount Davis overlooking other buildings in Kennedy Town, this vantage point provides fantastic panoramic sea views. It also boasts a landscaped garden, which provides a rare escape in Hong Kong.

    Ronald Lu and Partners were brought onto the project after the Kwan and Associates-designed towers had been topped out, their involvement being to provide interior design and finish off the project.

    Architect: Ronald Lu & Partners, Simon Kwan & Associates Limited.

    The following lots are included:

    -   Growable R$$

