    **Installation**

    Simply unzip the content of this archive into your plugins folder and delete all the lots you don't want.

    It is generally recommendable to unzip the entire download into a backup folder first and then copy only those files that you want into a sub-folder inside your main plugins folder. This procedure makes it easier to keep full control and leave out files that are not required in game, such as this readme and the screenshots.

    In case you are looking for any ***.SC4desc*** files, these have been merged with the associated lot files to reduce clutter. Due to the individual names of each lot, I needed one desc per lot anyway, so this method suggested itself.

    To uninstall a version you don't like, just delete the lot file from your plugins folder.

    **IMPORTANT:** If any instance of the lot in question has already grown in one or more cities, first bulldoze all instances of that version in all your cities, then save the cities and exit. **Now** you can safely remove the version without running any risk to experience crashes or any other inconvenience.

    Bixel on behalf of HKABT  
