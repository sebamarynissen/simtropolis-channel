    ## Introduction / Overview

    Harcourt House Mass Mutual Tower is situated at a prominent location in Wanchai. It was formerly known as the Fleet House and used to be the clubhouse for the British Navy. The building was acquired by the Chinese Estates Holdings Limited in the late 80s and was renamed as Evergo House in 1994. In mid-1995, extensive alteration and renovation works were carried out to the building and facade, which led to the external appearance at present. The building was subsequently renamed as Mass Mutual Tower in 2000.

      
    You will find the following versions:

    -   growable CO$$
    -   growable CS$$$
    -   ploppable CO$$
    -   ploppable CS$$$

