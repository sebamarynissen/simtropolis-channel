    * * *

    **Introduction / Overview**

    Unsteady Trading is the first of three CS buildings to come. It is rather characteristic in two ways: Firstly, it helps to fill CS$$ demand by providing 350 jobs, and secondly it sits on a very compact lot, which makes it perfectly suitable as a filler building for dense downtonws. In order to prevent it from growing like weed, you'll have to zone a dense 3x1 corner lot (either corner will work), and the building won't grow before stage 8.

    Unsteady Trading has been modded to serve two functions:

    Ploppable functional CS$$ Growable CS$$  
    All lots share the same basic design, but flora and people on it are randomized and will change every time the building grows or is plopped.  
      
    The ploppable version can be found towards the bottom of your landmarks menu, together with the other HKABT ploppables.

    * * *

    **Dependencies**

    None - everything is included!

