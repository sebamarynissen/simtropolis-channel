    Harbour Place (Hunghom Peninsula) was developed by NWS Holdings and Sun Hung Kai Properties. It is in a prime location in Hung Hom by Victoria Harbour. With seven 35- or 36-storey towers containing 2,470 units ranging from 559 to 770 sq ft. Units have functional two- or three-bedroom layouts without bay windows or balconies, and most offer unparalleled views of Victoria Harbour and the magnificent Lei Yue Mun in the distance. A private sale has already seen 950 units sold.  
      
    The property is at the core transportation hub of Hung Hom. Hung Hom railway station and the bus terminus are just steps away through a 24-hour passageway directly connecting to the property, while the coming Shatin to Central Link will add transportation convenience.  
      
    There was some controversy over the sale of the flats, you can check out a little bit about this Hong Kong Residential History here >> [http://www.skyscrapercity.com/showthread.php?t=169549&page=1](http://www.skyscrapercity.com/showthread.php?t=169549&page=1)  
      
    Formally known as Hunghom Peninsula  
      
