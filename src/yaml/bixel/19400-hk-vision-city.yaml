    **Introduction / Overview**

    **Vision City** is 195.3 m tall, located in Tsuen Wan Town Lot No. 398  [\[Wikipedia Article\]](https://en.wikipedia.org/wiki/Vision_City)

    The development, with a large trendy shopping centre, is ideally located in Tsuen Wan town centre, opposite to the Tsuen Wan City Hall and a 8-minute walk from Tsuen Wan MTR Station or a 5-minute walk from Tsuen Wan West Station on KCR West Rail. There are over 1,400 residential flats in 5 towers with excellent clubhouse facilities offered to residents.

    **The following lot is included:**

    -   Growable R$$

