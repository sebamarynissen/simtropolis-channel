    **Introduction / Overview**

    **The Harbourside** is a 255m (836.6ft) tall [residential](https://en.wikipedia.org/wiki/Residential "Residential") [skyscraper](https://en.wikipedia.org/wiki/Skyscraper "Skyscraper") located at 1 Austin Road, in [Union Square](https://en.wikipedia.org/wiki/Union_Square_%28Hong_Kong%29 "Union Square (Hong Kong)") complex on [Kowloon peninsula](https://en.wikipedia.org/wiki/Kowloon_peninsula "Kowloon peninsula"). The building is erected on the [West Kowloon Reclamation](https://en.wikipedia.org/w/index.php?title=West_Kowloon_Reclamation&action=edit "West Kowloon Reclamation") west of [Kwun Chung](https://en.wikipedia.org/wiki/Kwun_Chung "Kwun Chung"). Construction of the 74 storey building began in [2000](https://en.wikipedia.org/wiki/2000_in_architecture "2000 in architecture") and was completed in [2003](https://en.wikipedia.org/wiki/2003_in_architecture "2003 in architecture") under the design by P & T Architects & Engineers. The building is, in fact, three towers joined at the base, middle and top however from a distance it appears as one wall of a building. The gaps between the towers help relieve the stress caused by the wind as the building has a large surface area which results in it acting as a sail. It was constructed as part of the Kowloon Station development and was the fourth phase. All floors are used for residential purposes.

    The tower is the 91st tallest building in the world when measured up to the highest architectural point.

    The following lots are included:

    -   Growable R$$$
    -   Landmark

