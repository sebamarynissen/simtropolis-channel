group: alex-bervoets
name: castle-of-ooidonk-belgium
version: "1.0"
info:
  summary: Castle of Ooidonk, Belgium
  description: |-
    The castle was built in the 16th century and is still owned by the family that build it... Recently renovated to its current state.

    This is a pack with the castle, the entrance gate and some paths.

    Castle:
    * build cost: 45000
    * upkeep: 45
    * nightlights: yes
    * large landmark effect
    * NO dependencies

    Entrance gate and parks:
    * small build cost
    * small upkeep cost
    * no nightlights
    * park effect
    * NO dependencies

    ENJOY ![;)](https://community.simtropolis.com/assets/emoticons/LlamaWink.gif)

    Alex
  author: Alex_Bervoets
