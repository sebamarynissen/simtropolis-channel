info:
  summary: Colwick Woods Court, a 1960s prefab tower block in Nottingham
  description: |-
    A typical 1960s prefab tower block of the type once found in most large towns and cities in the UK. This particular one, in the City of Nottingham, still exists. It was completed in 1966 and rises to a height of 45 m over 16 floors. There are 90 flats within, but to match normal game values the in-game version provides homes for 604 sims.

    It contains a growable residential lot and a ploppable eyecandy landmark for those who want more control over when and where the building appears and aren't worried about function. Both lots are identical, and the building is rendered using TruNite. Also included are a small pack of textures used on the lot and a small prop pack with several variations of parking garages for lot makers.

    To get the growable to appear, enable the Euro tileset and zone a 5x4 medium density residential area. Hold down the Ctrl key to prevent the game from splitting the zone into smaller lots. The zone should grow provided your city meets all the conditions for other medium density low wealth residentials.

    **Stats**

    *Growable*

    - Lot size: 5x4
    - Tileset: Euro
    - Growth stage: 4
    - Capacity: R$ 604
    - Bulldoze cost: 685

    *Landmark (ploppable, eyecandy)*

    - Lot size: 5x4
    - Plop cost: 30,000
    - Bulldoze cost: 500
    - Monthly cost: 50
    - No landmark or mayor rating effect
