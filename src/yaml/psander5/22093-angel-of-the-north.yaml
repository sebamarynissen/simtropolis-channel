info:
  summary: Angel of the North (HD), the sculpture in Gateshead, England
  description: |-
    The Angel of the North is a colossal sculpture situated on a hill overlooking major travel routes into the north east of England, in Gateshead. It was designed by the artist Antony Gormley and completed in 1998. The structure stands in parkland at 20 m tall with a wingspan of 54 m. The Angel's wings are angled forwards by 3.5 degrees to form a gentle embrace, and it serves as a monument and gateway to the North East of England.

    There are two versions of the model, an orthogonal one and an angled one (22.5 degrees) for more flexibility of placement. Each version has two lots: a plain grass lot and a lot with a transparent base texture. The transparent lots allow the statue to be placed in non-urban parkland, as in real life, for example close to highway interchanges. They tolerate draggable paths, such as the ones by Chrisadams3997, which can be dragged directly onto the lot and under the sculpture's base. The grass lots can also be used as roundabout fillers.

    All models are in High Definition (HD), which gives a higher resolution at the closest zoom but makes the files 2 to 4 times larger.

    **Stats**

    *Static landmark*

    - Lot size: 1x1 (overhanging)
    - Plop cost: 20,000
    - Monthly cost: 50
    - Landmark effect: 30 over 30
    - Mayor rating effect: 7
