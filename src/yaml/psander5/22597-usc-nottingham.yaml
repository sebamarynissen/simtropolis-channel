info:
  summary: USC and Caffè Nero, a pair of small shops in Nottingham
  description: |-
    A small pair of commercial buildings for your city fringes and small town centres: a branch of USC, a branded clothing store, and a Caffè Nero. The USC building is based on a shop on Lower Parliament Street, Nottingham, UK, and the café is based on elements from several Nottingham buildings.

    Personally, I don't use growable commercials, but I made one anyway because I know that most people do. There's also a ploppable with jobs. I've done all the modding for this myself, so please let me know if any of the figures are wildly misjudged.

    **Stats** (the same for both versions, unless stated)

    - Lot size: 2x2 (corner)
    - Tileset: Euro
    - Growth stage: 3 (growable)
    - Capacity: CS$$ 43 (CS$ 106 when dilapidated)
    - Plop cost: 1,150 (ploppable)
    - Bulldoze cost: 90 (ploppable) or 173 (growable)
