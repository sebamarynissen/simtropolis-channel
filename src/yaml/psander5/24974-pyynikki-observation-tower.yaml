info:
  summary: Pyynikki Observation Tower in Tampere, Finland
  description: |-
    Pyynikin Näkötorni (Pyynikki Observation Tower) is a small observation tower in the city of Tampere, Finland. It is perched on the world's highest gravel ridge, and sits amongst pine trees in the forested Pyynikki park. It offers superb views over the trees of the city and the surrounding lakes. Once you've had a look you can go below to the café and tuck into their world famous munkki (doughnuts).

    This is a little thing that I made over a year ago but never got round to releasing. I have lost the source file, so it only has the Maxis Night and HD render, no Dark Nite or SD render.

    **Stats**

    *Landmark (ploppable)*

    - Lot size: 2x3
    - Plop cost: 30,000
    - Bulldoze cost: 450
    - Monthly cost: 120
    - Landmark effect: 20 over 20
    - Mayor rating effect: 10
