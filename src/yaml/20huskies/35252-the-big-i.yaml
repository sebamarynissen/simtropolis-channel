  summary: The Big I, a landmark skyscraper in Koriyama, Japan
  description: |-
    The Big I is a landmark 133 m, 24 story skyscraper in Koriyama, Fukushima Prefecture, Japan, which was completed in 2001. Its top floors house the highest planetarium in the world.

    It is available in both ploppable and growable versions. The planetarium provides an earthquake (EQ) boost in your city.

    **Stats**

    *Growable*

    - Lot size: 3x3
    - Growth stage: 8
    - Capacity: CO$$ 2,561
    - Bulldoze cost: 1,843

    *Ploppable*

    - Lot size: 3x3
    - Plop cost: 110,000
    - Capacity: CO$$ 2,561
    - EQ boost: 164%
