  summary: San-ai Dream Center, a cylindrical retail building in Tokyo's Ginza district
  description: |-
    San-ai Dream Center is an iconic cylindrical retail services building in the wealthy Ginza district of Tokyo, Japan. The BAT was released on 11 March 2021, ten years after the Tohoku Earthquake, Tsunami and Nuclear Crisis, in remembrance of them.

    The model is lit up and advertised fictionally by contributors to disaster relief. The colored rings of light on the first five floors represent Japan's resiliency: orange as the disaster unfolded, red as it peaked, green as the Japanese recovered, and a cherry blossom color to represent Japan's optimism for the future.

    **Stats**

    - Lot size: 3x3
    - Plop cost: 31,111
    - Bulldoze cost: 100
    - Capacity: CS$$$ 210 (CS$$ 521 or CS$ 2,077 when dilapidated)
    - Landmark effect: 99 over 64
    - Mayor rating effect: 64
