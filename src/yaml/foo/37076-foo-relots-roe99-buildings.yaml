group: foo
name: relots-roe99-buildings
version: "1.2.0"
subfolder: 200-residential
info:
  summary: 16 growable relots of roe99 buildings
  description: |-
    A set of 16 renewed growable lots using assorted building models made by roe99.
    The CAM lots grow at stages 10 through 13, mostly in the Euro building style.
    All lots have temperate seasonal flora props, some also include tropical flora.
    There are 2 oversized (6x6) high density residential lots; all other lots fit normal zones up to 4 tiles deep.
  author: Foo
  website: https://community.simtropolis.com/files/file/37076-foo-relots-roe99-buildings/
