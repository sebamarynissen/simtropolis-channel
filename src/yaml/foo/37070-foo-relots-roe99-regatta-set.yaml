  - roe99:resources
  # files listed by the author from the BSC Common Dependencies Pack
  - bsc:textures-vol01
  - bsc:textures-vol02
  - bsc:texturepack-cycledogg-vol01
  - bsc:mega-props-sg-vol01
  - bsc:mega-props-cp-vol01
  - bsc:mega-props-cp-vol02
  - bsc:mega-props-swi21-vol01
  - porkissimo:jenx-porkie-expanded-porkie-props
  - shk:parking-pack
  - supershk:mega-parking-textures
  - bsc:essentials

variants:
  - variant: { foo:relots-roe99-regatta-set:flora: "temperate" }
    assets:
      - assetId: foo-relots-roe99-regatta-set
        exclude:
          - " Tropical_[0-9a-fA-F]{8}\\.SC4Lot$"
  - variant: { foo:relots-roe99-regatta-set:flora: "tropical" }
    assets:
      - assetId: foo-relots-roe99-regatta-set
        include:
          - " Tropical_[0-9a-fA-F]{8}\\.SC4Lot$"

variantInfo:
  - variantId: foo:relots-roe99-regatta-set:flora
    description: Flora used on the lots.
    values:
