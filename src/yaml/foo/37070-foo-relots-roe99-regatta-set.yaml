info:
  summary: 6 growable relots of the roe99 Regatta buildings
  description: |-
    A set of 6 renewed growable residential lots using the Regatta building models made by roe99.
    The lots are CAMpatible and grow at stages 7 and 8 (Euro building style).
    Single buildings use 5x5 lots to avoid the immortal lot syndrome of the original lots; a 12x12 megalot is also included.
    Choose between a temperate seasonal and a tropical flora version.
  author: Foo
  website: https://community.simtropolis.com/files/file/37070-foo-relots-roe99-regatta-set/
