info:
  summary: 11 growable and ploppable relots of Mozukuss buildings
  description: |-
    A set of 11 renewed growable and ploppable lots using building models made by Mozukuss.

    Includes commercial lots with temperate seasonal flora props.

    Some lots are partial relots of lots once hosted on LEX to add seasonal foliage and whatnot. Others are merely recalculations and updates to make them more in Line with CAM 3.1/Hybrid gameplay values that PIM-X automatically calculates. Other differences to original lots are CAM and relevant BTE reward trackers were added to occupant groups, icons and descriptions for the ploppables were also added.

    None of the lots will interfere with any of the existing lots.
