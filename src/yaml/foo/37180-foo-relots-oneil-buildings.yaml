info:
  summary: 54 growable relots of Oneil buildings
  description: |-
    A set of 54 renewed growable lots using building models made by Oneil.
    Includes residential and commercial lots with seasonal flora props; some lots also have tropical flora variations.
    Building functions are spread over different growable types. CAM lots use stages 9 to 14.
    Many lots are larger than 4x4 and most buildings are skyscrapers, so expect to zone densely.
