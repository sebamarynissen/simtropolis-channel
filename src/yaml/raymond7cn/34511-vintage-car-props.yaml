  summary: Vintage Car Props
  description: |-
    \=================================  
    Vintage Car Props, by Raymond  
    \=================================

    Anecdote: Couple years ago, I saw a Vintage car when Friend and I drove on the freeway of Vancouver, It's so conspicuous there that I couldn't help to ask my friend what's that as a rustic, She told me this guy was supposed to take part in some sort of Vintage Car Party, I was pretty curious and asked my friend to follow him, After about half an hour, This Car parked in his own garage.![*:D](https://community.simtropolis.com/assets/emoticons/default_9.gif "*:D")

    I lost a good chance to get a look at various Vintage cars, whereas [@BartonThinks](https://community.simtropolis.com/profile/781878-bartonthinks/) gave me a good one along with his wonderful project, He and [@Cyclone Boom](https://community.simtropolis.com/profile/533355-cyclone-boom/) and many friends guided me with references and corrections when modeling. Many Thanks to them, and please forgive me if they're not very retro, I'll improve it during next set.![:}](https://community.simtropolis.com/assets/emoticons/default_48.gif ":}")

    NOTE ABOUT DARK NITE vs MAXIS NITE:  
    \-----------------------------------  
    These Props is designed for Maxis Night(HD).

    DEPENDENCIES:  
    \-------------  
    There are no dependencies required for this file.

    INSTALLATION:  
    \-------------  
    To use them in Lot Editor, you can easily find them by their name as "VintageCR(1\_Black)", Please see Preview picture For further information.

    Thanks.  
    \-- Raymond
