  summary: Bombardiere Drinking Water Fountain Relot with Neko Seasonal Cherry Tree
  description: |-
    Just a simple re-lots replacing the trees on the original with the Neko Seasonal Cherry Trees.
    Initially intended for personal use only in my gameplay, but I guess I can share so people that interested can have it too.

    You can keep the original Drinking Fountain lot from [British Boxes](pkg=bombardiere:british-boxes) and have both of them in your game, or remove it if you don't want to.

    **Usage**

    You can find the park on the Civic Tools > Park menu.

    **Credits**

    - @Bombardiere for the original lot & props
    - Neko Punch for the cherry trees & props
    - @Tyberius06 for the update with a new ID so the lot can co-exist with the original lot.

    **Showcase**

    It's much prettier if you have sidewalk mod too, and I recommend using the Paeng Sandstone Mod.

    Also, here's a short video showcase:  
    https://youtube.com/shorts/gAQ7ipuhYuI

    I hope it's useful and have fun!
