  summary: NOB Edo Suiro (Waterway/Canal) Re-lot with Cherry Blossom
  description: |-
    Just a simple re-lots replacing the trees on the original with the Neko Seasonal Cherry Trees.
    Initially intended for personal use only in my gameplay, but I guess I can share so people that interested can have it too.

    The lots are available on the Park menu.

    **Credits**

    - NOB for the props & original lots
    - Neko Punch for the cherry trees & props
    - @Tyberius06 for the updated version with new IDs and fixes

    **Showcase**

    Also, here's a short video showcase:  
    https://youtube.com/shorts/-KDoVu2Lo4A

    It's my first time trying to re-lots, I hope it's useful.
    Thanks!
  author: bhmantan
