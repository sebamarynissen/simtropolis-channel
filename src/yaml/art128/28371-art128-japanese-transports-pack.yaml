    - https://www.simtropolis.com/objects/screens/monthly_01_2013/5504227be02a394ffce02205a4781d34-mitaki03.jpg
    - https://www.simtropolis.com/objects/screens/monthly_01_2013/d71d430b98956d8028d1ea8c4ad3ebbb-mitaki05.jpg
    - https://www.simtropolis.com/objects/screens/monthly_01_2013/afc78dba87efcd47b956825f83074eae-mitakiuploadleft.jpg
    - https://www.simtropolis.com/objects/screens/monthly_01_2013/9287a2f0be0323517f959821c5a49ac3-mitakiuploadright.jpg
    - https://www.sc4evermore.com/images/jdownloads/screenshots/JR%20transport%20packfull%20v2.jpg
