group: art128
name: japanese-buildings-compilation
version: "1.0"
subfolder: 300-commercial
info:
  summary: 11 buildings inspired by Japanese buildings in various cities
  description: |-
    A set of 11 buildings inspired by Japanese buildings in various cities. This upload contains both of Art128's Japanese/Tokyo Building sets:

    - Art128 Japanese (Tokyo) Buildings Volume 1
    - Art128 Japanese Buildings 2

    They come in growable and two different plop versions: Landmark and Commercial. They can be found at the top and bottom of the landmark menu or, if you use the Submenus DLL mod (`pkg=memo:submenus-dll`), the ploppable with jobs lots can be found in the Commercial Zoning menu.

    - Office Building 1 - Chuo, Tokyo
    - [Toraya](https://en.wikipedia.org/wiki/Toraya_Confectionery) Building - Ginza, Tokyo
    - [Animate](https://en.wikipedia.org/wiki/Animate_(retailer)) Building - Ikebukuro, Tokyo
    - Office Building 4 - Ikebukuro, Tokyo
    - Digital Art Building - Ikebukuro, Tokyo
    - Tokyo Building 6 - Tokyo, Japan
    - Kitayama - Kyoto, Japan
    - Murakami Office - Murakami, Japan
    - Nagaoka-Tottori Offices - Nagaoka, Tottori, Japan
    - Toyama Office - Toyama, Japan
    - **Dantes Tower Machiya** - brand new, previously unreleased building

    All buildings are in HD and Dark Nite, therefore the use of SimFox's Day and Nite Mod (`pkg=simfox:day-and-nite-mod`) is strongly suggested. You can choose between the Maxis Night and Dark Nite setup with the `nightmode` variant.

    All the models and the initial lotting were created by Art128 and the modding by noahclem. The revision of the lotting and modding and the compilation was assembled by Tyberius06.

    **Thanks**

    A big thanks goes to my team mates, my friends who have supported me during the creation process of these buildings, and the readers on the forums who have given their thoughts about the buildings.

    A special thanks goes to noahclem who did the whole modding phase of these buildings. Without his great help there would be no upload of the highest quality possible.

    I hope you'll like these buildings!

    -art128
