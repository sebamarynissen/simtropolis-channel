group: art128
name: paris-modern-transportation-pack
version: "1.0.0"
subfolder: 700-transit
info:
  summary: GLR, subway and bus stations modelled after modern Parisian stations
  description: |-
    This transport pack contains GLR, subway and bus stations modeled after modern Parisian stations (mostly tram T3a).

    Artistic liberties were taken to fit SC4.

    Included are eight (8) lots:

    - GLR Side platforms
    - GLR Side platforms Diagonal
    - GLR Island platform simple
    - GLR Island platform with subway entrance (v2)
    - Subway Stations Orthogonal
    - Subway Stations Diagonal
    - Bus Stops Orthogonal
    - Bus Stops Diagonal

    The subway and bus stations props are arranged into families, that way you get a different entrance/canopy on your lots.

    - Two different GLR platforms are available: side and island.
    - Four different subway entrances are available: Stairs, Stairs+Escalator, Double Escalators, Lift.
    - Six different bus stops are available, made using the canopies of the tram platforms.

    The subway entrances are also available as props with no signs to better fit other uses.

    Modding was done by [@Tyberius06](https://community.simtropolis.com/profile/660284-tyberius06/), thanks!
