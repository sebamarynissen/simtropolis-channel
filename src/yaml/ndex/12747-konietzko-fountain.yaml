info:
  summary: Konietzko Fountain
  description: |-
    The Konietzko Fountain is a place of peace and relaxation. People from across the city come to sit and relax, listening to its gentle sounds and enjoying the surrounding greenery. Its lighting enables it to be used as a meeting point for people at night, as well as during the day. Generations of Sims in your city will enjoy the fountain!

    This download is only provided as a park lot.

    Lot size: 3x3 tiles
