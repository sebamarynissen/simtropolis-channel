info:
  summary: Tamorr's Resource
  description: |-
    **UPDATED to Version 2.05**
       This download contains two files; Tamorr\_Family\_Props\_V210.dat & RLM\_RailPropsNTextures\_V101.dat
       Tamorr Family Props is basically all my prop exemplers that I changed the IDs and put them into my families. Some of them even had there time of day changed, so maybe different from the original exemplars. These will not conflict with the originals, as they have different GI IDs. I only made families of the ones I needed to have certain ones grouped together for particular lots. So the families are definately different from the originals they possibly belonged to, otherwise it would be pointless to make new families.
       RLM RailPropsNTextures is all of the stuff Becca has made for me to go along with certain lots. She has given me permission to use and upload this with my material.

    **UPDATE:**
    2.05
      All I did in this update is changed some of the Cargo Props. Also added a few more of Becca's Rail Textures to this package. Also updated the readme to reflect this.
      *CAUTION - You may have to replop lots using the Cargo Families. That is the only way the for the new changes to show. To be safe I would suggest bulldozing any lots that use the cargo; i.e. My Freight station & Coastal Lots before re-installing/updating this package. See Readme for more Details of Updating.*

    **dependencies:
    **   I know it is probably a pain to get dependencies, especially when there are a lot of them, however the only dependencies you will need are actually mentioned, along with this file, in any of my Lots that I have made, and Uploaded.
       If you intend to use some of the props within this file, you will need to get a corrisponding dependency:
     PEG's Stuff:
       Barge Props and families = PEG CSK Barges Pack 2.05a
       RF and RW Train Cars/Engines = PEG Rail Fleet Pack and CDK3 SUPER PAK (The super pak is only for the regular Alco-Switcher Engine)
       CDK3 TractorTrailer Yard Goat = PEG CDK3 SP Seaport SUPER PAK
       CDK3 Cargo Stuff = PEG CDK3 SUPER PAK & PEG CDK3 SP Seaport SUPER PAK
     SG Props:
       Any SG stuff = BSC MEGA Props SG Vol. 1
     MAXIS Props:
       Pallete, Stack of Palletes, and Pallete cargo props
       Amil, Apark, Aper, and PZFlora Stuff
       Industrial Vehicles and Forklift

    Becca's Stuff in the Separate File has no dependencies, as that is the resources she made for me.

    **CREDITS:**

    PEGASUS and Simgoober for all the Resources most of my prop Exemplars Referance.
      RebaLynnTS for the Permission to include the Models and Textures she has made for me in this Download, as well for all the help she has given me with my projects.
