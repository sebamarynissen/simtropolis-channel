info:
  summary: Old Mine with Train Yard
  description: |-
    The old mine is turning better profits than ever. To serve newer industries rising in its neighborhood a small train yard has been established.

    You can leave the mine with its small train yard as is or use it as an anchor lot for a much bigger train yard, using the modular **Train Yard Strips** (included).

    You'll notice numerous rail tracks on the lot - the one in the rear (north) is the 'run-through'-track for both freight- and passenger trains. The other tracks can be used to make a visual connection to your rail network or to expand the train yard. All the train props are timed, so the yard looks different almost every hour.

    Old Mine

    \-----------------------------------

    Size: 8x5

    Jobs: 158 (ID)

    Needs power, water and road access.

    Can be used by itself or together with the modular Train Yard Strips.

    Train Yard Strips

    \-----------------------------------

    There are 8 pieces ranging in sizes from 1x3 to 1x7.

    They need to be supplied with power and water as well, but are cheap to plop and maintain.

    Can be used by themselves (standalone) or together with the Old Mine.

    All of the pieces can be found at or near the end of your Railway Menu.

    Please see the Readme for more infos and details!

    If you experience problems downloading from ST - the lots are also available at [PLEX](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?action=downloads;sa=view;down=563)
