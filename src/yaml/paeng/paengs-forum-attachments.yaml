# paeng:sandstone-boosters
group: paeng
name: sandstone-boosters
version: "1"
subfolder: 660-parks
info:
  summary: Add a number of Lot, Prop and Texture based items for your Sandstone environment
  description: |-
    This package includes:
    * **Alley Extenders** - Plop these lots over your Road network to make functional Sandstone Sidewalk pedestrian areas.
    * **Gridbusters** - These lots are good for touching up diagonal sections.
    * **Sidings** - Add visually interesting boundaries to Sandstone Alleys and Plazas.
  author: paeng
  website: https://community.simtropolis.com/forums/topic/70412-paengs-forum-attachments/?tab=comments#comment-1627787
  images:
    - https://www.simtropolis.com/objects/attachments/monthly_2019_05/SSt-AlleyExtenders.jpg.cac2551e64ac8ac922764129521da117.jpg
    - https://www.simtropolis.com/objects/attachments/monthly_2019_05/SSt-Gridbusters.jpg.f726562ae92aa3106a75fbe27fb37fcc.jpg
    - https://www.simtropolis.com/objects/attachments/monthly_2019_05/SSt-Sidings.jpg.567453160a8cf207578e15e57fe11840.jpg
dependencies:
  - shk:parking-pack
  - paeng:textures
  - murimk:props-vol02-mixed
  - bsc:mega-props-sg-vol01
  - porkissimo:jenx-porkie-expanded-porkie-props
  - bsc:mega-props-d66-vol01
  - peg:spot
assets:
  - assetId: paeng-sandstone-boosters

