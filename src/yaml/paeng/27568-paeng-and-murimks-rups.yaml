info:
  summary: Paeng & Murimk's RuPS
  description: |-
    **RuPS - Rural Passenger Stations**  
    Based on a whole range of new BATs by *Murimk*, here is a pack of rural stations in various configurations and sizes for you to choose from.  
      
    There are two basic types - one that can be plopped directly on the tracks and one that'll overhang the tracks. They all come with different layouts and configurations - with overpass, tunnels, shelters, station building, parking, and even some mirrored items...  
      
      
    **LIST OF ITEMS**  
    * Plop-on-track Stations - 5 pcs. (small, medium)
    * Overhanging Stations - 7 pcs. (small, medium, large)
    * Overhanging Stations with Building - 4 pcs. (small, medium)
    * Addon (optional) with Railside Parking - 6 pcs.
      
      
      
    **DEVELOPER NOTES**  
      
    The stations come in various sizes and capacities - see in-game menu for details.  
      
    Freight trains can pass, but the stations have no freight capacity.  
      
    The station building is a family and will plop a color-variation randomly. All items have night lights.  
      
    A small addon will enable you to extend the parking around your stations, including two P'n'R modules generating a small income (Business Deal). It fits seamlessly with the stations but can also be used standalone.  
      
    You find all items at or near the end of the *'Transport | Rail'* menu with custom icons.  
      
      
      
    **INSTALLATION**  
      
    Put the whole bundle into "*(My )Documents/Plugins*". You may of course opt to install only certain items - just remove any lot(s) you do not wish to use - but make sure you always keep the Resource files (*RuPS\_Resource\_KEEP*) installed.  
      
    To un-install - bulldoze all lots you may have plopped from this pack, then remove it completely from your Plugins.  
      
      
      
    **CREDITS**  
      
    BATs: **Murimk**  
      
    Textures, Lotting & Modding: **Paeng**  
      
      
      
    **SUPPORT**  
      
    Should you need support for these items please visit the

    **[PLEX on the STEX - Community Support](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**  
      
    [Nightowl Production Forum (no longer available)](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9154.msg204999#msg204999)  
      
      
      
    Enjoy!
