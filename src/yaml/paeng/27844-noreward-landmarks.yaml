info:
  summary: NoReward - Landmarks
  description: |-
    This is my "*Government & Propaganda Kit*"... I've turned a number of default rewards into regular landmarks, but tried to maintain the perks from the rewards. So basically you can plop these lots anytime, e.g. to build up your government district or such, without waiting for the conditions set by the default rewards but still getting similar benefits.

    **LIST OF ITEMS**

    Radio Station

    TV Station

    Movie Studio

    CityHall large

    Court House

    Stock Exchange

    Convention Center

    Bureau of Bureaucracy

    Major Art Museum

    Main Library

    Opera House

    **DEVELOPER NOTES**

    Since these lots will still give you the same benefits like the default rewards, I'd be careful about plopping them more than once - it might blow some caps :-)

    None of them replace any default rewards.

    The lots are all grouped together in the Landmarks menu, even those with education perks (museum and library). Infos on costs and consumption are noted in the in-game menu.

    **SUPPORT**

    Should you need support on any of these items, please visit the [support thread](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=10375.0).

    Enjoy!
