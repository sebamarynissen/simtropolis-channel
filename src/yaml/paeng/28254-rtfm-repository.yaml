info:
  summary: RTFM Repository
  description: |-
    A little tribute to all the content producers who make the extra effort to write a meaningful and precise documentation for their offerings. And a tribute to all the folks who make the extra effort to actually read that documentation...

    In that spirit, this is a regular *library*. The only difference is that you can get any of the many books for a lower price than normal - over 100.000 titles for a maintenance cost of 350/monthly.

    *Kudos as well to Prepo who once batted this little jewel, now set on a new lot for modern surroundings.*

    And remember: *He who reads does have a clear advantage*... ;-)
