info:
  summary: Security Fence Set
  description: |-
    Would you like to have tighter security around sensitive areas like powerplants, hitech-facilities or similar? Here is some proper fencing (and my first upload)!

    The lots are based on the in-game concrete plaza with all the same costs and effects. Basically they're just EyeCandy.

    Fillers and addons are all in separate files (14 lots), so you can delete any item you don't wish to use. Or add further pieces that I might release in the future.

    Thanx to PEGASUS for all the resources he makes available.
