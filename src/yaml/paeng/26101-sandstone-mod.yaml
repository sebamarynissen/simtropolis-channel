info:
  summary: Sandstone Mod
  description: |-
    These Mods - one for sidewalks and one for base textures - will replace a number of default textures with new custom textures designed mainly for rural villages, towns, suburbs and small cities. Basically it is meant to freshen up all those places using a lot of the default sandstone or an overdose of 'white' and 'pink' faux marble - mainly sidewalks, plazas, fillers and to some extent also the bases below buildings.  
      
    The default sidewalk textures will be replaced with a new texture set for high, medium and low wealth/density.  
      
    All base textures and overlays related to the Maxis default sidewalks (Pink, White and Grey) as well as the default Sandstone can be changed to the new Medium Wealth (key) texture with this mod. The Dirt Sidewalks along agricultural developments change to a new texture more related in color as well.

    **Installation**  
    The default (and recommended) scenario will install the 'Sidewalk\_Mod' with all-wealth-dependent sidewalks (*high, medium and low wealth/density*) and the 'Base\_Overlay\_Mod' with all the new base and overlay textures.  
      
    The unpacked Mod resides in the folder '*zzz\_PaengTextureMod*' to ensure that it loads last. Keep it in the root (1st level) of your Plugins, don't put it into any subfolder.

    **Developer Notes**  
    **Control Freak Options**  
    Both parts of this mod can be configured and customized in numerous ways. The included ReadMe has a highly detailed section for all who'd like to get into it. For all who'd like to '*Read Before Download*' first, there is an [Online Version Available](http://dl.dropbox.com/u/5012419/readme/tex_mod/readme1.html).  
      
    **Extras**  
    A 'Texture Pack' provides all the new textures and can be used for any individual lotting projects.  
      
      
    **Recommendation**  
    If you want to expand on this mod and its textures, check the work of **AtmoGuy**, e.g. his highly compatible [Mod to Replace Textures on RTMT Stops](https://community.simtropolis.com/files/file/26535-sandstone-texture-mod-for-road-top-mass-transit-rtmtv3/).  
      
      
      
    The following animation (give some time to load) shows the 'evolution' from defaults to 'old' sandstone to new textures.  
    [http://dl.dropbox.com/u/5012419/niteowl/texani01.gif](http://dl.dropbox.com/u/5012419/niteowl/texani01.gif)  
      
      
    **Support**  
    If you have any problems, questions or suggestions come over to the [Sandstone Texture Mod Support Thread](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9275.0) and join the discussion.  
      
      
    **Credits**  
    Textures & Modding - **Paeng**  
      
    Special Thanks! to the NiteOwl **Murimk** for brainstorming, testing, moral support :-) and a big help on logistics... Same to everybody else who joined the fracas at some point in the SimPeg forums!

