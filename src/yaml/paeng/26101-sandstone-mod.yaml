variantInfo:
  - variantId: paeng:sandstone-mod:sidewalks
    description: Choose the sidewalk textures that replace the default sidewalks.
    values:
      - value: default
        default: true
        description: Wealth-dependent sidewalks with three different textures for high, medium and low wealth (recommended).
      - value: all-high
        description: One-for-All, all sidewalks use the high wealth texture.
      - value: all-medium
        description: One-for-All, all sidewalks use the medium wealth texture.
      - value: all-low
        description: One-for-All, all sidewalks use the low wealth texture.
      - value: high-medium
        description: Control Freak, a mix of the high and medium wealth textures (high wealth, medium wealth and low wealth developments use the high, medium and high texture).
      - value: high-low
        description: Control Freak, a mix of the high and low wealth textures (high wealth, medium wealth and low wealth developments use the high, high and low texture).
      - value: medium-high
        description: Control Freak, a mix of the medium and high wealth textures (high wealth, medium wealth and low wealth developments use the high, medium and medium texture).
      - value: medium-low
        description: Control Freak, a mix of the medium and low wealth textures (high wealth, medium wealth and low wealth developments use the medium, medium and low texture).
      - value: low-high
        description: Control Freak, a mix of the low and high wealth textures (high wealth, medium wealth and low wealth developments use the high, low and low texture).
      - value: low-medium
        description: Control Freak, a mix of the low and medium wealth textures (high wealth, medium wealth and low wealth developments use the low, medium and low texture).

