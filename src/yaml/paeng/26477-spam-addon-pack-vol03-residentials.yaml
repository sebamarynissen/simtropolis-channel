info:
  summary: "SPAM Addon Pack Vol03: Residentials"
  description: |-
    The third SPAM\-patible AddOn pack for your agricultural adventure adds a variety of residential farmhouses.

    **LIST OF Growable LOTS**

    \* R$$\_3 (Becca's Luxury Ranch House, 5 Variations)

    \* R$$\_2 (Murimk's Party Loft, 4 Variations)

    \* R$$\_2 (Craig's Fine Homes, 6 variations)

    \* R$\_1 (Paeng's Hideaway, 6 variations \*)

    All R$$ lots are also included as additional ploppable Eyecandy.

    \* Note: *The ploppable R$ lots were already released with the previous 'AddOn Vol 02'*.

    \- Sizes: 1x2, 2x2

    *For additional greenery it's advised to also install*

    \* [The Terrain Kit](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?action=downloads;sa=view;down=603)

    **DEVELOPER NOTES**

    All the lots come with families of buildings and props - so every grown or plopped instance will look slightly different and give you good variety.

    The ploppable items are set up as landmarks - so they do not need to be connected to roads - you can plop them anywhere between your fields and connect them with non-functional access-roads, e.g. SPAR.

    **INSTALLATION**

    You can drop the whole bundle into the SPAM subfolder 'AddOns', everything is set to go.

    The additional ploppable items are located in the 'Landmarks' menu.

    **SUPPORT**

    If you have questions or need support on this product please visit the

    [SPAM Support Thread](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?board=116.0)

    Enjoy!
