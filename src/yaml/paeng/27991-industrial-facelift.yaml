info:
  summary: Industrial Facelift
  description: |-
    This mod will simplify and straighten out all industrial lots - I-D, I-M and I-H.

    **FIX!**

    **Unfortunately there was a mistake in this mod - the various stages and densities were not properly represented. That has been fixed, but --sorry to say-- you'll have to download and re-install the mod. Sorry for the inconvenience!**

    **USE ONLY WITH FRESH CITY TILES. DO NOT JUST RUN THIS MOD IN ESTABLISHED CITIES!**

    **You first need to bulldoze all default industrial lots! (See notes below...)**

    One of the biggest problems with default industrials is that Maxis dressed them with a rather nasty base texture (no offense meant) and the staggering amount of 5(!) props, creating plenty of boring repetitions. To make industrials more interesting, their footprints were reduced to a minimum and most of the forever repeating props have been removed.

    This will allow you to build up small industrial pockets, where the creative use of 'bulldoze and re-plop', making lots 'historical' plus some seasoning with custom items, props and parking lots can transform even the grimiest industrial area into an eyecatcher.

    **DEPENDENCIES**

    ~ none ~

    **DEVELOPER NOTES**

    The chaotic *I-D* texture has been replaced with Grunge Concrete, *I-M* now has a more neutral concrete look, and the *I-H* comes with a very clean-looking light concrete. Because of the small footprints there is no over-abundance of these texture and everything blends nicely and/or as much as you want.

    So basically you work with your IND lots as always - just zone your parcels and let them grow. As usual you get an array of lots with different sizes from 1x1 up. The main difference will be that your lots are now packed even tighter than before. And look better... :-)

    The rest is just a matter of setting your industrial fillers and MMPs to work :-)

    **USE ONLY WITH FRESH CITY TILES. DO NOT JUST RUN THIS MOD IN ESTABLISHED CITIES!**

    **You first need to bulldoze all default industrial lots!**

    Actually that is not hard to do, given the 'transient' nature of industrial material. But do make sure you catch them all - best would be to pause your game, use the 'Zone' view and remove (de-zone) all IND structures, then re-build with the mod in place. Your city might take a temporary hit, but experience shows that the books balance out rather quickly... Industrials are pretty sturdy ![:)](https://community.simtropolis.com/assets/emoticons/LlamaSmile.gif)

    **INSTALLATION**

    Put the whole bundle into your Plugin folder.

    **SUPPORT**

    Should you need support for these items please visit the

    [Paeng Production Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=10441.0)

    **Enjoy!**
