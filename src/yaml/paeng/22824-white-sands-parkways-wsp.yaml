info:
  summary: White Sands Parkways (WSP)
  description: |-
    This time around I did not make fixed size parks - instead I give you a set of parkways that create a park on their own as they wind through any landscape or cityscape you choose, adding lots of color and fresh air to your setting.

    The set comes complete with narrow and wide paths, diagonals, narrow-to-wide-transitions and a lot of extras (extensions).

    Since that means a lot of lots \*grin\*, I packaged them into different groups - so you have them all in one download, but can decide which groups you want to use (or not).

    These are the groups and their components:

    \* **Basic paths** (all 1x1)
    - straight, curves, tee, cross, straight w/ plaza

    \* **Wide paths** (all 1x1)
    - straight, straight w/ connectors to narrow (tee and cross)
    - transitions straight-to-narrow (tee and cross)

    \* **Diagonal paths** (2x1, 1x1)
    - straight to diagonal (left and right)
    - single diagonal, diagonal to straight connectors

    \* **Path Ends** (all 1x1)
    - Gift shop, Kiosk, Restrooms, Wishing Well, Playground

    \* **Entrances** (3x1, 3x2)
    - with and without parking

    \* **Extensions** (1x3, 2x2, 3x3)
    - ParkHotel, Aristocrat Inn, Coffee shop, Restaurant, Supermarket

    \* **Fillers** (1x1)
    - seasonal trees, plain grass

    In the readme you'll find a full size image showing the various groups.

    The set uses a lot of seasonal trees - be patient, they'll appear within the first year after plopping :-)

    To see the WSP in 'action' and with full size images, please visit this CJ:

    [https://www.simtropolis.com/cityjournals/?p=view&id=693&page=26](https://www.simtropolis.com/cityjournals/?p=view&id=693&page=26)

    \--------------

    Every lots has the usual park-benefits and costs a small monthly fee. They are located in the 'Parks'-menu and have custom icons.

    Thanks to everybody making resources available!

    Enjoy!
