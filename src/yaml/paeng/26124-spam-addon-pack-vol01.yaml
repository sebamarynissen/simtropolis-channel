info:
  summary: SPAM Addon Pack Vol01
  description: |-
    Here is my first SPAM\-patible AddOn pack (combined with some *SPAM* *Accessories*) for your agricultural adventure, containing a set of additional growable farms of various stages, ploppable IND and COM lots, freight station, fences, crop MMPs and more...  
      
      
    **LIST OF ITEMS**  
      
    \* Growable Farms (15 variations)  
      
    \* DDT and Sons - Farm Supplies (LM with COM jobs)  
      
    \* Mekano Brothers - Abattoir (LM with IND jobs)  
      
    \* Cattle Loading Station (functional freight station)  
      
    \* Old Watertower (functional utility)  
      
    ***SPAM Accessories***  
      
    \* Fences (brown, white, barbed wire, all w/ diagonals)  
      
    \* Animals (animated cows and horses)  
      
    \* Crop MMPs (Mayor Mode Ploppables)  
      
    See the included ReadMe for more detailed information!  
      
      
    **INSTALLATION**  
      
    You can drop the whole bundle into the SPAM subfolder 'AddOns', everything is set to go.  
      
      
    **SUPPORT**  
      
    If you have questions or need support on this product please visit  
    [PLEX on the STEX](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)  
      
    **CREDITS**  
      
    Some Building Models are included with kind permission -  
    Original BATs by: [Odd From Sweden / Renovations by: Glenni](https://community.simtropolis.com/files/file/24380-oddbats-previously-unreleased-bats-from-the-user-odd-from-sweden-with-full-permission/)  
      
      
    Enjoy!
