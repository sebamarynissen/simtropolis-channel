info:
  summary: Pocket Plazas
  description: |-
    Since there is a limited number of pleasant-looking 1x2 and 2x2 'natural' plazas for use between or at the end of a row of residential or commercial towers, here is a set to fill just that gap.

    **LIST OF ITEMS**

    \* 7 pcs. 2x2 with varying layouts

    \* 7 pcs. 2x1 with varying layouts

    **DEVELOPER NOTES**

    The items come with default base textures and are compatible with my Sandstone Mod (*see additional screenshots below*).

    Mix and match them with other park- or path systems and pedmalls.

    All values similar to the default small and medium plazas.

    Located at or near the end of the 'Parks' menu.

    All lots are in separate files so you can remove any item you do not wish to use. Included in the DL are images that will help you to identify individual items.

    **CREDITS**

    Lotting & modding: **Paeng**

    Original Request: **Shinkansen**

    **SUPPORT**

    Should you need support for these items please visit the

    [Paeng Production Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php/board,109.0.html)

    Enjoy!
