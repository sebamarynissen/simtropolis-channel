info:
  summary: Quonset Camp
  description: |-
    This is a quickly built camp for your migrant workers for any kind of operation - logging, mining, farming or similar...

    STATS

    Residential Growable

    Size: 3x6 (zone exact size with CTRL)

    Growth Stage: 1

    Capacity: 150 R$ (5 barracks for 30 each)

    Uses some water and power, very slight pollution, some garbage, needs road access.

    Note: *The 'Quonset Camp' uses special models BATted by* **Becca** (RebaLynnTS) - *they are included with her kind permission*.

    Enjoy :-)
