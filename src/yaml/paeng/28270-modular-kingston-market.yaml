group: paeng
name: modular-kingston-market
version: "1.0"
subfolder: 300-commercial
info:
  summary: Modular Kingston Market
  description: |-
    An old favorite of mine revisited... Here is a small set of modular lots designed to build your own marketplace in any size and shape around the *Kingston Market Hall*.
      
    
      
    **DEVELOPER NOTES**

      
    *Kingston Market* is a functional COM landmark with jobs (see in-game menu for details) - so it needs power, water and street access. There are no reward conditions. The original 'timed' functions were preserved.  
      
    The *Market Stalls* are plain eyecandy landmarks, but need a little power and water.  
      
    The three additional lots by Kwakelaar are optional. If you don't want to use them, delete that file (*paeng\_KingstonMarketStalls\_Kwa.dat*).  
      
    All lots are at or near the end of your *Landmarks* menu with custom icons.  
      
      
      
    **INSTALLATION**  
      
    Just drop the whole bundle in your Plugins. You may also opt to install only certain items - remove the ones you do not wish to use. To un-install - first, bulldoze any lots built with this addon, then remove the complete folder from your Plugins.  
      
    To keep your in-game menu tight, move all \*.SC4Lot files from the dependencies to a safe location outside your plugins.  
      
      
      
    **SUPPORT**  
      
    Should you need support for these items please visit the  
    [PLEX on the STEX - Community Support Forums](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)  
      
      
    **Enjoy!**
