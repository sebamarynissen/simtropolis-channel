info:
  summary: WMP SPAM Add-On Barns Vol01 (Legacy Version)
  description: |-
    Two additional farms for your SPAM agricultural areas, featuring two barns with a distinct european flavor from *Working Man Productions*.  
      
      
    **LIST OF ITEMS**  
      
    \* 2x3 Growable Farm with a long double barn (spam crops)  
    \* 2x3 Growable Farm with a short barn and silo (spam crops)  
      
    *Both are also available as ploppable version (no crops).*
      
      
    **DEVELOPER NOTES**  
      
    The growables will appear in your SPAM area with a random crop and fit in seamlessly with all the other SPAM growable farms (matching stats, queries etc.).  
      
    The ploppable items are neutral and can be found at or near the end of the 'Landmarks' menu.  
      
      
    **INSTALLATION**  
      
    Unzip the files into your Plugins (preferably into the subfolder SPAM AddOns).  
    To un-install, bulldoze all instances of these items, then remove the files from your plugins.  
      
      
    **CREDITS**  
      
    BATting: **Doc Rorlach / WMP**  
      
    Lotting and Modding: **Paeng**  
      
    \* *Barn models included with author's permission.*  
      
      
    **SUPPORT**  
      
    Should you need support for these items please visit the  
    [WMP Production Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9394.0)  
      
      
      
    **Enjoy!**
