info:
  summary: "'Federales'"
  description: |-
    Set up the Feds with an inconspicuous looking office building right in your downtown or any suburb and let them help you fight crime. Only the trained eye will discover the discreet security perimeter with double fences and concrete reinforced hedges, or the traps against suicide carbomb drive-ins... or the extra array of antennas on the roof...

    ![fbi500.jpg](http://dl.dropbox.com/u/5012419/Stex/fbi500.jpg)

    Sits on a 4x3 lot and has slightly raised stats from the default '*Large Precinct*'.

    Enjoy!
