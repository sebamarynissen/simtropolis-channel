info:
  summary: Grunge Docks
  description: |-
    This is another addon for the '*PEG* *PPond Canal Kit*', adding grungy wall- and dock pieces to the existing collection.

    **LIST OF ITEMS**

    6 lots with additional docks

    3 fillers

    1 large curve

    2 ends (left and right)

    **DEVELOPER NOTES**

    Note that these lots add 1 tile depth on the landward side of your canals. When you mix them with other canal pieces, just use any industrial 1x1 lots to fill the gaps - e.g. my '[Grunge Concrete Set](https://www.simtropolis.com/forum/files/file/26425-paengs-grunge-concrete-set/)'.

    The lots are cheap to plop and to maintain. They need to be connected to your power-grid for all effects to work (smoke, sparkles). They also give a small boost to job demand in the area.

    The industrial walls in the back are sprayed with families of grafitti that appear randomly with each plop. Bulldoze and replop if you don't like a particular motif.

    The barges and some of the freight on the docks are timed - allow some time for everything to change into the rhythm.

    **Note**: There is no special 'Outer Corner' - just use the one from the regular docks or canals!

    The pieces are located in the **Harbor Menue** just below the original CSK2 Docks with custom icons.

    Needless to say - these lots can be mixed freely with any other lots that are part of the PEG PPond Canal series.

    **INSTALLATION**

    Just drop the whole bundle in your Plugins. You may also opt to install only certain items - just remove the ones you do not wish to use. To un-install just remove the complete folder from your Plugins.

    **CREDITS**

    Lotting and Modding: **Paeng**

    **SUPPORT**

    Should you need support for these items please visit the

    [Paeng Production Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php/board,109.0.html)

    Enjoy!
