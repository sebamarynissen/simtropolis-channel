info:
  summary: SPAM Addon Pack Vol02
  description: |-
    The second SPAM\-patible AddOn pack for your agricultural adventure adds a variety of ploppable items - Barns, Silos, Farm- and Greenhouses... and a very large Dairy Farm.  
      
      
      
    **LIST OF LOTS**  
      
    \* Barns (3 lots - 9 Variations)  
      
    \* Silos (4 lots - 5 Variations)  
      
    \* Greenhouses (4 lots - 2 variations)  
      
    \* Farmhouses (1 lot - 6 variations)  
      
    \* Large Dairy Farm  
    \- Size: 5x9  
    \- Jobs: 145 I-M  
      
      
    **DEVELOPER NOTES**  
      
    Most of the lots come with families of buildings and props - so every plop will look slightly different and give you good variety. All the items are set up as landmarks - so they do not need to be connected to roads - you can plop them anywhere between your fields and connect them with non-functional access-roads, e.g. SPAR.  
      
    The Large Dairy Farm is the only exception - it is a functional landmark with I-M jobs and therefore needs road access, power, water and will create some pollution as well.  
      
      
      
    **INSTALLATION**  
      
    You can drop the whole bundle into the SPAM subfolder '*AddOns*', everything is set to go. You find the ploppable items in the landmark menu.  
      
      
      
    **SUPPORT**  
      
    If you have questions or need support on this product please visit  
    [PLEX on the STEX](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)  
      
      
    Enjoy!
