info:
  summary: Cemetery and Park Walls
  description: |-
    **Modular Cemetery and Park Walls 205**  
    **Parks 205 AddOn Vol02**  
      
    This AddOn brings you two small modular sets - *Park Walls* and *Cemetery*, both designed to fit seamless into the *Parks205* series. They'll help to transition a typical open park into a more closed and quiet cemetery and back to a free flowing park.  
      
    Each set contains 7 pieces, all of them 1x1, with various configurations of walls, gates, tombstones, sarks and crypts, some of them with typical path configurations to connect them easily to the rest of the *Parks205* series.
      
      
    **DEVELOPER NOTES**  
      
    All wall- and cemetery items are neutral, no special effects or benefits. You find them in the Parks menu sorted in near the *SIDINGS205*, with custom icons.  
      
    **Note that the AddOn contains one further item** - an **optional** replacement for the default cemeteries (all **3 stages**). The design is the same like one of the Cemetery205 Fillers, but with the functionality of the default cemetery. So once you are advised that "*Your Sims demand a cemetery*", you can just bulldoze one of the fillers in your cemetery-layout and plop the replacement tile instead. That way you get the default perks but don't need to change your carefully planned layout.  
      
    If you'd rather use the default items (which are kinda large 5x5 lots, and not the prettiest either), you can just remove the *cemetery\_replacements.dat* from the AddOn.  
      
      
      
    **SUPPORT**  
      
    Should you need support or want to see more images for these items please visit the

    **[PLEX on the STEX - Community Support](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**  
      
    **[Online Documentation (no longer available)](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9813.0)**  
    and/or the  
    **[Support Thread (no longer available)](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=10201.0)**  
      
    \* *A complete and updated catalog of all PARKS 205 items (PDF) is available in the documentation thread.*  
      
      
    **Enjoy!**
