info:
  summary: Sinti and Roma Memorial
  description: |-
    A national memorial to the murdered European Sinti and Roma.

    The Memorial by artist *Dani Karavan* consists of a black marble well with a retractable stele on which a fresh flower is placed daily. Panels around the site present information on the persecution of this minority under the National Socialist regime of terror.

    Find it in your Parks menu.

    *Version I*

    Plain 2x2 lot **without** the stepping stones (add them yourself).

    No dependencies

    *Version II*

    Full 4x4 lot **with** the stepping stones.

    Dependency: ['Stone Paths'](https://community.simtropolis.com/files/file/27995-stone-paths/) by NBVC (only for version II)

    Both variations come without any trees, so you can add your favorite MMP greenery...

    **Enjoy!**
