info:
  summary: SPAM Riding School and Stables
  description: |-
    Out in the rural areas it's more important to know how to ride a horse than driving a car... so here is a school where your folks can learn just that.  
      
    **LOTS**  
      
    \* 5x3 lot with the riding school.  
      
    \* 3x2 lot with a family of 5 stables that plop randomly.  
    
      
    **DEVELOPER NOTES**  
      
    The Riding School works like a regular Elementary School, but with some more radius. All other stats are the same. Find it in the 'Education Menu'.  
      
    The single lot with the family of stables is designed as a landmark and completely neutral. Can be plopped anywhere and connected with eyecandy paths or access roads, e.g. SPAR. Find it in the 'Landmarks' menu.  
      
      
    **INSTALLATION**  
      
    Just drop the files into your Plugins, preferably into the SPAM 'Addons' subfolder.  
      
      
    **SUPPORT**  
      
    If you have questions or need support on this product please visit  
    [PLEX on the STEX](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)  
      
      
    Enjoy!

    Staff Edit 12/10/2019: Added file descriptor. -CF
