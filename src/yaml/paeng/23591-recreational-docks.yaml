info:
  summary: Recreational Docks
  description: |-
    This is an addon for PEG's CSK2 series, so the proper (and very long) title should read:

    **AddOn for 'PEG CSK2 PPond Canal Docks' - Recreational Style**

    To give the hardworking folks from the industrial docks a break, here is a little addon that turns the docks into a boardwalk and offers some opportunities for recreation - taking a stroll along the rivers edge, rent a rowboat to sneak a first kiss from the new girlfriend or just check in on the Beer-O-Rama and party...

    There are 5 lots -

    1x1 straight section

    1x1 inner corner

    1x1 pier with shops

    1x1 pier with rowboat rental

    3x2 central piers with restaurant and shop

    The lots are cheap to plop and to maintain. They need to be connected to your power-grid. The three pier-lots slightly raise COM-desirability and give a small boost to the Mayor's rating.

    The REC Docks are located in the Harbor Menu just below the original CSK2 Docks with custom icons.

    Note: There is no special 'Outer Corner' - just use the one from the regular docks!

    Needless to say - these lots can be mixed freely with any other lots that are part of the PEG CSK2 PPond series.

    Enjoy :-)
