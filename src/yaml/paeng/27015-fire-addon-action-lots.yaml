info:
  summary: "FiRE AddOn: Action Lots"
  description: |-
    Okay, this pack will not be to everybody's taste - but which pack ever is? I feel these items will be useful (or at least some good fun) specially to mayors with CJs, and make for some great photo sessions, so I thought I'll put it up on the STEX for you to play around with. The set is based on **Becca's** wonderful **"FiRE - Fire & Rescue Education"** set which you'll have to get as well (see dependencies below).

    This pack offers some action for your apprentice fireworkers - it's not all just theoretical education, ya know :-) Since there are a lot of fires, smoke, explosions and what not, these lots are meant as (temporary) replacements for the FiRE core lots - e.g. to get some nice action-packed screenshots or small movies for your CJ...

    **TEMPORARY REPLACEMENTS FOR FiRE CORE LOTS**

    \* Burn Building (fire)

    \* Chlorine Tank (fire and toxic fumes)

    \* Confined Space (fire and heavy smoke)

    \* Hazardous Materials (fire and explosions)

    \* Car Wreck (fire)

    **EXTRAS**

    Before you start to take screenshots, you may want to dress up your scenes some more. For this purpose there are two **MMP**s with some extra goodies included -

    \* **Fire Trucks and Vehicles**  
    A great collection of 26! fire fighting vehicles to be plopped around the action site(s).

    \* **Firefighters**  
    The same guys (5 Models) as included with the FiRE core lots, but untimed and freely ploppable.

    **HOW TO USE ACTION LOTS**

    So how is this supposed to work? Well, let's assume you have built a nice training compound for your firefighters using the FiRE core lots, and now you want to shoot some footage of the training exercises -

    \* SAVE YOUR GAME and then set it to 'Pause'.

    \* Pick some exercise action, let's say the 'Burn Building'.

    \* Demolish the core 'Burn Building' and plop the 'Action Version' instead (it has the same footprint and orientation). Repeat for more 'Action' scenes if you wish. You know that the action is 'on' when you see the flashing red lights on the lamp posts.

    \* Now fast-forward game time to a date PAST JANUARY 05 - that's when all the effects are set to start.

    \* Shoot your footage.

    \* When you're finished, EXIT TO REGION WITHOUT SAVING, then re-enter... all is back to the normal theoretical lessons and 'dry' exercises... (and no 'harm' is done to your city).

    **DEVELOPER NOTES**

    Some effects are timed, so keep game time running at slow speed while taking your pics.

    You could of course opt to keep the action lots permanently - though you must be aware that in this case all the exercises would run 24/7 - so just give your guys (and your CPU) a break, okay?

    Naturally it's also possible to use the action lots in another context, e.g. simulating a fire in your industrial areas or a port or... just dress up any scene and follow the outlined 'recipe'.

    You find the lots in the 'Civics | Fire' menu right next to the corresponding FiRE core lots.

    **CREDITS**

    Lotting and modding: **Paeng**

    **SUPPORT**

    Should you need support for these items please visit the  
    [**NightOwl Support Forum**](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9154.60)

    Burn, burn, burn! :-)

