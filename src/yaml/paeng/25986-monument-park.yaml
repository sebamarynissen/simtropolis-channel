info:
  summary: Monument Park
  description: |-
    Another set of parks and paths with fresh props to add color and variety to your cities. Very comfortable with lots of benches, chess corners, fountains and more. Works well in suburban or rural settings, too...

    **Notice**: If you are considering a download, you may first want to take a look at this:

    [**Paeng's Parks Revisited**](https://www.simtropolis.com/forum/files/file/26923-paengs-parks-revisited/)

    **List of Lots**

    **Parks**

    4 pcs. - 2x1, 3x1, 1x3, 2x3 with different layouts

    **Paths**

    7 pcs. - straights, curve, tee, cross, transition

    **Ends**

    5 pcs. - with various configurations and layouts

    **AddOn** (*optional, see dependencies*)

    5 pcs. - 3x3 park, 2 additional ends, 2 roundabouts (small and large)

    **Developer Notes**

    Some of the lots have a slight park-benefit, but all are cheap to plop and maintain.

    All pieces are in separate files, so you can delete any you do not wish to use.

    They are located in the 'Parks' menue and have custom icons.

    **Support**

    \* [See fullsize image of a large Memorial Park here!](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=7498.1170)

    \* Should you need support for these items please visit the

    [Paeng Productions Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?board=109.0)

    Enjoy!
