subfolder: 400-industrial
info:
  summary: Rural Industry Pack
  description: |-
    For rural areas, specially with lots of agriculture, you may not want to zone too much for industrials - but still need the jobs.

    So here are three ploppable industrial compounds (ID, IM and IH) that should come in handy, and also blend in well with small communities or forested areas.

    1) **Dirty Industry**

    \----------------------------------

    Size: 10x8

    Jobs: 995

    2) **Manufacturing Industry**

    \----------------------------------

    Size: 10x10

    Jobs: 1495

    3) **HighTech Industry**

    \----------------------------------

    Size: 16x8

    Jobs: 1295

    *For more stats please see enclosed Read\_Me.*

    \----------------------------------

    NOTES

    \----------------------------------

    All three need access to Roads, Power and Water.

    Make sure that you have sufficient demand for ID/IM/IH-Jobs before plopping!

    The three lots are in separate files so you can choose which ones you like to install.

    You find them in the Landmark menu with custom icons.
