info:
  summary: Nightowl Extenders (Park Bridge Extender Pack)
  description: |-
    A set of extender lots that use props so textures can extend beyond lots. Perfect for use under bridges and elevated transport networks. There are three kinds to match various sets released by Paeng:

    - **Sandstone:** to match the Sandstone Sidewalk and Base Texture Mod (`pkg=paeng:sandstone-mod`). They come in single and double width and for all wealth levels (Rural / $ / $$ / $$$ variants). They are plain (undecorated), but can be enhanced with all kinds of MMPs. They can be found in the 'Transport | Miscellaneous' menu.
    - **Park Paths:** to match some of the paths of the Parks Revisited series (`pkg=paeng:parks-revisited`). They come in single and double width and are decorated with some basic park items (e.g. fences, hedges), but can be further enhanced with MMPs as well.
    - **Bikepaths:** to match Paeng's Bikepaths. The bikepath extender comes only as single width, but with a left and right version. For double-width networks, just plop an extender from both sides of the network.

    All extenders are sorted into the menus together with their park and path sets.

    Note that the overhanging part of the extender is a prop and therefore not affected by any texture shifts via the Texture Changer of Parks Revisited. So do not expect that every texture situation will be covered - be creative :-)

    **Credits**

    - BATting, color correction and shadow control: Murimk and Shokthrpy
    - LOTting and MODding: Paeng
  author: Paeng, rsc204
