info:
  summary: Urban Gardens
  description: |-
    Tired of square parks? Then this set is for you! Not only does it offer five different park-layouts, it gives you additional pieces to shape your parks in many different ways.

    At first plop the gardens look - well, green ... just wait for spring :-) and the explosion of bright and happy colors!

    Parks

    \---------

    7x5 - The Three Pavillions

    5x1 - Ancient Temple Ruins

    3x2 - Bronze Vases with Palms

    3x2 - Small Pavillion with Japanese Trees

    3x1 - European-style Fountain

    These lots have various entrance-/exit-slots to connect either wide or narrow paths.

    Paths

    \---------

    1x1 straight fancy - uncluttered, and with pretty lampposts

    1x1 straight |

    1x2 straight |-  flowerbeds, benches, parklights etc.

    1x3 straight |   three sizes for more variety and faster plopping

    1x1 tee

    1x1 curve

    1x1 cross

    1x1 path-end

    1x1 narrow-to-wide-path transition

    This last piece helps to create some open spaces and to integrate the actual park-modules in such a way that their shape is totally obscured. Actually you could make a module even appear to go 'around the corner'... Play around with it, you'll find it to be quite versatile!

    Fillers

    \----------

    1x1 filler with random trees (rotate for even more randomness)

    1x1 base texture with random crowds

    To see all these lots 'in action' and large images, visit my CJ:

    [https://www.simtropolis.com/cityjournals/index.cfm?p=view&id=693&page=21](https://www.simtropolis.com/cityjournals/index.cfm?p=view&id=693&page=21)

    \--------------

    Every lots has the usual park-benefits. The park-pieces cost a small monthly fee, the path-pieces are maintenance free (no monthly cost). They are located in the 'Parks'-menue and have custom icons.

    All pieces are in separate files, so you can delete any you do not wish to use.

    Thanks to everybody making resources available!

    Enjoy!
