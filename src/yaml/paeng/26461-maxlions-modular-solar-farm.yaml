info:
  summary: Maxlion's Modular Solar Farm
  description: |-
    A modular set of solar panels to create a 'power farm' of any size, suitable for rural and suburban areas. Each module produces a certain amount of power according to its size (1 to 6 panels).  
      
    **LIST OF MODULES**  
      
    1x1 - 1 panel / 50 KWh
    1x1 - 2 panels / 100 KWh
    3x1 - 3 panels / 150 KWh
    3x1 - 6 panels / 300 KWh
    1x1 - Control Unit, Eyecandy
    1x1 - 2 panels, Eyecandy
      
      
    **DEVELOPER NOTES**  
      
    The additional 2-panel module can be used to shape the 'farm' without producing additional power.  
      
    Find the items at or near the end of the 'Utilities | Power' menu with custom icons.  
      
      
    **CREDITS**  
      
    **Maxlion**: Idea, concept and original lots  
      
    **Murimk**: BATs  
    **Paeng**: Additional modding and lotting  
      
      
    **SUPPORT**  
      
    If you have questions or need support on this product please visit the  
    Support Forum
