info:
  summary: MTP AddOn Pack
  description: |-
    For all those who love rural areas with small towns and lots of landscape, and specially for all the players enjoying the MTP by PEG, I'd like to offer my pack of AddOns.

    The following lots are included:

    PARKS and PLAZAS
    - Tourist Spot
    - Gazebo Plaza
    - Diner
    - Observation Tower
    - Pedestrian Bridge
    - Dead Woods

    LAKESIDE RESORT (modular)
    - Hotel
    - Boat House
    - Cottages
    - Stable 1
    - Stable 2
    - Gazebo
    - Pier
    - Entrance

    LANDMARKS
    - Mayor's Mansion
    - Village Church

    CIVIC
    - Library and Kindergarten

    TRANSPORTATION
    - Bus-stops (3 versions)

    POWER
    - Power Pine

    You surely understand that I cannot post pics and stats of all these pieces - the DL includes a spec-sheet for every lot, as well as the list of dependencies (all with links), and some images.

    Note: This is a compilation of all MTP lots I have done to date. If you want to just get single items or see some fullsize images first, please visit my website:

    [http://paeng.e-workers.de/gallery/city\_journals/customlots.php](http://paeng.e-workers.de/gallery/city_journals/customlots.php)

    Enjoy :-)
