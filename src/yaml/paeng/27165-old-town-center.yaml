info:
  summary: Old Town Center
  description: |-
    Here is a set of Residential (growable) and Commercial (ploppable) lots based on the wonderful "*Jenx Vol 02*" prop pack that will enable you to build up small inner city cores with old timber frame structures - for all who like some 'Old World' charm in their towns and cities :-)

    **LIST OF ITEMS**

    **Growables** (RES$$ Stage 1 Residentials w/ 36 Sims)

    \* 32 lots with various footprints

    (2x1, 2x2, 3x1, 3x2)

    **Ploppables** (Landmark w/ 27 to 54 CS jobs)

    \* 15 lots with various footprints

    (2x1, 2x2, 5x2)

    \* 'Sourbrodt' Passenger Station

    (4x3, Cap: 5000)

    You find a detailed listing in the included chart (PDF).

    **DEVELOPER NOTES**

    Note that the growables have different footprints - specially the 2x1 is meant to counter the common 1x2. A good number of them are set up as corner-lots - if you find them too hard to grow into your layout, you can use some ploppables to compensate ;-)

    You find all ploppable items at or near the end of the 'Landmarks' menu, the station in the 'Rail' menu. The menu will also give out more stats for the lots.

    **INSTALLATION**

    Unzip into 'My Documents/Plugins'.

    **CREDITS**

    Thanks to **Xannepan** for the good-looking models :-)

    LOTting and MODding: Paeng

    **SUPPORT**

    Should you need support for these items please visit the

    [**Paeng Production Forum**](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=9907.msg198551#msg198551)

    **Enjoy!**
