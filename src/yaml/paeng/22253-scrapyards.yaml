  summary: Scrapyards
  description: |-
    No city or region will be complete without some junkyards and scrap dealers around. They may not be pretty, but quite useful to anybody who is into do-it-yourself repairs.

    Here are two scrapyards, one for rural (3x2) and one for urban (4x2) settings.

    They are not too expensive to plop and maintain, both use some power and water and have a slight NIMBY effect, so allow a little room to adjacent residential.

    Enjoy :-)
