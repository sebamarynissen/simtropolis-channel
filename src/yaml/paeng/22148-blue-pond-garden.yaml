info:
  summary: Blue Pond Garden
  description: |-
    Inspired by the current wonderful hot summer days here is a 5x5 $$$-park with cool blue ponds on a red brick base and ever-changing flowers and blooming shrubs and trees.

    There are no special path-pieces for this park, as the texture is readily available with other sets, i.e. the BSC Parks and Paths.

    Oh, and I must say this - the small thumbnails don't do the lot any justice - it's much nicer in-game ;-)

    Enjoy :-)
