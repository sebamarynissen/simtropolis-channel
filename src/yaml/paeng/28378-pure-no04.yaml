  summary: PURe No04
  description: |-
    Built in the 20's as a dealership warehouse for Studebaker car manufacturer, now turned into spacious lofts.

    4x4, residential growable for 196 R$$ (stage 5, any density or tile-set).

    *and/or*

    4x4, commercial ploppable with 160 CS$$ jobs

    \* *Based on* ***NYBT*** ***ABBT The Studebaker*** *building. Suggested by* ***Blunder*** *- thanks to both* ;-)

    **INSTALLATION**

    Unzip to your Plugins.

    To uninstall, bulldoze any instance of this lot in your city, then remove the files from your Plugins.

    **SUPPORT**

    Should you need support for these items please visit the

    [Paeng Production Forum](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/forum/index.php?topic=10398.0)

    **Enjoy!**
