  summary: PHIL - Forest Paths
  warning: |-
    A prop (0x9c1e5901) and a model used by some of these lots could not be found in any available package, so they may not show up in game.
  description: |-
    PHIL - Forest Paths

    AO - Add On - includes Rest Areas and some 2x2 lots with props  
    BK - Bike - includes props and bikers  
    BK T - Bike Trail - includes some extended lots with flowing trails and props for bikes to ride  
    Main - The main set of paths include the center to center. No Props  
    MR - Mud and Rock - Paths by Scoty with rocks and muddy pathches textured in. No Props  
    OP - Outer Path - this set includes paths that run outside the center, closer to the edges. No Props  
    Parking - Parking lots with trail starts. With Props  
    SP - Split Paths - this set includes paths that split or are spaced apart

    The main portion of these Forest Path lots are the trail lots, Main, OP, SP, and MR. These lots do not have a base texture  
    and can be used on any terrain. They can just be a dirt path for anywhere not just "forests".    
    The additional sets Parking, BK, BK T, and AO also do not have a base texture only overlay textures but these lots include props like  
    bikers, rocks, girafe seasonal flora, logs, ponds, parking, and even some bathrooms.    
    The Add On set includes some 2x2 lots with trails some with ponds and props in a scene.   
    There is also a set of Rest Area lots, some have bathrooms some benches or picnic tables.

    We only lost one kevin in the making of these lots. If you see anything on the internet about the 356 missing kevins reports, those are just missing not lost, they might still be biking or hiking around in the forest, they might still return and who knows maybe with some research for new add on lots.
