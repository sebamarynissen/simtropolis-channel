info:
  summary: PHIL - Scoty 1x1 Ponds
  description: |-
    PHIL - Scoty 1x1 Ponds

    3 sets of 1x1 Lots with a Scoty Pond texture

    The set 'Base' has a base texture and pond overlay texture  
    The 'Baseless' set has no base texture and just the pond overlay texture  
    The 'Base and Props' set has the base, pond, and seasonal props

    Within the download you will also find a Submenus patch folder for those that use submenus and have the required dependencies to use them.

    7 Kevins went out only 2 returned. Some splashing was heard from one pond, but nothing was found.  
    Another one was heard yelling quicksand but only a hat was found.

    Big Thanks to hugues aroux for just about everything, textures, icons and the submenu patch

    Dependencies:

    Textures:   
    Grass Texture - [Scoty Field Paths & Hedges](https://community.simtropolis.com/files/file/33722-scoty-field-paths-hedges) - texture folder    
    Pond Textures - [Scoty Park Alleys](https://community.simtropolis.com/files/file/37024-scoty-park-alleys/)

    Props:   
    Rocks - [NBVC Rock 'n' Stones](https://community.simtropolis.com/files/file/27092-rock-n-stones/)   
    Flora - [Girafe Seasonal Flora](https://www.sc4evermore.com/index.php/downloads/download/25-flora-fauna-and-mayor-mode-ploppables/27-sc4d-lex-legacy-bsc-vip-girafe-flora)

    No Base Texture - Mod needed - [Transparent Texture (Water Bug) Fix DLL](https://community.simtropolis.com/files/file/36379-transparent-texture-water-bug-fix-dll/)
