info:
  summary: Monument to the Heroes of the Peninsular War, in Porto
  description: |-
    The Monumento aos Heróis da Guerra Peninsular in the middle of the Rotunda da Boavista in Porto, Portugal, on a 5x5 lot. The lion of the monument represents Britain defeating the French eagle. It celebrates the victory of the English and Portuguese over Napoleon's armies.
