info:
  summary: Sandou modular Japanese shrine
  description: |-
    A set of 19 puzzle-piece lots for building a Japanese shrine or temple approach (sandō), by uki.

    The lots are added to the Parks menu.

    **Contents**

    - Straight, curve, cross, T-junction
    - Diagonal, diagonal right curve, diagonal left curve
    - Stone steps
    - Torii (6 types) and gates (3 types)
    - Temizuya (hand-washing pavilion) (2 types)
    - Street stall (roten) and street stall (1x2)
    - Teahouse (2 types)
    - Auxiliary shrine
    - Tile
    - Tamagaki (shrine fence): straight, corner and diagonal

    **Notes**

    - The torii (6 types, modeled after Kasuga Taisha, Ise Jingu, Kumano Hongu Taisha and others), the gates (3 types: Miyuki Gate of Katsura Imperial Villa, Lower Villa Gate of Shugakuin Imperial Villa and Hamaguri Gate of the Kyoto Imperial Palace) and the teahouses (2 types: modeled after the Outer Bench of Katsura Imperial Villa and Shokatei) are placed randomly.
    - Place the stone steps so that the arrow points up. One piece handles a height difference of up to about 15 m.
    - Torii and gates act as a bus stop when they touch a road. The other parts are only passable for pedestrians.
    - The lanterns light up at night.
    - If shadows are shown with software rendering, they look slightly jagged.

    **Update history**

    - 2013-02-02 (4.1): fixed diagonal models so that they cast shadows (the `BaseTexture` files were changed). Overwrite, or replace the old files. Lots that are already placed keep working.
    - 2013-01-12 (4.0): gravel texture added to `uki_SandouTexture.dat`.
    - 2012-11-17 (3.1): fixed the diagonal Tamagaki lot that was left out.
    - 2012-11-15 (3.0): diagonal Tamagaki added.
    - 2012-05-02: 1x2 street stall lot added. Fixed the lots not working as bus stops when using the MML.
    - 2012-03-10: torii and gates now work as bus stops when they touch a road, and other parts are only passable for pedestrians.
    - 2011-08-03: fixed a conflict with other MML lots.
    - 2011-07-06: released.

    **Note:** this is a preservation upload of a set that uki originally posted on July 6, 2011 (version 4.1 on February 2, 2013), at [https://uki-sim.seesaa.net/article/213588559.html](https://uki-sim.seesaa.net/article/213588559.html). The lots are a good fit for sc4pac, the SimCity 4 package manager, and the Yatai and Roten props they use are available as another preservation upload: `pkg=uki-sim:food-and-street-stalls-props`.

    I encourage you to check out the rest of uki Sim's bats and props on their website. [http://uki-sim.seesaa.net/](http://uki-sim.seesaa.net/)
