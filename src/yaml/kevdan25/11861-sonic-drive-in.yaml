  summary: Sonic Drive In
  description: |-
    In 1953, the prototype of the first ***SONIC*** Drive-In opened in Shawnee, Okla. Now, 50 years and almost 2,900 drive-ins later, ***SONIC*** enjoys the highest customer frequency rate in the quick-service restaurant industry. ***SONIC*** Drive-In Carhops have been serving up beloved American food and signature ***SONIC*** favorites at "the speed of sound" since 1953.  
    ***SONIC*** is parked in a very prominent place in the annals of drive-in history. Not only did we develop innovations in the drive-in concept, but we are one of the few remaining drive-in chains left in America. In an industry overwrought with automation, SONIC keeps the personal touch. Carhops still deliver food prepared-to-order right to your car.  
    [www.sonicdrivein.com](http://www.sonicdrivein.com/)

    ***SONIC*** comes ploppable with **45** jobs and is a 4x4 LM lot also included is a CS$ 4x4 Growable. I tried to make this as realistic as possible by using custom props, textures and lighting.  Install the .dat file to: C/program files/maxis/simcity4/plugins. Hope you and your sims enjoy!
