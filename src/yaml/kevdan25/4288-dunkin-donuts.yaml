  description: |-
    This is my very 1st BAT Bldg. I know this isn't exactly what a Dunkin Donuts looks like but I had some fun with it. I gained all of the knowledge thru the forums and tutorials. I hope you enjoy it! I am still learning and hope to make some more name brand bldgs. Im sure with practice I will get better. Let me know if there is anything I forgot to do or include. Thanks.

    UPDATE: I have revamped this lot to reflect new learnings. I have included a 4x4 LM Ploppable with jobs and a CS$ 3X3 Growable (35 jobs).

    Thanks go to phillippbo, redlotus and darkmatter on the use of the roof junk.

    Special thanks to GDV for the nightwindows and lighting.

    And a big thanks to everyone who has provided us with all of the wonderful mods, lots and props.

    Files needed:

    vehicle prop v3.dat

    cop car by mikeseith (included)
