  summary: Hard Rock Cafe
  description: |-
    The first ***Hard Rock Cafe*** (HRC) opened its doors to the public on June 14, 1971, in London, England. Founded by Isaac Tigrett and Peter Morton, two enterprising and music-loving Americans, HRC was an instant classic, attracting droves of customers with its first-rate, but moderately priced casual American fare, warm service and ever-present rock 'n' roll music and sensibility. Although it was initially decorated with an eye toward eclectic Americana, HRC has ultimately become the world's leading collector and exhibitors of rock 'n' roll memorabilia.  
    [www.hardrock.com](http://www.hardrock.com/)

    As far as I know there are no 2 HRC alike, so I decided to make my own as I see it.  I used alot of neon and created a glow to the bldg to give it life after dark. This by far was my most challenging bldg as I had to learn new techniques. I also made the guitar sign big for you and your sims to see!

      
    ***Hard Rock Cafe*** comes ploppable with 175 jobs and is a 4x4 LM lot I am not making a growable version as there is usually 1 HRC per city. I tried to make this as realistic as possible by using custom props, textures and lighting. Hope you enjoy!
