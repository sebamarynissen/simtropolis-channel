  summary: KFC Multibrand Store
  description: |-
    Yum! Brands, Inc., a Fortune 300 company, operates A&W All-American Food, KFC, Long John Silver's, Pizza Hut, and Taco Bell, restaurants worldwide. Based in Louisville Kentucky, Yum! Brands is the world's largest quick-serve restaurant company in terms of system units - nearly 33,000 restaurants around the world in more than 100 countries and territories.  
    KFC, Long John Silver's, Pizza Hut, and Taco Bell, are global leaders of their respective restaurant categories. Since 1919, A&W All-American Food has been serving signature frosty mug root beer floats and all-American pure-beef hamburgers and hot dogs, making it the longest running quick-service franchise chain in America. Yum! Brands' global system sales totaled more than $24 billion in 2002.

    This **New style *KFC & A&W Multibrand Store*** comes ploppable with 60 jobs and is a 3x4 LM lot also included is a CS$ 3x3 Growable. I tried to make this as realistic as possible by using custom props and textures.  For my next release I will make another multibrand store LJS & Pizza Hut. Hope you enjoy!
