    ***McDonald's*...  
    **Is the world's leading food service retailer with more than 30,000 restaurants in 119 countries serving 47 million customers each day.  
    Is one of the world's most well-known and valuable brands and holds a leading share in the globally branded quick service restaurant segment of the informal eating-out market in virtually every country in which we do business. Serves the world some of its favorite foods - World Famous French Fries, Big Mac, Quarter Pounder, Chicken McNuggets and Egg McMuffin. Our rich history began with our founder, Ray Kroc. The strong foundation that he built continues today with McDonald's vision and the commitment of our talented executives to keep the shine on McDonald's arches for years to come.  
    [www.mcdonalds.com](http://www.mcdonalds.com/)

    ***\*\*UPDATED\*\* 4/18/05***

    After learning new techniques I decided that this lot needed to be updated.  McDonalds has had a new facelift from the ground up including new textures, lighting and details. I have also made 3 different style street signs that will randomly change on the lots.   I am still awaiting the Custom UI's to be made but I felt that you should have the lot in the meantime.  This lot will go thru another update when those have been completed.  **Also note that this is an exe file.**   You will eventually be able to download the MAC version  from kbooms1w's website at: [http://homepage.mac.com/kbooms1w/FileSharing7.html](http://homepage.mac.com/kbooms1w/FileSharing7.html)

    ***McDonalds*** comes ploppable with 50 jobs and is a 4x4 LM lot also included is a CS$ 3x4 Growable. I also remade the 1x1 McDonald's Highway Sign lot. It will install into the parks menu. Plop one close to the highway for added realism . Hope you and your sims enjoy!

    **Special thanks to the BSC Team.**
