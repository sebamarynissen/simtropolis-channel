  description: |-
    In 1950, a entrepreneur by the name of Harmon Dobson opened a small, unassuming hamburger stand in South Texas. From the beginning, people knew that a Whataburger was no ordinary burger. As the unmistakable orange-and-white-striped A-frame structures began to populate the landscape, the Whataburger soon reached icon status across the southern U.S. Patrons quickly recognized the difference in the quality of the burger, in the ingredients and in the people who prepared it. It was this difference that led to the rapid expansion of Whataburger, even from its earliest days.

