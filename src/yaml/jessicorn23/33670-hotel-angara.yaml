info:
  summary: Hotel Angara, a hotel on Kirova Square in Irkutsk
  description: |-
    Located in Irkutsk's central Kirova Square, the Hotel Angara was built in the late 1950s during the city's construction boom as a modern showpiece of contemporary Russian construction ahead of the scheduled visit of president Dwight Eisenhower. In the past 60 years, the hotel has become somewhat run-down, as most "Khrushchevka" type buildings in Russia do, however it remains an icon of downtown Irkutsk and a functioning hotel. On the bottom floor are several shops and restaurants, and one of Irkutsk's major bus hubs.

    **Stats**

    *Landmark (ploppable)*

    - Lot size: 8x3
    - Plop cost: 8,000
    - Bulldoze cost: 100
    - Monthly cost: 150
    - Landmark effect: 40 over 20
    - Mayor rating effect: 10
