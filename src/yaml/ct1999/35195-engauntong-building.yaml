  summary: EngAunTong (永安堂), today the Guangzhou Children's Library
  description: |-
    EngAunTong (Chinese: 永安堂), today the Guangzhou Children's Library (Chinese: 广州少儿图书馆), is located at YanJiang West Road No.149 in the YueXiu district of Guangzhou, Guangdong Province.

    **History**

    EngAunTong was completed in 1937. It was a building used for manufacturing Tiger Balm, a brand owned by WenHu Hu. When EngAunTong was completed, it was a second stage building alongside the Oi Kwan Hotel (`pkg=ct1999:oi-kwan-hotel`).

    In April 1950, after the establishment of the PRC, the building was subject to forced handover to the government under an economic policy named "Success Debenture".

    After 44 years, in 1994, the government decided to return the building to Hu's daughter named Xian Hu. Mrs. Hu originally wanted to set up a private media office in the building. However, Mrs. Hu noticed that mainland China prohibits any private media. So she decided to contribute the building to the government as a social charity. After that, the building was set to become a children's library.

