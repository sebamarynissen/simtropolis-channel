  summary: ZhenHai Tower (镇海楼), a history museum in Yuexiu Park, Guangzhou
  description: |-
    ZhenHai Tower (Chinese: 镇海楼) is located in Yuexiu Park in Guangzhou City (Canton). It is a comprehensive history museum with local characteristics. Established in 1929, it is a place used for collection and exhibition of historical data and cultural relics of the city. It has two major exhibition areas: the Zhenhai Tower housing the historical relics and the Art Gallery showing many exquisite local craftworks.

    **A little history**

    In 1380. Zhenhai Tower (Sea Guard Tower) is 28 meters (92 feet) high and 31 meters (102 feet) wide.

    It has been destroyed and rebuilt five times and was changed from a wooden structure to reinforced concrete in 1928. The reddish-brown bricks and grey tiles made the building primitively simple and unique. At the front of the building, there is a pair of two-meter-high stone lions in red sandstone made in the Ming Dynasty (1368-1644).

    The tower houses nearly a thousand pictures, data and other exhibits on the city's history. Those collections display the changes of culture, custom and city developments. Walking into it, you can see a geographical model and a diagram of the ancient Guangzhou city on the first floor. On the second floor, there are historical relics (4000 BC - 589 AD) and unearthed remains of the Neolithic Age. When you come to the third floor, you can look around the historical relics of Sui, Tang, Song, Yuan, Ming and Qing Dynasties. The fourth floor mainly exhibits plentiful historical relics of the Qing Dynasty (1644 - 1911). Modern Chinese cultural relics since the Opium War (1840 - 1842) are displayed on the fifth floor. Besides, there are also special showrooms at the east side of the tower where all kinds of temporary or memorable special exhibitions are often held. At the west side, there is a barbette with a cannon on it and 23 ancient stone tablets.

    There is no Easter egg in this building.

    **Stats**

