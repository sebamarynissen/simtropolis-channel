  summary: New Asia Hotel (新亚酒店), one of the earliest high-rises in China
  description: |-
    New Asia Hotel (Chinese: 新亚酒店) is one of the earliest high-rises constructed in 1930s China, located in Guangzhou (广州) Yuexiu district (越秀区).

    There are a lot of weirdly sized buildings in China, and a lot of them are as big as hell.

    **Stats**

    *Landmark*

    - Lot size: 2x6
    - Plop cost: 8,000
    - Monthly cost: 400

    *Growable CS$$*

    - Stage: 8
    - Lot size: 2x6
    - Capacity: CS$ 1,100, CS$$ 900
    - Building style: Euro
