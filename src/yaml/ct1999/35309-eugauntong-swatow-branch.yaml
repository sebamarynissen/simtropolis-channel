info:
  summary: EugAunTong Swatow Branch (永安堂汕头分支), also known as the HuWenHu Building
  description: |-
    EugAunTong Swatow Branch (Chinese: 永安堂汕头分支), also known as HuWenHuBuilding (Chinese: 胡文虎大楼), was constructed in 1927 and is located in Shantou Jinping district.

    **Stats**

    *Growable CO$$*

    - Stage: 7
    - Lot size: 4x3
    - Capacity: CO$$ 701
    - Building style: Euro
    - Occupant group: Medium Wealth Commercial Office Building

    *Landmark*

    - Lot size: 4x3
    - Plop cost: 4,500
    - Monthly cost: 150

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
