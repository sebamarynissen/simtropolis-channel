  summary: Kingkey 100 (京基100), a landmark skyscraper of Shenzhen
  description: |-
    KingKey 100 (Chinese: 京基100) is one of the landmarks of Shenzhen City, located in Shenzhen Luohu district (深圳市罗湖区).

    **Stats**

    *Landmark*

    - Lot size: 5x5
    - Plop cost: 110,000
    - Bulldoze cost: 150,000
    - Monthly cost: 1,200

    *Landmark with jobs (CO$$$)*

    - Lot size: 5x5
    - Capacity: CO$$ 7,100, CO$$$ 6,900

    *Growable CO$$$*

    - Stage: 8
    - Lot size: 5x5
    - Capacity: CO$$ 5,100, CO$$$ 4,900
    - Building style: Euro

    This building only comes in a Dark Nite version.
