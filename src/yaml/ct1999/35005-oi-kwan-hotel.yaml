  summary: Oi Kwan Hotel (爱群大酒店), an Art Deco hotel in Guangzhou
  description: |-
    The Oi Kwan Hotel or Aiqun Hotel (Chinese: 爱群大酒店) is a hotel in Art Deco style in Guangzhou, China. At 64 meters tall with 15 floors, it surpassed the neighboring Nanfang Building to become the tallest building in the city from its completion in 1937 to 1967. The hotel has a revolving restaurant on the top floor, which was the first one in the city.

    The building contains an Easter egg.

