  summary: Canton Tower (广州塔), the 604-meter observation tower in Guangzhou
  description: |-
    The Canton Tower (Chinese: 广州塔), formally Guangzhou TV Astronomical and Sightseeing Tower (Chinese: 广州电视台天文及观光塔), is a 604-meter (1,982 ft) tall multi-purpose observation tower in the Haizhu District (海珠区) of Guangzhou (广州).

    **Stats**

    *Landmark*

    - Lot size: 5x5
    - Plop cost: 310,000
    - Bulldoze cost: 210,000
    - Monthly cost: 2,000 (the maintenance budget is really expensive!)

    *Landmark with jobs (CS$$)*

    - Lot size: 5x5
    - Capacity: CS$ 7,800, CS$$ 7,800
