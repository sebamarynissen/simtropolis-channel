group: ct1999
name: modern-chinese-village-box-3
version: "1.0.0"
subfolder: 200-residential
info:
  summary: Modern Chinese Village Box 3 (农民房), a 1x1 village house in Shenzhen
  description: |-
    This particular Village Box (Chinese: 农民房) is renovated with cleaner colors, but that doesn't make the building too special after all. It is still a really normal building, located in Shenzhen NanShan district NanTou Village.

    There is no spot for an Easter egg in this building this time.

    **Stats**

    *Growable R$*

    - Stage: 6
    - Lot size: 1x1
    - Capacity: R$ 64, R$$ 31
    - Building style: Euro
    - Occupant group: Medium Wealth Residential Building

    *Landmark*

    - Lot size: 1x1
    - Plop cost: 1,000
    - Monthly cost: 10

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
  author: Ct1999
  website: https://community.simtropolis.com/files/file/35213-modern-chinese-village-box-3/
