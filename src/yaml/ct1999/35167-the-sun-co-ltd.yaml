info:
  summary: The Sun Co Ltd (大新公司), a historic high-rise in Guangzhou
  description: |-
    The Sun Co Ltd (Chinese: 大新公司, today: NanFang Building, Chinese: 南方大厦) is a historic high-rise building in Guangzhou, China. At the time of its completion in 1922, it was the tallest building in the country. Since then, it has served as offices, department stores, electronics markets, and hotels.

    To be honest, when I exported it into the game and compared it to the Oi Kwan Hotel (`pkg=ct1999:oi-kwan-hotel`), it felt taller than Oi Kwan. I double-checked its scale and found nothing incorrect about it. It is just because of the game's view perspective. So now Oi Kwan has its big brother!

    This building is the main part of the complex. The west side of The Sun Co Ltd is another independent building.

    There is no Easter egg in this building. Go find it if you want.

    **Stats**

    *Landmark with CS$$$ jobs (overhang)*

    - Lot size: 4x4
    - Capacity: CS$ 1,550, CS$$ 1,250, CS$$$ 1,100

    *Landmark (overhang)*

    - Lot size: 4x4
    - Plop cost: 19,000
    - Monthly cost: 600
