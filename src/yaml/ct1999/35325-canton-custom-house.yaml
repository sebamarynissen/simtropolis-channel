info:
  summary: Canton Custom House (粤海关大楼), also known as the "Big Bell Tower"
  description: |-
    Canton Custom House (Chinese: 粤海关大楼), also known as the "Big Bell Tower" (Chinese: 大钟楼), is located in Guangzhou Yuexiu district.

    **History**

    After the Second Opium War, Canton (Guangzhou's old name) was occupied by the British and French forces, and Canton Customs was gradually controlled by the Western occupiers. Since then, the Western occupiers decided to construct a two-storeyed Customs House near the Shameen Island, the Western territory back then. However, the building was ruined by a drastic fire. After that, they decided to construct another Customs House near the ruin, which became the Canton Custom House that we know today. In 1860, the Canton Customs Tax Department officially established the Customs Department. On June 25, 1916, the building was officially completed.

    It will check the goods from another region.

    **Stats**

    *Landmark*

    - Lot size: 5x3
    - Plop cost: 10,000
    - Monthly cost: 500

    *Landmark with jobs (CO$$$)*

    - Lot size: 5x3
    - Capacity: CO$$ 650, CO$$$ 600

    *Civic (police)*

    - Lot size: 5x3
    - Plop cost: 6,000
    - Monthly cost: 650

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
