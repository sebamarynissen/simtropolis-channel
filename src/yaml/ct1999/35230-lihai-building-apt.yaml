  summary: LiHai Building (荔海楼), a high-rise apartment building in Shenzhen
  description: |-
    LiHaiBuilding (Chinese: 荔海楼) is a really normal high-rise apartment located in Shenzhen NanShan district.

    You can find some similarities if you are familiar with bixel's apartment buildings. This is because this is one of the early Chinese apartments with a Hong Kong design format.

    There is no spot for an Easter egg in this building this time.

    **Stats**

    *Growable R$$*

    - Stage: 8
    - Lot size: 4x4
    - Capacity: R$ 5,308, R$$ 4,210
    - Building style: Euro
    - Occupant group: Medium Wealth Residential Building

    *Landmark*

    - Lot size: 4x4
    - Plop cost: 2,000
    - Monthly cost: 150
