group: ct1999
name: wenshan-building
version: "1.0.0"
subfolder: 300-commercial
info:
  summary: WenShan Building (文山楼), a normal commercial building in Shenzhen
  description: |-
    WenShanBuilding (Chinese: 文山楼) is located at XinYuan Road No.2 in the LouHu district of Shenzhen, and is a really normal commercial building.

    **Stats**

    *Growable CS$$*

    - Stage: 5
    - Lot size: 4x3
    - Capacity: CS$ 910, CS$$ 501
    - Building style: Euro
    - Occupant group: Medium Wealth Commercial Service Building

    *Landmark*

    - Lot size: 4x3
    - Plop cost: 9,000
    - Monthly cost: 500

    The `resolution` variant selects between the HD and the SD (SameTGI) version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the buildings. With Maxis Nite, the SD version is installed.
  author: Ct1999
  website: https://community.simtropolis.com/files/file/35034-wenshan-building/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2022_04/WenShanBuilding_Preview_5.jpg.f1f0e05d6087f6732bc59d97a4e882d7.jpg
