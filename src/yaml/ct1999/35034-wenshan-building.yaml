    - https://www.simtropolis.com/objects/screens/monthly_2022_04/WenShanBuilding_Preview_2.jpg.f9d4891b8fd2b69eb7b4c3de66d31907.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2022_04/WenShanBuilding_Preview_3.jpg.cfb0ae13a75683ed35247a1a732fafee.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2022_04/WenShanBuilding_Preview_4.jpg.557c029b7a98e14b0e03d52b6154a5a8.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2022_04/WenShanBuilding_Preview_11_Preview.jpg.d8773a0a67dd340e11c98fc994a8797c.jpg
dependencies:
  - bsc:textures-vol01
  - bsc:vip-girafe-carpack-vol01-vol02
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: ct1999-wenshan-building-sd
        include:
          - "/WenShanBuilding_SD\\( MasixNite \\)/"
  - variant: { nightmode: dark, ct1999:wenshan-building:resolution: hd }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: ct1999-wenshan-building-hd
  - variant: { nightmode: dark, ct1999:wenshan-building:resolution: sd }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: ct1999-wenshan-building-sd
        include:
          - "/WenShanBuilding_SD\\( DarkNite \\)/"
variantInfo:
  - variantId: ct1999:wenshan-building:resolution
    description: Choose the resolution of the building. Only applies to Dark Nite, as Maxis Nite only has the SD version.
    values:
      - value: hd
        default: true
        description: The HD version, which only exists for Dark Nite.
      - value: sd
        description: The SD version, which has the same IDs as the Maxis Nite version.

