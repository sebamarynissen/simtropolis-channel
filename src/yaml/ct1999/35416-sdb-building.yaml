  summary: SDB Building (深圳发展银行大厦), the former Shenzhen Development Bank building
  description: |-
    SDBBuilding (full name: Shenzhen Development Bank Building, Chinese: 深圳发展银行大厦, today: 平安银行大厦) is a normal building next to a famous landmark of the city, located in Shenzhen (深圳) Luohu district (罗湖区).

    “盏鬼” is a Cantonese expression meaning “funny”.

    **Stats**

    *Landmark*

    - Lot size: 4x8
    - Plop cost: 12,000
    - Monthly cost: 600

    *Growable CO$$*

    - Stage: 8
    - Lot size: 4x8
    - Capacity: CO$$ 3,875
    - Building style: Euro
    - Occupant group: Medium Wealth Commercial Office Building
