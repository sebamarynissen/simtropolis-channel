subfolder: 360-landmark
info:
  summary: Cathedral of St. Victor (维多尔天主教堂), a small church in Zhanjiang
  description: |-
    Cathedral of St. Victor (Chinese: 维多尔天主教堂, also known as 霞山天主教堂) is a delicate small church located in Zhanjiang (湛江) Xiashan district (霞山区).

    May the god be with us.

    **Stats**

    *Landmark*

    - Lot size: 2x4
    - Plop cost: 8,500
    - Monthly cost: 150

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
  author: Ct1999
  website: https://community.simtropolis.com/files/file/35375-cathedral-of-st-victor/
