info:
  summary: Zhencheng Building (振成楼), a Hakka tulou in Fujian
  description: |-
    Zhencheng Building is located in the central and southern part of Hongkeng Village, Hukeng Town, Yongding County, Longyan City, Fujian Province. It was built in 1912 by the Lin Hongchao brothers, the 21st generation of the Hongkeng Lin family. Commonly known as Bagua building, it is famous for its magnificence and exquisite interior space design. Its local architectural style and the colors used in the gate, interior wall, ancestral hall and flower wall boldly adopt the principle of diversity and unity emphasized by western architectural aesthetics, reaching a very high aesthetic realm. It can be called a masterpiece of native land residential buildings combining Chinese and western. The building faces south and covers an area of about 5000 square meters. It is composed of two concentric rings. The outer ring is a civil structure, 4 stories high, 57.2m in diameter, with an inner corridor. It is divided into inner and outer circles. There are four outer rings with 48 rooms on each floor, which are built completely according to the layout of the "Eight Diagrams" in the Book of Changes, with 6 rooms on each.

    **Stats**

    *Growable R$$* (technically this is a residential building)

    - Stage: 6
    - Lot size: 6x6
    - Capacity: R$ 850, R$$ 500
    - Building style: Euro
    - Occupant group: Medium Wealth Residential Building

    *Landmark*

    - Lot size: 6x6
    - Plop cost: 15,000
    - Bulldoze cost: 1,550
    - Monthly cost: 550
