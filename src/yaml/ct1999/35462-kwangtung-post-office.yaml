info:
  summary: Kwang Tung Post Office (广东省邮务管理局), a Neoclassical building in Guangzhou
  description: |-
    Kwang Tung Post Office (Chinese: 广东省邮务管理局, today: 广州邮政博览馆) is a Neoclassical style building located in Guangzhou (广州) Yuexiu district (越秀区), constructed in 1916. This building collected all the stamps around the region.

    **Stats**

    *Landmark*

    - Lot size: 5x4
    - Plop cost: 8,000
    - Bulldoze cost: 9,000
    - Monthly cost: 560

    *Civic (museum)*

    - Lot size: 5x4
    - Plop cost: 8,000
    - Bulldoze cost: 9,000
    - Monthly cost: 750

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
