  summary: DaQing Building (大庆大厦), a normal office in Shenzhen (original scale)
  description: |-
    DaQingBuilding (Chinese: 大庆大厦) is located at ShenNan Ave No.6072 in the FuTian district of Shenzhen, and is a really normal office.

    This is the original version of the building, which is bigger. A slightly smaller version, closer to the realistic scale, is available as `pkg=ct1999:daqing-building-scale-adjust`. Both versions don't conflict with each other, so you can use both. If you want to replace this version with the ScaleAdjust version, you have to bulldoze all the existing buildings of this version first.

    **Stats**

    *Growable CO$$*

    - Stage: 8
    - Lot size: 5x4
    - Capacity: CO$$ 4,281
    - Building style: Euro
    - Occupant group: Medium Wealth Office Building

    *Landmark*

    - Lot size: 5x4
    - Plop cost: 50,000
    - Monthly cost: 900
