group: ct1999
name: inoale-inn
version: "1.0.0"
subfolder: 300-commercial
info:
  summary: Inoale Inn (爱诺博酒店), a mid-rise CS$$ hotel in Shenzhen
  description: |-
    InoaleInn (Chinese: 爱诺博酒店) is a really normal mid-rise hotel located in the NanShan district of Shenzhen.

    SC4 doesn't have enough CS$$ buildings, so I made one to enrich it.

    **Stats**

    *Growable CS$$*

    - Stage: 4
    - Lot size: 2x2
    - Capacity: CS$ 486, CS$$ 249
    - Building style: Euro

    *Landmark*

    - Lot size: 2x2
    - Plop cost: 5,000
    - Monthly cost: 150

    The `resolution` variant selects between the HD and the SD version. The HD version only comes in a Dark Nite version. The SD version comes in a Dark Nite and a Maxis Nite version, which use the same IDs, so you can switch between them without bulldozing the building. The HD and SD versions use different IDs, so they are not compatible with each other. With Maxis Nite, the SD version is installed.
  author: Ct1999
  website: https://community.simtropolis.com/files/file/35239-inoale-inn/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2022_07/InoaleInn_8.jpg.7a938f0aa7b82a49c61ff46254282af5.jpg
