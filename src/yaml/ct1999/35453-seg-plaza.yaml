info:
  summary: SEG Plaza (赛格广场), a landmark of Shenzhen
  description: |-
    SEG Plaza (Chinese: 赛格广场) is one of the landmarks of Shenzhen City. Many people may have heard of HuQiangBei (华强北), the place where you can piece your own iPhone together, and here it is for SC4 now. This building is located in the Futian district (福田区) of Shenzhen (深圳).

    **Stats**

    *Landmark*

    - Lot size: 5x5
    - Plop cost: 65,000
    - Monthly cost: 750

    *Landmark with jobs (CO$$)*

    - Lot size: 5x5
    - Capacity: CO$$ 5,010

    *Growable CO$$*

    - Stage: 8
    - Lot size: 5x5
    - Capacity: CO$$ 5,010
    - Building style: Euro
    - Occupant group: Medium Wealth Commercial Office Building
