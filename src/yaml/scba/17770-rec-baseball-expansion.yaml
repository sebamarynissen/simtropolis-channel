info:
  summary: Rec Baseball Expansion
  description: |-
    Four new baseball diamonds for the STEX; two with dirt infields, two with grass infields, and each kind with or without bleachers and props. The new fields should add color into your rec complex, high school, or college campus. And in two different sizes, you could squeeze them in just about anywhere.

    Sizes: 4x4 for the basic lot, 4x5 for the deluxe lot

    No dependencies

    Appears under Parks, down by the baseball and soccer fields

    Costs $100 to plop, $5 to maintain, emits no pollution and uses no water or electricity

    Enjoy!  A pack of more outlandish fields could be coming soon.
