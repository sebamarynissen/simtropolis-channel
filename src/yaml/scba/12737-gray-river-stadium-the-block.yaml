info:
  summary: Gray River Stadium The Block
  description: |-
    Introducing ~ The extremely compact, square, Gray River Stadium. Perfect for plopping around a downtown area, when you don't want to leave an large open space and break the skyline. The outer office buildings give off a shell appearance, and the inside stadium is half hidden from the air. Features a retractable roof covering the field and lower decks, several hundred luxury boxes, and a field-level restaurant in right field. Street level observing in left field leaves a clean view of the city.

    Lot Size: 7x7

    Dependencies or Requirements- None

    Find near 1x1 GRASS, in PARKS folder.

    Does not include jobs, I still am not sure how to construct something that can hold jobs. If anyone can help me in that department, I'd appreciate it.
