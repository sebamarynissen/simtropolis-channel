info:
  summary: Oeleanna Stadium
  description: |-
    A laid-back, small stadium that fits in on the edge of a town, in a warm-weather suburb, or on the edge of a desert, where I put mine. No noisy press boxes, obnoxious scoreboards, or even ugly buildings here - just a big, sweeping canopy and a few sets of stands. Takes up a very small amount of space, has no dependencies, and will appear under landmarks. No other notable stats, pretty cheap to build.

    Enjoy!
