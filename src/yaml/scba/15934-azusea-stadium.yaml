  summary: Azusea Stadium
  description: |-
    A palmy soccer/football stadium that will work great in a tropical or beach city. Not themed after any place in particular, this will be the first in a line of monthly-or-so pleasant stadiums that I'm creating. I hope that this will be a good start.

    Lot size of 10x10, no dependencies, BUT, if you downloaded my Sr. Park Soccer lot, it uses the same pitch prop, so you need to get rid of it before you download this one. Besides that, no other outstanding stats. It'll appear somewhere in the parks menu down by the larger sports fields. Enjoy it, folks! ![:)](https://community.simtropolis.com/assets/emoticons/LlamaSmile.gif)
