  summary: Honeybee Field
  description: |-
    Honeybee Field - A small softball stadium for the collegiate or amateur levels. Includes clubhouses, warmup areas, bullpens, dugouts, and seating for up to 800. The first BAT Softball lot on the STEX exchange.

    Softball is slightly different than baseball. The dimensions of the field and base paths are smaller, the ball is larger, the pitcher whips it underhand, and most importantly, it is primarily a girls sport. The games tend to be more frenzied than baseball, but matches between great teams are often low scoring. It seems like the kind of sport that would catch on in Europe, more so than baseball. Guess not.There isn't a popular major league for softball, so competition ends for the most part in College or at the Olympics (until 2008), so fields don't get too much bigger than this.

    Appears under Landmarks, and has no dependencies.

    The College Softball World Series is going on right now, check it out. And enjoy the lot!
