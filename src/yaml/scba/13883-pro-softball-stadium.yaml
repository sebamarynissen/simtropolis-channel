info:
  summary: Pro Softball Stadium
  description: |-
    Finally, a world-class softball stadium for your favorite local team! And all you have to do is squint a little bit...yeah. A block of seats are up the third base line, mixes of tables and benches up first, and a picnic area in right field. There's a camera tower, press box w. suites, and an on-site concession concourse.

    Lot size is 6x6, and should pop up around the normal baseball field icon in the parks menu; statistics are the same as it. I don't believe there are any dependencies. ![:D](https://community.simtropolis.com/assets/emoticons/LlamaGrin.gif)

    If you get a lot with nothing but a diamond and a bunch of empty squares, tell me. I might have packed the wrong one.
