  summary: Tribute to 2005
  description: |-
    What could possibly be a more fitting end to another year in your city than a cheerful celebration of nuclear proportions? Nothin! Plop down this little gem anywhere in town, and 1-2 months later, ka-BOOM! You'll keep your residents rolling in the aisles...sky high! Also shoots out fireworks during the New Year's and Fourth of July, ala the mayor's house and the resort hotel.

    Size: 1x1  
    Location: Power Folder  
    Radiation emitted: None  
    Destruction: Complete in a 9x9 radius of the blast, possible resulting fires  
    Cost monthly, construction, demolition: 1  
    Power supplied: 50  
    Does not replace any existing models

    It will blow on the FIRST DAY OF THE NEXT MONTH.
