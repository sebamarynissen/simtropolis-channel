info:
  summary: Tennis Expansion Pack
  description: |-
    Tired of the sea of grass-style tennis courts? Brighten up the town with two new court styles: Clay and Composite (RedOrange and LightBlue)

    Now with all three major types of courts, you can create your own realistic complex or center. Included is a 2x4 pre-made park with all three courts, a 1x2 composite court, a 1x2 clay court, and a standard bench prop. The park has the same functions as a normal tennis park, and the individuals serve as the 1x1 grass lots, and will be found there.

    No dependencies, but please tell me somewhere right away if anything inside doesn't work correctly. I'm still figuring this out.
