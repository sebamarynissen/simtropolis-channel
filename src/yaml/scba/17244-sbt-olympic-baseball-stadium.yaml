info:
  summary: SBT Olympic Baseball Stadium
  description: |-
    A Simlympic stadium - the main baseball field for the Baseball event in the Simlympics. That's right Europe, it's not 2012 yet, baseball is still in it. Designed in the Simlympic color scheme and design, this brand new field was slapped together just before the deadline, and is ready for a plop in your Olympic complex.

    Since it's an Olympic stadium, and doesn't have a permanent team, there's no need for a front office, so the only buildings on the property are for the teams and fans, right underneath of the bowl. No parking here either, you'll have to supply that yourself.

    Appears under Landmarks

    Sits on an 8x9 lot

    Costs $22,500 to build

    Uses little water or power

    No dependencies! Have fun, and enjoy the Simlympics.
