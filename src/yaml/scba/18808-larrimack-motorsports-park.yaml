info:
  summary: Larrimack Motorsports Park
  description: |-
    What can't you hold at a sprawling motorsports park? Stock car races, drag events, test cars, open-wheel races, go-karts, motorcycles, shows, anything. It's not big enough to hold down a major event, but it's a lock for any turbo-fueled northern county. The track can be rearranged into a number of different circuits, even two different things at once. Modeled after several real parks, but nothing in particular.

    Size: 16x15  
    Cost: $43,000  
    Power and Water: Little  
    Dependencies: None!  
    Appears under Landmarks  
    The neighbors aren't gonna like this one...  
      
    Have fun!
