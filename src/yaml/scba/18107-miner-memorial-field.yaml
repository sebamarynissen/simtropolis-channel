info:
  summary: Miner Memorial Field
  description: |-
    Small baseball stadium somewhere in Appalachia, dedicated to the dangerous lives of the region's unsung coal-miners. This field might have hosted high ball back in its prime, but even with refurbishment, it's probably only hosting rookie or low-A ball. Good for a rural or uncertain decline town up in the mountains.  
      
    Small, and fits on an 8x9 lot  
      
    Appears under Landmarks  
      
    Uses little power or water, costs $17,000, but is flammable  
      
    New and old:  
      
    I added lights for the first time, and I think they look pretty good, but just a little too short. Doesn't matter for something like this.  
      
    Unfortunately, after I exported it, I noticed that I had the scoreboard on both sides of the wall. Please try and just ignore that. Otherwise, it's done! Enjoy!  
      
    \*- and please comment.
