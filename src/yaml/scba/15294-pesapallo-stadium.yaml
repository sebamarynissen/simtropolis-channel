info:
  summary: Pesapallo Stadium
  description: |-
    Piece a what? Presenting the rarely-seen national sport of Finland...Pesapallo. From a foreigner's stand, the basis of the sport seems to have been invented when someone once decided to create a new sport, but ended up passing out drunk on top of a book of baseball rules. It's a sport like baseball, just twisted and converted around in all directions. The base paths have changed places and order, and the pitcher is only four feet away from the batter! The rule variations go on and on, so I suggest that if you are still interested, find a complete list on google or wiki.

    It was created in Finland in the 1920s, but to this date, is only played in a few Scandinavian countries, and the Australia area. This is a realistic looking field, modeled after a few pictures I've seen of the average pitch. If there are any Finns on here that can point out what might be wrong with it, that'd be great.

    Lot size in 5x7, has no dependencies, and appears under Landmarks.
