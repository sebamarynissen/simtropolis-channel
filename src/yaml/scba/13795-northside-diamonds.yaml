info:
  summary: Northside Diamonds
  description: |-
    Made based on the four-square design of park complexes seen commonly at recreation and community centers, and junior colleges. One low-level professional field, two standard fields, an empty gap, a kids field, and the central snack bar/gazebo building. Paths lead off in three directions for you to connect with other parks.

    7x7 lot

    The only dependency is some pack that came with chain link fences. Since there's only one, it won't matter if you don't have it. But if you do...there it is.
