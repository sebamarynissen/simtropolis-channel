info:
  summary: Bayfront Docks v1
  description: |-
    A scene from the mid-upper class in the mid-atlantic: the bay front docks. Modeled after the borders I grew up around in Ocean City, they include one level for distance walking, and a step down for boaters and crabbers.  
      
    Place them directly behind homes so that the docks are hanging out slightly over the water, and it'll look pretty good! My suggestion is to build a single-family or condominium development, with the streets two squares from the water, the 1x1 houses one, and these right on the waterfront. It's not too much right now, but there's more on the way. I just wanted to get these out as a test run. I've seen things like this on here before, but they've always been too industrial or sterile, or require a boatload of dependencies.  
      
    So, no dependencies, no other outstanding stats.  
      
    Includes 3 different pieces that should hopefully interlock with each other.  
      
    I would recommend lowering the land as much as possible for the development before you place these, and to have the water at a gradual slope.  
      
    I'm going to have another set or two, hopefully that will include corners, and lots that are simply water retaining walls. Boats would be nice, but I don't really have the capability.  
      
    Post note: Is there a glitch that eliminates random spaces when you type something like this up?
