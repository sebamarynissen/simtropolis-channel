info:
  summary: Taylor Memorial Field
  description: |-
    Welcome to the mold of the high school football stadium of America. Two out of three times, especially in the south, you'll see a field like this in every town, to some scale. Park this out behind the local high school or small college, or build a sportsplex around it. Finally, I'm out with a football field!

    Of course, with my extremely poor lighting skills, you won't be having any friday night games. Try and squeeze them in on saturday morning, until I figure out how to nightlight.

    Turf looks weird. One part of that was intentional. More and more fields are switching over to an artificial turf, so you get something like this. But since it's a small field, not completely walled in, I didn't want to have a seam between my grasses and the maxis grasses, so I limited it only to the field. And if it means anything, it looks much better zoomed out in the game than it does in this pic. I was also trying out having the red running track, but it just looks horribly tacky in SimCity. I'm sticking with asphalt for now.

    But enough apologizing.

    No dependencies

    $22000 to plop

    Appears under Landmarks

    20 units of power, no water

    No pollution

    10x7 space occupied

    RIP Sean Taylor
