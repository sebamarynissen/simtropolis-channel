info:
  summary: SBT Olympic Tennis Center
  description: |-
    A Simlympic stadium - the main court for the tennis event in the Simlympics, coming soon to your city! Part of a future, larger complex of a dozen courts, the aqua bowlis a beacon for the games.From a far out view on the map, the horseshoe shape might remind you of a stadium three times it's size, a little disorienting. A few quick zooms in, and you'll find a snug, warm park perfect for a medal-worthy match.  
      
    Appears under Landmarks  
      
    Costs $12,000 to build  
      
    Sits on a 4x4 lot - SMALL!  
      
    Uses very little power and water, and emits no pollution  
      
    No dependencies  
      
    Other people, hopefully, are going to be coming out with Simlympic lots, so keep your eye out for them. The larger, preliminary courts to accompany this are going to come out sometime in the next few days. If there's any problems, just give me a holler. Have fun!
