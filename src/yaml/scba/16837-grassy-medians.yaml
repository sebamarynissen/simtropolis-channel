info:
  summary: Grassy Medians
  description: |-
    A set of three wide median strips to use to divide roadways of any width or type, placed beside each other in rows. Great for creating your own highway systems.

    All lots are 1x1, and include a straight piece (two-sides), a T-intersection (three sides), and a square (four sides)

    Otherwise very basic and plain. Appears under Parks, somewhere near the top of the list, and costs only $1 to maintain each month. No other properties or wealth.
