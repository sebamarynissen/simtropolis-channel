  summary: Tropical Isle Cottages
  description: |-
    The oft-painted and long desired lonely home in the sea can now take form in the small islands of your region! Give your residents a glamorous summer home in the world of tax evasion  - today! On an island so tiny, houses cannot grow without water and power, and links to places of work. Prop parks also demand that pesky power zot. Who wants to dirty up their waters with power lines going this way and that? Fogettabout it! Each house is its OWN power station, providing 43 points of power so that other parks and structures can be placed on the island without worry.

    The lots are ornamental, and have no residential occupancy. This pack contains five different houses, varying in sizes of 1x1 and 2x1. No dependencies, and hopefully this time, no worries, mon!

    Recall: If you had downloaded my previous version, get rid of it.
