info:
  summary: Track and Field Park
  description: |-
    A small jogging circuit and sports field area for your town park, school, campus, or standalone area. Designed slightly after the one in my own town, it's low-key enough to fit in just about anywhere, and as part of a larger complex.

    Appears under Landmarks

    Size: 6x5

    Dependencies: None

    Cost: $2000

    Cost per month: $15

    Pollution: None

    Wealth: Neutral/none

    Water and Power: None

    I realize that there aren't lines on the field or on the track. That's completely intentional, and the style that I was going for. Please don't tell me that I forgot it or need it. Sorry!

    02/26/2020 Staff Edit: Added File Descriptor. -CF
