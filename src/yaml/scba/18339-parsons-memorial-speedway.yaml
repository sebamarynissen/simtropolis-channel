info:
  summary: Parsons Memorial Speedway
  description: |-
    Parsons Speedway - the first track BAT of any kind on the STEX. Not big enough to hold any Nextel Cup races anymore, it could still be in service somewhere in the chain of tracks in the southern valleys. Includes a kinked tri-oval raceway, stands, garages, infield space, parking, lights, pits, all of that. Start your own racing league today!

    The lack of anything permanent around the track is realistic. All of the haulers, concessions, venders, trailers, all of that is brought in during race week, so I didn't include it. The stands are typically bare-bones, and space is left in the infield in the turns for people to bring their trailers and camp out, or camp out outside the parking lots. Most tracks are banked, but this one isn't - this was big enough as it is. It's only a start, maybe my next track will be better.

    Size: 14x15

    Dependencies: None

    Cost: $62,700

    Appears under Landmarks, costs $100 to maintain, little power or water

    *Benny 1941-2007*
