  summary: EAGS Alan Parsons Project
  description: |-
    We shall call it...The Alan Parsons Project! The second Evil-sponsored production, this pack includes four different powerhouse of public terror...Preparation A, B, C, and H, perfect for selectively closing down sections of your cities for CJ or madman purposes. Preparation A releases radiation into a very small area, B slightly larger, and C will coat a medium-sized city with fumes. H catches fire easily and blows up with a little more firepower. Anyone living in the area will immediately leave, and the buildings will become vacant and run down.

    Each costs virtually nothing, appears under Power, has no dependencies, and explodes at the end of the month that you plopped it in. The lots have nothing to them, since they aren't really for looks to begin with. And obviously, if you don't want to wreck stuff...don't mess with this.

    You can get a freakin nuclear warhead here[https://www.simtropolis.com/STEX/index.cfm?id=14526](https://www.simtropolis.com/stex/index.cfm?id=14526)or here. [https://www.simtropolis.com/STEX/index.cfm?id=14732](https://www.simtropolis.com/stex/index.cfm?id=14732)

    muahaha...hahahahaha....HAHAHAHAHAAAAA!
