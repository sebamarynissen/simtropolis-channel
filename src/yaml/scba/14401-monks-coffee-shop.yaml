  summary: Monks Coffee Shop
  description: |-
    Monk's Coffee Shop was the fictional joint, or meeting place of the main characters on the run of "Seinfeld". If you've ever seen the show, you'll recognize the big signs immediately. The exterior of the building is that of Tom's Restaurant, in the upper-west side of Manhattan, and is an actual store that is still open today. The interior, however, looks nothing like the set on the show, if you ever take a trip to it.

    Landmark Lot

    Lot Size: 2x2

    Cost: 1250 S

    Dependencies: None

    If there are ANY obvious problems with the lot, tell me asap. Otherwise, enjoy!
