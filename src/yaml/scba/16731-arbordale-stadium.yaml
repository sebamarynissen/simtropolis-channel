  summary: Arbordale Stadium
  description: |-
    An original baseball BAT for the STEX - Arbordale Stadium, suitable for the AA or AAA class team in your city.Completely realistic, the stadium includes an updated field texture, luxury boxes and offices, party decks, ample parking, bullpens, trees, plazas, berm seating, and plenty of chair-back seats. Just about everything you can cram into a little park.  
      
    My best work yet, hopefully? It's a huge improvement over the 'glaring' issues of my first baseball field. The field texture is fantastic (and dark) this time.  
      
      
    No pollution  
      
    Medium Wealth  
      
    Size: 10x12  
      
    Costs 45,000 to plop, and 73 to upkeep  
      
    Appears under Landmarks  
      
    Best of all, no dependencies, and hopefully, no worries.
