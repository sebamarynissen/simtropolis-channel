info:
  summary: Dixie Stadium
  description: |-
    Big ol' college football stadium perfect for a storied campus. Most likely built and renovated on the cheap with hush money appropriated for new dorms and libraries, these celebrated grounds could be the next landmark for the university.

    Bench seats for all the seating, with the main bowl on one side, the visitor's stand on the opposite, and the new rack behind an end zone. Video-screen scoreboard.

    Appears under landmarks, and costs $30,000 to build. No dependencies.

    Since the lot is so big to begin with, I didn't put any parking on it. If you still want some, you can make your own, or use the LE 5x7 parking grid I threw together and included in this. The upper decks are cantilevered, but the supports are hard to see. The gaudiness of the bizarre screens behind the main stands are intentional, many CF fields have horrendous paint jobs. That's about it this time; say hello to the first BAT American Football field on the STEX. Enjoy!

    2008: This is a bad lot.
