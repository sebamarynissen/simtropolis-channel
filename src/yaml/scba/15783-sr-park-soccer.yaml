info:
  summary: Sr Park Soccer
  description: |-
    Simply a larger version of the in-game recreational field. Nothing big, nothing flashy here, just something that'll go pretty good in a complex or university system. The field here sits on a 5x7 lot, rather than the 3x5 that comes with the game.  
      
    Only problem is how bright the grass is. This was a major problem with the Windeyo park, so this time, I tuned the color waaay down low to a deep green. Everything looked fine until I got it in the game, at which point it turned lime again. I don't know. Maybe it's just the way that the game works, that some shades of green turn that nasty color. Either way, I realize the problem. It IS a shade darker than the baseball park, and you can't see the glow from the region view, so that's a little better.  
      
    Using this same field, I'm going to built a major stadium in a short while, so stay tuned. Enjoy!
