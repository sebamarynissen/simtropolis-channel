info:
  summary: Plop n Go Fair Kit
  description: |-
    A mega Lot Editor package of assorted pre-made lots you can plop around your city, or cluster together to make a custom fairground look. All are found somewhere under the Parks menu, and cost just as much as a square of grass. They include:

    Ferris Wheel  
    Tilt-A-Whirl  
    Flower Yard  
    Hot Air Balloon  
    Open Grounds & Bleachers  
    Air Show  
    Old Time Baseball Stadium  
    Putting Greens  
    Farmers Market  
    Parking  
    Riding Pen

    Two packs are pretty much required, if you want everything to look just right. If you truly don't care and just want to take up space, they'll still work, just may be missing some supports or roofs.  
    You'll need------------\*may add more\*  
    PEG Lake Resort  
    BSC BAT Props MJB Vol04

    Enjoy!
