info:
  summary: Flag River Stadium
  description: |-
    AAA or International sized baseball stadium that fits in with any city or suburb surrounding. Includes a parking lot with two small garages, main bowl seating, berm lawns, and luxury boxes. Arches surrounding the outfield for symbolizing a long fly ball that might leave the park, with a swooping canopy covering parts of the bowl as the shadows turn. Hopefully pretty proportionate; sort of looks like a scaled-down Yankee or Anaheim Stadium.

    Appears under Landmarks

    Cost: $45,000

    Size: 13x13

    Dependencies: None

    A little power and water, emits no pollution, basis of medium wealth
