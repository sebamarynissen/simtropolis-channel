info:
  summary: Risemdale Park
  description: |-
    A shiny new baseball field for your cities. Almost everything I've learned so far has been incorporated into this field to make it look as solid as possible; hopefully, the best baseball stadium of its size on the Exchange that I'm made yet. Lots of seating around the bowl, second-deck seating beneath the luxury boxes, several sections of benches in the outfield, and plenty of party and group areas. Includes lots of parking, non-functional lights, and plenty of trees. Plop this anywhere you want!  
      
    Cost: about $30,000  
    Little power or water  
    Lot size: 9x13  
    No pollution  
    Appears under Landmarks  
    No dependencies!  
      
    Have fun!  
      
    (And please comment if anything is wrong!)
