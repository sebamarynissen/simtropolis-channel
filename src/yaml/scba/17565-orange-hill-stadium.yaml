  summary: Orange Hill Stadium
  description: |-
    The second half of my soccer/football series - Orange Hill Stadium. Themed more towards the North American side, and fields like PAETEC Park, it's simply a big orange bowl with a big roof and a few boxes. The field could probably also be used for other sports.

    The big roof of the building behind the boxes is extremely bright, I didn't mean for it to come out so bad. I meant for it to be white, but I always forget that what looks good in real life stand out in the kind of dull colors of SC4. I also realize that the structure all around is pretty barebones, but that's the way some fields here are. PAETEC Patk looks like an erector set underneath.Sorry about the rather uninspired lot, too.

    Appears under landmarks.

    Lot Size: 12x12

    Cost: $20,400

    Wealth: Medium

    Upkeep: $80

    No pollution, few needs, no dependencies
