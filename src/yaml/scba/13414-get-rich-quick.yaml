info:
  summary: Get Rich Quick
  description: |-
    \---With this pack of fancy plop-lots. Spruce up a dingy part of town with some park squares, create a recreation area, or expand upon the given country club. To install, open up the zip folder, and copy the files inside of the folder concealed. It's not confusing once you see it. They'll all appear somewhere near the top of the list in the Parks tab, as well.

    File includes:

    Golf Holes One  
    Golf Holes Two  
    Golf Holes Three w. Mansions  
    Mansion  
    Tee Square  
    Horse Track Jr.  
    Secluded Court One  
    Secluded Court Two  
    Cafe Square  
    Playgrounds  
    Prep School  
    Tennis and Basketball Complex  
    Snack Corner w. Green  
    Watergazebo

    I haven't had a change to even see if the water gazebo works, so there's a chance that it might not. I'll post here what happens when I start it up in a minute. If it worked, there should just be a gazebo that can be placed on water. If not, you have a very dull prop.

    Happy dowloading.
