info:
  summary: Windmills Expansion
  description: |-
    Two new beautiful windmills for the STEX. One modern, white, and sterile, and one old-fashioned with wood and a grass roof. Whether either one actually resembles its time period, it's a fair, easy, and pretty way to add power to your city. Provides power.  
      
    Two lots: Newer (2x1), Older (2x2)  
      
    Each produces 1000 points of energy with virtually no cost  
      
    Improves health and pollution slightly  
      
    Doesn't explode, shouldn't degrade  
      
    Appears under power  
      
    No dependencies, enjoy!
