  summary: Northern Electric Field
  description: |-
    Baseball, football, multi-use stadium currently arranged for baseball use.Stadiums like this are common throughout the US, where a county decides that it'd be worth it to house both outdoor sports in one field. Sometimes they work, like this one, and sometimes they turn out a tad ugly. Most build before the 80s are cringe-worthy. With this field, the outfield fence would be removed, the goalposts correctly aligned, and a few strips of turf brought to switch to football. So, that's why part of the field seems a little more worn.

    The third-base bleachers are meant for football, but can carry overflow crowds. Vice versa for baseball. The berm in the outfield, and the lookout tower behind it, service both. Also comes with a few snack and picnic areas, and ample parking.

    Costs $36,000 to build, 10x11 in size, and appears under landmarks.

    The grass behind the press box is far too lime, and I realize that. But since it takes an hour to export this thing, I won't have the time to change it tonight. An edited version should be up tomorrow, with the grass toned down some. Sorry about that. Also, I know people have been clamoring for an American Football field for a while. I promise, it'll be my next project.
