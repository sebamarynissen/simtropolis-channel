info:
  summary: Pineapple Park
  description: |-
    A small baseball field with a Floridian theme. Not based on a particular park, just of the many coastal fields that have served an infinite number of uses, from college, high school, spring training, and local leagues. Capacity is around 600, and includes a press box, clubhouse, refreshment area, and seating behind the plate, down the first base line, and right field.

    No dependencies

    Appears in parks, near the 2x2 Flower park

    Size: 5x6, pretty small!

    Rate and comment, especially if there are any flaws.
