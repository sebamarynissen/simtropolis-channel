info:
  summary: Water Bomb
  description: |-
    Another evil lot. Come on, you know it's a guilty pleasure. The counterpart to the land bomb, the painfully simple water bomb is basically the same thing. Place it anywhere in the water, and get a nice little er, firecracker. Takes out an area of about 10x10 blocks in all directions, and spreads massive fires if the shockwave reaches land.  
      
    The Rules:It's a 1x1 lot, appearing under Power. Plop it anywhere in the water, and zoom in to the closest level. It'll pop at the end of that month or the next. If you want to see the full effects, quickly zoom out the instant you see something happen. If it's completely underwater, turn on "Water Pollution" to see a really cool effect. The fireball appears on top of the water, and will easily destroy several blocks of a city of you place it in a lake.  
      
    No dependencies, no real stats to speak off. Costs one for pretty much every purpose.  
      
    We've used our massive subterranean drill well on this one. Enjoy...if you must. MUAHAHA---  
      
      
