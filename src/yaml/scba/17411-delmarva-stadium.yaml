info:
  summary: Delmarva Stadium
  description: |-
    New and improved Lacrosse field; I'd say it's a big step up from my last one. It's a sport primarily played in the mid-atlantic region, so, the mast theme of the park fits in good. Includes press tower, stands, observation and camera walkway, scoreboard, and parking, all in a little box. Good for a college, it could double as a field hockey or soccer field.

    Comes without goals, benches, players, extra balls, other game day things like that. The grass is bright, but it's 'right-bright.' The grass in the game is too dull. Surround this with other parks, and it'll blend right it.

    Cost: $14000

    Lot size: 7x7

    Appears under Landmarks

    Uses very little power or water, no pollution

    No dependencies! Have fun!
