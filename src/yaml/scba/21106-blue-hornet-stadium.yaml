  description: |-
    SMURF TURF ALERT. Someone threw Hornet Stadium in the rinse cycle, and came out with this. Do not adjust your screens; the legend of the blue turf lives on. The only other artificial turf color that seems reasonable, it's become the white whale of football fields in America. Famously, only the infamous field at Boise State University can claim to featuring blue in the college ranks, and after that, only a high school in Texas and another in Alaska sport the lovely blues, as far as I can see. Make a statement about your city (and beat Oklahoma, please.)

    Size: 10x9

    Cost: $22000

    Power: 40

    Water: 10

    No pollution

    Appears under Landmarks

    No dependencies

    Enjoy!
