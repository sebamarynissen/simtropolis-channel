info:
  summary: Horseshoes Horseshoe
  description: |-
    The Horseshoes Horseshoe - a perfect landmark stadium for any horseshoe-crazed town. I'm not sure that there actually are any, but with this, you can give your town something irrelevant to boast about. It can double as a venue for other neglected lawn sports as well. Works well in a campground, too.

    Sits on a 3x2 lot, uses no power or water, and emits no radiation

    Appears under landmarks

    Costs $2000 to build and $10 to upkeep

    No dependencies, enjoy!
