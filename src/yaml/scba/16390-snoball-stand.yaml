info:
  summary: SnoBall Stand
  description: |-
    Nothing can satisfy an afternoon like an easy, $.89 snowball from the shack across the street from the gas station! Now bring the experience to your city, with its own teeny little frozen treat stand.

    There's one of these, like, every other block in my town, and I'm thinking about opening one up myself. How easy can it be?

    CS$$ Growable Lot  
    1x1 size  
    4 jobs  
    No pollution  
    No power/water  
    No dependencies  
      
    Pretty simple lot there. It's awfully pastel and loud, but how will passersby notice if the stand isn't as obnoxious as possible. If they start popping up too much, just start knocking some of them down. They look great at rural crossroads, though.  
      
    Enjoy!
