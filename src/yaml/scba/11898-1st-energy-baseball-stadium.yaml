info:
  summary: 1st Energy Baseball Stadium
  description: |-
    Part three in my stadium series. This one was easier to build and detail, since I've been to before. Located in Reading, PA, it's currently home to the AA affiliate Reading Phillies. Tons of cool features here, folks, hopefully my best project yet. There really is a pool there in right field, and on at least one occasion a player's gone for an accidental dip trying to climb the wall. There really is a train that runs through the parking lot, and the hot air balloon stands there for many a night as well. The tent on top of the third base bleachers gives out haircuts, believe it or not, and people go up there for a trim during the game. Very unique experience if you should ever go see the real deal.
  author: scba
