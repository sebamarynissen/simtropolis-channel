info:
  summary: Azusea Marine Tower
  description: |-
    Modern coastal lighthouse / transmission tower made for one of my island ports. Looks great in a crowded harbor, or out on a peninsula. About as tall as a mid-rise skyscraper, it would make a good landmark for any city seeking a prominent structure on the waterfront.

    I originally made this just for my city, not for the STEX, but figured that I may as well upload it. It intentionally looks rather bright, blocky, and sterile, that's just the style I decided upon. There's no interior to it, so the hollowness and beam-like thatching just works.

    Costs $49,000, sits on a 2x3 lot, has no dependencies, uses up 80 power points, and appears under Landmarks. No other outstanding properties or pollution.

    Enjoy!
