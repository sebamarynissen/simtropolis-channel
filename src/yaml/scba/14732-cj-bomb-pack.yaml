info:
  summary: CJ Bomb Pack
  description: |-
    Introducing - two forces of destruction perfect for accomplishing absolutely nothing in your city, but will work prefect for CJs involving it, war, or anything in between! Includes a regular atomic bomb, and a massive, radiation-spreading bomb, to keep you residents thrilled. Riiiiight.

    Atomic Bomb: Takes out an area of 9x9 tiles in all directions, spreads fire around the rims of the blast zone, and emits no radiation.

    Radiation Bomb: Fills virtually your entire city with radiation after a small blast, giving all buildings an abandoned look, and also causing EVERYONE to leave town.

    Both have minimal statistics; 1 to plop, 1 to demolish, monthly cost of 1, etc. They produce 50 pwr, but obviously, I wouldn't recommend using them long term. The bombs **will explode on the first day of the next month**, and you may have to be zoomed in to one of the closest levels for it to occur properly.

    I know that I already uploaded a bomb here, but it didn't have 'bomb' in the title. This is for people who want the new radiation as well, or will put Bomb into a search. They wouldn't have found the old file.

    Enjoy...Mr. Bigglesworth will be watching. And rate the frickin file!
