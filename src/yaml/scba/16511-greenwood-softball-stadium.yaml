info:
  summary: Greenwood Softball Stadium
  description: |-
    A small, renovated stadium down the old road, near the mountain. Every middle-town in America built one of these fields sometime between 1930-1960, and thanks to renovation, this one is still open! Perfect for local softball leagues or little league tournaments, Greenwood Field is ready to go anywhere. The park still maintains its classic look - no lights, wide roof, a rickety press box, a few new sets of bleachers, and plenty of walls.

    No based on anything in particular, just some of this and some of that.

    Plop in Landmarks for 13,000, and costs 65 to maintain. No other outstanding stats besides that.

    No dependencies, and hopefully, no worries! Enjoy!
