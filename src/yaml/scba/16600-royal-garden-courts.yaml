  summary: Royal Garden Courts
  description: |-
    Fresh, green, and ready for construction in your town. Complete the perfect city park setting with this pair of illustrious grass courts. No longer for the rich, they can now be used for anything - park tournaments, qualifiers, high schools, or the general public.

    This is a better edition to my Tennis Expansion Pack, improving more on the grass court look and size. For once, the texture is purposefully bright. I meant for the actual central area to have trees, but the height glitch wouldn't let me. They were supposed to be in the little planter circles, but instead, they're empty. Sorry.

    Lot size: 4x4

    No water or power needed

    Produces no pollution

    High Wealth

    And best of all, no dependencies, and hopefully, no worries! Enjoy!
