info:
  summary: Planned Growth Forest
  description: |-
    My friends and I call these "Tree Graveyards." You see them often on the site of a new development, where after the land has been completely scalped and leveled, the builders take a lazy way out of creating new foliage. Trees saplings are planted in long rows, concealed in tubes. When only a tenth of them grow, the trees are more spread out, giving them an almost natural look.

    The pack includes one lot of plain tubes, and one with a few new trees. Both are 1x1, cost $300 to plop, and will reduce air pollution. Appears under Parks.  
      
    Enjoy!
