info:
  summary: Windmill Props for Rooftops
  description: |-
    A set of four small windmills that be placed on top of existing Maxis buildings to customize lots. I added them to several houses in the picture given, and after some selective growth, built a town almost entirely out of them, creating its own Windmill theme. The other mills seen in the images were also created by me, in a separate package.

    They are only props, and don't produce and power. There aren't any lots included, it's up to you where to put them.

    3 props suitable for 1x1 lot

    1 larger prop suitable for 1x2 lot

    No values, wealth, or statistics of any kind. Have fun with this!
