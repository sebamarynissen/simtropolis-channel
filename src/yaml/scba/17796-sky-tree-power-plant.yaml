info:
  summary: Sky Tree Power Plant
  description: |-
    A hyper-modern wind power plant for the skylines of your city. Wind pushes the enormous leaves, flags, and propellers around to swivel the entire tower, creating power in the chambers underneath. Producing over 4,000 units of power, it's enough to light up a large city for a good amount of time.

    Sits on a 4x4 lot

    Appears under Power

    Increases Health points of the area

    Costs little, produces a lot, no water, pollution, or explosions.

    No dependencies.

    This is a bit of a departure from my usual works, so just stick with me here.
