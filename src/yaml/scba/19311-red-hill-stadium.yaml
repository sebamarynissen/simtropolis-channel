info:
  summary: Red Hill Stadium
  description: |-
    Finally, a respectable field to represent your University. A reworking and upgrade from my last college field, Red Hill should be big and bold enough to place on a Div. I campus. Of course, if this were a real field, the parking lot would probably take up most of your city, so I scaled it back a bit. Just leave room for the tailgaters (but kick Corso out)!  
      
    Not based off of any one place in particular. This is about as big a field as I feel comfortable making right now. I'll start experimenting with other building techniques so that I can go bigger, though. For now, though...enjoy it!  
      
    No Dependencies  
    Size: 12x11  
    Cost: $44000 to plop  
    Appears under landmarks  
    60 value for Power, 20 value for Water  
    No pollution of any kind  
      
    GOOOOOOO...team?
