  summary: Lackawanna AAA Stadium
  description: |-
    Second in my series of modeled parks - Lackawanna County Stadium in northern PA, AAA affiliate of the Phillies.

    Constructed in 1989 with a capacity of around 20,000, it currently is home to the Scranton-Wilkes Barre Red Barons, and is the site of  local area football games. It was designed to look like a miniature version of Veterans Stadium in Philadelphia, to adjust rising stars to playing in the atmosphere.
