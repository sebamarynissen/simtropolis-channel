info:
  summary: Yellowbrick Road
  description: |-
    A sleepy, UK-style football field. Intended for something very low-league, it's got only an east and west stand, high walls, and nothing more. The second field in the set, more of an American style field, will be coming out in a few days.

    Appears under landmarks

    Size of 7x7

    Costs $5000 to plop, $15 to upkeep

    Few regional effects, no water, power, garbage, pollution

    No dependencies. Enjoy!
