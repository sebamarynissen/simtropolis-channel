info:
  summary: Liquid Sunshine Plaza
  description: |-
    Based off of a local landmark in Ketchikan, AK comes the Liquid Sunshine Meter and Plaza, a testament to the ridiculously high rainfall amounts and frequency throughout the upper northwest. Now you too can own a piece of the land, with this handsome plaza, featuring a rain-collecting tower that can connect to your water system, producing about 1080 water points each month. The lot size is 2x2, and will require BSC Texture packs #1-4 in order to get the plaza effect seen above.

    The actual rain-o-meter isn't fake, but in real life is up against the side of a building in the downtown harbor, one of the rainiest cities in the world. It was much easier and more beautiful to incorporate it into a park. If you've ever been on an Alaskan Passage cruise, you have probably seen it.

    Build the bridge, darn it!
