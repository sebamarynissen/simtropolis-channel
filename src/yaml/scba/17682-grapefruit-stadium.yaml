info:
  summary: Grapefruit Stadium
  description: |-
    A baseball stadium in the style of an early 90s Spring Training field; one that you would find or would have found in Florida's Grapefruit League. More and more teams are packing up and heading to the Cactus League in Arizona, leaving many ballparks in the southeast virtually vacant. This could be one such place. Bright, lush, and built in the Floridian style, it lacked the corporate amenities to stick around in the big leagues.

    Fortunately, you can annex it for your own league, now. Features administrative/team/concession buildings, seating bowl, concourse, press box, bullpens, outbuildings, berms, and plenty of parking, it'd fit in well in a tropical town.

    Sits on an 11x12 lot

    Appears under Landmarks

    Emits no pollution

    No dependencies

    I'll take any criticisms you might have, I'm kind of curious of what would be wrong. I know the roofs are bright, they're supposed to be. I've been working on the textures more, now so that the seats are further behind home plate, like they should be.

    Enjoy!
