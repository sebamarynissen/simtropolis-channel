info:
  summary: Outdoor Ice Rink
  description: |-
    As seen during the winter times in many major cities worldwide - the public ice rink! Taking up a space of only 3x3 tiles, it can be easily placed in or near an already existing park in your metro. Included the rink, which can double for a hockey field with the lines, a shop office/press box, viewing area, and bench seating for 100. Will appear in Landmarks, and has no outstanding data points.

    It's been over two years since anyone has made anything like this, so I decided to take a break from my usual slew of cookie cutters that I'm sure you all are just oozing over, to try out something completely different. And when I say take a break, I mean that I made this spontaneously in about three hours. As a result, the entire rink and building are inexplicably up in the air and off centered a bit - that's why I didn't place anything on them, as I'd planned. You shouldn't notice that anything is wrong, though.

    Merry Christmas!
