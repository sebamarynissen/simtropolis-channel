info:
  summary: Hornet Stadium
  description: |-
    A new football stadium, with something a little different built into it. Could be a good size for a team at any level anywhere in your nation. Two lines of parking, and a scattering of deciduous trees shouldn't prevent you from plopping it in any setting. Enjoy!

    Size: 10x9

    Cost: $22000

    Power: 40

    Water: 10

    No pollution

    Appears under Landmarks

    No dependencies

    Warning ahead of time: There's a bad side to this stadium. I've been hiding how un-talented of a BAT\-er I am, but decided to go for it with the curving hillside. A long, long time later, I had to cut my losses and just dump what I had here (and even then, it looked better in GMAX than it did one I exported it) So I'll recognize that the north hill and the edges are eyesores. Like a bad christmas tree, just turn it into the corner, and don't cycle through different views.

    I'll be making another stadium soon without the silly hill. Just wanted to try something new.

    (The roof texture also isn't great; that siding never turns out right.)
