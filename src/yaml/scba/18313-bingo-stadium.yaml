info:
  summary: Bingo Stadium
  description: |-
    Fun, overstuffed softball stadium of a big, old, southern university. Seating all the way around in benches, tables, platforms, and anything else you can cram a crowd into. Tall lights for those endless night games, good vantage points, and...no scoreboard? Who needs one, when no one scores until the 17th inning anyway? The biggest softball field yet, this would be a great addition to any complex or campus!

    Size: 8x9

    Appears under Landmarks

    Costs $28,000 to plop

    Uses a fair share of power, but little water, no pollution

    No dependencies! Have fun with this!
