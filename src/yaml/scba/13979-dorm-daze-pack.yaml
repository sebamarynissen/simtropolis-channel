  summary: Dorm Daze Pack
  description: |-
    DO NOT DOWNLOAD. ERRORS. All of your future terrors or past memories can now flood back, with the lots and lands included in the Dorm Daze pack. Such installments include the hazing grounds, mascot pen, dorms, and intramural fields. Also, featuring my first ever BAT. \*Gasp\* Me, not use Lot Editor for something? That must sound crazy.

    This file includes the:

    College Football Stadium  
    Intramural Field  
    Frat House/Hazing Yard  
    Softball Park  
    Mascot Pen  
    "U" Flowers  
    Park Plaza  
    Rowhome Dorms  
    Goalpost prop (BAT)  
    Generic Hall  
    Pizza Joint  
    Tailgate Party One  
    Tailgate Party Two  
    Parking Lot

    There may be things that require the Mega Textures pack that I'm sure most of you have, but I wouldn't say that it's dire. Also, if you already downloaded the Park Plaza or Softball Stadium, remove them first. No other dependencies  
    Football Field is the largest, 8x9 squares.  
    The "U" of flowers can't be viewed from a far distance. Not sure why.
