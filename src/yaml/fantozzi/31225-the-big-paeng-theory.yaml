info:
  summary: 78 lots to expand Paeng Parks Revisited
  warning: |-
    The lot Old Vienna Wheel does not show its wheel, because the models of the SFBT Vienna Giant Wheel (`SIR_Riesenrad_Base` and `SIR_Riesenrad_Top`) are not available.
  description: |-
    78 park lots that expand `pkg=paeng:parks-revisited` into a unified park system, in the Parks menu. They include animal parks, sports parks and amusement parks. The lots use a mix of seasonal and non-seasonal props.

    The main lots have an individual function: some cost money, some give a little income. The handbook (PDF) of the original upload has an illustrated catalog.
  author: Fantozzi
  website: https://community.simtropolis.com/files/file/31225-the-big-paeng-theory/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_08/BigPaengTheory1.jpg.a170916adba9db1e1f782ae555119299.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2016_08/BigPaengTheory2.jpg.05f01e2d979ed08e16a46e91d6c59f62.jpg
