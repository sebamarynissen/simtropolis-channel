info:
  summary: Residential relots of JP Schriefer's Castelo Del Mar
  description: |-
    Relots of `pkg=jp-schriefer:castelo-del-mar` by JP Schriefer. The stats were generated by PIM-X.

    **Non-CAM version**

    - 3 relots: 1x R$$ and 2x R$$$
    - Grow stage: 8

    **CAM version**

    - 5 relots: 1x R$$ and 4x R$$$
    - Grow stages: CAM stages 11 and 12

    Lot sizes: 2x3, 3x3 and 3x2.
