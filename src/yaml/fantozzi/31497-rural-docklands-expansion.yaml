info:
  summary: 36 lots to expand the WMP Rural Docklands
  description: |-
    An expansion of `pkg=wmp:rural-docklands-base-set` and `pkg=wmp:rural-docklands-optional-set-ii` with 36 lots that are 3 and 4 tiles deep, including many corner lots, to build an industrial water front. There are no container port lots. The icons show symbols that make the corner lots easier to use.

    The main lots (car transfer dock, building material transfer dock, chemical liquids dock and coal docks) relieve the caps of industries.
  author: Fantozzi
  website: https://community.simtropolis.com/files/file/31497-rural-docklands-expansion-rde/
