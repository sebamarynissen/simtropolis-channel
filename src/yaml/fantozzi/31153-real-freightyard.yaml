info:
  summary: A freightyard for the Real Railway (RRW) of the NAM
  description: |-
    A freightyard with European engines, with timed props so that the trains appear and disappear from time to time. The engines can be replaced in the Lot Editor.

    - Functional freight station on a 4x7 lot
    - Four single shunting tracks on a 1x9 lot. They can be connected to the rail network, but have no transport function.
    - Two shunting tracks with junctions on a 3x8 lot
    - Two fillers on a 1x1 lot
  author: Fantozzi
