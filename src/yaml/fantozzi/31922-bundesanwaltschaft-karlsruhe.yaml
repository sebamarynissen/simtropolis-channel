info:
  summary: Bundesanwaltschaft, a police station relot of mattb325's Karlsruhe Courthouse
  description: |-
    A relot of `pkg=mattb325:karlsruhe-courthouse` as a police station on a 6x5 lot, with 40 high security cells. It has no patrol cars, but city wide coverage.

    The lot has timed props, so it may take some time until all props appear when it is plopped.

    The lot is the one of v1.1 with the occupant group and budget line of power plants removed, so it no longer shows up in the list of power plants. It is installed from the fixed lot that was posted in the comments of the upload.
