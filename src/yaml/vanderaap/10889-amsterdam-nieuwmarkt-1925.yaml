  summary: vda Amsterdam Nieuwmarkt 1925
  description: Small shops (2x1 CS $$$) at the Nieuwmarkt in Amsterdam. The three house at the left (19-23) were demolished in the 20s for a new industrial building, known as the "Flesseman" (nowadays an elderly home), only the corner building (1724) remained intact. In the 70s all of the houses in the street behind, the Sint Antoniesbreestraat were demolished in order to construct the new metro line. The corner building just survived, even after a huge fire. It was restored in the early 80s, and the only building from the b/w pic which is still there. V-apps, 11-02-04
