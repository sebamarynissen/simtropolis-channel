  summary: vda Amsterdam Oudezijds Achterburgwal 66 66a
  description: Two houses (1x2 R $$) at the Oudezijds Achterburgwal, Amsterdam. 66a (left) was originally an "achterhuis" of an house located at the Oudezijds Voorburgwal. Other than most "achterhuizen" this one got decorated stone ornaments in the top in Dutch Classicism style, based on facades by Philips Vingboons (3rd quarter of the 17th century). 66 (right) was built in 1729 in Louis XIV style.V-apps, 05-12-07
