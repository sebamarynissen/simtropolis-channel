  summary: vda Delft Dansschool Wesseling
  description: Former dancing school, situated in the old station area in Delft, the Netherlands (3x2 CS $$ growable). Built as the Stations Coffee house. The first train station in Delft had no restaurant; passengers went to one of the cafés near the station for their drinks while waiting on the train. One of these restaurants was known as the "Station's Coffee House". The richly decorated facade was built in 1894, and by the 30s it was connected with the surrounding buildings. The building was last known as dancing school Wesseling. As a result of the construction of the rail fly-over in the 60s a small part of the facade was demolished. Because of new developments for the area and plans of making a train tunnel to replace the fly-over, all buildings in this neighbourhood, including the dancing school, were demolished in september/october 2009. Sadly, plans for reconstruction of the facade in the area failed. The BAT is a reconstruction of the situation in 2009. V-apps, 10-07-09
