  summary: vda Amsterdam Prins Hendrikkade 171 172
  description: Two luxurious houses at the Prins Hendrikkade, Amsterdam (1x3 R $$$). Both were built in the 18th century, and had, until the railway station was built, a magnificent view over Amsterdam's harbor and the IJ. The right house (171), was built in appr. 1755 in Louis XV style. In the big sandstone balustrade on top are various harbor attributes as well as a big ship visable. The left house (appr. 1730) used to have a balustrade as well, but this one was removed in the 19th century. Both houses seem taller from the front, and thus richer, but behind the top windows is nothing more than storage space for goods. Like most houses in Amsterdam these were built on narrow, deep parcels. To ensure daylight in the central part of the houses, the back part of the house (achterhuis), which contains the richest decorated rooms was built seperate from the main building. The two parts were connected by a staircase. V-apps, 02-24-08
