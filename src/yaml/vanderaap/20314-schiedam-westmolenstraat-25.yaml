  description: Building (1x2 CS $) in the historic centre of Schiedam, a small city close to Rotterdam.Originally two 17th/18th century houses, which were connected in the 19th century and restyled. Entrance in empire style. The variaty inwindow types and different floor heights show this building is a combination of two older houses, which can also be seen by the two different roof types. Original building soon to be restored. V-apps, 09-03-08
