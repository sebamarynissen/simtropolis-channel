  summary: vda Amsterdam Prins Hendrikkade 88 93
  description: Six shops at the Prins Hendrikkade in Amsterdam (3x1 CS $$). Located at one of the most crowded corners in Amsterdam, where tram, metro, bus, taxi and train come together; opposite Amsterdam Central Station. Originally built as three pairs of two houses in the early 17th century, most of the houses nowadays show a late 18th century exterior, with early 20th century shop fronts. Four of the houses have a cornice in Louis XVI style, and number 92 even contains parts of an interior from that period. The 5th house was rebuilt in 1940, re-using the old 18th century cornice in Louis XVI style. V-apps, 03-08-08
