  summary: vda Gouda Westhaven 27 29
  description: Houses (2x2 CO $$$) along the Westhaven in the Dutch city of Gouda. The left house, built in the early 17th century, contains a well preserved shopping interior. The facade was hardly changed either, except for the high stepped gable which was replaced by a lower bell shaped one in the 19th century. The small house in the centre was mostlikely the coach house of the large building at the right. A lot of the larger houses in Dutch cities are nowadays used as office buildings. V-apps, 04-17-08
