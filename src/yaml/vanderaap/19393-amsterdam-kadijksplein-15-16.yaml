  summary: vda Amsterdam Kadijksplein 15 16
  description: Two small shops (1x2 CS $$) at the Kadijksplein in Amsterdam. The right one (15) has a common neck gable top, of which still remain hundreds in Amsterdam. The left one (16) has a less common top. Both were built in the early 18th century. The "Kadijken" area, which is located near the harbor of Amsterdam, contained numberous bars and pubs for the dockworkers and seamen to spend their loan after a hard day of work. V-apps, 19-02-08
