info:
  summary: vda Amsterdam Rembrandt Theatre Reconstruction Site
  description: |-
    Reconstruction site of the Rembrandt Theatre. Originally built between 1900/02, by a design of Evert Breman and Willem Molenbroek. The theatre was demolished in the late thirties and replaced by a modern blocky theatre, which burnt down in 1940. The site remained a gap for many years, until 1969/70 when more of the surrounding buildings were demolished to make place for new hotel.

    Edits (11-21-04):

    -   Model size - i put it on a smaller lot (3x5 instead of 4x6), as this fits better with both my own files, as well as most other w2w buildings.
    -   Most walls are changed into a red brick, which is more realistic. Only the representative facades were made in a more expensive yellow brick.

    V-apps, 07-29-04 / 10-27-04 / 11-21-04, finished model will follow later(november/december)
