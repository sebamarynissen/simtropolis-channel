  description: |-
    Office building of the "Stoomvaart Maatschappij Nederland" (Dutch Steamer Company) at the Prins Hendrikkade in Amsterdam (1x3 CO $$$ growable). Built in 1902/03 by J.G. and A.D.N. van Gendt, who joined their fathers architect's firm in 1894 and took over his business after his death in 1901. This office building is slightly inspired by H.P. Berlage's work, even though the Van Gendt brothers still used historical neo styles for the details. V-apps, 03-13-08

    Edit 03-22-08: I found out that the length of the file name apparently caused some difficulties for some people. They weren't able to extract one of the files to their plugin folder. The newzip contains a re-rendered lot. All three files have a shorter name; "Vanderaap - Amsterdam, Stoomvaart Maatschappij Nederland", instead of "Vanderaap - Amsterdam, Prins Hendrikkade 159, Stoomvaart Maatschappij Nederland".
