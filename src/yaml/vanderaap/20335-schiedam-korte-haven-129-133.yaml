  summary: vda Schiedam Korte Haven 129 133
  description: Harbor buildings (2x3 CS $$) in the historic centre of Schiedam, a small city close to Rotterdam. Buildings of this type also excisted in Rotterdam before the May 1940 bombings. The small gates on the lower floors give access to the warehouses at the back, while the decorated doors give access to the appartments and offices above. All three were built in the last quarter of the 18th century or early 19th century. The right two buildings were renovated and expanded in the 1910s or 1920s. Original buildings are still waiting to be restored, and are in a rather bad condition. V-apps, 09-06-08
