  description: |-
    Anne Frank House (1x3 Museum). Former hiding place of the Frank family from 1942 til 1944. In the block of houses that is located on the garden side behind the Prinsengracht, the secret annex (achterhuis) of #263 is one in a long row. There are small and large buildings, where some houses lie deeper than others. The neighbors to the back are given the impression that the house is not in use. Nowadays a museum. V-apps, 10-17-04

