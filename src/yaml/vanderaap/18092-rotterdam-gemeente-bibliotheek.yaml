  description: Former City Library of Rotterdam (6x4), built between 1917-1923. Designed by D.B. Logeman with help of N. Lansdorp and J. Poot. The library at the Nieuwe Markt is one of the few buildings that survived the May 1940 bombings on the centre of Rotterdam. Student capacity 50,000. Started summer 2004. V-apps, 07-05-07
