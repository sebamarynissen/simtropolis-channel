  description: |-
    Reconstruction of two houses at the Prins Hendrikkade, Amsterdam (1x2 R $$). Situation before 1964, when the two houses, together with six other houses at the Prins Hendrikkade and several buildings at the Foeliestraat and Rapenburg, were demolished for the construction of the IJ tunnel to connect the northern part of Amsterdam with the centre. The top part of the right house (182) still had a mid 17th century appearance with a wider central window and two smaller ones on the sides. The lower floors were renovated in the 18th century, as well as the interior which had an stucco entrance hall in Louis XIV style. The left house (183) was built in the 2nd quarter of the 18th century and mostlikely had an neck- or bellshaped top. The cornice it had until 1964 was added in the 19th century. The house also had an "achterhuis" (back house), like a lot of houses in Amsterdam have. V-apps, 02-28-08

    edit 02-29-08: due to a little mistake in making the LOT, the first version wouldn't appear in the game. Only the LOT file has been edited.
