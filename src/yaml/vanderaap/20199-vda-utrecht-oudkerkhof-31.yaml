  summary: vda Utrecht Oudkerkhof 31
  description: Luxury furniture store (1x3 CS $$$) at the Oudkerkhof in Utrecht, the Netherlands. The Oudkerkhof is one of the oldest neighbourhoods in Utrecht, situated close to the Dom Church. Until 1904 this building used to be a early 17th century merchant home (appr. 1600). Only the top floor and roof with stepped gables still date from that time. In 1904 the lower two floors were renovated and a big shop front was added. In the twenties the shop front was decorated in a Art Deco style, as still can be seen on the upper part. Garden and Gardenhouse disappeared to expand the building. V-apps, 08-09-08
