  summary: vda Amsterdam Prins Hendrikkade 28 30
  description: Reconstruction of three early 17th century facades with stepped gables (2x1 CS $$) at the Prins Hendrikkade in Amsterdam. The original triplets were located at the old harbor and had a view over the open water, until the Central Station was built at the end of the 19th century. From this period several low budget hotels were located along the Prins Hendrikkade, as well as in these small houses. Demolished in 1915 to make place for an office building. Situation of appr. 1875-1890, before the most left stepped gable was renovated in a more sober spout-like one. V-apps, 05-17-07
