  description: Shops (2x2 CS $$) at the Kleiweg in Gouda (the Netherlands). The left part was built in appr. 1900 in Art Nouveau style, and expended in 1915 in a similar, but slightly different style. The building is nowadays split up and contains two cloth stores. Both shopfronts have been renewed several times. V-apps, 04-19-08
