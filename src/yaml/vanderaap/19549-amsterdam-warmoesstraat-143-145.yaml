  summary: vda Amsterdam Warmoesstraat 143 145
  description: These two houses (1x3 CS $$) are located at one of the oldest parts of the medieval city of Amsterdam. Though in their appearance both houses are 18th century, inner parts reveal a much older history. It might be hard to believe nowadays, located at the edge of the red light district, but until the ring of canals was dug that made Amsterdam unique, the Warmoesstraat was a street for the high society. Warmoesstraat 145 (right) for instance has been a large house from the late 16th century, rising above most of the neighbours. Remainings of an old decorated wooden ceiling, unique for the Netherlands due to it's age and quality of detail, were found during the restoration in 2006/2007 and highly decorated parts of the wooden construction, which were removed when the inner structure was partly renovated in 1904,are nowadays exposed in the Rijksmuseum. The part of the medieval city where these two houses are located, the so-called Blaauwlakenblok, impoverished rapidly after World War II, due to plans of a nearby departmentstore, De Bijenkorf, to built a parking garage at the site. The restoration of the entire neighbourhood started in 2005. V-apps, 03-22-08
