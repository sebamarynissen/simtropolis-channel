  summary: vda Amsterdam Rembrandtplein 25 35 Rembrandt Theater
  description: |-
    Rembrandt Theatre. Originally built between 1900/02, by a design of Evert Breman and Willem Molenbroek. The theatre was renovated in 1938, the facade and most of the interior was demolished. In 1940 the theatre burned down, the site remained a gap for many years, until 1969/70 when more of the surrounding buildings were demolished to make place for the new Caransa hotel.

    Edits (11-21-04):

    -   Model size - i put it on a smaller lot (3x5 instead of 4x6), as this fits better with both my own files, as well as most other w2w buildings.
    -   Most walls are changed into a red brick, which is more realistic. Only the representative facades were made in a more expensive yellow brick.

    V-apps, 07-29-04 / 10-27-04 / 11-21-04 / 11-26-04
