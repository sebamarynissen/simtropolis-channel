  description: |-
    **Description:**

    One Penn Plaza is a skyscraper near Pennsylvania Station in New York City, west of Seventh Avenue, between 33rd and 34th Streets. It was designed by Kahn & Jacobs and completed in 1972. It reaches 229 meters (750 feet) with 57 floors. The tower has setbacks at three places; 7th, 14th, and 55th floors. From its location on the West side of Manhattan, most South, West and North facing tenants have unobstructed views of the Hudson River.

    The night lighting of this model only suits for [SimFox's Darker Nite mod](../../stex/details.cfm?id=23089)

    Otherwise, your building will look like the night pictures of this upload

    **Crédits:**

    BAT, LOT / configuration, READ ME, Installer by **Heblem**

    Lot by **Kelismatic**

    Special thanks to **Ripplejet (Tage)** for model configuration help.
