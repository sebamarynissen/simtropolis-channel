info:
  summary: Buckingham Fountain
  description: |-
    **PDA-ADC Buckingham Fountain**

    Buckingham Fountain was designed and built in 1927 by Chicago urban planner Edward Bennett, for Kate Buckingham in honor of her deceased husband. The design is based off of the Fountain of Latona at Versailles. It has become an enduring symbol of Chicago.

    The fountain is the centerpiece of Grant Park, just feet away from Burnham Harbor. It has spectacular fountains, with three tiers of pools and, on the bottom tier, four copper seahorses that spray water. The central section lights up at night, and changes colors. I could not implement this, so I stuck with orange, the usual color.

    **Lot specs**

    - Size: 6x6
    - Type: Park
    - Wealth: Medium
    - TE Plop: No
