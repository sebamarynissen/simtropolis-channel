info:
  summary: Colossus Addon Mod
  warning: |-
    It is crucial to start a new region when installing CAM, as the mod drastically changes the simulation parameters.
  conflicts: |-
    Only compatible with game version 1.1.641, the Windows digital edition.
    See the CAM manual for a list of mod incompatibilities.
  description: |-
    **Colossus Addon Mod - Vanilla Controller** is an enhanced version of the game's vanilla simulation. It includes the improvements introduced in CAM but retains the classic Maxis gameplay and excludes the improvements related to farms. The mod was developed by the various members of the CAM Team who over time have brought modifications to improve this mod 
    
    ***WARNING: From version 2.5 onward Colossus Addon Mod works only with the digital version (1.1.641) of SimCity 4 (Microsoft Windows and Linux only). If you run CAM 2.5 or later on systems different from those listed, the mod may malfunction and no support is provided***
    
    ***MIGRATION:***
    Migration to CAM - Vanilla 3.0 and later versions can be done if you meet these requirements
    * ✅ Players coming from Vanilla can upgrade to CAM 3.0 using only the CAM Vanilla Controller
    * ✅ Players from CAM Controller can switch to CAM 3.0 using the CAM Vanilla but must create a new region
    * ✅ Players from CAM - SPAM Controller can switch to CAM 3.0 using the CAM Vanilla but must create a new region
    Migration to CAM 3.0 and later versions cannot be done if you meet these requirements
    * ❌ Players coming from CAM 2.1.1 cannot upgrade to CAM 3.0 

  author: "CAM Team"
