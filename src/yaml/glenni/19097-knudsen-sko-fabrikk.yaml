    | Building style(s): | Building: Industrial,Building: ID,Industry: Anchor,0xb5c00ea8,0xb5c00ea9 | Building: Landmark,Building: ID,Industry: Anchor |
    | Growth stage: | 4 | n/a |
    | Occupants: | I-D : 262 | I-D : 262 |
    | Bulldoze cost: | § 429 | § 429 |
    | Building Value: | § 1938 | § 1938 |
    | Construction Time: | 42 days |  |
