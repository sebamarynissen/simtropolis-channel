  summary: Glenni Knudsen Sko Fabrikk
  description: |-
    NDEX Glenni Knudsenskofactory, by Glenni

    Knudsen Shoe Factory used to be a prosperous place, supplying Simnation with shoes for over 130 years. But now... it is a ruin, only used by squatters and drug dealers. This comes in 3 lots: I-D3 growable, I-D4 growable for CAM only and a ploppable with ID jobs. You can keep all of them or remove those you do not want.

    Bigger images:

    [Day](http://i80.photobucket.com/albums/j179/Glenni91/BAT%20pics/blah/NDEX-Glenni-Knudsensko-day-scpolska.jpg)

    [Night](http://i80.photobucket.com/albums/j179/Glenni91/BAT%20pics/blah/NDEX-Glenni-Knudsensko-day-scpol-1.jpg)

    Lot Details and Information

