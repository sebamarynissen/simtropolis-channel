info:
  summary: Nexis Utility Prop Pack
  description: |-
    First Utility Prop Pack from Nexis.More to come with time.

    I have been doing a lot of BATprops and lots for the use of my CJ , and I would like to share some of these, as I did with the Silos and the Damprops. Included are 4 props that you will see in the Lot Editor on a 1x1 lot or more.They are:

    1\. A Welcome sign, as we see them often at the entrances of Villages and small towns.

    2\. A Picnic table, just perfectly sized to fit your sims.

    3\. A bunch of Barrels, some squished and all rusty, perfect for the dark corners of your lot.

    4\. A Firewood pile, that usually hangs around in the backyards of homes.

    If you need ideas how to make lots with these props , come and see my CJ \*Nexis of Genesis\*,some might already be there, others will come in the futur.

    Use them as you wish and if you want more, just tell me so,I usually do a lot of these small utility props. If you make and publish lots with these props, I would appreciate a small credit to Nexis,thank you.

    Have Fun with Nexis
