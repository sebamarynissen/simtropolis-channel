info:
  summary: Chipotle Restaurant
  description: |-
    "The Chipotle line of restaurants was founded in 1993, by Steve Ellis, In order to offer

    a simple menu of great food prepared fresh each day, using many of the same cooking techniques

    as gourmet restaurants, and then, serve the food quickly, in a cool atmosphere.

    Chipotle Locations are often found in many upscale neighborhoods, with designs that fit into the surrounding area, while still standing out."

    For more info: www.chipotle.com

    \---------------------------------------------------

    Numbers have been set to mirror the in-game buildings as much as possible.

    Numbers on the growable and ploppable are the same

    Commercial Services CS$$$

    Capacity Satisfied: 35 CS$$$

    Tileset: Houston, Stage 2, Low and Medium Density

    Ploppable can be found in the Landmarks Menu

    Growable: 2x3

    Ploppable: 2x3

    Plop Cost: $3750

    Bulldoze Cost: 160

    Building Value: 3500

    Pollution:

    Water 2

    Air 2

    Garbage 7

    Dependencies:  None!  Just plug, and play!

    To use: Simply place the files you want to use into your plugins folder.

    You MUST install the SC4 model file.

