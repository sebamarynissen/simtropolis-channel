  summary: Outroph Oil Tower
  description: |-
    This is my much anticipated Outroph Oil Co. Tower.

    The name picks fun at the Enron name, reversing it somewhat. This makes use of a corrupt company's otherwise beautiful building. I added some cones to it so it won't be a pure copy.

    How I made fun of the Enron Name:

    Enron

    En= in

    R

    On=on

    Outroph

    Out=out

    r

    oph=off

    Get it? LOL

    This building is actually an RCI ploppable, thanks to RaphaelNinja's Efforts in this sector. The building itself is actually a prop, but it still lights up and stuff. This building has about 12,000 CO$$$ jobs, so don't overdo the plopping of this building.

    DONT WORRY! NO LAYOFFS! LOL

    Credits:

    DuskTrooper

    RaphaelNinja
