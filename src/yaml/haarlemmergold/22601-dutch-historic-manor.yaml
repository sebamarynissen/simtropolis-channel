info:
  summary: Dutch Historic Manor
  description: |-
    This is a 3d-model of the Amsterdam City Manor of Landgoed Frankendael. It has been built in 1660 and it's the last of its kind within the city boundaries of today. In real life, it can be found along the Middenweg leading towards the town of Diemen. In the game, you can use it as a landmark. I made a ploppable landmark out of it, on a 3x4 lot.

    Have fun!
