info:
  summary: Dutch Music School Odeon
  description: |-
    **Odeon** is designed by architect Harry Klunder and built by volunteers in the late nineties of the last century. The building functions as a institute of music for the region of Vriezenveen in The Netherlands and is the proud possession of  the  “***Koninklijk Erkende Vriezenveense Harmonie***”, winner of the first Dutch Championship for Windorchestras in 2006. This respectable project was only possible through financial support from the inhabitants and firms of trade and industry of Vriezenveen.

    The introduction of Odeon to SimCity is an homage to those that spend a lot of time and money in this unique building and this great orchestra.

    Functions as a High School in SC4.
