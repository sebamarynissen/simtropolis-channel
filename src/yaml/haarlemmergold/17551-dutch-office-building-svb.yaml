info:
  summary: Dutch Office Building SVB
  description: |-
    This office building is home to the Social Insurance Bank (part of the Dutch (semi)governmental social services apparatus) of Leiden and is also one of the tallest structures in the city counting 66 metres. It was originally designed by Hoogeveen Architects in Amstelveen and was completed in 2000. On top of the building there is a (non-) public restaurant overlooking the old city and the neighbouring railway station. I made some minor changes to the original design to fit the building on a 3x2 lot, but the main design should be recognisable though.

    I’ve uploaded two versions of the building: a growable CO$$ version and a ploppable version of the building on a functional lot with over 200 CO$$ jobs included.
