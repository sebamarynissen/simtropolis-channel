  summary: Dutch Housing Project Groningen
  description: This building is a fine example of Dutch social housing in the 1920’s / 1930’s inspired by English suburban planning. Combined with historic Dutch features of city-building (courtyards and almshouses), these housing projects were very common in the years between WWI and WWII. Examples of these projects can be found in almost any Dutch city or town and were in fact the last mass-building housing projects before the Second World War.
