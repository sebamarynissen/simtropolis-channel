  summary: Hagestraat Dutch Riverside Buildings
  description: |-
    Hagestraat (Spaarne) Dutch Riverside Buildings

    Two buildings that are neighbouring buildings in real-life too. They overlook the river Spaarne in downtown Haarlem, Holland. The stepped gable is a nice example of Dutch architecture around 1610-1630 and the left building has probably been built shortly after the French occupation ended. My guess is that only to front gable was rebuilt by 1820 and the inside and back side are in fact much older.

    **This is Version 2**.

    In all cases players who have previous versions installed of these lots are required to bulldoze these lots in their cities and remove them from their plugins folder before installing this update. For removing old versions you need to run the included cleanitol scrip with the  
    [nos.17's SC4 Cleanitol](https://community.simtropolis.com/files/file/35790-sc4-cleanitol/) or with the [BSC Cleanitol TM tool](https://www.sc4evermore.com/index.php/downloads/download/30-gameplay-utilities/18-bsc-cleanitol)

