  summary: Dutch Monumental City Block
  description: |-
    For my **100th upload**, I’ve selected a monumental Dutch office/residential block located near the city centre of Dutch Haarlem. It was erected in the 1880’s and shows architectural signs of historicism – judging from the use of white horizontal bars (speklagen) and the five white stones above the windows which clearly point to the Dutch Renaissance style used in the first half of the 17th century. The building block is one of about ten to twelve making up a nice sort of (small) boulevard marking the end of the old town and the beginning of residential areas spread out to the woods and dunes in the West.

    In the game I gave the block three purposes: A Landmark 6x3 option for those among you who are not willing to wait and see the block growing, a CO$$$ in 6x1 and 6x2 option for bringing some luxurious offices to your old cities, a RES$$$ 6x3  and 6x1 for expensive dwelling and a prop version just in case.

    Enjoy, and thanks for downloading and using all my stuff!
