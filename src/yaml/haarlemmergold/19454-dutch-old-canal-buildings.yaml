  summary: Dutch Old Canal Buildings
  description: These historic Dutch buildings can be found in the city of Haarlem (what a surprise!). The left one is located in the Koningstraat in the shopping district and the white building on the right can be found along the Nieuwe Gracht (‘NewCanal’). I guess the left one was built in its present form by around 1750 and the canal building was built around 1800.
