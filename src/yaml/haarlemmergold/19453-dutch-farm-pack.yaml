  summary: Dutch Farm Pack
  description: |-
    **UPDATE:** I forgot to add the model files for the farms. This was fixed in this update.  
      
    I created a small pack of Dutch farm buildings. It contains a modern barn as seen much in the Dutch countryside, a farm building from the province of South-Holland with a built- in small barn and a small farm building from North-Holland (Edam e.o.). I also made a few LOTs with the buildings, but being a city-boy myself without any knowledge of how a realistic farm lot should look like, I must stress that this pack is mainly meant to make a farm-LOT yourself! So have fun with this do-it-yourself pack!
