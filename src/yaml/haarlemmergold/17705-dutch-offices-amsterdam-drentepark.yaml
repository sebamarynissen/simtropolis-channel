info:
  summary: Dutch Offices Amsterdam Drentepark
  description: |-
    These buildings have just recently been erected in Amsterdam next to the terminus of tram no 4 and near RAI Station in the South of the city. The walls consist of bricks built around concrete pre-fab units. It looks a bit dull to me, but it will probably be very functional in real-life… I took realistic textures from some office-buildings located elsewhere in The Netherlands to provide a nice roof for this building.

    Unfortunately, I did not manage to get the building onto a functional lot. I tried and tried and got frustrated. I took a good look in the mirror and then I knew again: I’m a BAT\-ter, not a MOD-der ;-).

    So if anyone wants to make a functional lot of this building; go right ahead, no objection here!
