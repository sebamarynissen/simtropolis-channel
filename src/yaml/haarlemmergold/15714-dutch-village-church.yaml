  summary: Dutch Village Church
  description: |-
    Landmark, 2x4.

    A Belgian retro-church (!) - I repainted the original orange-red brick into a more Dutch look (brownish brick) - from around 1880-1900. Dutch and Belgian (the Flemish ones at least) churches look very much alike since they were originally built in the same time (1200 -1400) when the territory shared one common culture. After 1648 the territories were officially split into a Northern half (the Netherlands) and a Southern half (Belgium). The retro-style of the late 1800's tried to resemble older gothic and romanesque styles - hence the similarities of the Dutch and Belgian retro churches from that time.
