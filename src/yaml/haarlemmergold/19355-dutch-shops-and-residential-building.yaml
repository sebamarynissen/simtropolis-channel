  summary: Dutch Shops and Residential Building
  description: |-
    This building can be found in Dutch Haarlem along the Zijlweg, leading out of the city to the West. Buildings like these were built by the turn of the last century. It harvests both residential apartments, shops and offices – as do a lot of buildings in the Netherlands located at bigger roads. Therefore, I gave the building in the game two functions: that of a R$$ and that of a CO$$ as well, so you can choose in which form you want it o appear in your cities.

      

      

      
