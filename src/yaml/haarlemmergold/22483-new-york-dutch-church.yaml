info:
  summary: New York Dutch Church
  description: |-
    A Tribute to New York, celebrating its **400th anniversary** 1609-2009. This old church was built by the Dutch in the 17th century in the colony of Nieuw Amsterdam, to be renamed New York later. The building can be seen in many old paintings from that era depicting the view of the city. In 1674, the Dutch traded Nieuw Amsterdam for Suriname as a result of the Treaty of Breda. After the English takeover, some Dutch buildings survived for a while, but city fires like the Great Fire of 1835 eventually destoryed all of them over time. I made the model by comparing 10 different old paintings and drawings found on the internet and combining them along with architecural elements found in existing old Dutch churches in The Netherlands.

      

      
    The church is placed on a 2x2 Landmark lot.
