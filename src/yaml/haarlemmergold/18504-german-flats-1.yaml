  summary: German Flats 1
  description: Until the Second World War, the German city of Kassel had a fine old centre, but was bombed in the war like many other German cities. Nowadays, the city has a more modern face with a lot of buildings from the 50’s, 60’s and of more recent origin. These two models are typical West-German after-war housing which can be found in almost any town or city in former West-Germany.  Cheap and quickly built to provide the then homeless citizens with a roof in a ruined city.  These two buildings can be found in Kassel in neighbourhoods outside the city centre.
