  description: A big German police station for your cities. This building can be found in the town of Villingen (Black Forest) and has a regional function in law inforcement. It’s located in the centre of town next to the historical prison (fast am Knast) which is still in use. Villingen is definitely worth a visit for the old town seems to have suffered almost no damage during the Second World War.
