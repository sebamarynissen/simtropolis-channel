  summary: Dutch Church Spaarnwoude
  description: |-
    This is the old church of Spaarnwoude, a small village near Haarlem, Holland. The tower dates back to 1200, whereas the church itself was rebuilt in 1764 after a fire destroying the old chuch building, leaving only the tower as a witness of the church's past.

    In SimCity, the curch is a ploppable Landmark, 1x2 with nightlights. Use it to lighten up your villages during Christmas!
