  description: In the late seventies and eighties many cheap social housing projects were finished in Dutch cities. Many of these projects still exist till today, such as this one found in Haarlem. Although not very charmful, they make up a certain percentage of some older neighbourhoods of Dutch cities. As of today, you can spice up your Dutch SC4-cities with these ugly and cheap apartments. In the game, they serve the purpose of a 5x1 R$6-residential.
