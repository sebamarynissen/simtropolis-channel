  summary: Dutch Townhall Haarlem
  description: "**The Townhall of Haarlem** (Netherlands) is was built in the 12th century by the Counts of Holland and has been transformed into the townhall during the 13th century as the city grew to become one of Holland's main trading cities in the Golden Age. The town hall has been painted by famous Dutch painters as Berckheyde and It still serves as townhall of the provincial capital of North-Holland and is open to public."
