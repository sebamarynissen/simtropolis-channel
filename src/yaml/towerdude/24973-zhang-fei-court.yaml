info:
  summary: Zhang Fei Court, a Chinese housing estate (landmark)
  description: |-
    You are in the heart of the property bubble in China with this! This is directly taken from all these estates popping out of the ground in China.

    Model, lot and modding by Towerdude. File conversion and lights by Cockatoo 210893.

    The street trees come from `pkg=sfbt:essentials`. Its `tree-family` variant lets you choose one tree family, while this lot uses trees of the Maxis deciduous, palm and pine families, so only the trees of the family you choose will show.

    **Stats**

    *Landmark (ploppable)*

    - Lot size: 9x6
    - Plop cost: 50,000
    - Bulldoze cost: 100
    - Monthly cost: 150
    - Landmark effect: 40 over 20
    - Mayor rating effect: 10
  author: TowerDude
  website: https://community.simtropolis.com/files/file/24973-zhang-fei-court/
