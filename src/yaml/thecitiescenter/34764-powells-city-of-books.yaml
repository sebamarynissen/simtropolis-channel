info:
  summary: Powell's City of Books, a bookstore in Portland, Oregon
  description: |-
    Powell's City of Books is one of the largest bookstores in the world. Founded in 1971, it is located in the Pearl District of Downtown Portland, Oregon, USA. The bookstore, which sells new and used books, has approximately 1.6 acres (68,000 square feet) of retail space, with nine rooms and 3,500 sections. There is also a coffee shop located within the premises and a Rare Book section.

    This version sits on a 4x4 lot and is available via the Landmarks menu.

    **Stats**

    - Lot size: 4x4
