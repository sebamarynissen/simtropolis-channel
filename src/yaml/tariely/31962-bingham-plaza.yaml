info:
  summary: ADC Bingham Plaza (6x6)
  description: |-
    And now I begin to pay a grateful homage to the wonderful batlotters who have given and are still giving me hours of pleasure when I play. It is Relot Time!

    My Bingham Plaza is a riff on ADC's splendid Buckingham Fountain. It uses the model of the fountain (`pkg=ardecila:buckingham-fountain-model`), and you can also have ADC's (smaller) park in your park stash (`pkg=ardecila:buckingham-fountain`).

    See [Ardecila's content](https://community.simtropolis.com/profile/21619-ardecila/content/?type=downloads_file).

    **Stats**

    - Plop cost: 250
    - Park effect: magnitude 30, radius 50
    - Pollution: none
    - Landmark effect: 20, radius 5

    The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lot only needs the Rivit streetlight prop from `pkg=tariely:essentials`.
  author: Tariely
  website: https://community.simtropolis.com/files/file/31962-tl-adc-bingham-plaza-6x6/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_10/59de5454e8d5b_TL-ADCBinghamPlaza6x6.jpg.065b970898f98d21d158d27fa3dc381b.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_10/59de54558dcac_TL-ADCBinghamPlazanite.jpg.81eb6ad4cce5c371c649df62618cfb0d.jpg
