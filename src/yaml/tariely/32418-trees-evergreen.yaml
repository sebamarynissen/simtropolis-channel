group: tariely
name: trees-evergreen
version: "1.0-1"
subfolder: 900-overrides
info:
  summary: Spring-only versions of seasonal CP, JENX and Porkie trees
  description: |-
    I like all SC4 trees, seasonal or not. But I noticed over the years that I preferred the more varied, often lighter green, spring version of many seasonal trees (those that have a spring season). Even the beautiful Girafe evergreen trees (where would we be without them?) are a bit too dark for me. In fact, all summer versions of all trees look the same, too dark green for me. So I decided to get me some spring-only version of the seasonals I liked and was likely to use in my lotting or relotting.

    Here they are: CP trees, JENX (Xannepan) Trees (among which his uniquely beautiful Willow Tree), and PK (Porkissimo) Trees.

    This package is an override. Any seasonal tree of the CP, JENX and Porkie prop packs used on any lot will be changed into a springy evergreen. If you don't want that, don't install this package. The originals' properties haven't been changed.

    If you want to use them for your own lots-relots, they are in the Lot Editor under their original names. Remember you still must stack them (yes, that fun part…). The JENX "xmas" prop is for the fourth season so that they don't disappear in what should have been spring. For the PK trees, and JENX Willow tree, just put another summer prop on top of the winter one, it should do the trick.

    The test lots of the original download, which only show what the trees look like in your game, are not included.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Tyberius06, Matias93, Fantozzi, Catty-cb, Corinamarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is very comforting.
  author: Tariely
  website: https://community.simtropolis.com/files/file/32418-tariel-trees-evergreen/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_08/5b75c19621081_TL-CPevergreens1.jpg.ff0f3a882ac94b437dbc6c7528dd00b7.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_08/5b75c19688d43_TL-CPevergreens2.jpg.f5aea0c0e1e8df219b7534a83fb8a1a5.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_08/5b75c196dd9fc_TL-CPevergreens3.jpg.1ea38dfcb3c9397a4b461356a653ffe6.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_08/5b75c1a128663_TL-TreesJENXEvergreen.jpg.27b852c0be9ff71c12dbb440040140ae.jpg
dependencies:
  - bsc:bat-props-jenx-tree-props-vol01
  - bsc:mega-props-cp-vol01
  - bsc:mega-props-cp-vol02
  - porkissimo:jenx-porkie-expanded-porkie-props
  - tariely:trees-evergreen-cp-oak
assets:
  - assetId: tariely-trees-evergreen
    exclude:
      - "/TL-Trees Evergreens Testlots/"
      - "/TL-CPv1 Oak12x12x15\\.dat$"

