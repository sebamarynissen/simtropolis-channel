info:
  summary: Nexis and DM Waterfront Modular Promenade and Parks
  description: |-
    I blame Nexis (mrbisonn) for this set. He sent me a nice model of an anchor and… I let it run away and make babies with Don Miguel's Waterfront Promenade lots. Here's the result: six parks, five of which work as waterfront pieces.

    **Content**

    - Waterfront park paths
    - Waterfront addon paths

    That you can variously combine with:

    - Waterfront Large Promenade 11x4

    and its modular versions:

    - Waterfront Promenade Park East
    - Waterfront Promenade Park Center 5x5
    - Waterfront Promenade Park West

    and with:

    - Nexis Waterfront Anchor Park 6x5

    and its fully waterfronty version (to be combined with the paths):

    - Nexis Waterfront Anchor Park 6x5 Open

    The original Don Miguel sets are Waterfront Promenade and Waterfront Promenade Set 2. Go and have a look at both Nexis' and Don Miguel's content, why don't you?

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Tyberius06, Matias93, Fantozzi, Catty-cb, Corinamarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is very comforting.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different (not these trees!); perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
