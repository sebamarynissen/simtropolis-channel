info:
  summary: Four Mayor Mansions and Houses
  description: |-
    There were a few Mayor abodes floating around that I liked to use in my CJs. I decided to give them some TLC. Those four go from the Big City Mayor's Mansion to the humbler rural one. You'll find them somewhere at the top of the Reward menu.

    I didn't make those lots from scratch but riffed on already existing lots done by savvier people than I, as I couldn't BAT to save my life. The originals are there:

    - From the ever prolific mrBisonm (Nexis), who gave us so many enjoyable lots and is still doing it: [Nexis Mayor's Mansion](https://community.simtropolis.com/files/file/406-nexismayorsmansion/) and [Nexis Successful Mayor Mansion](https://community.simtropolis.com/files/file/1620-nexissuccessfulmayormansion/)
    - From gshmails (idem!): [Rural Mayor's House](https://community.simtropolis.com/files/file/2145-rural-mayors-house/)
    - [TEOM Country Mayor's House](https://community.simtropolis.com/files/file/2072-teom-country-mayors-house/)

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4 world and is always generously ready to help. And also the guys and gals on the forums (Twalsh, Matias93, Fantozzi, CorinaMarie…). We need help when we begin peeking under the SC4 hood. That the community is always there for us noobies is a constant and pleasant reassurance.

    The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lots only need the Rivit lighting props from `pkg=tariely:essentials`.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, maybe your trees will be a bit different; perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or get rid of them entirely.
  author: Tariely
  website: https://community.simtropolis.com/files/file/32290-tariel-four-mayor-mansions-houses/
