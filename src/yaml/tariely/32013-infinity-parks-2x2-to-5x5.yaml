info:
  summary: Simsim Infinity Parks 2x2 to 5x5
  description: |-
    I loved Simsim's parks set when I came upon it way back then. Those parks were… different. Alas, the originals have disappeared from the STEX. But this Japanese batter's website is still floating on the web, with them: http://simsim.bakufu.org/p04.html

    What I loved about those lots is that they were almost modular, almost, not quite. So they were perfect candidates for my first attempts at modularity.

    There are two 2x2s, one 3x3, one 3x4, two 4x4s and one 5x5. Relotted, with mirrored textures AND with 1x2, 1x3, 1x5 and 2x5 "modules" that make them… endlessly combinable (hence, the name). The original download also contains pictures of how-to-combine examples.

    LLB (Dreadnought) was kind enough to make three little 1x1 that can be used as paths linking the parks. I might make more park paths with that texture in the future. Modular 'R' Us!

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world. Also the willing victims of various beta-tests, RobertLM78, Handyman and, again, Dreadnought. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi…). We need help when we begin sneaking a peek under the hood of SC4. That the community is always willing to help is a constant and pleasant comfort for us noobies.

    **Note on Ftexture:** when I first downloaded the Simsim parks, an obscure dependency was listed, Ftexture. I got it and the lots worked, i.e. the paths showed up. Later I was persuaded that Ftexture was not necessary. But it is. The textures are installed by `pkg=tariely:ftexture`, which is also used by `pkg=tariely:infinity-parks-again`.

    **Stats:** they don't cost much (from 30 to 200), they have a positive effect on pollution (except, slightly, the 1x5 parking module), they are not water-guzzling and they have a nice park and landmark effect.

    Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lots only need the Rivit streetlight prop from `pkg=tariely:essentials`.
