info:
  summary: Woodwork Parks (Burgess Square 9x6, Nyhaven Spring Park 9x8, Nyhaven Calluna Park 9x8)
  description: |-
    I remember going "wow" when I first saw that set of parks and plazas by woodb3kmaster, way back then (I mean, 2006, or whereabouts). But… no night lights. So I tarielized them. And relotted them, beginning with the three parks. (A plaza later...)

    You can check woodb3kmaster's content on the STEX.

    There are three parks: Burgess Square (9x6), Nyhaven Spring Park (9x8) and Nyhaven Calluna Park (9x8). The latter can be used with my Infinity Parks modular set (`pkg=tariely:infinity-parks-again`), having the same paths texture. The lots have the same properties as the originals.

    One street tree of Burgess Square is a prop of the SFBT tree families (`pkg=sfbt:essentials`). Choose the `CP-deciduous-trees` family to see it.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi, Catty-cb, CorinaMarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is a constant and pleasant reassurance.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different; perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or get rid of them entirely.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods.

    The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed.
