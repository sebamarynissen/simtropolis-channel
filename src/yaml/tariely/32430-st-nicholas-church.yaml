info:
  summary: St Nicholas Church (4 versions) 6x5
  description: |-
    I love that little church. It was originally a Caliban reward, but I wanted it without having to wait or to cheat for it. So I decided to relot it. Four times, and not as a reward.

    Check Caliban's other creations on the LEX. Or callagrafx, same great batter.

    **Content**

    - St Nicholas Church v1.2 (walls with ivy)
    - St Nicholas Church v2.2 (grate walls)
    - St Nicholas Church v3.2 (park, no walls; compatible with Tariel's Big Modular Parks & Paths Project!)
    - St Nicholas Church v4.2 (Ancient, big walls)

    The park version is compatible with my NTS Modular Parks & Paths (`pkg=tariely:nts-modular-park-paths-set`), and belongs to the Tariel's Big Modular Parks & Paths Project.

    The seasonal cherry tree is a prop of `pkg=bsc:mega-props-cp-vol02`. If you want the tree not to be seasonal, install my Evergreen version of it (`pkg=tariely:trees-evergreen`), which also changes the other CP, JENX and Porkie trees of your city.

    Three props of the v4.2 Ancient lot are not available in any known file, so these may be missing in game. The original list of dependencies mentions `DukeChapel_Caliban.dat` of the Caliban Lots for a small optional detail, but that file does not contain them.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Tyberius06, Matias93, Fantozzi, Catty-cb, Corinamarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is very comforting.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection; it shouldn't interfere here.
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different (not these trees!); perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
  author: Tariely
