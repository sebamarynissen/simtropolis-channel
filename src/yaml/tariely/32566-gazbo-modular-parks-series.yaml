info:
  summary: Gazbo Modular Parks & Paths Set
  description: |-
    Tariel's Big Modular Parks & Paths Project (a.k.a. TBMPPP), continued.

    After the NTS Modular Paths Set (`pkg=tariely:nts-modular-park-paths-set`) and the Holly Hocks Parks & Paths Set (`pkg=tariely:holly-hock-parks-3x3-paths`), here is another set of 20 parks and their paths, with eight different textures, the most generally used. The pieces have been SPOTted for easier use. Also, decorated with prop families (just replop if the greenery doesn't suit you). And they are lit, of course.

    In order to avoid too bright lights in some pieces, be mindful of the way you plop them (especially the straight and cross pieces and when plopping identical pieces one after the other). I've tried to indicate clearly which side is up; that's where the secondary lightning effect is placed, sometimes causing too much brightness.

    **NB:** one of the parks, Willow Pond Park, with the JENX willow, is not, alas, pretty by night. But I have included it nevertheless for those of you who only play day, because those trees are too amazing.

    If you want to use more than one park set at a time, the pieces are ordered in the menu by texture, so they might be up and down your park menu, but, hopefully, always logically grouped. There are a few transition pieces from one texture to another (more can be made if asked nicely :-) **Warning:** the icons are the same from one set to the other (basic shapes, no texture), only the names are different.

    All pieces are medium wealth and procure a medium landmark and park effect.

    **NB:** if you are wondering why there are two sets of greystone parks (horizontal and vertical texture), it is because they match my Infinity Parks (`pkg=tariely:infinity-parks-again`) and their modules addons, whose textures have both horizontal and vertical orientations. And because it does help. You'll see when you play Tetris with those sets.

    And Ludwig D. Gazbo is another park designer, Holly Hocks' business partner and companion. In case you wondered.

    The RedBrick 1 texture is a BSC park texture. When installing `pkg=bsc:bsc-parks-texture-pack`, choose the `default` texture (`BSC_Park_Textures_zDefault.dat`) to match these parks. The fountain parks use the fountain prop of the CDK-OWW Commercial Style, which also adds its 8 seawall plazas to the Park menu.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Tyberius06, Matias93, Fantozzi, Catty-cb, Corinamarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is very comforting.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different (not these trees!); perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
  author: Tariely
