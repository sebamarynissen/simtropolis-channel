info:
  summary: DEL Metropol Parasol Park LM 7x12
  description: |-
    I fell in love with that amazing building by Delyrium… and saw it had no night lights. There is no way to add them to the building itself, but I thought perhaps I could do something with it anyway. So I transformed the LM into a rather formal city park.

    The model of Metropol Parasol is installed from `pkg=delyrium:metropol-parasol-models`.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Tyberius06, Matias93, Fantozzi, Cyclone Boom, Catty-cb, Corinamarie, Andreas…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is very comforting.

    My Evergreen trees (`pkg=tariely:trees-evergreen`) can be used for the seasonal CP and Porkie trees of this park, if you prefer evergreens. They are not installed with this package, as they change those trees in your whole city.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your Maxis trees might look a bit different; perhaps you should use it, it is a neat mod…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I usually make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
  author: Tariely
