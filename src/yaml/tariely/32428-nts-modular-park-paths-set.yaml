info:
  summary: NTS Modular Park Paths Set
  description: |-
    I remember the excitement when Paeng uploaded his modular parks series, with three different textures and lots of addons. Master Paeng has been my model all these years, as a CJer and as a lotter-relotter. I will never come even up to his knees but I'd be glad to stay there. He is my inspiration. And the fact that his parks were not lit is the main reason I got into relotting.

    So, in homage to Paeng who does not play with us anymore (and before relotting-lighting his parks), I decided to make my own set of modular parks. A lighted version. With yet another texture, from LBT. If you wonder what NTS stands for, it was my working name for the lots; it means "Not Too Simple", referring to that texture's quality. I kept it. It's fitting.

    All the pieces should be at the beginning of the Park Menu, depending on each player's set-up, of course. But I have tried to group them in a more or less logical order (narrow paths, ends, wide paths).

    Paeng's Parks were not very friendly to MMPs, but thanks to the MGB TGN Parks 205 override of `pkg=mgb204:terrain-grass-nam`, they now are, and so are mine, as the picture shows. My terrain mod (MGB-SVU) has a rather dark grass texture but you should be able to MMP the edges of all the pieces so as to blend them seamlessly with your own grass texture.

    All pieces are SPOTted to help you place them. I also placed dots to indicate where some of the props stand, to facilitate orientation.

    **Warning:** by night, some pieces might look more lit than others, especially the cross and straight pieces. A good way to avoid this is to change the piece's orientation when plopping them. Trust the SPOT arrows.

    And this is a main component of Tariel's Big Modular Park & Paths Project, i.e. the path texture is compatible with that of several of my parks already there or yet to come. See my content.

    The street trees of these lots are props of the SFBT tree families (`pkg=sfbt:essentials`). Choose the `Maxis-deciduous-trees` or `Maxis-pine-trees` family to see the corresponding trees (only one family can be chosen).

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world and is always generously ready to help. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi, Catty-cb, Corinamarie…). We need help when we begin peeking under the hood of SC4. That the community is always there for us noobies is a constant and pleasant reassurance.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere, but one never knows!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different (not these trees!); perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
