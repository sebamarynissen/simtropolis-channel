info:
  summary: EBLT Fountain Circle Plaza 4x4
  description: |-
    The io_bg EBLT originals are splendid by themselves, in their use of the beautiful NDEX Konietzko Fountain. I use them extensively (and I am not the only one! You may soon find more of them relotted on the STEX). I too thought they could do with a little modern TLC. As I fell in love with their base texture I used it in many of my other plazas, so I added a little 1x1 to link them if desired.

    The originals are [EBLT Plaza Pack](https://community.simtropolis.com/files/file/22429-eblt-plaza-pack/) by io_bg. The fountain is installed from `pkg=ndex:konietzko-fountain-model`.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world. Also the willing victims of the beta-tests, RobertLM78, Handyman and, again, Dreadnought. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi…). We need help when we begin sneaking a peek under the hood of SC4. That the community is always willing to help is a constant and pleasant comfort for us noobies.

    **Stats**

    - Plop cost: 500
    - Park effect: magnitude 20, radius 60
    - Pollution: air -16
    - Landmark effect: magnitude 50, radius 10

    This is for SC4 Rush Hour.

    Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lots only need the Rivit streetlight prop from `pkg=tariely:essentials`.

    The party props of these lots are part of `pkg=sfbt:essentials`, which asks you to choose a tree family. These lots don't need a particular one.
