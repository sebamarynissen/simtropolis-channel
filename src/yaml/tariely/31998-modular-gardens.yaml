info:
  summary: LBT Modular Gardens with plazas 3x3 & 2x2
  description: |-
    I liked the unusual Costa Del Sol-y texture of the original LBT plazas, so I ran away with it. There were six of them, I kept only two, the 2x2 and 3x3. Count your blessings.

    The original (LBT PlazasPack6) seems to have disappeared, alas, or I didn't manage to find it. If you do, please PM me and I will amend this upload.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world. Also the willing victims of the beta-tests, RobertLM78, Handyman and, again, Dreadnought. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi…). We need help when we begin sneaking a peek under the hood of SC4. That the community is always willing to help is a constant and pleasant comfort for us noobies.

    **Stats**

    - Plop cost: 30 for the 1x1s, 100 for the 2x2, 150 for the 3x3
    - Park effect: magnitude 30, radius 50 for the 1x1s; magnitude 40, radius 60 for the 2x2 and 3x3
    - Pollution: air magical 0
    - Landmark effect: magnitude 20, radius 5

    This is for SC4 Rush Hour.

    Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lots only need the Rivit streetlight prop from `pkg=tariely:essentials`.
  author: Tariely
  website: https://community.simtropolis.com/files/file/31998-tl-lbt-modular-gardens/
