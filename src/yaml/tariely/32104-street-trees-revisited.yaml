info:
  summary: Kazuki Street Trees revisited
  description: |-
    A few months ago, I uploaded the lost original, which I had been using liberally for years. With some problems, though, that I thought would be nice to save new users from. (1) The bus stop never showed up, (2) neither did the dirt circle for the trees (the original used the Invisible One…), (3) they were not well lighted, which is my personal bugaboo. Also, last but not least, (4) I never knew exactly on which side the chain barriers were, and had to re-plop several times to get them right.

    While making an Evergreen version of the lots (no fall leaves on the street…) I realized my first relot could have been better.

    So here is a new new version of those Kazuki lots, trying to solve all those problems, with a little bit of SPOT to help with the plopping. All hail goes to Kazuki for making them in the first place. I just licked them up and lighted them and gave them new menu icons. I also took advantage of the opportunity to redo the menu icons and add an Empty lot (I found it was necessary when making a plaza out of these lots, because sometimes you can't plop two of them side by side; all but two are transit-enabled.)

    You don't need the original but it's here.

    **Notes**

    - If you have a Sandstone Mod, it will replace the Maxis pavement.
    - The trees are seasonal. The non-seasonal Evergreen version is a separate upload.

    **General warnings**

    - This is for SC4 Rush Hour.
    - I play with NAM36, RRW-EU selection (it shouldn't interfere here, but you never know!)
    - I also play with the T Wrecks Maxis HD Tree Replacement (`pkg=t-wrecks:maxis-tree-hd-replacement-mod`). If you don't use it, your trees might look a bit different (not these trees!); perhaps you should use it…
    - I play Nights. Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. If you don't want it, you can either tweak my lights in the Lot Editor or take them out of my Essentials dependency.
    - I like trees. I make intensive use of trees. Especially the Girafe tree collection on the LEX; just follow it into the woods, when indicated.
  author: Tariely
