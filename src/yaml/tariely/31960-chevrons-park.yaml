info:
  summary: Chevrons Park 3x3
  description: |-
    I love parks, plazas, green spaces, even treed parking lots, anything that will let a cityscape breathe, by day or by night. Over the years I collected a lot of them, with a dozen loved ones I always find myself going back to. But at some point, playing in night mode, I noticed that many of them were not lit, or not enough for my taste. Ditto for too many sport parks. I don't want my peeps to be mugged when taking a stroll in a park or playing catch with the kids! So I decided to learn how to light stuff. Among other things. So here is the very first park I lotted (as any new modder would...) when I was hopped up on textures. There will be others. I thought it was time to add to our collective collection.

    Depending on your using or not a Light Replacement Mod, the lighting will be slightly different, but there will be light. The lot and its 1x1 addon (to extend the paths if desired) should show up at the beginning of the Park menu, or somewhere thereabout; menu order is also player-dependent.

    Many thanks to my technical gurus, Rsc204, Kosc and Dreadnought. And especially Rivit, who lighted my SC4world. Also the willing victims of the beta-tests, RobertLM78, Handyman and, again, Dreadnought. And the guys and gals on the forums (Twalsh, Matias93, Fantozzi…). We need help when we begin sneaking a peek under the hood of SC4. That the community is always willing to help is a constant and pleasant comfort for us noobies.

    **Chevrons Park 3x3**

    - Plop cost: 250
    - Park effect: magnitude 40, radius 65
    - Pollution at center: -5
    - Pollution radius: air 10, water and garbage radiation 0
    - Landmark effect: 20, radius 10

    The original download also contained two optional Rivit lighting overrides (`RVT ParkLights2.dat` and `zLightCones_RVTNite.dat`). They replace two Maxis park lampposts and two Maxis light cone textures, so they are not installed. The lots only need the Rivit streetlight prop from `pkg=tariely:essentials`.
