info:
  summary: Zeughaus Museum
  description: |-
    Based on the Zeughaus (Armory) of Köln (Cologne), Germany. The original building was completed as an armory in 1606, and rebuilt after World War II to serve as part of the city's museum complex.

    This upload contains one lot, a ploppable 5x2 museum. This is a medium-sized museum best suited for medium-to-large cities. It costs $2,300 to plop, serves up to 6,400 sims, and costs up to $2,400/month to maintain.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
  author: brancra
