  summary: The Altagracia
  description: |-
    This upload contains three lots. All three use AGC props and grow on the Houston and Euro tilesets. The models are DarkNite only.

    - "The Altagracia Apartments", a growable 2x3 Stage 6 R$$ lot. This uses the light-colored building.
    - "The Hotel Altagracia", a growable 2x3 Stage 4 CS$$$ lot. This uses the dark-colored building.
    - "The Bellavista Apartments", a growable three-building residential complex on a 5x5 Stage 6 R$$ lot. This uses both types of buildings.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
