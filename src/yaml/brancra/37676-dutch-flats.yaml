info:
  summary: Dutch Flats
  description: |-
    Based on a real pair of apartment blocks in Amsterdam, the Netherlands.

    This upload contains two lots. Both use AGC props and grow on the Houston and Euro tilesets.

    - A growable 5x1 Stage 6 R$ lot.
    - A growable two-building "apartment complex" on a 5x4 Stage 5 R$ lot. There are two models with slight wall color differences, and both are used for this lot.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
