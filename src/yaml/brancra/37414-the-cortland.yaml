info:
  summary: The Cortland
  description: |-
    Based on a real building in Detroit, Michigan, USA.

    This upload contains two growable R$ lots. Both grow on the Chicago and New York tilesets.

    - A growable 2x2 Stage 6 lot with Maxis props.
    - A growable 3x3 Stage 5 lot with AGC props.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
