info:
  summary: Gürzenich Köln (Great Hall of Cologne)
  description: |-
    Based on the Gürzenich (Great Hall) of Köln (Cologne), Germany. The original Gothic structure was built as a market and festival hall in 1447, and was a host facility for foreign dignitaries. Today, following several renovations over the centuries, it is an events and performing arts center.

    This upload contains one lot, a ploppable 2x4 library. This is a medium-sized library in-game. It costs $950 to plop, holds up to 165,000 books, and costs up to $700/month to maintain.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
