  description: |-
    Based on a real building (the Como Metropolitan) in London, UK.

    This upload contains three lots. All are growable on the Houston and Euro tilesets.

    - A growable 2x3 Stage 6 R$$$ lot with Maxis props.
    - A growable 2x3 Stage 5 CS$$$ lot with AGC props.
    - A growable 5x5 Stage 5 R$$$ "Apartment Complex" lot with AGC props.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
