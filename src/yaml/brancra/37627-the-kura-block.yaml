info:
  summary: The Kura Block
  description: |-
    The Kura Block / Bloque Kura is a joint project between Barroco Hispano and nikoxlaux. The building is fictional. The name "Kura" comes from the word for 'stone' in Mapudungun, one of the indigenous languages of Nikoxlaux's home country of Chile, and is a nod to the building's stone texture.

    This upload contains two growable CO$$$ lots. Both grow on the Houston and Euro tilesets.

    - A 3x2 Stage 5 lot.
    - A 4x4 Stage 4 lot, "The Kura Corporate Complex". The AGC stone props in this lot are another nod to its name.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
