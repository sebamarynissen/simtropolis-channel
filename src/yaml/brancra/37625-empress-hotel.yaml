info:
  summary: Empress Hotel
  description: |-
    This is a joint project between Barroco Hispano and Bobelboy. It is based on the Empress State Building, an office building built in 1961 in London, UK. The original plan was for it to be a hotel, though it was later adapted to an office building: [Empress State Building](https://en.wikipedia.org/wiki/Empress_State_Building).

    This upload contains one lot, a growable 6x6 Stage 8 CS$$$ lot. It grows on the Houston and Euro tilesets.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
