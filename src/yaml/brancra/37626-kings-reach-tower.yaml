info:
  summary: Kings Reach Tower
  description: |-
    This is a joint project between Barroco Hispano and Bobelboy. It is based on an office tower in London, UK, built in 1972 and renovated and renamed in 2013: [Southbank Tower](https://en.wikipedia.org/wiki/Southbank_Tower).

    This upload contains one lot, a growable 3x3 Stage 8 CO$$ lot. It grows on the Houston and Euro tilesets.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
