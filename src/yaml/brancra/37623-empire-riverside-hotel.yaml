  summary: Empire Riverside Hotel
  description: |-
    This is a joint project between Barroco Hispano and Bobelboy. It is based on a real hotel located in Hamburg, Germany: the [Empire Riverside Hotel](https://davidchipperfield.com/projects/empire-riverside-hotel).

    This upload contains one lot, a growable 3x4 Stage 7 CS$$$ hotel. It grows on the Houston and Euro tilesets.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
