info:
  summary: Harold Washington Library
  description: |-
    Based on the Harold Washington Library in Chicago, USA. While it looks historic, the real building was built in 1991.

    This upload contains one lot, a ploppable 4x7 library. This is a large library best suited for large urban areas. It costs $7,050 to plop, holds up to 1.32 million books, and costs up to $3,450/month to maintain.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
