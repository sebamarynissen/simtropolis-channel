  summary: Small Community Church
  description: |-
    This is a fictional small community church, not unlike many small town churches found across the United States and Canada.

    The church comes on two ploppable lots: a 1x1 lot and a 2x2 lot with an outdoor gathering area and a small cemetery.

    Lotting, modding and testing by brancra. The refined modeling, texturing and lighting are by AGC / Barroco Hispano. If you appreciate his work, consider [donating to his PayPal](https://www.paypal.com/donate/?hosted_button_id=WF9FDNHXCHDVU).
