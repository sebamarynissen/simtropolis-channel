  description: |-
    **Surbiton Station**

    Surbiton Station was built in 1937 to accomadate the expansion of London with the new suburb of Surbiton.  Built on the existing London and Southwestern Railway. The Art Deco building is Grade II Listed and considered one of the finest Art Deco stations in the UK.

    This old model of mine has been lying around on my PC for months now, so i just spruced up the textures a little and rendered.

    In-game Statistics:

    Cost: £5000

    Capacity: 30,000

    Size 4x8

