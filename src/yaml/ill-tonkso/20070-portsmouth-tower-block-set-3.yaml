    Portsmouth, just like any city in the UK got bombed to the ground by Nazi Bombing Raids. After the Blitz, cities began building new social housing schemes to house the homeless. Portsmouth was no exception.

    * * *

    This zip contains the model and lot for 'Ladywood House', a 72m 24 storey building, currently the third tallest building in Portsmouth behind the more modern 100m Eastside Plaza and 170m Spinnaker Tower..

    This download is formed of two R£ 1600 2x3 growable lots.

    * * *

