    **25 Old Broad Street: Tower 42**

    Tower 42 was completed in 1980 and at 183 meters and 42 stories was Londons tallest building (surpassed by [One Canada Square](https://www.simtropolis.com/stex/index.cfm?id=16049) in 1991). Richard Sieferts design was reported to be the straitest skyscraper in the world due to new technology at the time and is the worlds tallest Cantlivered Building.

