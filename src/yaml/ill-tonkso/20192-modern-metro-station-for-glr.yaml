  description: |-
    I opened up max earlier, because I needed  an old looking Victorian Sub Surface Station for my metro network. That didn't quite happen. It turned modern. So I used it anyway, completely defeating the object of having a Victorian Network. Oh the joys of BAT doodles.

    Here it is anyway, to use it simply dig a hole using the hole diggers, stick a GLR line through it, and then stick this on it. Simple. I will upload a lot for Standard Rail soon. =
