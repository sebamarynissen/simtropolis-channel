  summary: The Metropolitan Mall
  description: |-
    The Metropolitan Mall is a new Functional Reward lot from Ill Tonkso (modded by Barbyw).  
      
    Designed to act as a British inner city shopping centre this new BAT model contains a selection of UK shops and a car park. Also has an area for local busses.  
      
    To activate the reward you must achieve 10,000 commercial jobs in your city. The Mall will give you 7000 CS££ Jobs (yes people that is realistic and was agreed upon between me, barbyw and others lol). The lot is fully transit enaabled and requires the [BSC Reward Thingy](https://www.simtropolis.com/stex/index.cfm?id=12434) in the essentials package to work. Also, for the roads it needs [this.](https://www.simtropolis.com/stex/index.cfm?id=14430)  
      
    A Special Thanks to everyone who commented on the work in chat and for Barbyw who made the reward function possible.
