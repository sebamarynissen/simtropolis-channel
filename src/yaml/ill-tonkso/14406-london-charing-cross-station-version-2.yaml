info:
  summary: London Charing Cross Station Version 2
  description: |-
    **Charing Cross Station**

    This is a fixed version addressing a few bugs in version 1. Charing Cross now has no negative effects on Frogfaces Kings Cross Station and has no dependency problems.

    Charing Cross is one of the smaller London Termini, also the most centralised Station in the Metropolis. In 1991 'Embankment Place', a Post Modernist Office Block was added as an air rights development on the roof.

    Lot Size: 7x17  
    Lot Capacity 50,000 Passenger Rail Users

    Transit Enabling: Rail is transit enabled on the first tiles to allow ground rail to be connected, there are also 3 tiles of transit enabled road at the front of the station.

    dependencies:  
      
    ITS Props Inclusive  
    BCS Texture Mega Pack [https://www.simtropolis.com/STEX/index.cfm?mode=files&filetype=Texture&Str=bsc%20textures%20mega%20pack](https://www.simtropolis.com/stex/index.cfm?mode=files&filetype=Texture&Str=bsc%20textures%20mega%20pack)

    Thanx to SC4\_Miester for the Render.

    Appologies for any problems caused by Version 1.
