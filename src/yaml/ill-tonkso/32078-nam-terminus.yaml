info:
  summary: High Level NAM Terminus
  description: |-
    This elevated rail terminus is based on an early victorian/late georgian station such as those built in the early railways age. The Train Shed Roof takes inspiration from that of the original Euston Station in London. This is one of the earliest Stations on the BNSRW (Brenntia and Northern Suburban Railway) metro network dating from 1837.

    Plop Cost: §2000  
    Upkeep: §200  
    Bulldoze Cost: §274  
    Capacity: 40,000  
    Power Consumed: 61  
    Water Consumed: 12

    Model by ILL Tonkso, lotting and modding by ILL Tonkso and SC4 Meister. Re-uploaded by Tyberius06 on behalf of ILL Tonkso with the permission of the Simtropolis staff.
