  description: |-
    **Brenntrail Set Curved Station**

    This station has been designed to adhere to the Network Addon Mod Rail curve.

    Capacity 10,000

    Plop cost 500.

    This lot functions as an overhanging prop from a 1x1 lot. Simply place the lot on the inside of the curve, facing away.

    Requires the Network Addon Mod: the station only fits the NAM's smooth 45° rail curves.
