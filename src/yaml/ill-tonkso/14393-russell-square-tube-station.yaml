  summary: Russell Square Tube Station
  description: |-
    **Russell Square Tube Station**

    On July 7th 2005 08.50AM, a train left Kings Cross Tube Station for Russell Square Tube Station, it was never to arrive at its destination. One of multiple terror attacks on the capital that day that claimed the lives of 52 innocent Britons. This is Russell Square Tube Station, recently a place of mourning for those whos lives were taken so suddenly.

    As memorial to those who died this is a fully functional BAT of the station.

    Capacity 5000, Plop Cost 500  
    Found in Mass Transit Menu  
    2x1 Lot

    We will never forget.
