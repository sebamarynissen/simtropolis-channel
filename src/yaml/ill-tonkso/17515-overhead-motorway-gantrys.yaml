    A Merry Christmas from ITS and friends ![:)](https://community.simtropolis.com/assets/emoticons/LlamaSmile.gif)

    **ITS Overhead Motorway Signs (yes i saw the typo in the STEX upload lol)**

    I created these motorway signs for my region 'Brenntia' to act as eye candy lots on my motoways. The signs are real UK Motorway signs taken from the M1 near Sheffield and placed over a gantry based on those found all over the network. Each lane also has speed limit reduction signs that display alternative speed limits when traffic is backed up, the weather is bad or there has been an accident.

    The set contains two overhanging lots, one for elevated and one for ground, both sets cost £20 to plop and have no status effects on the city, just eye candy.
