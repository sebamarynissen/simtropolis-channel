  summary: Replaces the default El-Rail train models with a Docklands Light Rail train
  conflicts: Replaces the Maxis El-Rail engine and car models (also used by GLR). Do not combine with other replacements of these models.
  description: |-
    The Docklands light rail is one of the three London Metro networks (along with the Tube and Tramlink). The DLR opened on 31/07/87 connecting the new London Docklands development (e.g. Canary Wharf) with the city.

    Note: Only one GLR skin may be used to prevent mixing of trains.
