  summary: The Spinnaker Tower Portsmouth
  description: |-
    Here it is, my **200th UPLOAD,** the MIGHTY SPINNAKER TOWER. As the tallest building in my hometown, the striking 170m Spinnaker Tower was my first ever model on 3d software, now, 4 years later, I have made it again, to better scale and accuracy. One of the greatest, if not THE greatest modern building in the United Kingdom stands tall and proud as an icon to the great City of Portsmouth. Now it can be an icon for your SimCity aswell.

    'Heavens Light our Guide' *Portsmouth City Motto*

