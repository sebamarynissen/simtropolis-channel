info:
  summary: 125 Old Broad Street London Stock Exchange Tower
  description: |-
    Completed in 1970 for the London Stock Exchange, 125 Old Broad Street was a concrete clad tower with extra hight floors on its upper levels. With the stock exchanges vacation in 2004 to the nearby Paternoster Square, the exchange tower was left Vacant with little attraction to possible Tennants. In 2007 the Tower was reclad in glass and steel with extra floors added to modernise the Exchange Tower into a sleek reflective building, suitable of Londons changing skyline.

    * * *

    Ploppable Diagonal Lot: 2x2 (plus building overhang), £4000, CO£££ 6300.

    * * *

    dependencies: None.

    * * *

    Thanks, Dan.
