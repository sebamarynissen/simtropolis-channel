  description: |-
    **Brenntia St Georges Station  
    **  
    When opened in 1862, Brenntia St Georges was by far the largest Railway Station in Brennt. The Brenntia terminus for the Brennt Shores Railway (BSRW) between Brenntia and Eastland and several suburban lines this has 20 Platforms to cope with the sheer amount of Rail traffic. Notably Platforms 19 and 20 are in a seperate shed, these were added in 1875 to cope with the additional traffic on Brenntia City inter-terminal lines to Brenntia Bridge and South Bank. The Stations capacity is recorded to be 200,000 people per hour making this a huge asset to Brenntia City Commuters. The Station is the earliest major project of ITS architects, the NDEX division was trusted in building and engineering the entire BSRW.  
      

    * * *

      
      

    Cost: £10,000  
    Lot Size: 12x11  
    Rail Tiles: 10 Tiles wide  
    Capacity: 200,000  
      

