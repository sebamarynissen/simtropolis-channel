  description: |-
    **The Royal Bank of Brennt**

    Got some cash? Why not save it in the largest bank in one of the Simworld's largest Economy's. The Royal Bank of Brennt is the largest and oldest bank in the great Brenntian Nation.

    I got a little bored and made a tower based on something I saw in a Sao Paolo thread on Skyscrapercity.com, however, it is not a recreation and a large portion of this tower is my own design. Night Lighting took bloody ages though, nicked bits from a photograph of 5 Canada Square (London) and used them to create one big night window texture for each side of the building.

