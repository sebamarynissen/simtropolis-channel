  summary: Portchester Fire Station
  description: |-
    Something local, very local in fact, 1 little residential street away in fact. I walk past this little suburban fire station all the time on the way to my local Rail Station so I thought I would bring it to the game.

    Portchester Fire station is a Portsmouth Suburban Fire station with one engine, for the game I have given it a medium radius, about the same size as the 4 engine station in game. My coverage is a little more realistic than the default stations. It also sits on a 2x3 lot and costs £300 to plop.
