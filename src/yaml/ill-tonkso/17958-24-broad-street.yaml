    **24 Broad Street**

    Following on with my small downtown filler series, this is another 1970s commerical building. This is a larger lot with commercial services instead of offices. Buildings like this that utilise the lower floors for retail and dining are common in the Urban Environment where space is limited and developers need to maximise the usage of the space they have.

