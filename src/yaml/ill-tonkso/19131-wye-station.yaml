info:
  summary: Wye Station
  description: |-
    **Wye Station**

    Wye Station has been modelled after the typical Victorian British country station. Rendered with Mental Ray at 64 samples per pixel to bring out the details and the depth as it should be this is probably my most detailed station to date [see here](http://img158.imageshack.us/img158/8053/stationss8.jpg).

    **The Stats**

    This is a fully transit enabled 2x6 lot that costs a mere £1000 to plop and has a hefty capacity of 10,000. Found in the Rail Menu.

    Any issues, please post [here](https://www.simtropolis.com/forum/messageview.cfm?catid=116&threadid=71573&enterthread=y&STARTPAGE=42) in my support and development thread.

    *Dan*
