info:
  summary: GLR interchange station for changing between two tram lines
  description: |-
    So, you have a big GLR network, huh? I bet it's pretty busy. How would you like an interchange?

    This GLR interchange allows changing between 2 tram lines, with a handy shelter to keep dry from the rain. Sitting on a 6x2 lot this may seem big, but it's a big investment in your city's transportation future.

    - Lot size: 6x2
    - Capacity: 20,000

    Special thanks to the BSC for all the team help.
