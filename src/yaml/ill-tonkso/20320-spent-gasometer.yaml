  summary: Spent Gasometer
  description: |-
    This one really needed to be done to be honest, and somebody had to do it. These things are all over the UK sitting there, not being used (some are). Local Landmarks in many a case. So, in the persuit of realism, I made one.

    To sweeten the deal, I gave it a function. I made it a cheap, low output Gas Powered Power Station.

    * * *

    Cost £500

    Output 1000mw.

    Pollution: Air 40, radius, 25.

    * * *

    Dependencies, none.
