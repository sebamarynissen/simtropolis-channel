    **NDEX ITS 40 50 Bank Street**  
      
    40 and 50 Bank Street was completed in 2003, designed by Ceaser Pelli linked by a glass hall known as the East WInter Garden. 40 Bank Street is currently (22nd september 2006) the 11th tallest building in London and forms part of the Canary Wharf complex.  

