  summary: Small Suburban Tramshed
  description: |-
    Back in the days where tramlines lined the streets of UK cities, the tram companies were the kings of thier game. The Birmingsfield Tramway Corporation had lines all over Birmingsfield City untill the eventual demise with the invention of the car. Then, in later years came the supertram light railways know to ths SImWorld as the GLR. Now the Birmingsfield Metrotram has reopened its small sheds spread sparodacaly all over the city in a half arsed attempt to save money. They were greeted with dirtied, worn brickwork, an old sign they couldnt remove without endangering the main structure and a big, rusty, leaky roof.

    Lot size: 2x4
