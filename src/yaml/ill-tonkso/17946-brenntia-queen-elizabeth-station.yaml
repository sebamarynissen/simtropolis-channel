  summary: Brenntia Queen Elizabeth Station
  description: Brenntia Queen Elizabeth is the second largest terminus in Brenntia with 16 platforms. The station has a capacity of 80,000 and costs £5000 to build, a real good investment. The buildings design is an early victorian rail station with non-arched train shed. The office buildings were added in the mid 1980s and have served as the Great Central Railway headquarters since.
