  summary: Customs House Portsmouth the Worlds first Office Building
  description: |-
    **The Worlds First Office Building**

    Thats right kids! This is the oldest building in the world built specifically to house offices. Part of the former HMS Vernon site at Portsmouth Harbour, (Portsmouth, England)  the Customs House was built in 1790. Before then, offices would be housed in peoples houses, factories or above shops, but never in their own building. This is the grandaddy of all those stunning office skyscrapers we know and love today, the birth of the Office Block.

    In 2000 the building was converted into a Pub, the Pub has retained the interiour layout and is full of old paintings and relics from the buildings 228 year history, also, their garlic bread is quite nice.

