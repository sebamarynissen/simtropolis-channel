  summary: BSS Vlakhaas
  description: |-
    **BSS Vlakhaas**

    One of the Brenntian Navy's Type 54 Frigates, it is laden with two coastal bombardment anti-ship turrets and two anti-aircraft defence missile launchers. The ships main purposes in Wartime are for Coastal bombardment, Carrier Support/Escort and Helicopter Strike launching. One of the many fine ships to take the BSS (Brenntian Service Ship) name this is one of many type 54's owned by the Brenntian Navy.

    Duing Peace-time the ship is used as a 'Drug-Deterant' patrol Vessel around the Shores of Brennt and Allied Country, Thames.

    A Special Thanks goes out to Barbyw for Modding the Ship and the custom Queries.
