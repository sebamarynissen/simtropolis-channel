  summary: HSRP Terminus Station
  description: |-
    After searching the STEX for a terminus station to sit alongside my mainline rail terminal I discovered there wasn't one. Several hours in MAX later and I ended up with this. Now me and Barbyw went through a lot of hassle to get this thing to work in the game (for some reason it just didn't want to) but we got there in the end. Here it is, a proper terminus for the High Speed Rail Project.

    Lot Size: 5x18 Transit Enabled Lot

    Capcity: 60,000 HSR (monorail)

    Build Cost: §20,000

    dependencies:

    Mandatory: HSRP (duh!) [(win)](http://http//www.simtropolis.com/stex/details.cfm?id=19748) [(mac)](http://http//www.simtropolis.com/stex/details.cfm?id=19749)

