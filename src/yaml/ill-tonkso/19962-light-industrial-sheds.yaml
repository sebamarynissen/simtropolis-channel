  summary: Light Industrial Sheds
  description: |-
    Tonksie doing Industrial? What has the world come to! The Sky is falling!

    Hehe, I saw some buildings that looked like this as I passed by on the train and thought, meh, why not. Only took half hour to model and I needed something like this.

    This set comes with 4 flavours!

    -   Phils Car Parts (Blue Building)
    -   Mellotron (Red Building)
    -   Newham Beds (Grey Building)
    -   Softme Circuits (Grety/Yellow Building)

    Each of which provide 120 Industrial Manufacturing Jobs (The Plugin Manager suggested 3350 ¬\_¬ ) and grows on a 2x3 lot. Hold on a sec, Tonksie didn't make a ploppable?

    * * *

    No dependencies! Crack open the Champagne!
