  summary: 99 Bishopsgate
  description: |-
    99 Bishopsgate is a midrise skyscraper in London England. It was completed in 1976 for the Hong Kong Shanghai Bank Corporation. The skyscrapers history has not been completely smooth however, in 1993 the IRA detonated a Truck Bomb along Bishopsgate, destroying the curtain wall of 99 Bishopsgate, the building was subsequently abandoned. An Image of the building after the blast is available [here.](http://f5.putfile.com/5/12807480465.jpg) After the cleanup, the tower underwent an 18 month renovation where an ultra modern reflective facade was installed to the Tower and Podium. The tower was reopened in 1995 and still looks brand new today.

      
    The SimCity version is modeled after the 1995 reclad 99 Bishopsgate.  
    CO£££ 2000, 3x4 lot.  
    This Tower is a wall to wall model designed for placing on the corner of a wall to wall block.

      
