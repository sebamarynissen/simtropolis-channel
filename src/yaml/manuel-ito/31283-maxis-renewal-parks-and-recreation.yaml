info:
  summary: Maxis Renewal - Parks and Recreation
  description: |-
    In this first\* installment of the Maxis renewal series, most of the basic Maxis parks, as well as some related rewards, have been re-lotted.

    Changes include general lot redecoration: most trees replaced with CP's seasonal and semi-seasonal variants, sidewalk textures replaced with CP's SCILT textures and the green park's base replaced to match the open grass area, among other things.

    Lots overriden: Green parks, flower gardens, plazas, sports fields, beach, minor and major league stadium facelift, mayor statues, farmer's market.

    Optional standalone lots included: koi pond garden, fenced sports fields, beach promenade extensions.

    These overrides require a considerable amount of dependencies.

    \*Technically second, as I consider the Grand Rail Station Facelift as part of the series

    Notes:

    As with any lot overrides, it's recommended to bulldoze any existing instances of these Maxis lot overrides in your desired region before (un)installing this plugin, otherwise it may lead to problems ranging from texture and prop mismatches to other issues. You can plop them back afterwards.

    Enjoy! ![*:)](https://community.simtropolis.com/assets/emoticons/default_1.gif ":)")
