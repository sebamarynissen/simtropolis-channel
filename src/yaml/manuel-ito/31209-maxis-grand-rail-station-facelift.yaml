info:
  summary: Maxis' Grand Rail Station Facelift
  description: |-
    This is a relot of Maxis' Grand Rail Station reward, which didn't age well in comparison with the great custom content made by the community. In addition to general redecoration of the surroundings, a second dual track rail passage has been added, as well as some timed passenger car props and visual TE for street and a custom icon.

    Notes:

    As with any lot overrides, it's recommended to bulldoze any existing instances of the Grand Rail Station in your desired region before (un)installing this plugin, otherwise it may lead to problems ranging from texture and prop mismatches to pathing issues. You can plop them back afterwards.

    This relot was originally built for personal purposes, hence the amount of dependencies

    Enjoy! ![*;)](https://community.simtropolis.com/assets/emoticons/default_2.gif ";)")
  author: Manuel-ito
  website: https://community.simtropolis.com/files/file/31209-maxis-grand-rail-station-facelift/
