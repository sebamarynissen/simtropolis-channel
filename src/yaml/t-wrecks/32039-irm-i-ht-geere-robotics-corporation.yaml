group: t-wrecks
name: irm-i-ht-geere-robotics-corporation
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Geere Robotics Corporation BAT by jestarr
  description: |-
    The IRM uploads continue with another jestarr creation.

    The 15th upload in this series, **Geere Robotics Corporation** by **jestarr**, is another more or less nondescript building that looks a bit like a warehouse - one can imagine that they produce robots and ship them directly from this large plant. The two lot options are equal in size, but differ slightly in style. The first one has two "closed" sides with a fence and a footpath running along the back walls of the building, the other two sides open up to adjacent industry lots. The second one has three open sides with frontside parking and comes without a fence. Nothing too exciting, but there are some nice details if you zoom in closely, or at least I think so.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **120 I-HT jobs**, the quadrupler version **480 I-HT jobs**.

    The following lots are included in this download:

    - 6x6, Stage 3 (2 versions)

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 989 jobs, and the lots grow at Stage 4.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **jestarr**.

    T Wrecks, December 17, 2017
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32039-irm-i-ht-geere-robotics-corporation-by-jestarr/
