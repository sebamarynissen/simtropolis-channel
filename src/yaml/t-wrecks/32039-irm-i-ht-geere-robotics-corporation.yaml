    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_GeereRobotics_02.jpg.fa1a9a64ada4cf7c8feedfeab965be75.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_GeereRobotics_03.jpg.556c8adb92ec7753f76b037c9d62ee28.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_GeereRobotics_04.jpg.e33c34c4266d98b38856bce5f40b5e11.jpg

