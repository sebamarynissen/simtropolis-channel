      - assetId: t-wrecks-irm-w2w-gk-metal-fabrication
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM W2W Expansion/G&K Metal Fabrication \\(jestarr\\)/"

