group: t-wrecks
name: irm-w2w-gk-metal-fabrication
version: "1.0"
subfolder: 400-industrial
info:
  summary: 4 W2W I-D lots using the G&K Metal Fabrication BAT by jestarr
  description: |-
    The third upload in a series of IRM W2W lots based on BAT models made by other artists is **G&K Metal Fabrication**, another BAT made by **jestarr**.

    The building will provide **240 I-D jobs**. The following lots are included:

    - 4x3 straight (2 versions), Stage 1
    - 3x4 straight (2 versions), Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide only 50 jobs and also grow at Stage 1.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again, credits to **jestarr** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, January 28, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30115-irm-w2w-gk-metal-fabrication-by-jestarr/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_01_2015/6e76452fcc7de8e398462f6ffc6db226-irm_w2w_gkmetalfabrication_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_01_2015/26dec8e99981d21d9e7287014ad16cae-irm_w2w_gkmetalfabrication_02.jpg

dependencies:
  - memo:industrial-revolution-mod
  - t-wrecks:irm-w2w-base-pack
  - bsc:mega-props-jes-vol03

variants:
