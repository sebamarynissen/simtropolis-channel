info:
  summary: 4 W2W I-D lots using the American Licorice Company BAT by jestarr
  description: |-
    The second upload in a series of IRM W2W lots based on BAT models made by other artists is **American Licorice Company**, another BAT made by **jestarr**.

    The building will provide **360 I-D jobs**. Since the building can only be used as W2W in one orientation, all lots were made with right corners in mind. The following lots are included:

    - 2x6 right corner, Stage 1
    - 2x7 right corner, Stage 1
    - 3x6 right corner, Stage 1
    - 3x7 right corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 262 jobs. The 2x6 lot grows at Stage 5, the 2x7 and 3x6 lots at Stage 4, and the 3x7 lot at Stage 3.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again, credits to **jestarr** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, January 26, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30111-irm-w2w-american-licorice-company-by-jestarr/
