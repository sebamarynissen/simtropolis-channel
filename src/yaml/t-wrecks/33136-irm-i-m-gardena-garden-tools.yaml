    - https://www.simtropolis.com/objects/screens/monthly_2019_09/IRM_I-M_T1_GardenagardenTools_02.jpg.dbfec9356038330395e14904b1454b9a.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_09/IRM_I-M_T1_GardenagardenTools_03.jpg.25066a0c188f77bc22fed2c239a353b4.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_09/IRM_I-M_T1_GardenagardenTools_04.jpg.4e7caa03e9501bceaf9e291b8549e84f.jpg
