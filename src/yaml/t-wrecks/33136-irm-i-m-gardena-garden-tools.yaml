  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-m-gardena-garden-tools
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-M Gardena Garden Tools \\(T1\\)/"

