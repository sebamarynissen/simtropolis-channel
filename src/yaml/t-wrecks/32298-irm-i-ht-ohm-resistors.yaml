group: t-wrecks
name: irm-i-ht-ohm-resistors
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Ohm Resistors BAT by HunD88
  description: |-
    Might as well make a second upload today to get this series done finally...

    The 38th upload in this series, **Ohm Resistors** by **HunD88**, is certainly not its highlight. It's one of HunD88's earlier BATs, and while it still looks OK to me, I must admit it's not my favourite building. More importantly, however, this might have been the first lot that I made for the I-HT category, and in any case you can certainly tell it's not my best!
    Anyway, the building certainly has character with the 3D sign and its "shoebox tilted to the side" shape. The lots look kinda "meh" to me in hindsight, but I guess they'll do. The bigger one has some footpaths and greenery towards the front and side and parking to the back, whereas the smaller one is of the simple "island in a sea of concrete" type.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **44 I-HT jobs**, the quadrupler version **176 I-HT jobs**.

    The following lots are included in this download:

    - 3x4, Stage 2
    - 5x3, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots grow at Stage 4 (3x4) and Stage 3 (5x3).

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for this BAT go to **HunD88**!

    T Wrecks, June 9, 2018
  conflicts: "Contains the IRM lots for `pkg=hund88:ohm-resistors`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32298-irm-i-ht-ohm-resistors-by-hund88/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_06/IRM_I-HT_H88_OhmResistors_01.jpg.4fff8b36989212a4d0e86ccc808f05e8.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_06/IRM_I-HT_H88_OhmResistors_02.jpg.b0b81f3c1dbc8757788eccd0f676890f.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_06/IRM_I-HT_H88_OhmResistors_03.jpg.faee853569a596255b73aadf5f384c59.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_06/IRM_I-HT_H88_OhmResistors_04.jpg.745e7f23d25c950991c074fe48d23d22.jpg

dependencies:
  - memo:industrial-revolution-mod
  - hund88:ohm-resistors-model

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-ohm-resistors
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-ohm-resistors
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Ohm Resistors \\(HunD88\\)/"

