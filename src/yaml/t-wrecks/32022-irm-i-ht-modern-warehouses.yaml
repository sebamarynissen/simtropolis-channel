group: t-wrecks
name: irm-i-ht-modern-warehouses
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Modern Warehouses BAT by SimGoober
  description: |-
    This is going to be the last SimGoober relot for a while, but I hope you'll bear with me one more time before we move on to other authors.

    The 13th upload in this series, **Modern Warehouses** by **SimGoober**, is a four-in-one download: SimGoober made four variants of this building that differ slightly in appearance, but share the same footprint, function, and stats. The lots are rather simplistic, the only exception being the slightly curved driveways on the bigger version. The compact version will require some filler lots - or a road/street access - in the back to give the trucks enough room to manoeuvre if you are obsessed enough with realism. While the bigger lot is more enclosed and looks pretty much like a standalone facility, the smaller one will tie into any surrounding high-tech industry and is easy to complement with fillers.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **55 I-HT jobs**, the quadrupler version **220 I-HT jobs**.

    The following lots are included in this download:

    - 5x4, Stage 3
    - 5x5, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 410 jobs, and the lots grow at Stage 4 (5x4) and Stage 3 (5x5).

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **SimGoober** once again.

    T Wrecks, November 28, 2017
  conflicts: "Contains the IRM lots for `pkg=simgoober:hi-tech-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32022-irm-i-ht-modern-warehouses-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_ModernWarehouses_01.jpg.0c2f432c628e96ae34700690ee97b3cb.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_ModernWarehouses_02.jpg.66ba222e2298c243a5cb89cdc95c8117.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_ModernWarehouses_03.jpg.379859f64a50cff2c4a7a056b9484c08.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-iht

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-modern-warehouses
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-modern-warehouses
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Modern Warehouses \\(SimGoober\\)/"

---
