info:
  summary: 2 W2W I-M lots using the Ritter's Rubber Shoe Factory BAT by jestarr
  description: |-
    This is the 20th and final upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. This upload, **Ritter's Rubber Shoe Factory** by **jestarr**, is a larger-than-usual lot because the building is so long.

    The lots will provide **356 I-M jobs**. Here's the lot breakdown:

    - 3x8 left corner, stage 2
    - 3x8 right corner, stage 2

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 623 jobs and grow at Stage 5.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again credits for the BAT go to **jestarr**! This concludes my second IRM expansion pack. A third and final pack is well on its way and should be arriving at a STEX near you throughout 2016. Take care!

    T Wrecks, December 24, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30879-irm-w2w-ritters-rubber-shoe-factory-by-jestarr/
