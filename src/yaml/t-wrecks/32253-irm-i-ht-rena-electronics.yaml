group: t-wrecks
name: irm-i-ht-rena-electronics
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Rena Electronics BAT by Tag_One
  description: |-
    Since I currently have some time on my hand (gasp), let's keep the uploads coming!

    The 32nd upload in this series, **Rena Electronics** by **Tag_One**, is a very interesting BAT. Its basic box shape is accentuated by a few characteristic features such as the imposing, angled glass front, the wide skylights and the angled loading bays, which I tried to echo in the lot design using some angled textures and jestarr's wonderful 22.5° trucks. Not much else to say this time - I hope you like the result!

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **50 I-HT jobs**, the quadrupler version **200 I-HT jobs**.

    The following lots are included in this download:

    - 4x5, Stage 2
    - 5x4, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots grow at Stage 3.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **Tag_One** once again.

    T Wrecks, May 10, 2018
  conflicts: "Contains the IRM lots for `pkg=tag-one:rena-electronics`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32253-irm-i-ht-rena-electronics-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_T1_RenaElectronics_01.jpg.a7b3c7cb433fd4359a45e7d277cbae66.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_T1_RenaElectronics_02.jpg.79d1a521cd10f15d9575702641ef5098.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_T1_RenaElectronics_03.jpg.eaec4c7a81f3697bc64f3ea10b150d28.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_T1_RenaElectronics_04.jpg.6a67c3a2326ed259c2935f249430588f.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:mega-props-t1-vol04

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-rena-electronics
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-rena-electronics
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Rena Electronics \\(Tag_One\\)/"

---
