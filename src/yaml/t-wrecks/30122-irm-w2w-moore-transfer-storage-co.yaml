group: t-wrecks
name: irm-w2w-moore-transfer-storage-co
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-D lots using the Moore Transfer & Storage Co BAT by jestarr
  description: |-
    The fifth upload in a series of IRM W2W lots based on BAT models made by other artists is **Moore Transfer & Storage Co**, another BAT made by **jestarr**.

    The building will provide **200 I-D jobs**. The following lots are included:

    - 3x4 straight (2 versions), Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide only 45 jobs and grow at Stage 1.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again, credits to **jestarr** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, February 3, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30122-irm-w2w-moore-transfer-storage-co-by-jestarr/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/d8924c2175c677df560b857fbd66a547-irm_w2w_mooretransfer-amp-storageco_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/4c215577e021c938318fabefbc5247d7-irm_w2w_mooretransfer-amp-storageco_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/2a1bf800c7ac50e8da83b15064124667-irm_w2w_mooretransfer-amp-storageco_03.jpg

dependencies:
