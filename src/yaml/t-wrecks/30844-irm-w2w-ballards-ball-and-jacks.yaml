info:
  summary: 4 W2W I-M lots using the Ballards Ball and Jacks Factory BAT by jestarr
  description: |-
    This is the 14th upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. Since I found the building suitable to use in two instances as well as on its own, I present to you **Ballards Ball and Jacks Factory**, an old BAT by **jestarr**, in two different versions, one with a single building and one with two buildings right next to another.

    The original version of the building will provide **128 I-M jobs**, the double version **256 I-M jobs** (surprise!). Here's the lot breakdown:

    - 1x5 straight, Stage 1 (2 versions) (normal version)
    - 2x5 left corner, Stage 1 (double version)
    - 2x5 right corner, Stage 1 (double version)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. Both versions provide 160 jobs; the 1x5 lots grow at Stage 5 and the 2x5 corner lots at Stage 4.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    It's not the first time I'm writing this, and it won't be the last: credits to **jestarr** for this BAT!

    T Wrecks, November 16, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30844-irm-w2w-ballards-ball-and-jacks/
