group: t-wrecks
name: irm-i-ht-ledpro-leds
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Ledpro LEDs BAT by Tag_One
  description: |-
    If I let [@Aarsgevogelte](https://community.simtropolis.com/profile/732380-aarsgevogelte/) do all the uploads, you're going to risk dying from all the awesomeness - time to interrupt his series with something far less spectacular:

    The 26th upload in this series, **Ledpro LEDs** by **Tag_One**, basically looks like a simple warehouse with a little office section - nothing to see here. The lots, too, are pretty toned down, with the one that has the building oriented perpendicular to the road being open to all sides and perfectly suitable for getting surrounded with ploppable fillers or other industry. A small propane tank in the back is the only special feature. The other lot is slightly more complex with the angled entrance and the fences; it features a paved area in front and a strip of green with some trees in the back, forming a border to the adjacent development.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **44 I-HT jobs**, the quadrupler version **176 I-HT jobs**.

    The following lots are included in this download:

    - 3x5, Stage 1
    - 5x3, Stage 1

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots grow at Stage 3.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **Tag_One** once again.

    T Wrecks, February 19, 2018
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32138-irm-i-ht-ledpro-leds-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/IRM_I-HT_T1_LedproLeds_01.jpg.ef3f9bfc1ec5199cb51737640d61a097.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/IRM_I-HT_T1_LedproLeds_02.jpg.82914e43075cf57e72dc78e68b7b991a.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/IRM_I-HT_T1_LedproLeds_03.jpg.374ca36276a77f424e08b8452172aa49.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/IRM_I-HT_T1_LedproLeds_04.jpg.c37d2e71630e87775621fc1c278b976b.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:mega-props-t1-vol03

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-ledpro-leds
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-ledpro-leds
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT LedPro LEDs \\(Tag_One\\)/"

