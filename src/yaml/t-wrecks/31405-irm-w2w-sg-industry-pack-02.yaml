info:
  summary: 10 W2W I-M lots using the SG Industry Pack 02 BATs by Simgoober
  description: |-
    This is the fifth upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. This time it's an entire BAT package rather than a single building - **SG Industry Pack 02** by **Simgoober**.

    The job breakdown for the buildings included in this package is as follows:

    - Eagle Electrical: 80 I-M jobs
    - Franklin Furs: 108 I-M jobs
    - Goober's Go Go Golfcarts: 80 I-M jobs
    - Hamilton Hose: 92 I-M jobs

    Since these BATs are pretty small, they probably look best in low-rise W2W environments. A variety of lots is included, here's the list:

    **Eagle Electrical:**

    - 2x2 left corner, Stage 1
    - 2x2 right corner, Stage 1

    **Franklin Furs:**

    - 3x2 left corner, Stage 1
    - 3x2 right corner, Stage 1

    **Goober's Go Go Golfcarts:**

    - 3x3 left corner, Stage 1
    - 3x3 right corner, Stage 1
    - 3x3 straight, Stage 1 (2 versions)

    **Hamilton Hose:**

    - 2x2 left corner, Stage 1
    - 2x2 right corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 24 jobs (Eagle Electrical), 74 jobs (Franklin Furs), 27 jobs (Goober's Go Go Golfcarts) and 34 jobs (Hamilton Hose). The Franklin Furs lots grow at Stage 3, the Hamilton Hose lots at Stage 2 and all other lots at Stage 1.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **Simgoober** for this BAT package!

    T Wrecks, December 18, 2016
  author: T Wrecks, nos.17
