group: t-wrecks
name: irm-i-ht-pcb-assembly
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the PCB Assembly BAT by Tag_One
  description: |-
    Next day, next upload - and this time it's a big one, too.

    The 28th upload in this series, **PCB Assembly** by **Tag_One**, is a large warehouse and offices complex that houses one of those businesses where those smart PCB layouts are actually built and shipped to the customers. While the wider lot has some more grass areas around the building and employee parking spaces scattered all around, the narrower lot features one employee parking lot at the side and a nice little open-air break area complete with some soft drink vending machines, chairs and tables, and a fence all around so there's some degree of protection from incompetent truck or forklift drivers.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **123 I-HT jobs**, the quadrupler version **492 I-HT jobs**.

    The following lots are included in this download:

    - 5x6, Stage 3
    - 6x6, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots grow at Stage 5.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **Tag_One** once again.

    T Wrecks, March 5, 2018
  conflicts: "Contains the IRM lots for `pkg=tag-one:pcb-assembly`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32170-irm-i-ht-pcb-assembly-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_03/IRM_I-HT_T1_PCB_Assembly_01.jpg.3cae34dc5e32b7851c347009951c7c42.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_03/IRM_I-HT_T1_PCB_Assembly_02.jpg.127a439af315b12adae9d2db171e96d0.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_03/IRM_I-HT_T1_PCB_Assembly_03.jpg.52fa56bae1bcc8d6ca22a7591658c00c.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_03/IRM_I-HT_T1_PCB_Assembly_04.jpg.a0310d91354b5ac670aebfef35cb1ee7.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:mega-props-t1-vol04

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-pcb-assembly
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-pcb-assembly
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT PCB Assembly \\(Tag_One\\)/"

---
