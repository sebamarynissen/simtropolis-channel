group: t-wrecks
name: irm-lot-blockers
version: "1.0.0"
subfolder: 900-overrides
info:
  summary: Blockers to switch between regular IRM and IRM W2W anchor lots
  description: |-
    The Industrial Revolution Mod (IRM) has regular anchor lots and wall-to-wall (W2W) anchor lots. These blockers prevent one of the two kinds from growing, so you can choose which one you want to use. Choose the mode with the variant of this package. Lots that have already grown stay in your city and remain functional.

    - `mixed`: no blockers are installed, both regular and W2W anchor lots can grow.
    - `regular-only`: blocks the lots of `pkg=t-wrecks:irm-w2w-base-pack` and of the IRM W2W Expansion, so only regular anchor lots can grow.
    - `w2w-only`: blocks the regular lots of `pkg=memo:industrial-revolution-mod` and of the IRM Expansion, so only W2W anchor lots can grow. The blocker for the regular lots of the base pack uses the new lot IDs of `pkg=memo:industrial-revolution-mod`, as the original blocker only works with the original lot IDs.
  author: T Wrecks
  website: https://community.simtropolis.com/files/file/30106-irm-w2w-expansion-blocker/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_03_2015/8274e0dd9e68a2e933c7e591ff7d96f4-irm-w2w-expansion-blocker.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_06/IRM_Expansion_Blocker.jpg.c4a154e540bce79b54d03c65d820fd45.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2026_10/IRM_Expansion_Blocker.jpg.2d077bf61fe7b241d9773ffd5bd85945.jpg
variantInfo:
  - variantId: t-wrecks:irm-lot-blockers:mode
    description: Choose which kind of IRM anchor lots are blocked from growing.
    values:
      - value: mixed
        description: No blockers, regular and W2W anchor lots can grow
        default: true
      - value: regular-only
        description: Block W2W anchor lots, only regular anchor lots can grow
      - value: w2w-only
        description: Block regular anchor lots of the IRM base pack and Expansion, only W2W anchor lots can grow

variants:
  - variant: { t-wrecks:irm-lot-blockers:mode: "mixed" }
  - variant: { t-wrecks:irm-lot-blockers:mode: "regular-only" }
    assets:
      - assetId: t-wrecks-irm-w2w-base-pack
        include:
          - "/IRM W2W Base Pack Blocker \\(add to disable W2W\\)\\.dat$"
      - assetId: t-wrecks-irm-w2w-expansion-blocker
        include:
          - "\\.dat$"
  - variant: { t-wrecks:irm-lot-blockers:mode: "w2w-only" }
    assets:
      - assetId: t-wrecks-irm-w2w-base-pack
        include:
          - "/IRM Maxis Lot Blocker \\(add to disable non-W2W\\)\\.dat$"
      - assetId: tiepinl-irm-maxis-lot-blocker-new-ids
        include:
          - "\\.dat$"
      - assetId: t-wrecks-irm-expansion-blocker
        include:
          - "\\.dat$"

