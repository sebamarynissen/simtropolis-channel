group: t-wrecks
name: irm-i-ht-rorschach-research-development
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Rorschach Research & Development BAT by jestarr
  description: |-
    Time to continue with the IRM! After several SimGoober uploads, it's time for a few buildings made by another very productive industrial BATter, jestarr.

    The 14th upload in this series, **Rorschach Research & Development** by **jestarr**, is a pretty generic and nondescript building that could house pretty much anything that doesn't require huge machinery and towering smokestacks. In this case, it houses the laboratories and offices of a R&D company. The two lots included are extremely simple and straightforward, with at least one side open towards the surroundings. Being so generic, it should fit into bigger compounds, therefore I opted against a secluded lot.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **40 I-HT jobs**, the quadrupler version **160 I-HT jobs**.

    The following lots are included in this download:

    - 3x4, Stage 2
    - 4x3, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 208 jobs, and the lots grow at Stage 3.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **jestarr**.

    T Wrecks, December 12, 2017
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32033-irm-i-ht-rorschach-research-development-by-jestarr/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_RorschachRD_01.jpg.488bb80e9913e761b329c70191650491.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_RorschachRD_02.jpg.d66e074d1ed5f5a2983d128e4023d75a.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_RorschachRD_03.jpg.dd97feca2d6102b9add131ce9523cc8f.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_RorschachRD_04.jpg.935bc491604f28940560a57ac13814b0.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:mega-props-jes-vol06

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-rorschach-research-development
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-rorschach-research-development
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Rorschach R&D \\(jestarr\\)/"

