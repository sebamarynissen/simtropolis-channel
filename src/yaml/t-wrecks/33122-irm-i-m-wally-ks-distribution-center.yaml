subfolder: 400-industrial
info:
  summary: 2 I-M lots using the Wally K's Distribution Center BAT by SimGoober
  description: |-
    Okay, so here's the second of the "twin" buildings made by Simgoober.

    The sixth upload in this series, **Wally K's Distribution Center** by **SimGoober**, is pretty much the same building as the previously uploaded TSC Distribution Center (`pkg=t-wrecks:irm-i-m-tsc-distribution-center`), just in a different colour and, logically, with the Wally K's logo attached to it. Therefore I simply recycled the lots, too. Given the large footprint of these structures, I guess they shouldn't grow all too often anyway.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **68 I-M jobs**, the quadrupler version **272 I-M jobs**.

    The following lots are included in this download:

    - 6x7, Stage 2
    - 8x6, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 627 jobs, and the lots grow at Stage 3.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for this BAT go to **SimGoober**.

    T Wrecks, August 29, 2019
  conflicts: "Contains the IRM lots for `pkg=simgoober:manufacturing-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/33122-irm-i-m-wally-ks-distribution-center-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_01.jpg.b8a1d054768eb2e3e148a7cb5f24bab4.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_02.jpg.c1cefe48775e776db1c19b9d2ab84495.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_03.jpg.ab811cf5a28c4768f03b3feb92c19e33.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_04.jpg.4d0ffcbd56f861a790b0b7c9cae9882b.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_05.jpg.cab7556839f8690bcf3a0ec35e6a619e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_WallyKs_DistributionCenter_06.jpg.3110b516ae6e44ecfe73bf7e5a45e8e1.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-im1

