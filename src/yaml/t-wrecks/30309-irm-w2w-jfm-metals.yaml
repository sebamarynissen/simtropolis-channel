group: t-wrecks
name: irm-w2w-jfm-metals
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-D lots using the JFM Metals BAT by JMyers2043
  description: |-
    The 13th upload in a series of IRM W2W lots based on BAT models made by other artists is **JFM Metals** by **JMyers2043**. This is pretty much a variation of the previously uploaded building, Gadgetron Manufactory (`pkg=t-wrecks:irm-w2w-gadegtron-manufactory`).

    The building will provide **160 I-D jobs** and comes on two simple lots, both straight lots with an alley either to the left or to the right:

    - 2x3 straight, Stage 1 (2 versions)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide only 36 jobs and grow at Stage 2.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Thanks and credits to **JMyers2043** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, March 24, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30309-irm-w2w-jfm-metals-by-jmyers2043/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_03_2015/74eeaabdae75761ebf334fd9b5d4a6eb-irm_w2w_jfmmetals_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_03_2015/b18d8cb7b13a2dbdc1513ee931ea1943-irm_w2w_jfmmetals_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_03_2015/ba2d71fb7320e9d3a9b542ab7b6d2231-irm_w2w_jfmmetals_03.jpg

