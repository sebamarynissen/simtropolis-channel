group: t-wrecks
name: irm-i-ht-thermo-fisher-scientific
version: "1.0"
subfolder: 400-industrial
info:
  summary: 1 I-HT lot using the Thermo Fisher Scientific BAT by SimFox
  description: |-
    New year, new uploads - let's get some more IRM on the way for 2018!

    The 18th upload in this series, **Thermo Fisher Scientific** by **SimFox**, actually felt a bit cheap to release. Why? Well, because the entire building fills the lot, and it wouldn't make much sense to put it on a bigger lot and design stuff around it - not least because you can do so yourself, be it with growable buildings or any kind of fillers, maybe the dedicated IRM ones. The building even looks good when surrounded by streets on all sides, so I reckoned I'd best leave it as is, and merely tweaked its stats and made sure it would grow according to the IRM logic.

    Once again, this is a 3dsmax building that can be downloaded in both DarkNite and Maxis night, but due to technical reasons will not be compatible with the gradual day/night cycle. Instead, it will switch from the day model to the night model - and back - instantaneously, as practically all 3dsmax BATs do.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **150 I-HT jobs**, the quadrupler version **600 I-HT jobs**.

    The following lots are included in this download:

    - 7x4, Stage 3

    With CAM, the CAM edition of the lot by nos.17 is installed instead. It has no quadrupler version, provides 1572 jobs, and grows at Stage 6.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **NO**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **SimFox**, whom I'd sure like to see again, too.

    T Wrecks, January 6, 2018
  conflicts: "Contains the IRM lots for `pkg=simfox:thermofisher-scientific`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32058-irm-i-ht-thermo-fisher-scientific-by-simfox/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_SimFox_ThermoFisher_01.jpg.38541f67b9980f7cf4f68aa86bcc677d.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_SimFox_ThermoFisher_02.jpg.2c6394ec27b2723d2e0ab7f74fe8ed3e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_SimFox_ThermoFisher_03.jpg.042db20d6397831eb4ba5848e6e20cad.jpg

dependencies:
  - memo:industrial-revolution-mod
  - simfox:thermofisher-scientific-model

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-thermo-fisher-scientific
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-thermo-fisher-scientific
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Thermo Fisher \\(SimFox\\)/"

---
