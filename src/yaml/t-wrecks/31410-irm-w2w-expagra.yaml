group: t-wrecks
name: irm-w2w-expagra
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-D lots using the Expagra BAT by Tag_One
  description: |-
    This is the sixth upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. We go back to dirty industry with this one, **Expagra** by **Tag_One**.

    The building will provide **340 I-D jobs**. Due to its height, it looks good in conjunction with small 1x2 rowhouses, but also with slightly taller buildings, as depicted in the example screenshots. Here's the lot breakdown:

    - 3x6 right corner, Stage 1
    - 6x3 left corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed, and these lots grow at Stage 4.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to one of the greatest industrial BATters we've ever had, **Tag_One**, and Merry Christmas, everyone!

    T Wrecks, December 25, 2016
  conflicts: "Contains the IRM lots for `pkg=tag-one:expagra`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31410-irm-w2w-expagra-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/IRM_W2W_Expagra_01.jpg.f9da4fb7e73d5a0ad4f422bf9bec3026.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/IRM_W2W_Expagra_02.jpg.80816845e76890f00e57c4cbca3dca0c.jpg

dependencies:
  - memo:industrial-revolution-mod
  - t-wrecks:irm-w2w-base-pack
  - bsc:mega-props-t1-vol04

variants:
  - variant: { CAM: "no" }
    assets:
      - assetId: t-wrecks-irm-w2w-expagra
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM W2W Expansion/Expagra \\(T1\\)/"

