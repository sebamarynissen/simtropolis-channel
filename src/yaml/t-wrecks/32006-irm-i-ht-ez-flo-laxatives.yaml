group: t-wrecks
name: irm-i-ht-ez-flo-laxatives
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the EZ Flo Laxatives BAT by SimGoober
  description: |-
    The last few buildings have been pharmaceutical factories that produce drugs to get rid of intangible things such as pain (Alka Seltzer) or any care you may otherwise be tempted to give even though you'd rather not (Fukitol). What about getting rid of something physical, though?

    Enter the eleventh upload in this series, **EZ Flo Laxatives** by **SimGoober**. I'm not sure if it's the famous Intergalactic Laxative that **Donovan** sung about in 1973 and if EZFlo will, in fact, take you from here to SimMars.
    What I do know is that the building struck me as rather interesting due to the hangar shape of the main structure and the partly separate loading facility. I chose to accompany it by two lots, one being pretty much a sea of concrete and the other a more closed design with more greenery.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **76 I-HT jobs**, the quadrupler version **304 I-HT jobs**.

    The following lots are included in this download:

    - 4x6, Stage 3
    - 5x5, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 375 jobs, and the lots also grow at Stage 3.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **SimGoober** once again.

    T Wrecks, November 10, 2017
  conflicts: "Contains the IRM lots for `pkg=simgoober:manufacturing-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32006-irm-i-ht-ez-flo-laxatives-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_EZFlo_01.jpg.2d0501676c671853b86c48c923213651.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_EZFlo_02.jpg.69ab4c8937dccd85c8752534759c914f.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-im1

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-ez-flo-laxatives
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-ez-flo-laxatives
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT EZ Flo Laxatives \\(SimGoober\\)/"

---
