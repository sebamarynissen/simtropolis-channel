info:
  summary: 2 W2W I-M lots using the Belkin's Bobbin Factory BAT by jestarr
  description: |-
    This is the 15th upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. It's the second one that I found to be suitable for a double version, **Belkin's Bobbin Factory**, another oldie by **jestarr**. Just like the previous upload, this one comes in two different versions, one with a single building and one with two buildings right next to another.

    The original version of the building will provide **128 I-M jobs**, the double version **256 I-M jobs** (surprise!). Both versions can be used to form an end cap to W2W blocks with a depth of 4 tiles, i.e. two rows of 1x2 residential buildings standing back to back. Here's the lot breakdown:

    - 1x4 left & right cap, Stage 1 (normal version)
    - 2x4 left & right cap, Stage 1 (double version)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 260 jobs (normal version) and 519 jobs (double version), and grow at Stage 7.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    It's not the first time I'm writing this, and it won't be the last: credits to **jestarr** for this BAT!

    T Wrecks, November 23, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30850-irm-w2w-belkins-bobbin-factory-by-jestarr/
