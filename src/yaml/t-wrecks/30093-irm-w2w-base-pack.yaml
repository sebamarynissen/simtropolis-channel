      - assetId: t-wrecks-irm-w2w-base-pack
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM W2W Base Pack \\(Maxis & IRM Props\\)/"
        exclude:
          - "/z_IRM Lot Blockers/"

