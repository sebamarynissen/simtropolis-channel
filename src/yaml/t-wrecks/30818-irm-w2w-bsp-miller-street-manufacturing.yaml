group: t-wrecks
name: irm-w2w-bsp-miller-street-manufacturing
version: "1.0"
subfolder: 400-industrial
info:
  summary: 1 W2W I-M lot using the BSP Miller Street Manufacturing BAT by SimHoTToDDy
  description: |-
    This is the eleventh upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. There's still more BSP stuff left, this time: **BSP Miller Street Manufacturing** by **SimHoTToDDy**.

    The building will provide **252 I-M jobs**. Since it is basically a snug fit towards all sides, I decided to leave it on a very simple, tight-wrapping lot so you can use filler lots or let mech/anchor lots develop behind the building. You can also integrate it into tight W2W areas with house rows situated back to back. The one included lot is as follows:

    - 2x4 straight, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lot by nos.17 is installed instead. This lot provides 433 jobs and grows at Stage 7.

    If you want to block the lot from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **SimHoTToDDy** once again!

    T Wrecks, October 14, 2015
  conflicts: "Contains the IRM lots for `pkg=simhottoddy:bsp-miller-street-manufacturing`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30818-irm-w2w-bsp-miller-street-manufacturing-by-simhottoddy/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2015_10/IRM_W2W_BSP_MillerStreetMfg_01.jpg.ba980bc65c1d94e7432ae9542adecb2e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2015_10/IRM_W2W_BSP_MillerStreetMfg_02.jpg.6678c3b62e2fd688a99a567dbdf13dd2.jpg

dependencies:
  - memo:industrial-revolution-mod
  - t-wrecks:irm-w2w-base-pack
  - simhottoddy:bsp-miller-street-manufacturing-model

