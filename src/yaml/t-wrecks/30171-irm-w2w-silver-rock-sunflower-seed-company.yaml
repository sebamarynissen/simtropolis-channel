info:
  summary: 4 W2W I-D lots using the Silver Rock Sunflower Seed Company BAT by jestarr
  description: |-
    The ninth upload in a series of IRM W2W lots based on BAT models made by other artists is **Silver Rock Sunflower Seed Company**, another BAT made by **jestarr**.

    The building will provide **260 I-D jobs** and, once more, comes on four lots. The two straight lots are really simple; they feature the building with a small loading area in the back and with an alley either to the left or to the right. The other two lots can be used as end pieces for two rows of W2W houses built directly back to back. Here's the lineup:

    - 5x3 straight, Stage 1 (2 versions)
    - 4x4 left cap, Stage 1 (left-hand end piece for 4 tiles deep W2W blocks)
    - 4x4 right cap, Stage 1 (right-hand end piece for 4 tiles deep W2W blocks)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 136 jobs; the 5x3 lots grow at Stage 3 and the 4x4 caps at Stage 2.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again, credits to **jestarr** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, March 2, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30171-irm-w2w-silver-rock-sunflower-seed-company-by-jestarr/
