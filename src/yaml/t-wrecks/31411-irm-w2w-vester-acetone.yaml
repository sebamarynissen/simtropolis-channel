version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-D lots using the Vester Acetone BAT by Tag_One
  description: |-
    This is the seventh upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. This is another dirty industry BAT, **Vester Acetone** by **Tag_One**.

    The building will provide **260 I-D jobs**. It's one of the rather rare cases where a dirty industry building looks rather modern. Even though the building is pretty tall in some places, its W2W part is not. This is why it still probably looks best in conjunction with low-rise rowhouses. Here's the lot breakdown:

    - 4x3 straight, Stage 1
    - 4x4 right corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed, and these lots grow at Stage 4.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **Tag_One** for another great industrial BAT!

    T Wrecks, December 29, 2016
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31411-irm-w2w-vester-acetone-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/IRM_W2W_VesterAcetone_01.jpg.745b835b260b47370c3f61dea06bc5ab.jpg
