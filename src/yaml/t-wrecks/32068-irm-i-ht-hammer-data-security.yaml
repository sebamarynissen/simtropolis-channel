group: t-wrecks
name: irm-i-ht-hammer-data-security
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Hammer Data Security BAT by Jasoncw
  description: |-
    Before I move on to the next longer series, I'd like to release some more relatively modern BATs.

    The 19th upload in this series, **Hammer Data Security** by **Jasoncw**, is another somewhat cheap relot where I didn't have to do much because the building already fills the lot pretty much. I only made an additional lot featuring some access roads right and left as well as narrow tile sidewalks that complement the building's shape rather well if I may say so myself. The rest was the usual bit of shoving some hex figures around, editing files and the rest of the bore and snore fest that modding often is.

    Once again, this is a 3dsmax building that can be downloaded in both DarkNite and Maxis night, but due to technical reasons will not be compatible with the gradual day/night cycle. Instead, it will switch from the day model to the night model - and back - instantaneously, as practically all 3dsmax BATs do.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **116 I-HT jobs**, the quadrupler version **464 I-HT jobs**.

    The following lots are included in this download:

    - 4x6, Stage 3
    - 5x6, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 838 jobs, and the 4x6 lot grows at Stage 5 while the 5x6 lot grows at Stage 4.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **NO**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **Jasoncw**.

    T Wrecks, January 13, 2018 (yeah, I only got around to uploading it today)
  conflicts: "Contains the IRM lots for `pkg=jasoncw:hammer-data-security`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32068-irm-i-ht-hammer-data-security-by-jasoncw/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_JCW_HammerDataSecurity_01.jpg.1d4fb6fa97ab6e56a83d702062a5c01b.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_JCW_HammerDataSecurity_02.jpg.36fe602cbf3c8331e8bf45a4ccf99779.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_JCW_HammerDataSecurity_03.jpg.b7e296f27d99924f7b7c96269348cf1c.jpg

dependencies:
  - memo:industrial-revolution-mod
  - jasoncw:hammer-data-security-model

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-hammer-data-security
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-hammer-data-security
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Hammer Data Security \\(Jasoncw\\)/"

---
