group: t-wrecks
name: irm-w2w-auto-factory
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-D lots using the Auto Factory BAT by SimGoober
  description: |-
    The 19th upload in a series of IRM W2W lots based on BAT models made by other artists is this good old **Auto Factory** made by the one and only, virtually omnipresent **SimGoober**.

    The building will provide **340 I-D jobs** and comes with 2 similarly styled lots, one being a bit deeper than the other:

    - 6x3 straight, Stage 1
    - 6x4 straight, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 195 jobs. The 6x4 lot grows at Stage 2 and the 6x3 lot at Stage 3.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Thanks and credits to **SimGoober** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, April 14, 2015
  conflicts: "Contains the IRM lots for `pkg=simgoober:manufacturing-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30448-irm-w2w-auto-factory-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_04_2015/4658caddfaaf47a9ab84cf77076636b0-irm_w2w_autofactory_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_04_2015/90ff9459f7bda721f387311c385fcd96-irm_w2w_autofactory_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_04_2015/f4ad17a791d8558ced236c61ea58a75e-irm_w2w_autofactory_03.jpg

dependencies:
  - memo:industrial-revolution-mod
  - t-wrecks:irm-w2w-base-pack
  - bsc:sg-models-im2

variants:
  - variant: { CAM: "no" }
    assets:
      - assetId: t-wrecks-irm-w2w-auto-factory
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM W2W Expansion/Auto Factory \\(SG\\)/"

---
