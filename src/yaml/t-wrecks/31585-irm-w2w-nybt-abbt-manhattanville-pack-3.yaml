version: "1.0"
subfolder: 400-industrial
info:
  summary: 11 W2W I-M lots using 8 Manhattanville Project buildings by NYBT ABBT
  description: |-
    After another hiatus, I finally gave myself a push and got around to uploading this one. It marks the 14th upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. Once again, I didn't have too much work with this one because the high-quality 3dsmax BATs in this pack, **Manhattanville Pack 3** by **NYBT / ABBT** were designed to be W2W in the first place. I merely tweaked a few stats, assigned the zones, added a few lot options, and a prop here and there.

    The buildings will provide **36 to 140 I-M jobs** for your Sims (for details, see lot breakdown below). Most of them will look best among low-rise development; 641 West 130th Street can even be used to "cross" a 4-tiles deep W2W block because it is long enough to face both the street in front and the one in the back.

    As the screenshot shows, there is not much lot design to speak of; the buildings mostly sit snugly on the lot with blank walls to all sides not facing a street/road.

    As usual, here's the list of lots included:

    **603 West 130th Street (108 I-M jobs):**

    - 2x2 straight, Stage 1

    **641 West 130th Street (140 I-M jobs):**

    - 2x4 straight, Stage 1 (2 versions)

    **524 West 131st Street (112 I-M jobs):**

    - 2x2 straight, Stage 1

    **624 West 131st Street (100 I-M jobs):**

    - 2x2 straight, Stage 1

    **630 West 131st Street (72 I-M jobs):**

    - 1x2 straight, Stage 1

    **3247 Broadway (136 I-M jobs):**

    - 2x2 left corner, Stage 1
    - 2x2 right corner, Stage 1

    **3251 Broadway (128 I-M jobs):**

    - 3x2 left corner, Stage 1
    - 2x3 right cap, Stage 1

    **Pedro y Jose (36 I-M jobs):**

    - 1x2 straight, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide only 12 to 303 jobs per building and grow at higher stages: 3247 Broadway at Stage 8, 524 West 131st Street at Stage 7, 3251 Broadway at Stage 6, 603 West 130th Street at Stage 5, 641 West 130th Street at Stage 4, 624 West 131st Street at Stage 3, 630 West 131st Street at Stage 2, and Pedro y Jose at Stage 1.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to the **NYBT ABBT guys** for these BATs!

    T Wrecks, April 23, 2017
  conflicts: "Contains the IRM lots for `pkg=abbt:manhattanville-project-3rd-pack`. Installing both results in duplicate lots of the same buildings, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31585-irm-w2w-nybt-abbt-manhattanville-pack-3/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/IRM_W2W_NYBT_ABBT_3.jpg.f4930f81d41230bf0e2630f91f7dbaf9.jpg

