info:
  summary: 2 I-M lots using the Pepsi Bottling Plant BAT by SimGoober
  description: |-
    I thought I'd pick something a bit different and go from relatively small buildings to this whopper.

    The third upload in this series is the big, bad **Pepsi Bottling Plant** by **SimGoober**. This really massive structure made me think it would be a good idea to move beyond the default maximum lot size of 6x6 because you could barely squeeze the building into such a lot, and there wouldn't be much room left for variation. Extending the lot by another 2 tiles in different directions enabled me to give the building some breathing room (which I feel it needs) and create two rather different lots. Lotting this one was massive fun because somehow the textures and the building outline went together really well, and I like the result if I may say so myself.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **85 I-M jobs**, the quadrupler version **340 I-M jobs**.

    The following lots are included in this download:

    - 6x8, Stage 3
    - 8x6, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 1,339 jobs, and the lots grow at Stage 5.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for this BAT go to the amazing **SimGoober**, who has BATted everything but the kitchen sink apparently - and I wouldn't even place a bet that he hasn't BATted that, too.

    T Wrecks, August 28, 2019
  conflicts: "Contains the IRM lots for `pkg=simgoober:manufacturing-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
