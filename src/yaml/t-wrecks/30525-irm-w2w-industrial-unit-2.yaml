version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-M lots using the Industrial Unit 2 BAT by rp2005
  description: |-
    This is the second upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. This building is **Industrial Unit 2**, another very very old creation by **rp2005** (later **rp2006**, finally **zero7**) that I still think should not be forgotten. However, it is worth mentioning that **the building's night lighting will not work with SimFox' DarkNite mod, only with Maxis night**.

    The building, too, will provide **80 I-M jobs** and comes in two slightly different variations, both with identical stats and mostly identical lots:

    - 2x2 right corner, Stage 1
    - 2x2 left corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide only 33 jobs and grow at Stage 2.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Well, the next boring filler, haha... Credits to **rp2005** for this BAT!

    T Wrecks, May 9, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30525-irm-w2w-industrial-unit-2-by-rp2005/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_05_2015/1cca279a6694dd652b03760d86eee0d6-irm_w2w_industrialunit2_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_05_2015/2b4c8fa7ecb025dc1d2567233b04dbfb-irm_w2w_industrialunit2_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_05_2015/18d521699fa0b88695c96de87e0fbaa2-irm_w2w_industrialunit2_03.jpg

