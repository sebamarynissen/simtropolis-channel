group: t-wrecks
name: irm-i-ht-cookie-research
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Cookie Research BAT by HunD88
  description: |-
    OK, it's time to dig up some really old BATs by an often overlooked BAT artist!

    The 36th upload in this series, **Cookie Research** by **HunD88**, was originally uploaded as a bakery 10 years ago. However, I thought it would look OK as a high-tech industry building, and then I remembered how the first high-tech building you used to get in SimCity3000 was often an inconspicuous little facility called something along the lines of "Cookie Research Institute" in my game's language. Therefore, I decided to pick up the theme and re-lot this one as a high-tech cookie research facility.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **35 I-HT jobs**, the quadrupler version **140 I-HT jobs**.

    The following lots are included in this download:

    - 3x4, Stage 1
    - 4x3, Stage 1

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots also grow at Stage 1.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for this BAT go to **HunD88**!

    T Wrecks, May 31, 2018
  conflicts: "Contains the IRM lots for `pkg=hund88:bakery`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32277-irm-i-ht-cookie-research-by-hund88/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_H88_CookieResearch_01.jpg.76681dfe6996e77ecb7b4788c41624c5.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_H88_CookieResearch_02.jpg.4140acadc3f83ed5f0cd039296bef5e5.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_H88_CookieResearch_03.jpg.aeac1687c50a3c536463323a4d785ddb.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_05/IRM_I-HT_H88_CookieResearch_04.jpg.e1ff763f73b5b5ecd02a49743c21b59b.jpg

dependencies:
  - memo:industrial-revolution-mod
  - hund88:bakery-model

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-cookie-research
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-cookie-research
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Cookie Research \\(HunD88\\)/"

