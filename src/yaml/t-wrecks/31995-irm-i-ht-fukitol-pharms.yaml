  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-fukitol-pharms
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-fukitol-pharms
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Fukitol Pharms \\(SimGoober\\)/"

