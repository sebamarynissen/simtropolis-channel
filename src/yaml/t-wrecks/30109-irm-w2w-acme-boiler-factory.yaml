group: t-wrecks
name: irm-w2w-acme-boiler-factory
version: "1.1"
subfolder: 400-industrial
info:
  summary: 9 W2W I-D lots using the Acme Boiler Factory BAT by jestarr
  description: |-
    As the first upload in a series of IRM W2W lots based on BAT models made by other artists, I present to you **Acme Boiler Factory**, a BAT made by **jestarr**.

    Unlike most other industrial lots, this one comes in three versions. Factory 1 consists of only the main building, Factory 2 of only the side building. Factory 3 has both buildings on one lot. The boiler factories will provide **400 I-D jobs (Factory 1)**, **180 I-D jobs (Factory 2)**, and **580 I-D jobs (Factory 3)**, respectively. You can choose to keep them all or pick whatever version you like best.

    The following lots are included:

    - 6x3 straight (Factory 1), Stage 2
    - 6x4 straight (Factory 1), Stage 2
    - 2x5 left cap* (Factory 2), Stage 1
    - 2x5 right cap* (Factory 2), Stage 1
    - 5x2 straight, version A (Factory 2), Stage 1
    - 5x2 straight, version B (Factory 2), Stage 1
    - 5x6 straight, version A (Factory 3), Stage 2
    - 5x6 straight, version B (Factory 3), Stage 2
    - 6x5 straight (Factory 3), Stage 2

    *can be used to "cap off" a block of W2W rowhouses front and back towards one side, see screenshots

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 185 jobs (Factory 1), 88 jobs (Factory 2) and 187 jobs (Factory 3). All lots grow at Stage 2, except the 6x3 lot of Factory 1, which grows at Stage 3.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to jestarr for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, January 24, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30109-irm-w2w-acme-boiler-factory-by-jestarr/
