group: t-wrecks
name: irm-i-m-rand-textile-mill
version: "1.0.0"
subfolder: 400-industrial
info:
  summary: 2 I-M lots using the Rand Textile Mill BAT by SimGoober
  description: |-
    Another day, another upload - let's stay with SimGoober for a while, shall we?

    The fourth upload in this series is **Rand Textile Mill** by **SimGoober**. The main body somehow reminds me a bit of socialist pre-fab apartment blocks. Maybe it's mainly the entrances. Anyway, after the very clean and sleek uploads we've had so far, this one is certainly more of a classic factory, smokestacks included. The square lot is somewhat divided into an inner factory yard and an outer parking area, the other lot mostly has an open concrete area out in the back and might be a good spot to plop down some industrial MMPs. Although the lots aren't that big, the building is rather tall and therefore provides relatively many jobs.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **78 I-M jobs**, the quadrupler version **312 I-M jobs**.

    The following lots are included in this download:

    - 5x5, Stage 3
    - 6x4, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 946 jobs, and the lots grow at Stage 6.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for this BAT go to **SimGoober** - again... and not for the last time, either!

    T Wrecks, August 29, 2019
  conflicts: "Contains the IRM lots for `pkg=simgoober:dirty-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/33120-irm-i-m-rand-textile-mill-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_RandTextileMill_01.jpg.933daf5ec36184eed06f06288cff8627.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_RandTextileMill_02.jpg.faee47a8a89c0d7b597fb60882ea5320.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_RandTextileMill_03.jpg.6b69ae3bd3ac57dfd796a8155d8eb024.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_08/IRM_I-M_SG_RandTextileMill_04.jpg.895a9940e4293ab64e0f17b2de579ab8.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-im1

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-m-rand-textile-mill
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-m-rand-textile-mill
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-M Rand Textile Mill \\(SG\\)/"

