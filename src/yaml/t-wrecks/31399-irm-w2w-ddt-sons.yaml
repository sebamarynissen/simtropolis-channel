group: t-wrecks
name: irm-w2w-ddt-sons
version: "1.0"
subfolder: 400-industrial
info:
  summary: 4 W2W I-M lots using the DDT & Sons BAT by Odd_from_Sweden
  description: |-
    This is the fourth upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. This time around I dug out a more obscure little BAT that may not be part of practically everybody's plugin suite yet - **DDT & Sons** by **Odd_from_Sweden**.

    The building will provide **76 I-M jobs**. The shape makes it ideal to fill small, 1-tile gaps in existing W2W development. As you can see in the screenshots, it exists in 3 different design variants that will appear randomly (I turned them into a building family). The following lots are included:

    - 1x2 straight, Stage 1 (2 lots)
    - 1x3 straight, Stage 1 (2 lots)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 32 or 33 jobs per building variant. The 1x3 lots grow at Stage 2 and the 1x2 lots at Stage 4.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits not only to **Odd_from_Sweden** for this BAT and the other ones you can find in the package (`pkg=glenni:oddbats-previously-unreleased-bats-from-the-user-odd-from-sweden-with-full-permission`), but also to **Glenni** for bringing them to the STEX with Odd's permission!

    T Wrecks, December 4, 2016
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31399-irm-w2w-ddt-sons-by-odd_from_sweden/
  images:
