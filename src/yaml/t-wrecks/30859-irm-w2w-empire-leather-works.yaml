info:
  summary: 10 W2W I-M lots using the Empire Leather Works BAT by jestarr
  description: |-
    This is the 18th upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. For this upload, I turned **Empire Leather Works** by **jestarr** into an entire family of no fewer than 10 lots - from a single compact W2W factory to large complexes with multiple buildings.

    The lots will provide **80 I-M jobs** (Empire Leather Works 1), **96 I-M jobs** (Empire Leather Works 2), **160 I-M jobs** (Empire Leather Works 3 and 4), **208 I-M jobs** (Empire Leather Works 5), respectively. Here's the lot breakdown:

    - 1x2 straight, stage 1 [Empire Leather Works 1]
    - 4x2 left corner, stage 1 [Empire Leather Works 2]
    - 4x2 right corner, stage 1 [Empire Leather Works 2]
    - 5x4 left corner, stage 1 [Empire Leather Works 3]
    - 5x4 right corner, stage 1 [Empire Leather Works 3]
    - 5x4 left corner, stage 1 [Empire Leather Works 4]
    - 5x4 right corner, stage 1 [Empire Leather Works 4]
    - 6x5 left corner, stage 1 [Empire Leather Works 5]
    - 6x5 right corner, stage 1 [Empire Leather Works 5]
    - 6x6 straight, stage 1 [Empire Leather Works 5]

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide between 47 and 185 jobs per building. The 1x2 lot grows at Stage 4, the two 4x2 lots at Stage 3 and all other lots at Stage 1.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    It's not the first time I'm writing this, and it won't be the last: credits to **jestarr** for this BAT!

    T Wrecks, December 6, 2015
  author: T Wrecks, nos.17
