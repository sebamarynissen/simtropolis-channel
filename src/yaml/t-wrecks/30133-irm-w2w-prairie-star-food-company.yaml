group: t-wrecks
name: irm-w2w-prairie-star-food-company
version: "1.0"
subfolder: 400-industrial
info:
  summary: 4 W2W I-D lots using the Prairie Star Food Company BAT by jestarr
  description: |-
    The sixth upload in a series of IRM W2W lots based on BAT models made by other artists is **Prairie Star Food Company**, another BAT made by **jestarr**.

    The building will provide **240 I-D jobs**. The following lots are included:

    - 3x4 straight (2 versions), Stage 1
    - 4x3 straight (2 versions), Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 127 jobs and grow at Stage 3.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Once again, credits to **jestarr** for the great BAT, and to those of you who use the IRM W2W: Have fun!

    T Wrecks, February 9, 2015
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30133-irm-w2w-prairie-star-food-company-by-jestarr/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/c8850a6b4efdd97d7b17103a5b9b5687-irm_w2w_prairiestarfoodcompany_01.jpg
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/3cdedeefe9ac5b3fc29e7b94756d522f-irm_w2w_prairiestarfoodcompany_02.jpg
    - https://www.simtropolis.com/objects/screens/monthly_02_2015/e382c85ef585b18a2f7a6da0a060c776-irm_w2w_prairiestarfoodcompany_03.jpg

