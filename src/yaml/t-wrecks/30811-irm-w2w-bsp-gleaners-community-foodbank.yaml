group: t-wrecks
name: irm-w2w-bsp-gleaners-community-foodbank
version: "1.0"
subfolder: 400-industrial
info:
  summary: 1 W2W I-M lot using the BSP Gleaners Community Foodbank BAT by SimHoTToDDy
  description: |-
    This is the tenth upload in a second series of IRM W2W lots based on BAT models made by other artists, this time manufacturing industry. There's more BSP stuff left, this time: **BSP Gleaners Community Foodbank** by **SimHoTToDDy**.

    The building will provide **304 I-M jobs**. Since it is basically a snug fit towards all sides, I decided to leave it on a very simple, tight-wrapping lot so you can use filler lots or let mech/anchor lots develop behind the building. You can also integrate it into tight W2W areas with house rows situated back to back. The one included lot is as follows:

    - 7x3 straight, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lot by nos.17 is installed instead. This lot provides 698 jobs and grows at Stage 5.

    If you want to block the lot from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **SimHoTToDDy**, another superb BAT artist and all around pleasant guy who is sorely missed.

    T Wrecks, October 5, 2015
  conflicts: "Contains the IRM lots for `pkg=simhottoddy:bsp-gleaners-community-food-bank`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/30811-irm-w2w-bsp-gleaners-community-foodbank-by-simhottoddy/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2015_10/IRM_W2W_GleanersCommunityFoodbank_01.jpg.8b4fbd7ae595a86867ffb9ebee035d21.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2015_10/IRM_W2W_GleanersCommunityFoodbank_02.jpg.20b7a4eddce98ed601db68838e8f28a1.jpg

