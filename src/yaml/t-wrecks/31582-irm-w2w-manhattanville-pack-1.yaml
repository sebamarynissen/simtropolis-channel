    assets:
      - assetId: t-wrecks-irm-w2w-nybt-abbt-manhattanville-pack-1
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM W2W Expansion/NYBT ABBT Manhattanville Pack 1/"

