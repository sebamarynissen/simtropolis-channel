    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_BlacksIceCompany_02.jpg.823712c34d0c228835b77c86992574ee.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_BlacksIceCompany_03.jpg.c89f818c1394b3f560525ffe683be0d2.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_12/IRM_I-HT_jes_BlacksIceCompany_04.jpg.7383991431c780d1762b1d1c2fce6228.jpg

