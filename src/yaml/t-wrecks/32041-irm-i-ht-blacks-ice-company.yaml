group: t-wrecks
name: irm-i-ht-blacks-ice-company
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Black's Ice Company BAT by jestarr
  description: |-
    Allow me to introduce you to the third and last jestarr creation for this part of the IRM expansion.

    The 16th upload in this series, **Black's Ice Company** by **jestarr**, used to be a dirty industry (I-D) building, but given a general lack of I-HT in game, the fact that I-HT makes up most of the "endgame" industry and the rather clean appearance of this BAT with those huge radiators on top, I decided that it would also look OK as high-tech facility. The lots, of course, had to be adapted for this purpose. Both features a footpath leading around the building and some more greenery all around, not least for the purpose of hiding those tall blank walls. One of the lots has a muddy pool in front that looks rather natural - we could pretend that the building was originally erected in a green area with trees and some swampy spots, and they tried to leave some nature intact... Once again this is a creation I'm less pleased with, but I wasn't dissatisfied enough to trash it, so here it is.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **90 I-HT jobs**, the quadrupler version **360 I-HT jobs**.

    The following lots are included in this download:

    - 5x5, Stage 3
    - 6x4, Stage 3

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 643 jobs, and the lots grow at Stage 4.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **jestarr**.

    T Wrecks, December 20, 2017
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32041-irm-i-ht-blacks-ice-company-by-jestarr/
  images:
