group: t-wrecks
name: irm-i-ht-halma-automation
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the Halma Automation BAT by Tag_One
  description: |-
    We continue with more BATs from the same author, this one being one of the smallest in the whole pack.

    The 23rd upload in this series, **Halma Automation** by **Tag_One**, is a cute little structure that could also hide in a low-rise office park or even in a residential area. The rounded corners are its most interesting architectural features and, in terms of elegance, give it a slight edge (ha, ha) over your average shoebox building. It features a central entrance in both version - very simple in the case of the smaller lot, pretty ornate in the case of the bigger one - and not much externally visible typical industrial features to speak of, but that's not a problem because those I-HT guys and gals work with their smartybrains and not with big, bad machines and stuff... so much for a technically sound explanation!

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **16 I-HT jobs**, the quadrupler version **64 I-HT jobs**.

    The following lots are included in this download:

    - 2x3, Stage 1
    - 3x3, Stage 1

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, and the lots also grow at Stage 1.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **Tag_One** once again.

    T Wrecks, January 26, 2018
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32082-irm-i-ht-halma-automation-by-tag_one/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_T1_HalmaAutomation_01.jpg.65ff144463d52b4b3e35ae509c6b14ed.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_T1_HalmaAutomation_02.jpg.a448483c85b0ec5402809d49471f0cf1.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_T1_HalmaAutomation_03.jpg.3212662c3f2a243d74f41c96f3a2f96c.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2018_01/IRM_I-HT_T1_HalmaAutomation_04.jpg.c21e2b01dd50216b225685922cc6f2cf.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:mega-props-t1-vol04

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-halma-automation
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-halma-automation
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT Halma Automation \\(Tag_One\\)/"

