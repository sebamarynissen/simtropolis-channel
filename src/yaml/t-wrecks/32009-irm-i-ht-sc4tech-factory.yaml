group: t-wrecks
name: irm-i-ht-sc4tech-factory
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the SC4Tech Factory BAT by SimGoober
  description: |-
    Enough with the pharmaceutical stuff - let's get back to some plain old high-tech again, shall we?

    In the case of the twelfth upload in this series, **SC4Tech Factory** by **SimGoober**, the "old" in "plain old high-tech" can be taken literally, because the original BAT dates back to 2005. While it's not the most spectacular building at a first glance, it does have some nice details such as the little rooftop terrace and the illuminated interior in night view. Since it's more or less a corner building, I chose to lot it in two different orientations and make two rather different lots for it, both rather open and not surrounded by fences to encourage the formation of coherent industrial compounds - and/or the use of filler lots, of course!

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **50 I-HT jobs**, the quadrupler version **200 I-HT jobs**.

    The following lots are included in this download:

    - 4x6, Stage 2
    - 5x4, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 410 jobs, and the lots grow at Stage 3 (4x6) and Stage 4 (5x4).

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to **SimGoober** once again.

    T Wrecks, November 20, 2017
  conflicts: "Contains the IRM lots for `pkg=simgoober:hi-tech-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/32009-irm-i-ht-sc4tech-factory-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_SC4Tech_01.jpg.01402dc7fe596d37c4dddb3611156138.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_SC4Tech_02.jpg.05c370c6fdd37a091a5b18b229fc44f3.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_SC4Tech_03.jpg.09bb438d1ec64096e53de9ee52ec323e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_11/IRM_I-HT_SG_SC4Tech_04.jpg.4e2521348bd0b4b068e8e06e37fa4931.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-iht

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-sc4tech-factory
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-sc4tech-factory
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT SC4Tech Factory \\(SimGoober\\)/"

---
