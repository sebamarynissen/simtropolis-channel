info:
  summary: 3 W2W I-D lots using the Tage Brickworks BAT by Tag_One
  description: |-
    This is the eighth upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. This massive building is another dirty industry BAT, **Tage Brickworks** by **Tag_One**.

    The building will provide a whopping **1400 I-D jobs**. Since it is so huge, you can use it for mid-rise areas just fine - it might be one of those huge factories that ended up in the city as the city grew. Due to its shape, it is lotted as a building that can form an "end cap" for a 6 tiles deep city block with W2W buildings both in front and in the back. Here's the lot breakdown:

    - 6x6 left cap, Stage 3
    - 6x6 right cap, Stage 3 (2 versions)

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed, and these lots grow at Stage 6.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **Tag_One** for this whopper!

    T Wrecks, December 30, 2016
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31413-irm-w2w-tage-brickworks-by-tag_one/
