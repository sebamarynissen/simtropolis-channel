group: t-wrecks
name: irm-w2w-todds-packaging-plant
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 W2W I-M lots using the Todd's Packaging Plant BAT by Vlasky
  description: |-
    This is the eleventh upload in the third (and probably final) series of IRM W2W lots based on BAT models made by other artists, this time a mix of dirty and manufacturing industry. My little comeback after a hiatus is a relatively recent and high-quality 3dsmax BAT, **Todd's Packaging Plant** by **Vlasky**.

    The building will provide **240 I-M jobs** for your Sims. Since it is basically a single-storey building, it will look best among low-rise development. As the screenshots show, this time there is not much lot design to speak of; the building sits snugly on the lot and can be complemented with mech and anchor type lots growing behind it, or, of course, the ploppable IRM fillers.

    As usual, here's the list of lots included:

    - 6x2 left corner, Stage 1
    - 2x6 right corner, Stage 1

    In keeping with the other IRM stuff, the job numbers are intended to be in line with Maxis stuff if you use Toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`). Since you cannot zone large coherent areas with W2W industrial and the lots can be complemented with fillers, the resulting job density will, in fact, be not that excessive. For the same reason, growth stages for IRM W2W are generally kept low.

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These lots provide 414 jobs and grow at Stage 5.

    If you want to block the lots from growing temporarily, for example when you want to go back to regular (i.e., non-W2W) IRM industry for a while, see `pkg=t-wrecks:irm-lot-blockers`.

    Credits to **Vlasky** for this BAT! Uploading it makes me wish for two people to come back: SimHoTToDDy, to whom this BAT was dedicated originally, and Vladimir (Vlasky) himself, who not only contributed many a great BAT, but also was a fun and pleasant guy to have around.

    T Wrecks, February 5, 2017
  conflicts: "Contains the IRM lots for `pkg=vlasky:todds-packaging-plant`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31452-irm-w2w-todds-packaging-plant-by-vlasky/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_02/IRM_W2W_ToddsPackagingPlant_01.jpg.b3a8a12c141cf850814a6aa808d6e949.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_02/IRM_W2W_ToddsPackagingPlant_02.jpg.1a13c0576baff36378b60a49e49eff45.jpg

dependencies:
