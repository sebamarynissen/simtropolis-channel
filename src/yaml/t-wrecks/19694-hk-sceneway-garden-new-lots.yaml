info:
  summary: HK Sceneway Garden new lots
  description: |-
    **HKABT Sceneway Garden**

    **BATs by Bixel**

    **New lot package by T Wrecks**

    For a first impression, see some better pics:

    [Pic 1 - overall view of lots 1&2](http://img225.imageshack.us/img225/9949/sceneway12auk7.jpg)

    [Pic 2 - detail view of the back](http://img217.imageshack.us/img217/9784/sceneway12bfu7.jpg)

    [Pic 3 - detail view of the front](http://img230.imageshack.us/img230/2250/sceneway12cjg2.jpg)

    [Pic 4 - another angle](http://img246.imageshack.us/img246/4698/sceneway12dxy5.jpg)

    This download contains a host of new lots for Bixel's previously released Sceneway Garden tower complex. Three lot series are included to suit different playing styles and to make the recreation of such an enormous complex (and even bigger ones!) possible without using the CAM!

    1) A revamp of the original **landmark lots** for eyecandy ploppers,

    2) An all-new, **simple growable lot series** for the down-to-earth player who prefers a streamlined plugins folder, and

    3) An all-new **deluxe growable series of no less than 10(!) lots** to unleash the full HK madness upon your cities.

    Read on to find out which one you prefer - or maybe you just use all of them?

    Please note that you will need the .sc4model files from **[Bixel's original upload](https://community.simtropolis.com/files/file/18828-hk-sceneway-gerden/)**, or you will see brown boxes!

    * * *

    **1) The landmark lots revisited**

    This series comprises **4 lots**. They maintain the true-to life tower orientation of the original upload, but the ground has been made all new from scratch. You will now find an intricately shaped, lively and colourful plaza that connects the towers. A zoning plan for correct layout is provided.

    The values have been adjusted as well, and all four icons have been remade.

    Lots 1 & 2 have a LM effect of +40 over 20 tiles and an equally strong park effect.

    Lot 3 has a LM and park effect of +50 over 20 tiles each. Lot 4 has a LM and park effect of +40 over 15 tiles.

    You will find all icons grouped conveniently together in your landmarks menu. The plop cost ranges from 80,000 to 100,000.

    Dependencies for this version:

    [BSC MEGA Props by SimGoober](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)

    [BSC MEGA Props Misc](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=426)

    [BSC MEGA Textures Pack](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=90)

    HKABT\_Sceneway\_ABC\_as\_Props.dat (included)

    * * *

    **2) The simple growable lots**

    This series consists of **3 lots**. Each lot features a single tower on it, which will grow just like any other residential structure. The three versions are for the three slightly different tower models: Lot A for Tower A, Lot B for Tower B and Lot C... you guess. All lots feature some diagonal textures and lampposts with integrated light cones.

    The only difference is that at night different windows are lit. This was made to avoid obvious repetition on the original, multi-tower lot. For these growable lots, it's not strictly necessary, hence you can also choose to keep just one lot. This will be easiest on your plugins folder.

    Some key stats for these growables:

    Lot size / zone: 3x3, dense residential

    Growth stage: 8

    Tileset: Euro

    Occupants: 2,920 R$

    The other stats are in line with in-game buildings... you should know me by now. ![;)](https://community.simtropolis.com/assets/emoticons/LlamaWink.gif)

    Dependencies for this version:

    [SFBT Essentials](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=750)

    * * *

    **3) The deluxe growable lots**

    This series consists of **10 growable lots** (3x7 and 4x7, dense residential, R$, Euro tileset) with one or two towers each.

    Dependencies for this version:

    [BSC MEGA Props by SimGoober](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)

    [BSC MEGA Textures Pack](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=90)

    [SFBT Essentials](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=750)

    HKABT\_Sceneway\_ABC\_as\_Props.dat (included)
