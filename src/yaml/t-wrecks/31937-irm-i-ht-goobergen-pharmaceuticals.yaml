group: t-wrecks
name: irm-i-ht-goobergen-pharmaceuticals
version: "1.0"
subfolder: 400-industrial
info:
  summary: 2 I-HT lots using the GooberGen Pharmaceuticals BAT by SimGoober
  description: |-
    High-tech industry in SimCity would be unthinkable without companies like GooberGen, inventors of the tried and tested Fukitol capsules. So here we go again:

    The seventh upload in this series is another old classic, **GooberGen Pharmaceuticals** by **SimGoober**. This time around, we have a driveway to the backyard next to the entrance and, in the case of the wider lot, another open area to the right of the building, both with some employee cars parked in parallel. The left edge and the back left corner are lined with trees that form a visual border to whatever is beyond the lot, whereas the right side is relatively open. A really simple lot once again, but I'm still halfway pleased.

    Since all Maxis lots contained in the IRM Base Pack could optionally be used with toroca's Industrial Jobs Quadrupler (`pkg=toroca:industry-quadrupler`), this download is offered in two versions: a regular one for those who prefer the default job numbers, and a quadrupler-compatible version for those who prefer using the modified stats. You can choose between them with the `toroca:industry-quadrupler:capacity` variant. The default version of the building will provide **65 I-HT jobs**, the quadrupler version **180 I-HT jobs**.

    The following lots are included in this download:

    - 4x5, Stage 2
    - 5x4, Stage 2

    With CAM, the CAM edition of the lots by nos.17 is installed instead. These have no quadrupler version, provide 444 jobs, and the lots grow at Stage 4.

    For those of you who like to play with day and night view, the building used on this lot is compatible with the following night light mode(s):

    - Maxis Night with gradual day/night cycle: **YES**
    - Maxis Night with static day or night: **YES**
    - DarkNite with static day or night: **YES**

    DarkNite requires SimFox' Day and Nite Modd (`pkg=simfox:day-and-nite-mod`) or a similar darkening mod.

    Credits for the BAT go to omnipresent **SimGoober** - and not for the last time, either.

    T Wrecks, September 16, 2017
  conflicts: "Contains the IRM lots for `pkg=simgoober:hi-tech-industrial-set`. Installing both results in duplicate lots of the same building, so in an IRM city install only this package."
  author: T Wrecks, nos.17
  website: https://community.simtropolis.com/files/file/31937-irm-i-ht-goobergen-pharmaceuticals-by-simgoober/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_09/IRM_I-HT_SG_GooberGenPharma_01.jpg.abf7148892b3f2baca8cc97f65ddca1f.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_09/IRM_I-HT_SG_GooberGenPharma_02.jpg.582d976ed39e360f78f7ec94a473f78c.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_09/IRM_I-HT_SG_GooberGenPharma_03.jpg.de8ed44be1977f328c75bfc7cd6489db.jpg

dependencies:
  - memo:industrial-revolution-mod
  - bsc:sg-models-iht

variants:
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "standard" }
    assets:
      - assetId: t-wrecks-irm-i-ht-goobergen-pharmaceuticals
        include:
          - "\\.SC4Lot$"
          - "\\.SC4Desc$"
        exclude:
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "no", toroca:industry-quadrupler:capacity: "quadrupled" }
    dependencies:
      - toroca:industry-quadrupler
    assets:
      - assetId: t-wrecks-irm-i-ht-goobergen-pharmaceuticals
        include:
          - "\\.SC4Lot$"
          - "_x4\\.SC4Desc$"
  - variant: { CAM: "yes" }
    assets:
      - assetId: nos17-irm-expansions-and-addons-cam-a
        include:
          - "/IRM Expansion/I-HT GooberGen Pharmaceutics \\(SimGoober\\)/"

---
