subfolder: 360-landmark
info:
  summary: TSC team CBX tower
  description: |-
    BAT and Lot by BLanco_05
    For TSC team!

    CBX tower is a 142m tower built in the "CBD" of Paris: La defense.

    Dexia is actually the occupant of this tower.

    From Wikipedia - English:

    "Built from 2002 to 2005, the tower is 142 meter-tall. The tower is built nearby the La Défense circular boulevard on its Northern side, and a pedestrian bridge is connecting it to the district's esplanade on the Southern side. The CBX tower is also one of the few towers in La Défense having an inclined roof."

    There are 3 CBX versions:

    One with full roof ( 3*6 )
    One for 45° road
    One in construction ( 3*6 )

    CBX tower:
    ----------
    Budget Item cost: 15
    Bulldoze cost: 100
    Flammability: 10
    Plop cost:  25 000
    Power consumption: 60
    Water consumption: 20

    CBX in construction:
    --------------------
    Budget Item cost: 15
    Bulldoze cost: 100
    Flammability: 10
    Plop cost:  2 000
    Power consumption: 150
    Water consumption: 25

    Sorry this version have no jobs.
