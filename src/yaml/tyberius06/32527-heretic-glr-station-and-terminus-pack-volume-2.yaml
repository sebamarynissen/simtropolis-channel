    - https://www.simtropolis.com/objects/screens/monthly_2018_09/5baf5e1abd5ee_HereticGLRStationandTerminusPackv.2-r.jpg.21de465ea9b2a2c8db478e315aec8a7e.jpg
# The lots Kitsune LD GLR Terminus and Redfox84 LD GLR Terminus Island-type use the building-as-props exemplar of the Cogeo GLR Wheel Stop (0xd8f11522),
# which is only included in pack v.1, so the resources of that pack are a dependency. Its model is in cogeo:glr-stations-and-hubs-model.
# Mapping of the dependencies of the original description:
#   - WMP AD Station Props, WMP Power Props 01: wmp:mega-props-vol01 and wmp:mega-props-vol05
#   - RDQ HD Prop Pack: reddonquixote:prop-pack
#   - Track Textures for Cogeo GLR Stations (Ebina): not needed, the textures are part of NAM 50
#   - Nams Props Pack vol 2: namspopof:nams-mega-props
#   - Building-as-props dependencies: only their models are needed (the -model and -resources packages below)
#   - z____MGB Mods (override for MGB's SEN/SWN mod) is not installed, as that mod is not in the channel
dependencies:
  - wmp:mega-props-vol01
  - wmp:mega-props-vol05
  - simmer2:mega-prop-pack-vol1
  - simmer2:mega-prop-pack-vol2
  - reddonquixote:prop-pack
  - bsc:vip-girafe-french-road-signs
  - bnl:dutch-prop-pack
  - tamorr:tamorrs-resource
