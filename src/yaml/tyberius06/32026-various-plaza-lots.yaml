info:
  summary: 21 medium and large plazas by Tyberius06 and Tariel
  description: |-
    **Background**

    During one autumn I ran into a little problem in one of my cities. I needed some medium plazas with the dimensions of 2x3/3x2-3x4/4x3 and I couldn't find anything that I wasn't already using in my cities, so I came up with the idea of making some new lots. The original idea wasn't about a public release, since I don't have too much experience (nor too much motivation) with plazas and I wouldn't have wanted to waste too much time trying to make something which could be satisfying for everyone. But during the working process @tariely came up with some ideas and thoughts about nightlights (which is another thing I'm not interested in), so she got the files to put her touch on them. Later I combined the two sets, hers and mine, and here we are with this quite massive plaza set, which contains:

    - 18 medium plazas (5 of 2x3, 5 of 3x2, 2 of 2x4, 4 of 3x4, 2 of 4x3)
    - 3 larger plazas of 6x5

    I modded the plaza effects such as pollution and things like this totally randomly, so don't look for any realism. I don't really care about the gameplay aspect that deeply, so they can be unbalanced, but if you notice some balancing problem, you will probably know how to fix it. Hint: the LE Prop or Reader tool are your friends. Of course, I'm open to any suggestion, and if you have accurate values for me on which numbers I should change for what, I can and will do it and update the upload.

    The plaza plop costs vary according to the sets:
    - Heretic (yep, that's me) 2x3/3x2 plazas: 400
    - Heretic 3x4/4x3 plazas: 405
    - Tariel 2x3/3x2 plazas: 410 (yep, they are more expensive, because they are admittedly nicer, less out of the box, than mine)
    - Tariel 3x4/4x3 plazas: 415
    - Heretic-Tariel 6x5 plazas: 500

    You will find these lots in the Park menu.

    Huge thanks to Tariel for her help on this project. All the nightlights are her work, so all credits on the night lights are hers! Also I would like to thank Tariel for her ideas and help on the lots, and for providing her versions for this set. The beautiful Heretic-TL 3x4 Med Virgin Mary Fountain Plaza lot is completely her vision, so all credit is hers!

    Enjoy!

    - Tyberius
