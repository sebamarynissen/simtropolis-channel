# Checked against the contents of all dependencies: every prop, family and texture referenced by the lots resolves to the dependencies below,
# except the Maxis props and textures.
# Deviations from the dependency list of the original description:
#   - peg:cdk3-master-seaport-controller is not a dependency: none of the lots references a prop of it
#   - the CDK3 resource files of the Pier One, the Vandy Shipping and the Capt Jacks Landing packages are not referenced by any lot, so they are not needed.
#     The Container Ship Fleet and the PPond Canal Kit resource are not referenced either
#   - peg:cdk3-algae-farm-resource is used by the Acme Algae Farm lot but is not listed in the readme
#   - the BSC girafe carpack Vol01-Vol02 is only used by the car family props of the SAM 1 Override, and BSC T1 Vol07 is not referenced
#   - the dead link "BLS CAL Canal Wharves BSC" is covered by bsc:mega-props-canals-cal-remastered-simgoober-style: all referenced props resolve to the CAL and SimGoober
#     brick canal prop dats
#   - the T Wrecks Maxis Prop Names and Query Fix is not needed: its IDs are also in the PEG CDK3 super pak
#   - the NAM is listed in the readme for z0_PEG_CDK_Ferry.dat, but none of the referenced props is only in the NAM
#   - the included Heretic_SG_CAL_Canal_Straight_PropFamily.dat is identical to the one of the Seaport Project and tyberius06:heretic-sg-cal-canal-expansions-vol1
