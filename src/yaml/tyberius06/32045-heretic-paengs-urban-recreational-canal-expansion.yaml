info:
  summary: Expansion set with 26 new pieces for Paeng's Urban Recreational Canals
  description: |-
    This is an expansion set for Paeng's Urban Recreational Canals set, but I also used a bunch of WMP props. The original idea was to give more variety to the urban canals using more boats, which required giving the set some marinas. Later, when I revisited the set, I remade most of the lots and expanded the original relot set to get 26 new pieces.

    **List of items**
    - 4 waterfall pieces: three modular pieces (1x2) and one 3x2 lot, which can be used as a connection between the canal set and game water.
    - 2 modular bridge pieces (1x1), left side and right side. For center pieces the original PEG Pond Bridge Center pieces can be used.
    - 2 straight longer URC pieces (3x1), one for the walls, one for the promenade.
    - 3 water tiles (1x1) with boats, skulls etc. There are three sets of prop families, one for each lot.
    - 5 marina type lots: Small Straight Marina (1x1), Small Boathouse (1x1), Large Straight Marina (2x1), Punts Dock (2x2), Rowing Club (5x3).
    - 6 various pedestrian bridges in different sizes and usage. There are two lots which use overhanging bridge props.
    - 4 URC Streams extra add-ons: two transition pieces between URC and URC Streams (2x1), one URC Stream bridge, and one URC Stream with pedestrian bridge.
