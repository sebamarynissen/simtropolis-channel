  - bsc:mega-props-jes-vol01
  - bsc:mega-props-jes-vol02
  - bsc:mega-props-gascooker-vol01
  - ncd:rail-yard-and-spur-mega-pak-1
  - maxis:buildings-as-props
  - bsc:mega-props-cp-vol01
  - cp:scilt

assets:
