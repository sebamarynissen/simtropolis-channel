info:
  summary: 19 more lots for the Heretic SeaPort Project, with the retextured PEG-CDK3 docks, transitions and canal rail yards
  description: |-
    Here are a few more additions to the SeaPort Project (`pkg=tyberius06:seaport-project`). Altogether it contains 19 new additional lots (6 of them are totally new). With this expansion pack you get the old PEG-CDK3 docks and some of the other CDK3 related lots (Acme Algae Farm, Captain Jack's Landing, Blackies Boat Yard, Fred Ginger Fishery, Vandy Shipping Company and the two Garbage Disposal Docks), and I made two transition pieces between the PEG-CDK3 and PEG-CDK3-SP sets. After the SG-CAL canal transition pieces, I made transition pieces between game water and the original old-fashioned SimGoober canals, and combined the bigger industrial rail yard type lots with warehouses and canal pieces as well.

    **The contents**
    - The PEG-CDK3 docks set and related lots
    - Two new transition pieces between the CDK3 and CDK3-SP docks
    - A SimGoober Canal Lock Transition (almost the same as the SG-CAL Canal Lock Transition)
    - Three more warehouse-seaport-rail yard lots (2 for SG-CAL Canal, 1 for SimGoober Canal)

    This package does not install the PEG-CDK3 Master Seaport Controller. To avoid any conflict you should use only ONE set of docks (PEG's or mine), you shouldn't use both at the same time.

    **Credits & special thanks**

    Thank you for:
    - Simmer2 for his amazing RRW NSB overlay texture set, as that was the main inspiration of this project. And of course for his nice barrier props and other RRW overlays that he made.
    - Pegasus and the PEGPROD team for their work on the original seaport set, on the models and props.
    - MGB204/rsc204 for the very nice RRW rail tunnel model.
    - Tamorr for his prop families and his original ideas about SET endings and canal transitions.
    - NBVC for making the original Modular Container Port set.
    - FrankU for his nice prop families.
    - Kingofsimcity for his work on the SuperSHK parking textures.
    - CAL and Simgoober for their work on canals.
    - Girafe and the VIP team for their car props.
    - Jestarr and the BSC team for the amazing industrial related props, among them trucks and railcars.

    And me, Heretic/Tyberius, for the lot modifications and the new additional seaport lots.

    Thanks for the support, opinions, suggestions and criticism to everybody!
