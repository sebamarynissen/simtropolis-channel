info:
  summary: Seven big GLR terminus and hub stations with subway, bus and carpark functions
  description: |-
    Let me introduce you to the **Heretic GLR Station and Terminus Pack volume 3 - The Big Fellas**.

    With the third volume (out of 4), I bring SEVEN new GLR terminuses and stations to your cities. These lots have different capacities, but all of them function as a GLR station and, in addition, as a bus station and/or subway station.

    **List of items**
    - 10x4 Greenbelt Downtown GLR Terminal HUB with subway, bus station and carpark function and with 975 jobs and 70000 passenger capacity.
    - 10x4 Mitaki Downtown GLR Terminal HUB with subway, bus station and carpark function and with 1025 jobs and 80000 passenger capacity.
    - 3x12 Glendale-on-Valleymede GLR Interchange with subway station, 85 jobs and 70000 passenger capacity.
    - 8x5 WestEnd City Center GLR Terminus HUB, subway and bus stop with 1500 jobs and 60000 passenger capacity.
    - 8x3 Tonkso Europa Downtown GLR Station and subway stop with 650 jobs and 35000 passenger capacity.
    - 7x3 Mid-City Downtown GLR Terminus, subway and bus stop with 780 jobs and 55000 passenger capacity.
    - 8x3 WestEnd Cross Downtown GLR Station, subway and bus stop with 650 jobs and 40000 passenger capacity.

    The split GLR track paths are available for right-hand and left-hand drive. Choose the `driveside` variant that matches your game.

    **Credits & special thanks**

    Thanks everybody for the help and support!
    - **Nick (Simmer2)** - for awesome new props and models, some of them were made on request, and for making his two Mega Prop Packs, which make listing tons of dependencies easier.
    - **Robin (MGB204/rsc204)** - GLR path files (RHD and LHD), texture overlays for the Sandstone GLR version.
    - **Brian (b22rian)** - for testing very thoroughly all the stations and for the constant support.

    And of course all the great creators (art128, ILL Tonkso, Nilo7, Glenni, mattb325, motokloss, AndisArt and cogeo) of the models I used for this project, who gave the inspiration to make these stations.

    Have fun and enjoy!

    - Tyberius06
  author: Tyberius06
  website: https://community.simtropolis.com/files/file/32561-heretic-glr-station-and-terminus-pack-volume-3-the-big-fellas/
