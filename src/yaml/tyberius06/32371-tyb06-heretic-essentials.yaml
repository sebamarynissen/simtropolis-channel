info:
  summary: Dependency package with almost 900 timed props in 96 timed prop families
  description: |-
    Let me introduce you to my dependency essential package which contains almost 900 timed props altogether in 96 "new" timed prop families from creators like **Girafe** (cars), **AndisArt** (also cars), **Motokloss** (buses), **Namspopof** and **Delecto** (people), **Blanco_05** (HD buses and railcars, rail engines), **Orange_o** and **R6** (vehicles), **Simmer2** (in this release only a few of his hard working people props show up, but stay tuned for more), **SimCityFreak666** (railcar props) and there are additional single timed props too. Also I merged into this package some of my previous already released prop families.

    This is **Tyb06 (Heretic) Essentials v2** (second update).

    This is a **DEPENDENCY PACKAGE** to my releases in the future (and in some cases to the past), there is **NOT** any plopable or growable item in this release, however lotters may find it useful, since I gathered together many very useful and quite common props and turned them into timed props, then organized them into prop families.

    **Credits & Special Thanks:**

    Thanks everybody for the help and support!

    - **Simmer2** - timing lessons, support, textures (some of my base and overlay textures are based on his awesome texture creations), the special underground parking ramp and the slightly different version of the Roundabout Subway and Bus Station
    - **MGB204/rsc204** - GLR path files (RHD and LHD), texture overlays
    - **Vortext** - Model Tweaker
    - **Art128** - making me the Bus Terminal models and props
    - **Girafe** - making me the half circular parking cars model and prop
    - **Barrocco Hispano (AGC or JLC)** - allowing me to release some of his early car models and props
    - **Brian (b22rian)** - constant support

    and of course all the great creators of the models what I used for this project.

    Have fun and enjoy!

    **- Tyberius06**
