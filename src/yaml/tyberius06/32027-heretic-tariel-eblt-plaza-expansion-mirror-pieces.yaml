info:
  summary: Mirrored and modular pieces to expand the EBLT Plaza Set
  description: |-
    **Background**

    One of my first relotting projects was to make a "redirected" mirrored version of @io_bg's EBLT Plaza Set, to make a flawless looking plaza route combining the original set of plazas and the relots. While doing my "housekeeping" on my bunch of experimental relots, I decided to revisit my old lots. Since @tariely started her very nice projects on plazas and gardens, we made a team-up and she facelifted my lots with nice nightlights and other fancy stuff, and also made three plazas for this set. Huge thanks to her for the hard work on this project!

    **List of items**
    - 6 1x1 modular plaza walk pieces. Using the SPOT you can make bigger plazas with flawless plaza routes.
    - 2 2x1 modular-ish plaza walk pieces.
    - 5 2x2 mirrored plazas for the purpose of expanding the existing EBLT Plaza set.
    - 2 2x2 plazas using the same routeways as the original set. They are not mirrored pieces, credit goes to Tariely for these pieces.
    - 2 2x4 plaza pieces, one regular and one mirrored version.

    The listed items can work together nicely, but I guess they need a little patience and experimenting for better results.

    You will find these lots in the Park menu close to the original set. The plop cost of the original 2x2 set is 50$. To keep the additional pieces close to the original set, I gave the following values:
    - 2x2 plazas: 51$
    - 1x1 plazas: 52$
    - 2x1 plazas: 53$
    - 2x4 plazas: 55$

    **Credits**

    Huge thanks to Tariel for her help on this project. All the nightlights are her work, so all credits on the night lights are hers! Also I would like to thank Tariel for her ideas and help on the lots, and for providing her versions for this set. Also I would like to thank @rivit, who helped us out with a little overlay texture addition to the CycleDogg overlays, which seemed a necessary addition to this set. Credit on that is his!

    Enjoy!

    - Tyberius
