# Checked against the contents of all dependencies: every prop, family and texture referenced by the lots resolves to the dependencies below,
# except the Maxis props and textures.
# Deviations from the dependency list of the original description:
#   - the PEG CDK3 collection is replaced by the packages that hold the used resource files: peg:cdk3-super-pak (PEG-CDK3_SUPER_PAK_RESOURCE.dat),
#     peg:cdk3-sp-seaport-super-pak (PEG-CDK3-SP_SUPER_PAK_RESOURCE.dat), peg:cdk3-sp-rail-fleet and peg:cdk3-sp-container-ship-fleet.
#     The ShipTraffic1, GarbageDock, AlgaeFarm and BoatYard resources and the Master Seaport Controller are not referenced by the lots
#   - the PPond Kit (peg:ppond-kit-resources) and the T Wrecks Maxis Prop Names and Query Fix are not referenced; the one ID of T Wrecks is also in the PEG CDK3 super pak
#   - the BSC girafe carpack Vol01-Vol02 is only used by the car family props of the SAM 1 Override (the readme says Vol03 and Vol04 are not needed either)
#   - the included Heretic_SG_CAL_Canal_Straight_PropFamily.dat is identical to the one in tyberius06:heretic-sg-cal-canal-expansions-vol1
#   - the included Heretic-JES_Freight_Railcar_prop_families_v1.dat overlaps 28 of its 34 TGIs with the JES family dat of the Heretic Essentials,
#     but the families 0x5f85f101, 0x5f85f102 and 0x5f85f104 are only in the Heretic Essentials
#   - the three functional seaports of the ZZZZ_PEG SEAPORTS folder are in a separate package
#   - the prop 0x073d48b2 (a worker figure) of the functional Pier Seaport is only in peg:mtp-logging-resource, peg:oww2-resource-pack-vol01 and
#     peg:oww2-resource-pack-vol02; none of these is a dependency of the original PEG Pier Seaport either. It is not used by the other lots.
