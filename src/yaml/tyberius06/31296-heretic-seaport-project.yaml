info:
  summary: 130 retextured and relotted CDK3-SP seaport docks and warehouse lots with new rail yards, transitions and canal lots
  description: |-
    **Heretic SeaPort Project**

    **Introduction**

    This project was initially made for my personal use to get a better (for me more satisfying) design in my cities, which idea was inspired by Simmer2's RRW NSB overlay texture set. I like the PEG-CDK3-SP system, and I've been using them since I found them on SimPEG a few years ago. But I don't like the base texture that it uses, and there are some configurations that were also problematic (I really don't like those rail crossings on the inner corner lots, at least not in every situation), so I decided to change them. But if I change one or two lots, I have to change all of them, or the most used ones for the uniformity.

    This upload contains retextured and relotted items from three different creators/teams who made the original sets and additions for the original set, and contains a lot of new additional lots made by me. The remade original contents are the following:
    - PEG-CDK3-SP Docks, Seaports and Warehouse Docks from Pegasus
    - Large Warehouse Outer Corner (for the CDK3-SP Raw Warehouse set) from NBVC
    - Modular Container Port from NBVC
    - Tamorr CDK3-SP End Lots from Tamorr
    - Bob's CSK Transfer Dock from Tamorr
    - CDK3-SP Rail Port WH from Tamorr
    - Tamorr's CDK3-SP Freight Station from Tamorr

    Altogether with my creations this project contains 130 lots. Apart from the three PEG-CDK3-SP Seaport lots (Container Seaport, Pier One Seaport, Break-Bulk Seaport) these are not overrides, this is kind of a new set based on the original lots. The three mentioned seaport lots override the original PEG seaports, or replace them. Because of that, they are available in the separate optional package `pkg=tyberius06:heretic-seaport-project-functional-seaports`. I didn't change the stats of these lots, I only gave them a new item name and the new texture design.

    **IMPORTANT NOTICE:**

    As the PEG-CDK3 Master Seaport Controller mod says, the PEG seaports (which I also use in this upload) are not compatible with any other seaports or seaport mods, including the BSC seaports as well. As @Eggman121 pointed me in the right direction in my development thread over on SC4 Devotion, you can only use each of the seaports: the PEG-CDK3 seaports with the Master Seaport Controller OR the BSC seaports, but you can **NOT** use these together at the same time.

    This package does not install the Master Seaport Controller. To avoid any conflict you should use only ONE set of docks (PEG's or mine), you shouldn't use both at the same time.

    **Credits & special thanks**

    Thank you for:
    - Simmer2 for the amazing RRW NSB overlay textures, as that was the main inspiration of this project. And for his nice barrier props and other RRW overlays that he made.
    - Pegasus and the PEGPROD team for their work on the original seaport set, on the models and props.
    - MGB204/rsc204 for the very nice RRW rail tunnel model.
    - Tamorr for his prop families and his original ideas about SET endings and canal transitions.
    - NBVC for making the original Modular Container Port set.
    - FrankU for his nice prop families.
    - Kingofsimcity for his work on the SuperSHK parking textures.
    - CAL and Simgoober for their work on canals.
    - Girafe and the VIP team for their car props.
    - Jestarr and the BSC team for the amazing industrial related props, among them trucks and railcars.
    - And me, Heretic/Tyberius06, for the lot modifications and the new additional seaport lots.

    Thanks for the support, opinions, suggestions and criticism to everybody!
  author: Tyberius06
  website: https://community.simtropolis.com/files/file/31296-heretic-seaport-project/
