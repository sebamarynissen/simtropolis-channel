  summary: Retextured functional PEG-CDK3-SP seaports (Container, Pier One and Break-Bulk) that replace the PEG seaports
  warning: "These are functional seaports that directly replace the game's default seaport and require the Pegasus Seaport Controller. Make sure you have no other seaport controller or functional seaports installed! Failure to do so could prevent you from opening your cities."
  description: |-
    The three functional seaports of the Heretic SeaPort Project: the retextured Container Seaport, Pier One Seaport and Break-Bulk Seaport. They override the original PEG-CDK3-SP seaports, or replace them, so they cannot be installed together with `pkg=peg:cdk3-sp-container-seaport`, `pkg=peg:cdk3-sp-break-bulk-seaport` and `pkg=peg:cdk3-sp-pier-seaport`.

    As the PEG-CDK3 Master Seaport Controller mod says, the PEG seaports are not compatible with any other seaports or seaport mods, including the BSC seaports. You can only use each of the seaports: the PEG-CDK3 seaports with the Master Seaport Controller OR the BSC seaports, but you can **NOT** use these together at the same time.

    I didn't change the stats of these lots, I only gave them a new item name and the new texture design.

    This package belongs to `pkg=tyberius06:heretic-seaport-project`.
  conflicts: Conflicts with the original functional PEG seaports `pkg=peg:cdk3-sp-container-seaport`, `pkg=peg:cdk3-sp-break-bulk-seaport` and `pkg=peg:cdk3-sp-pier-seaport`, which have the same IDs.
