info:
  summary: L1 (7.5 meters) elevated hybrid railway station in two versions
  description: |-
    This L1 (7.5 meters) Elevated Hybrid Railway Station is a creation of [@Oidaas](https://community.simtropolis.com/profile/64713-oidaas/). The upload contains two versions of the lot that share the same stats, but use slightly different prop sets.

    It's a high capacity station, which serves two passing through HRW DTR lines on Level 1 (7.5 meters) height. These are brand new station lots based on the freshly made L1 station model created by Oidaas and were created for the Hybrid RailWay Dual Network (RRW-RHSR).

    This station provides 92 jobs. It allows both Monorail (RHSR) and regular Passenger Train (RRW) traffic to get on/off from the trains, and also allows them to pass through on the station. It has a Bus Stop, underground parking facility and Subway Station as well. Freight Trains can pass through on this station too.

    The lotting on the v1 lot (`Oidaas HRW L1 Station (short 4x4)_v1`) was made by Oidaas, while on the v2 lot (`Oidaas-Tyb06 HRW L1 Station (short 4x4)_v2`) it was made by Tyberius06. The modding and functional transit enabling was made by Tyberius06.

    **Special gratitude goes to the following people:**

    - **Oidaas** for the main station building
    - **eggman121** for creating the Hybrid RailWay network
    - **Girafe** and the **VIP Team** for the beautiful urban and flora props and for the vehicle props
    - **CP/Cycledogg** for some of the planter and flora props
    - **Glenni** for some of the props used on these lots
    - **SFBT Team** for some of their props used on these lots
    - **Bipin** for some of the station shelter props which are a nice addition to the NAM
    - **z1** and the fellow **MTA/NAM** members for establishing the current standards for transportation lots

    Have fun and enjoy!
