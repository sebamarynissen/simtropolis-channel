info:
  summary: CounterPoint Shinjuku Station Complex, the second URHTS release
  description: |-
    Let me introduce you to the **second** release of a series of station lots, which is called **Heretic Urban Rail and HSR Terminal and Station Project** (in short: **URHTS**). In the second release you will meet the **Heretic CounterPoint Shinjuku Rail Station**, which has subway, carpark and bus station function too.

    Also let me tell a little background story.

    I met the Shinjuku Complex lot for the very first time in the [SimCity 4: Let's Play Pinecastle](https://www.youtube.com/watch?v=obhBvQtXD4M&list=PL3PCS51Bk2Mn5-0_Jo5Qcdk8auW1K6NK_) [videos](https://youtu.be/obhBvQtXD4M?t=196) by [Samgoogolplexian](https://www.youtube.com/channel/UCsvNTnFF7S04gV6ibzIoYmw)/[@Moonraker0](https://community.simtropolis.com/profile/264353-moonraker0/) and I started using it in my first city attempts from the late 2014. Then later in 2015, when I first started to use the Lot Editor (with a huge lack of knowledge about anything), this complex (the West Wing more precisely) was one of the first relots that I've ever made to change the rail textures and some additional parts. This is one of my favourite station complexes in the game and in the past couple of years it got many alterations. Now I feel it's time to give one of them to you.

    Some of you may know that CounterPoint is a bit of a special part of my capital city in SC4 (Noir City), partially standard European, partially very Parisian and there are parts of it which recall more Far-Eastern architectures. The last (now released) version of the Shinjuku Station Complex is the main central station of CounterPoint. I like to mix the different styles, that's why the Japanese station complex got very Western additional buildings on the East Wing (this is v1) and since it was made mostly for my CounterPoint city part I call it CounterPoint Shinjuku. Although some of you might not like this mixture, therefore I made a more Japanese looking version (v2), and I call it just simply Shinjuku East Wing. The dimensions for both wings were changed compared to the original lots made by [@tepodon](https://community.simtropolis.com/profile/126266-tepodon/). The two wings have different stats, and only the West Wing has subway cover.

    You can choose which east wing to install with the `tyberius06:heretic-urhts-project-02-counterpoint-shinjuku-station-complex:east-wing` variant: `heretic` (v1), `japanese` (v2) or `both`. The version you choose determines which of the additional office building packages are installed.

    **List of items**

    - 6x15 CounterPoint Shinjuku West Wing Rail Terminus with Subway, Bus station and Carpark function and with 1010 jobs and 115000 passenger capacity.
    - 10x15 CounterPoint Shinjuku East Wing Rail Station (v1 - Heretic mixed style) with Bus station and Carpark function and with 885 jobs and 115000 passenger capacity.
    - 10x15 Shinjuku East Wing Rail Station (v2 - Japanese style) with Bus station and Carpark function and with 730 jobs and 115000 passenger capacity.

    Thanks everybody for the help and support!

    Credit goes to **Tepodon** - main station buildings, **JP Schriefer**, **Ill Tonkso**, **Kei_jpn** and **Art128** for the additional office buildings.

    **Nick (Simmer2)** - for awesome new props and models, some of them were made by request, and for making his two Mega Prop Packs which makes listing tons of dependencies easier.

    **Brian (b22rian)** - for the constant support

    and of course all the great creators of the models that I used for this project.

    Have fun and enjoy!

    **- Tyberius06**
