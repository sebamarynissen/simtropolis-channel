info:
  summary: Strickland L1 E-RRW terminal with GLR, subway, bus and carpark functions
  description: |-
    Let me introduce you to the first release of a series of station lots, which is called **Heretic Urban Rail and HSR Terminal and Station Project** (in short: URHTS).
    In the first release you will meet the Heretic Strickland L1 E-RRW Terminal, which is also functioning as a GLR terminus. It has subway, carpark and bus station functions too.

    **List of items**
    - 5x7 Strickland L1 E-RRW and GLR Terminal HUB with subway, bus station and carpark function and with 380 jobs and 95000 passenger capacity.

    **Credits & special thanks**

    Thanks everybody for the help and support!
    - **mattb325** - for the wonderful station models which gave the first kick to this project.
    - **SimCity4IE** - for the GLR station platform.
    - **Nick (Simmer2)** - for awesome new props and models, some of them were made on request, and for making his two Mega Prop Packs, which make listing tons of dependencies easier.
    - **Robin (MGB204/rsc204)** - GLR path files (RHD and LHD), texture overlays for the Sandstone GLR version.
    - **Brian (b22rian)** - for testing very thoroughly all the stations and for the constant support.

    And of course all the great creators of the models I used for this project.

    Merry Christmas! Have fun and enjoy!

    - Tyberius06
