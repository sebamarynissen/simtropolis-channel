    - https://www.simtropolis.com/objects/screens/monthly_2018_12/5c1fcfd74bdec_URHTS01-StrictlandTerminal-n.jpg.737bb8739b2852d4bc75f23d73922f40.jpg
# Checked against the contents of all dependencies: every prop, family and texture referenced by the lot resolves to the dependencies below,
# except the Maxis textures 0x258d1000 and 0x258f2000. The building-as-props exemplars are included in the upload itself.
# Mapping of the dependencies of the original description:
#   - Mattb325 Multifunction Station Pack: mattb325:multifunction-stations, a prop pack without lots (models of the two building-as-props exemplars)
#   - WMP Station Prop Pack: wmp:mega-props-vol01 (the lot uses no props of wmp:mega-props-vol05)
#   - RDQ HD Prop Pack: reddonquixote:prop-pack
#   - z____MGB Mods (override for MGB's SEN/SWN mod) is not installed, as that mod is not in the channel
dependencies:
  - mattb325:multifunction-stations
  - simcity4ie:suburban-luas-glr-station-model
  - cogeo:glr-stations-and-hubs-model
  - bsc:bat-props-mattb325-vol02
  - wmp:mega-props-vol01
  - simmer2:mega-prop-pack-vol1
  - simmer2:mega-prop-pack-vol2
  - bsc:vip-girafe-french-road-signs
  - bsc:vip-girafe-urbanpack-vol01
  - reddonquixote:prop-pack
  - tamorr:tamorrs-resource
  - tyberius06:tyb06-heretic-essentials
  - nam:network-addon-mod
  - supershk:mega-parking-textures
assets:
  - assetId: tyberius06-heretic-urhts-project-01-strickland-terminal
    exclude:
      - "/z____MGB Mods/"

