  summary: Chapelle de Sta. Marie, a small chapel
  description: |-
    The first lot I made for the props in Namspopof's BAT prop pack Vol 02, which had no lots. It is a small chapel that costs nothing to maintain, as it is supported by private donors, and has a very small amount of pollution (mainly pamphlets caught by the wind). The model is part of `pkg=tsc:mega-props-vol05-namspopof`.

    **Stats**

    - Lot size: 2x2
    - Plop cost: 1,100
    - Bulldoze cost: 100
    - Monthly cost: 0
    - Landmark effect: 40 over 20
    - Mayor rating effect: 10
