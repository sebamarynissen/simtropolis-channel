  summary: Growable R$$$ lot for the Barber Mansion
  description: |-
    As far as I know this beautiful building has only been available as a reward, so I decided to make a high wealth growable lot to use in my cities. It has 478 residents, which is high, but the building takes up a lot of space, so I kept PIM's stats. The model is part of `pkg=csx:mega-props-vol01`.

    **Stats**

    - Lot size: 7x4
    - Growth stage: 5
    - Capacity: R$$$ 478 (R$$ 1,091 or R$ 1,974 when dilapidated)
    - Bulldoze cost: 328
