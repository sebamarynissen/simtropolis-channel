  summary: Łódź, Tuwima, a residential building by TAO from the old SimCity Polska site
  description: |-
    A residential building by TAO that was on the old SimCity Polska site. It didn't have a residential growable lot, so I made a relot with one. Besides the growable, the ploppable lots of the original are included.

    **Stats**

    *Growable*

    - Lot size: 2x2
    - Growth stage: 4
    - Capacity: R$$ 82 (R$ 146 when dilapidated)
    - Bulldoze cost: 233

    *Ploppable (two versions of the same lot)*

    - Lot size: 2x2
    - Plop cost: 10
    - Bulldoze cost: 10
    - Monthly cost: 1
    - Landmark effect: 40 over 20
    - Mayor rating effect: 10
