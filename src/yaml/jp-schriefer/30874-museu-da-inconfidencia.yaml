info:
  summary: Museu da Inconfidência in Ouro Preto in HD and SD
  description: |-
    Located in the city of Ouro Preto, the old capital of the Brazilian state of Minas Gerais, the old city council and prison, now the **Museu da Inconfidência**, is a history museum dedicated to those who died in the failed rebellion movement Inconfidência Mineira for Brazilian independence from Portugal.

    **Information**

    The model is available in the Education menu.

    - Plop cost: 30,000
    - Lot size: 2x3
    - Monthly cost: 3,000
