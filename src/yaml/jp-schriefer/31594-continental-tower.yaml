group: jp-schriefer
name: continental-tower-model
version: "1.0"
subfolder: 110-resources
info:
  summary: Model dependency for `pkg=jp-schriefer:continental-tower`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31594-continental-tower/
# The model is identical for the commercial and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-continental-tower-commercial-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-continental-tower-commercial-dn
        include:
          - "\\.SC4Model$"

