group: jp-schriefer
name: failing-office-building
version: "1.0"
subfolder: 300-commercial
info:
  summary: 12-story corner high-rise in Landmark and Commercial Office versions
  description: |-
    The **Failing Office Building** is a 12-story high-rise building located in downtown Portland, Oregon, U.S. Also known as **The 620 Building**, it was built from 1908-1910 by the firm Whidden & Lewis. The building is listed on the National Register of Historic Places since October 31, 2007.

    **Information**

    The model is available in two versions - Landmark and Commercial Office. Both are corner W2W models. With the custom LODs it's possible to add furniture as props on the terraces in case anyone wants to do it.

    *Landmark*

    - Plop cost: 30,000
    - Lot size: 2x2

    *Commercial Office*

    - Lot size: 2x2
    - CO$$$: 400
    - CO$$: 650

    Both versions are installed. The model comes in a version for Maxis Night and one for Dark Nite (SimFox Day and Nite Modd, `pkg=simfox:day-and-nite-mod`), which you can choose with the `nightmode` variant.
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/32137-failing-office-building/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/1.png.48b2d1cdf42be9e9f8b20bc4191d7f4f.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/3.png.76a0e52bd47d02a4a7b2c25e147c7cea.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/4.png.e8bd45d6143df91e8c15fbdbb99d6aed.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/5.png.2c5b8df79e3ce40bded2fe373c1943b1.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/6.png.5284cf52f2d871e8d37d935ab11d4518.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/7.png.188bbd49fe781d95ca72ae7e7289ce89.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/8.png.d864e6e65e45a6a78d9f494c5f220ce3.png
    - https://www.simtropolis.com/objects/screens/monthly_2018_02/989d561f7888f446903216e2156756ae5948b4b9.png.b445329310346f3fe5553a051891123c.png
dependencies:
  - jp-schriefer:failing-office-building-model
# The lots are identical in the Maxis Night and Dark Nite downloads, only the model differs.
assets:
  - assetId: jp-schriefer-failing-office-building-commercial-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-failing-office-building-landmark-mn
    exclude:
      - "\\.SC4Model$"

