group: jp-schriefer
name: tiradentes-building
version: "1.0"
subfolder: 300-commercial
info:
  summary: Tiradentes Building in Belo Horizonte in Landmark and Commercial Office versions
  description: |-
    Located in the city of Belo Horizonte, Brazil, the **Edifício Tiradentes** (in English: Tiradentes Building) was designed by Flávio Almada and finished in 1990 in a pluralistic style. It is located at the Praça da Assembleia and is an annex of the Legislative Assembly of the State of Minas Gerais, the public department that operates at the Inconfidência Palace and where state deputies work.

    **Information**

    The model is available in two versions: Landmark and Commercial Office.

    *Landmark*

    - Plop cost: 30,000
    - Lot size: 3x2

    *Commercial Office*

    - Lot size: 3x2
    - CO$$$: 1,400
    - CO$$: 1,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/30987-tiradentes-building/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_03/56dc8889c873a_NewCity-Jan.50014572929612.png.c5e325808db53084a2fd413d1f03b967.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_03/56dc88a118c5f_NewCity-Jan.5001457292961.png.4353ee5954544db00b6a32dbd7f2c54f.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_03/56dc88b447a2e_CpiadeARQBH-2008-02-16(49)-R01.jpg.59f53ca26f5dcf280d687d495f880473.jpg
dependencies:
  - jp-schriefer:tiradentes-building-model
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-tiradentes-building-landmark-mn
        exclude:
          - "\\.SC4Model$"
      - assetId: jp-schriefer-tiradentes-building-commercial-mn
        exclude:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    assets:
      - assetId: jp-schriefer-tiradentes-building-landmark-dn
        exclude:
          - "\\.SC4Model$"
      - assetId: jp-schriefer-tiradentes-building-commercial-dn
        exclude:
          - "\\.SC4Model$"

