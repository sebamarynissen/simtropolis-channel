group: jp-schriefer
name: 261-5th-avenue
version: "1.0"
subfolder: 300-commercial
info:
  summary: Art deco high-rise in New York City in Landmark and Commercial Office versions
  description: |-
    **261 5th Avenue** is a 26-story high-rise building located in New York City, U.S. Built in 1929 in art deco style, the building offers several commercial offices.

    **Information**

    The model is available in two versions: Landmark and Commercial Office. Both are W2W.

    *Landmark*

    - Plop cost: 100,000
    - Lot size: 3x2

    *Commercial Office*

    - Lot size: 3x2
    - CO$$$: 6,000
    - CO$$: 8,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31864-261-5th-avenue/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/7.png.f6c051e388d7efddf0e2c536cb34c47f.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/1.png.8da18add1ecdcbe4e35cac5a7f02f0de.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/2.png.49f869991fff618922a857b09ebc4294.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/3.png.766305ad631c3730b151ba1777c9d29e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/4.png.e3f602de23b50ccd171d2f232608165f.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/5.png.5f167d004926369cc1c027ef15ee0171.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/6.png.a99e668915fbf802090e89e62ecb000e.png
dependencies:
