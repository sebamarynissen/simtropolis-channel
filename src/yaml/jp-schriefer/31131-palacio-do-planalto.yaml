group: jp-schriefer
name: palacio-do-planalto
version: "1.0"
subfolder: 360-landmark
info:
  summary: Palácio do Planalto in Brasília as a Landmark
  description: |-
    The **Palácio do Planalto** (in English: Planalto Palace) is the official workplace of the President of Brazil and is located in the national capital, Brasília. The building was designed by the architect Oscar Niemeyer and inaugurated on April 21, 1960. It has been the workplace of every Brazilian president since Juscelino Kubitschek.

    **Information**

    This model is only available as a Landmark.

    - Plop cost: 70,000
    - Lot size: 7x9
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31131-palacio-do-planalto/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_06/1.png.ce3d23f3852df8695fad6ee16e4baca1.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_06/576b41eb4ffe6_NovaCidade-2Abr.001466642998.png.22f6cb2a05188361b7f3f3a4cfb76547.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_06/576b41f52a80c_NovaCidade-2Abr.001466643782.png.f563484a3e4032df3065c78b2d1bd144.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_06/576b41fdb87a4_NovaCidade-2Abr.001466643027.png.bc3ade8f3a29343462586ba612444aef.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_06/palacio-do-planalto.jpg.2d84d92c21c0075881da6005494f4223.jpg
dependencies:
  - bsc:textures-vol02
  - jp-schriefer:palacio-do-planalto-model
# The lot is identical for Maxis Nite and Dark Nite, only the model differs.
