group: jp-schriefer
name: 32-old-slip-one-financial-square
version: "1.0"
subfolder: 300-commercial
info:
  summary: 32 Old Slip skyscraper in New York City in Landmark and Commercial Office versions
  description: |-
    **32 Old Slip**, also known as One Financial Square, is a skyscraper completed in 1987 in the Financial District of New York City. This BAT was made following a good suggestion by \_\_B.

    **Information**

    There is a landmark version and a commercial version of this model.

    *Landmark (non-functional)*

    - Plop cost: 100,000
    - Lot size: 4x4

    *Commercial Office (CO$$$), growable*

    - Jobs: 6,000 ($$$) and 4,000 ($$)
    - Lot size: 4x4
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/30704-32-old-slip-one-financial-square/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2015_07/4.png.c4b05953723d980c8e125fe3e917232a.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2015_07/7.jpg.a6aad78218abe05f9952bbc6302671c1.jpg
dependencies:
  - jp-schriefer:32-old-slip-one-financial-square-model
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-32-old-slip-landmark-mn
        exclude:
          - "\\.SC4Model$"
      - assetId: jp-schriefer-32-old-slip-commercial-office-mn
        exclude:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    assets:
      - assetId: jp-schriefer-32-old-slip-landmark-dn
        exclude:
          - "\\.SC4Model$"
      - assetId: jp-schriefer-32-old-slip-commercial-office-dn
        exclude:
          - "\\.SC4Model$"

