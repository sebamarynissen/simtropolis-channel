group: jp-schriefer
name: castelo-del-mar
version: "1.0"
subfolder: 200-residential
info:
  summary: Modernist condominium tower in Recife in Landmark and Residential versions
  description: |-
    Located in the city of Recife, PE, Brazil, **Castelo Del Mar** is a modernist residential condominium with twin towers built in 2001.

    Note: this file includes only a stand-alone tower. The lot includes two pools and 6 palm trees, which may take a while to appear.

    Relots of this building by Fantozzi are available as `pkg=fantozzi:castelo-del-mar-relot`.

    **Information**

    The model is available in two versions: Landmark and Residential.

    *Landmark*

    - Plop cost: 15,000
    - Lot size: 2x2

    *Residential*

    - Lot size: 2x2
    - R$$$: 300
    - R$$: 650
    - R$: 1,200
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31493-castelo-del-mar/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_03/CDM5.png.418be0f060cf9d5fc1ad4cb02f2f118d.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_03/CDM4.png.658e3eb7733ab12fb4b656fc694c66f3.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_03/CDM1.png.c3962c2cfaa6b8c5a0c96b766676b79f.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_03/CDM3.png.f9e9647fbe13d22691f69769e251f465.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_03/CDM2.png.6d559f617dbd9df0caacc2c2b7473149.png
dependencies:
  - jp-schriefer:castelo-del-mar-model
# The lots are identical for Maxis Nite and Dark Nite, only the model differs.
assets:
  - assetId: jp-schriefer-castelo-del-mar-landmark-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-castelo-del-mar-residential-mn
    exclude:
      - "\\.SC4Model$"

---
group: jp-schriefer
