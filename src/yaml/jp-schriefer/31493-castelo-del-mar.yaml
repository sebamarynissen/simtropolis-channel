  summary: Model dependency for `pkg=jp-schriefer:castelo-del-mar` and `pkg=fantozzi:castelo-del-mar-relot`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31493-castelo-del-mar/
# The model is identical for the residential and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-castelo-del-mar-residential-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-castelo-del-mar-residential-dn
        include:
          - "\\.SC4Model$"

