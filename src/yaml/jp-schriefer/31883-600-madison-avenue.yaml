group: jp-schriefer
name: 600-madison-avenue
version: "1.1"
subfolder: 300-commercial
info:
  summary: High-rise in Midtown Manhattan in Landmark and Commercial Office versions
  description: |-
    **600 Madison Avenue** is a 25-story high-rise building located in Midtown Manhattan, New York City, U.S.A. Built in 1965 by Emery Roth & Sons, the building offers several commercial offices.

    **Information**

    The model is available in two versions: Landmark and Commercial Office. Both are corner models.

    With the custom LODs it's possible to add furniture as props on the balconies in case anyone wants to do it.

    *Landmark*

    - Plop cost: 100,000
    - Lot size: 2x3

    *Commercial Office*

    - Lot size: 2x3
    - CO$$$: 6,000
    - CO$$: 8,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31883-600-madison-avenue/
