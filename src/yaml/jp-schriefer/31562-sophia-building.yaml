info:
  summary: Model dependency for `pkg=jp-schriefer:sophia-building`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31562-sophia-building/
# The model is identical for the residential and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-sophia-building-residential-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-sophia-building-residential-dn
        include:
          - "\\.SC4Model$"

