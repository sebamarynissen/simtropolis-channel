group: jp-schriefer
name: sophia-building
version: "1.0"
subfolder: 200-residential
info:
  summary: Modernist residential building in Belo Horizonte in Landmark and Residential versions
  description: |-
    Located in Belo Horizonte, MG, Brazil, the **Sophia Building** is a modernist residential building from the 70s.

    **Information**

    The model is available in two versions: Landmark and Residential. Both are W2W corner buildings.

    *Landmark*

    - Plop cost: 25,000
    - Lot size: 2x2

    *Residential*

    - Lot size: 2x2
    - R$$: 950
    - R$: 1,450
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31562-sophia-building/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB1.png.903538e3e99921e31d47d30ee489fe96.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB2.png.6a04652bf275b49f138b6a8c8ad8f00f.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB3.png.dab62334938d8f6b3134f0655c6d3581.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB4.png.57030429dfc629a6934d6e416aa304c0.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB5.png.4c909b4a7e24eb2072192d00c2d8d6f1.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB6.png.5bb290752bcaa8ec11c016c5452828e4.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_04/SB7.png.a7201afad283601f2d2a59b6b18bbc66.png
dependencies:
  - jp-schriefer:sophia-building-model
# The lots are identical for Maxis Nite and Dark Nite, only the model differs.
assets:
  - assetId: jp-schriefer-sophia-building-landmark-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-sophia-building-residential-mn
    exclude:
      - "\\.SC4Model$"

---
group: jp-schriefer
name: sophia-building-model
version: "1.0"
