info:
  summary: Habib's fast food restaurant in Belo Horizonte as Landmark (SD and HD) and growable CS$$
  description: |-
    **Habib's** is a Brazilian fast food company that is specialized in Middle Eastern cuisine. It has more than 475 outlets (many of them self-owned) across the country and has recently begun expansion into foreign markets. It is known for its very low prices and exotic dishes. Middle Eastern dishes are very popular in Brazil since people from that area, particularly Lebanon and Syria, immigrated to Brazil, despite their numbers being less than 0.48% of the overall population.

    This BAT was suggested by Bastet69008. It is located in Belo Horizonte, Brazil.

    **Information**

    *Landmark SD and HD*

    - Lot size: 2x2
    - Plop cost: $10,000

    *Growable CS$$*

    - Lot size: 2x2
    - Jobs: CS$$ = 30 / CS$ = 60

    There are also some cars as props in the drive-thru.

    The lot was made with custom LODs around the building, which means you can edit it in Lot Editor the way you like it.
