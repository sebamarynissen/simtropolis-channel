group: jp-schriefer
name: 667-madison-avenue
version: "1.1"
subfolder: 300-commercial
info:
  summary: Modernist skyscraper in Manhattan in Landmark and Commercial Office versions
  description: |-
    **667 Madison Avenue** is a 24-story modernist skyscraper in the Lenox Hill neighborhood of Manhattan, New York City, U.S.A. Designed by Helpern Architects and constructed in 1989, it is acknowledged as Manhattan's finest boutique office building. The 667 Madison Avenue Statue of Liberty is a bronze casting of the original plaster sculpture from which the New York Harbor Statue of Liberty was scaled. The work was acquired and installed by Leonard Stern in 2011 as a salute to American democracy and the legacy of the French-American alliance. Mr. Stern's father Max immigrated through Ellis Island in 1926 and often recalled the powerful moment of sighting the Statue of Liberty as his ship entered New York Harbor.

    **Information**

    The model is available in two versions: Landmark and Commercial Office. Both are corner models.

    With the custom LODs it's possible to add furniture as props on the terraces in case anyone wants to do it.

    *Landmark*

    - Plop cost: 80,000
    - Lot size: 3x2

    *Commercial Office*

    - Lot size: 3x2
    - CO$$$: 3,500
    - CO$$: 5,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31892-667-madison-avenue/
