group: jp-schriefer
name: great-southwest-building
version: "1.1"
subfolder: 300-commercial
info:
  summary: Art deco skyscraper in Houston with and without the annex building, in Landmark and Commercial Office versions
  description: |-
    The **Great Southwest Building**, formerly the Petroleum Building, is a skyscraper built in 1926 and located at 1314 Texas Avenue in Downtown Houston, Texas, in the United States. The structure was originally commissioned by Joseph S. Cullinan, founder of The Texas Company, to house the offices of his growing oil and gas business. Designed by New York architect Alfred Bossom, the building features Art Deco style with unusual Mayan touches including reliefs and a stepped back style on upper floors to mimic a Mayan pyramid.

    **Information**

    The model is available in two versions, Landmark and Commercial Office (CO$$$), and with and without the annex building. All of them are corner W2W. Both the versions with and without the annex are installed.

    *Landmark, with annex*

    - Plop cost: 70,000
    - Lot size: 3x2

    *Commercial Office, with annex*

    - Lot size: 3x2
    - CO$$$: 1,500
    - CO$$: 2,000

    *Landmark, no annex*

    - Plop cost: 55,000
    - Lot size: 2x2

    *Commercial Office, no annex*

    - Lot size: 2x2
    - CO$$$: 1,500
    - CO$$: 2,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31848-great-southwest-building/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/100.png.8cdffac93a79b4f59038bad2695f9362.png
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/104.png.1d74659339c208f89496f816508ffec7.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2017_07/108.png.331120e1060fd98984b553d1f6e35d8c.jpg
dependencies:
  - jp-schriefer:great-southwest-building-models
# The lots are identical for Maxis Nite and Dark Nite, only the models differ.
