  - assetId: jp-schriefer-great-southwest-building-with-annex-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-great-southwest-building-no-annex-mn
    exclude:
      - "\\.SC4Model$"

