group: jp-schriefer
name: bank-of-brazil-branch
version: "1.0"
subfolder: 300-commercial
info:
  summary: Bank of Brazil branch in Belo Horizonte in Landmark and Commercial Service versions
  description: |-
    This is a **Bank of Brazil** branch located in the center of Belo Horizonte, MG, Brazil. Western Union is also working in this building.

    **Information**

    The model is available in two versions: Landmark and Commercial Service. Both are corner models.

    With the custom LODs it's possible to add furniture as props on the terraces in case anyone wants to do it.

    *Landmark*

    - Plop cost: 15,000
    - Lot size: 2x2

    *Commercial Service*

    - Lot size: 2x2
    - CS$$: 250
    - CS$: 400
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/32695-bank-of-brazil-branch/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2019_01/1.png.49c93e804e849660347a1278660e45e9.png
    - https://www.simtropolis.com/objects/screens/monthly_2019_01/4.png.b2434d981d5ca0d20d63b8d36bd66f73.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_01/5.png.f8664f72d6f89a2062ab42457e51ecfd.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2019_01/6.png.59863ba9e59a72ab97614a4daa16d032.jpg
dependencies:
  - jp-schriefer:bank-of-brazil-branch-model
# The lots are identical for Maxis Nite and Dark Nite, only the model differs.
assets:
  - assetId: jp-schriefer-bank-of-brazil-branch-landmark-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-bank-of-brazil-branch-commercial-service-mn
    exclude:
      - "\\.SC4Model$"

---
group: jp-schriefer
name: bank-of-brazil-branch-model
version: "1.0"
subfolder: 110-resources
info:
  summary: Model dependency for `pkg=jp-schriefer:bank-of-brazil-branch`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/32695-bank-of-brazil-branch/
# The model is identical for the commercial and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-bank-of-brazil-branch-commercial-service-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-bank-of-brazil-branch-commercial-service-dn
        include:
          - "\\.SC4Model$"

