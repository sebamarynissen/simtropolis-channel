  summary: Model dependency for `pkg=jp-schriefer:15-goitacazes-street`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31476-15-goitacazes-street/
# The model is identical for the commercial and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-15-goitacazes-street-commercial-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-15-goitacazes-street-commercial-dn
        include:
          - "\\.SC4Model$"

