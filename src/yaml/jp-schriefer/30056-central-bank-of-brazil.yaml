  summary: Central Bank of Brazil in Growable (CO$$$) and Landmark versions
  description: |-
    The **Central Bank of Brazil** (Portuguese: Banco Central do Brasil) is Brazil's central bank. It was established on December 31, 1964. The bank is not linked to any ministry, currently being autonomous. Like other central banks, the Brazilian central bank is the principal monetary authority of the country. It received this authority when it was founded by three different institutions: the Bureau of Currency and Credit (SUMOC), the Bank of Brazil (BB), and the National Treasury.

    **Information**

    Growable (CO$$$) and Landmark (non-functional):

    - Lot size: 4x4
    - Plop cost: $50,000
