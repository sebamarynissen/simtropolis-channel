version: "1.0"
subfolder: 200-residential
info:
  summary: Solar das Paineiras residential building in Belo Horizonte in HD and SD
  description: |-
    The **Solar das Paineiras** building is part of a residential complex built at the end of the 70s and planned by the architect Joel Campolina in the city of Belo Horizonte, Brazil.

    Note: I preferred to make a "cleaner" version, as the buildings probably were when finished in the early 80s.

    **Information**

    The model is available in two versions: Landmark and Residential.

    *Landmark*

    - Plop cost: 5,000
    - Lot size: 2x3

    *Residential*

    - Lot size: 2x3
    - R$$: 150
    - R$: 300

    **Broken lots in the original upload**

    Three lot files of the original upload are broken: they contain no lot data and are not installed. These are the Landmark lot of the SD version (in both the Maxis Nite and the Dark Nite upload) and the Landmark lot of the HD Maxis Nite version. The remaining lots are the Residential lot (SD only) and the HD Landmark lot of the Dark Nite version.

    The HD version installs the HD Landmark lot (Dark Nite only) and the Residential lot from the SD set. The HD and SD models have different IDs, so the Residential building is shown in SD. For Maxis Nite, there is no working HD lot, so the HD and SD versions are the same and no resolution is asked.
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/30978-solar-das-paineiras-residential/
