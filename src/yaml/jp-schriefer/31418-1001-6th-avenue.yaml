group: jp-schriefer
name: 1001-6th-avenue
version: "1.0"
subfolder: 300-commercial
info:
  summary: Art deco building in Manhattan in Landmark and Commercial Office versions
  description: |-
    Located at 1001 6th Avenue in Manhattan, the art deco building was designed by Buchman & Kahn. Completed in 1926, it houses several commercial offices.

    **Information**

    The model is available in two versions: Landmark and Commercial Office. It is a W2W corner building.

    *Landmark*

    - Plop cost: 75,000
    - Lot size: 2x2

    *Commercial Office*

    - Lot size: 2x2
    - CO$$$: 1,750
    - CO$$: 2,000
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31418-1001-6th-avenue/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/Thumb.png.21b658de1ff39b37679cc76dbd7218f1.png
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/13.png.bdc362f0c1d2088f43b9e03ddc71ef3e.jpg
    - https://www.simtropolis.com/objects/screens/monthly_2016_12/Real.jpg.a137ff5c0091957f63f50d302094dcf3.jpg
dependencies:
  - jp-schriefer:1001-6th-avenue-model
# The lots are identical for Maxis Nite and Dark Nite, only the model differs.
assets:
  - assetId: jp-schriefer-1001-6th-avenue-landmark-mn
    exclude:
      - "\\.SC4Model$"
  - assetId: jp-schriefer-1001-6th-avenue-commercial-office-mn
    exclude:
      - "\\.SC4Model$"

---
group: jp-schriefer
name: 1001-6th-avenue-model
