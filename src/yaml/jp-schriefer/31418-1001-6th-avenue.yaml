  summary: Model dependency for `pkg=jp-schriefer:1001-6th-avenue`
  author: JP Schriefer
  website: https://community.simtropolis.com/files/file/31418-1001-6th-avenue/
# The model is identical for the commercial and the landmark version.
variants:
  - variant: { nightmode: standard }
    assets:
      - assetId: jp-schriefer-1001-6th-avenue-commercial-office-mn
        include:
          - "\\.SC4Model$"
  - variant: { nightmode: dark }
    dependencies:
      - simfox:day-and-nite-mod
    assets:
      - assetId: jp-schriefer-1001-6th-avenue-commercial-office-dn
        include:
          - "\\.SC4Model$"

