info:
  summary: "A DLL Plugin for SimCity 4 that clears pollution from a city."
  conflicts: "Only compatible with game version 1.1.641, the Windows digital edition."
  description: |
    A DLL Plugin for SimCity 4 that clears pollution from a city.

    The DLL adds a ClearPollution cheat that can be used to clear Air, Water, Garbage and/or Radiation pollution from a city. The cheat takes an optional Air, Water, Garbage or Radiation parameter to control what type of pollution to remove. When run without parameters, it will clear all 4 pollution types.

    The cheat is intended to remove phantom pollution caused by improperly modded lots that have been demolished. The game will recalculate the pollution values for the city tile after running the simulation for a few months.

    **System Requirements**

    * Windows 10 or later
    * Microsoft Visual C++ 2022 x86 Redistributable

    The plugin may work on Windows 7, but I do not have the ability to test that.

    **Troubleshooting**

    The plugin should write a SC4ClearPollution.log file in the same folder as the plugin.
    The log contains status information for the most recent run of the plugin.

    **Source Code and Support**

    Plugin thread: https://community.simtropolis.com/forums/topic/763874-clear-pollution-dll-plugin/

    The plugin's source code and issue tracker are located on GitHub: https://github.com/0xC0000054/sc4-clear-pollution

    If you would like to make voluntary contributions to support me in continuing to create more content for SimCity 4, I accept donations via PayPal: https://paypal.me/0xC0000054

    Thanks to the few people who have donated to me.

