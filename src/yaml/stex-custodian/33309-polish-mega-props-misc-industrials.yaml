info:
  summary: Polish Mega Props - MISC Industrials
  description: |-
    This is an overall compilation (update and expansion) of Aras's so-called AC Saturn Prop Pack and his several industrial related models, which were released separately on the SimCity Polska site, which is no longer running. It also contains some of the loose, separately released single models from a few authors, and some other industrial related models.

    This is a dependency package, and it doesn't contain any ploppable or growable elements, although it can be used for creating new lots with the Maxis Lot Editor or PIM-X.

    (Sidenote: none of these models and props are creations of Tyberius06 or the STEX Custodian. They were created by Aras/AC, kb7/kbieniu7, Perun, MRQS, Rajfurke and Zarzyk. All credits go to them.)

    This dependency package contains 53 models and props, compiled into one single `.dat` file. These are not new content per se: they were released either separately in smaller prop packs or as part of other uploads on the defunct SimCity Polska (SCP) site. The props and models come from different sets from different times, and therefore their quality is not equal. It contains props and models from Aras's AC Saturn Prop Pack and other industrial related models and props from his separate uploads, and also from different creators.

    **Credits and thanks**

    Thanks to the following great custom content creators for their work:

    - Aras: all the great models and props under the AC alias, and the Saturn prop pack.
    - Kbieniu7: coal props. Also the support and help with the SCP Restoration Project, and for allowing the creation of this mega prop pack as part of it.
    - RaV, Rajfurke, MRQS and Perun: the various misc props and models in this pack.
    - Zarzyk: Bucket-wheel Excavator and coal model.
    - Tyberius06 and the STEX Custodian: compiling the separate prop packs into this mega prop pack, and creating the readme and the cleanitol file.

    Special thanks to everybody who has been involved in collecting the lost SimCity Polska content, for the help and support from the Current Collection/SimCity Polska Organization Club: Yarahi, kschmidt, sejr99999, CorinaMarie, Cyclone Boom, catty-cb, Mika88, ramrec, monkeywater, RaV, Duco, AsimPika3172, matias93, 11241036.

    **Support**

    These are legacy contents, so the support is very limited. Please post any feedback or support issues in the appropriate forums of the Simtropolis SimCity Polska Organization Club and/or the STEX Custodian General Support Topic. We will attempt to answer them to the best of our knowledge, and as quickly as possible.
  author: Aras, Kbieniu7, RaV, Rajfurke, MRQS, Perun, Tyberius06
