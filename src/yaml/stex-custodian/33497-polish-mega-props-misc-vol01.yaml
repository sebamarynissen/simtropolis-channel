info:
  summary: Polish Mega Props - MISC Vol01
  description: |-
    This is a dependency package, and it doesn't contain any ploppable or growable elements, although it can be used for creating new lots with the Maxis Lot Editor or PIM-X.

    (Sidenote: none of these models and props are creations of Tyberius06 or the STEX Custodian. They were created by the custom content creators listed below. All credits go to them.)

    This dependency package contains 155 models and props, compiled into one single `.dat` file. These are not new content per se: they were released either separately in smaller prop packs or as part of other uploads on the defunct SimCity Polska (SCP) site. The props and models come from different sets from different times, and therefore their quality is not equal. It contains props and models from the original Polish Prop Packs (1-2) made by Fordoniak/adik151/adrian10; from Aras's Polish Bus Props Pack; the Bus Depo, border control office, rural Polish bus sheds and Palm Tree props made by Kbieniu; and some smaller separately released props from different creators, like RaV, Ferox and szymcar.

    A detailed list of the used content is available in the readme file of the original download.

    **Credits and thanks**

    Thanks to the following great custom content creators for their work:

    - Fordoniak/adik151/adrian10: the original Polish Prop Packs, and the Polish House and Block Packs.
    - Aras: all the great models and props under the AC alias, and the Polish Bus and Saturn prop packs.
    - Kbieniu7: Polish Road Signs, Bus Depo and Palm Tree props. Also the support and help with the SCP Restoration Project, and for allowing the creation of this mega prop pack as part of it.
    - MRQS: Railcar Set and the Mineshaft model.
    - RaV, Rajfurke, Ferox, szymcar and Perun: the various misc props and models in this pack.
    - Tyberius06 and the STEX Custodian: compiling the separate prop packs into this mega prop pack, and creating the readme and the cleanitol file.

    Special thanks to everybody who has been involved in collecting the lost SimCity Polska content, for the help and support from the Current Collection/SimCity Polska Organization Club: Yarahi, kschmidt, sejr99999, CorinaMarie, Cyclone Boom, catty-cb, Mika88, ramrec, monkeywater, RaV, Duco, AsimPika3172, matias93, 11241036.

    **Support**

    These are legacy contents, so the support is very limited. Please post any feedback or support issues in the appropriate forums of the Simtropolis SimCity Polska Organization Club and/or the STEX Custodian General Support Topic. We will attempt to answer them to the best of our knowledge, and as quickly as possible.
