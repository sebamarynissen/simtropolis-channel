info:
  summary: Long slope transitions for rail, El-Rail, GLR and subway by Caribou and Tyberius06
  description: |-
    This upload is a combination of **Caribou**'s original Long Slope Transitions, that were released originally on his website almost two decades ago, and the former **Heretic-Caribou GLR Ramp Transition Relot** set, that was released both on the former *SC4Devotion LEX* and on the *STEX*. Since the demise of Caribou's original site, his contents were restored on STEX as part of early community wide restoration efforts and later they were brought under the **STEX Custodian** umbrella.

    These original Caribou Long Slope Transitions (released in 2007) were re-hosted as they were originally released (restored in 2018 on STEX), but it's time to give them some well needed technical update. Since the former Heretic-Caribou GLR Ramp Transition relots (released in 2018) also required some technical update and they needed to be brought up to current NAM/MTA standards, for better accessibility the decision was made that the two uploads would be compiled into ONE upload.

    This compilation contains the following:

    - Caribou's three original models and lot files
    - the five lots, the props and the custom paths for El-Rail that were coming with the Heretic-Caribou GLR Ramp Transition Relot set
    - an additional brand new lot to complement the set
    - revised and extended custom network paths for both El-Rail and Rail to cover the ramps

    The custom network paths are available for right-hand drive and left-hand drive (UK, Australia, Japan). You can choose between them with the `driveside` variant.

    **Credits**

    **The models and the original lots were created by Caribou**, all credit goes to him for that!

    The additional lots, the updated modding, the custom network paths, props and expanded functionality of all the lots have been made by **Tyberius06**.

    Special gratitude goes to the following people:

    - **Simmer2** (SM2) - providing the uploads during their restoration on STEX
    - **Pikachu_SQ** and others - continuous efforts for preserving these contents for the community

    **Original description**

    It has come to my attention that Caribou's website went down back in 2016 and after scouring the internet there is no trace of any of his work.

    Since I have his work stored in a secure offline vault, I feel that in the spirit of preservation, his work should be available to the public once again.

    **These lots and models were made by Caribou and are provided AS IS, nothing in the zips has been changed by me.**

    Since he never provided any pictures I took it upon myself to plop all the lots in game for the purpose of taking snapshots in order for everyone to peruse them before downloading.

    Anyone in the future who would like to create new lots from these models can now use these uploads as a dependency.

    There are 3 lots in this zip:

    1. caribou long slope
    2. caribou long slope 2
    3. caribou long slope 3

    Many thanks go to **Tyberius06** for bringing this matter to my attention.

    Kind regards

    Simmer2
