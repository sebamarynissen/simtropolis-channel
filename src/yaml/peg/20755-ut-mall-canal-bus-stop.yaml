info:
  summary: 3x1 bus stop and end cap for the PEG-UT Mall Canals
  description: |-
    This PEG Utopia Series lot is similar in size (3x1) and style to the Mall Canal Plaza lot and can be used as a similar "end-cap" or extender piece. But as the name implies, it is a functional Bus Stop with the same costs and properties of a normal bus stop. The lot also features a large Mall Canal sign and elevator access to the mall & canal below.

    Obviously, the lot was intended for use with the Utopia Mall Canals... but could be used by itself. However, if you put up a big, honking Mall Canal sign, you'd probably better also put a big, honking Mall Canal behind it somewhere. You wouldn't want your Sims thinking you'd cheaped out on the rest of the mall, now would you?

    \* The lot will appear in your Misc. Transportation Menu along with the normal Bus Stop lot.

    **\*\* This lot requires the PEG-UT Mall Canal Resource Pack (`pkg=peg:ut-mall-canal-resource-pack`).**

    **All Pegasus files are now legacy content and are no longer officially supported - however support from the wider community can be requested [here](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**.
