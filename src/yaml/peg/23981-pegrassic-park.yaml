  summary: Dinosaur statue props
  description: |-
    Pegrassic Park is a collection of dinosaur statue props that you can use in the Lot Editor  
    to make parks... or whatever your imaginations comes up with.  
      
    Enjoy!!

    *\* These custom props are free to use and distribute in lots your create for your own use or to publicly distribute.  If re-distributed, please reference the original prop pack as a dependency. Do not copy and redistribute the original prop material. Most of the props are larger in-game than the their bounding boxes will indicate in the L0t Editor. Most notably, the statues with longer tails may extend beyond the tile that the prop is placed on.* 

    **All Pegasus files are now legacy content and are no longer officially supported - however support from the wider community can be requested [here](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**.
