info:
  summary: 1x3 plaza and end cap for the PEG-UT Mall Canals
  description: |-
    This PEG Utopia Series Plaza is designed for use with the UT Mall Canals. Being the same depth as the canal lots (3 tiles), it blends in perfectly with all other lots in the series. The plaza is 1 tile wide and can be used as an "end cap" or filler to add more flexibility in matching the canals to a city's existing grid size.

    The lot features a large sign and escalator access to the mall & canals below. The lot has the same values, cost & resource usage of a small plaza. Like all other Mall Canal lots, this plaza will appear only in the Landmark menu.

    **\*\* This lot requires the PEG-UT Mall Canal Resource Pack (`pkg=peg:ut-mall-canal-resource-pack`).**

    **All Pegasus files are now legacy content and are no longer officially supported - however support from the wider community can be requested [here](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**.
