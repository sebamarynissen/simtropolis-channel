info:
  summary: Smallest version of the PEG-UT Mall Canal, 3 tiles wide
  description: |-
    This PEG Utopia Series lot is the smallest version of the **UT Mall Canal**. At only 3 tiles wide, it will fit in just about any city grid pattern. Used with the Mall Canal Plaza or Bus Stop, it can be stretched in a variety of ways to any block size.

    Like the other Mall Canal lots, this Small Mall Canal is a subterranean shopping mall. It's a CS$$$ ploppable lot... with jobs... and the YIMBY effects of a small plaza that will help spur nearby commercial development. This lot also helps boost your Mayor Approval Rating to a small degree.

    As this lot is half the size of the original version, all of its properties (jobs, costs, resource usage, pollution, etc.) have been reduced by approx. 1/2. Its plaza effects have also been reduced to about 1/2 of those of a small plaza.

    The basic depth of all UT Mall Canal lots is 3 tiles. They are designed to be modular... and can be connected directly together or separated by roads, avenues, rail... etc... or any other appropriate lot. As the canals run visually underground, you can actually have any amount of distance between them.

    The Mall Canals are extensively night lighted... and they are **Christmas Enabled** with colored lights and decorations that will appear only during the Holiday season. (game time) The Mall Canals also have custom queries that use random query sound effects... playing 1 of 5 different real-world mall recordings each time a lot is queried.

    **\*\* This lot requires the PEG-UT Mall Canal Resource Pack (`pkg=peg:ut-mall-canal-resource-pack`).**

    **All Pegasus files are now legacy content and are no longer officially supported - however support from the wider community can be requested [here](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**.
