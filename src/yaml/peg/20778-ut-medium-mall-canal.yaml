info:
  summary: Medium version of the PEG-UT Mall Canal, 4 tiles wide
  description: |-
    This PEG Utopia Series lot is a slightly smaller version of the **UT Mall Canal**. At only 4 tiles wide, it is ideal for cities locked in to a smaller grid size than the larger 6 tile wide version can accommodate.

    This Medium Mall Canal is also a subterranean shopping mall. It's a CS$$$ ploppable lot... with jobs... and the YIMBY effects of a small plaza that will help spur nearby commercial development. This lot also helps boost your Mayor Approval Rating to a small degree.

    As this lot is 2/3rds the size of the original version, all of its properties (jobs, costs, resource usage, pollution, etc.) have been reduced by 1/3rd.

    The basic depth of all UT Mall Canal lots is 3 tiles. They are designed to be modular... and can be connected directly together or separated by roads, avenues, rail... etc... or any other appropriate lot. As the canals run visually underground, you can actually have any amount of distance between them.

    **\*\* This lot requires the PEG-UT Mall Canal Resource Pack (`pkg=peg:ut-mall-canal-resource-pack`).**

    **All Pegasus files are now legacy content and are no longer officially supported - however support from the wider community can be requested [here](https://community.simtropolis.com/forums/topic/68471-plex-on-the-stex-community-support/)**.
