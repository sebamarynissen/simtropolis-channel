info:
  summary: "A DLL plugin that enables DirectX 11 in SimCity 4, improving performance and stability"
  conflicts: "Only compatible with game version 1.1.641, the Windows digital edition."
  description: |-
    SCD3D11 replaces SimCity 4's old DirectX 7 hardware renderer with a modern DirectX11 one. Your cities look the way they always have, but the game now draws through the graphics path that today's video cards, drivers and Windows versions are built and tested for. 
    
    **Why use it?**
    
    * Built for modern hardware. DirectX 7 has been deprecated for twenty years and gets little attention in current drivers. Direct3D 11 is fully supported on every recent GPU. 
    
    * Higher performance. You should see significant performance improvements over the default DirectX 7 renderer or dgVoodoo and other DX wrappers. 
    
    * Borderless fullscreen. Play fullscreen in a window that covers the whole monitor, so Alt+Tab is quick and other windows can sit on top of the game. 
    
    * High resolutions. Runs at any resolution you give SC4, 4K included.
    
    * The right GPU on laptops. On laptops with both an integrated and a dedicated graphics card, SCD3D11 picks the fast one automatically. 
    
    * Better ReShade. ReShade effects are applied to the city only, so the menus and info windows stay sharp. Depth effects such as ambient occlusion, depth of field and fog work straight away, with no depth buffer setup. 
    
    * Optional live shadows. Real shadows cast along SC4's own sun. Buildings, trees, props and network pieces shade each other, and hills shade the land behind them. Off by default because it costs some frame rate. 
    
    * Safer region thumbnails. Switching away from the game while it saves no longer leaves a blank city thumbnail in the region view. 
    
    * Nothing to configure to get started. The game picks SCD3D11 up by itself. No launch switches are needed, and removing two files puts everything back the way it was. 
    
