info:
  summary: "DLL that smooths diagonal jagged edges in steep terrain, independent of the installed terrain mod"
  conflicts: "Only compatible with game version 1.1.641, the Windows digital edition."
  warning: "Existing terrain is only corrected after a nearby terrain update, such as raising or lowering a tile or building a road. New terrain is correct straight away."
  description: |-
    SC4 DJEM Fix corrects diagonal jagged edges in steep SimCity 4 terrain. The game divides each terrain cell along one diagonal. Near a sharp height change, the other diagonal can give a smoother surface. This DLL selects the diagonal with the smaller height discontinuity after the game updates terrain normals and cliff textures, making diagonals look a lot smoother. The fix also keeps prop placement and other height-dependent behavior aligned with the rendered surface, so that props along the diagonal are positioned correctly.

    Unlike typical diagonal jagged edges mods, this one is completely independent of your installed terrain mod or slope mod and will not turn every height difference into the cliff texture.

    Existing terrain needs a nearby terrain update (raising or lowering a tile, building a road, ...) for the fix to apply in that location. New terrain is immediately correct.

    The fix can be tuned or switched off in `SC4DjemFix.ini`.
