info:
  summary: Mechanical engineering company Klemmt & Sons by Mathe Man
  description: |-
    The medium-sized mechanical engineering company Klemmt & Sons produces heavy equipment. The building is designed after a 60s structure, featuring a row of well-visible external braces that carry the travelling crab which is used for lifting heavy loads, such as large diesel engines.

    **Lot Statistics:**

    - Lot size: 3x4 tiles
    - Building style(s): Industry
    - Stage: 3
    - Jobs: 57 I-M
  author: Andreas Roth
