info:
  summary: Donutor Inc. as growable I-HT lot and ploppable power plant
  description: |-
    In their annual report, the local police administration suggested improving the donut supply for their cops. A team was founded to develop a project, and finally they handed over their plans for the construction. Unfortunately, the documents were partially destroyed by a nasty virus. From the remaining data that could be recovered, a donutor was designed, and the associated Donutor Inc. was established. Completely diverging from the former project, the Donutor produces high-density energy cells in torus-form. Actually, donuts are a form of energy supply, too, aren't they?

    **Update:** Growable and power plant version included. The power plant version has the same statistics as the hydrogen power plant, but less output. Please bulldoze any landmark versions first before you install the power plant version, since they use the same IDs. Thanks to ardecila for the power plant idea.

    This lot comes with an EXE installer. A Mac-compatible version will be available at the [BSC Mac archive](http://homepage.mac.com/kbooms1w/FileSharing12.html).

    **Dependencies**

    -   [SFBT Essentials](https://www.simtropolis.com/stex/details.cfm?id=14212)

