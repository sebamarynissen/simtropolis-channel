info:
  summary: Park Set Low Wealth
  description: |-
    Like the SFBT Park Set by Andreas, this download contains a set of red park trails, covered with brick gravel, like it is common in lower wealth areas. The textures have been adapted to low wealth lots, and in order to prevent the low wealth development from upgrading, these lots don't have any park and landmark effects. They do clean the air, though, like any other park, and they also come with a small demand cap relief. The set contains straight and diagonal paths, as well as some curves, to allow a variety of different parks. All park lots are using deadwood's alignment props that show up during the placement of the lots, and then disappear forever.

    **Lot Statistics**

    |  |  |
    | --- | --- |
    | Lot size: | 1x1, 1x2 tiles |
    | Menu position: | Parks |
    | Plop cost: | §2 to § 10 |
    | Bulldoze cost: | § 1 to § 6 |
    | Monthly cost: | § 1 to § 5 |
    | Air pollution: | -4 over 3 tiles |
    | Water pollution: | 1 over 1 tiles |
