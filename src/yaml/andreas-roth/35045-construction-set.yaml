     SFBT Construction Set

    SFBT Classics 

    This set contains 23 different lots which can be used to create custom construction sites. The range includes simple dirt textures as well as construction site fences, construction vehicles, tower cranes and supply depots. All lots can be found in the airport menu - probably the only one that isn't overcrowded yet. ;-)  
      
    **Note:** This download includes a modified copy of Swamper77's [construction filler kit](http://www.simtropolis.com/stex/details.cfm?id=12312) with matching icons and menu position. Please remove either the included lots or the original lots by Swamper77 before using them in the game. If you like to use the included lots, please bulldoze the original lots first.

     Lot Details and Information

