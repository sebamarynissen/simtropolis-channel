     Compatibility

    This download is only compatible with SimCity 4 incl. the "Rush Hour" expansion pack or SimCity 4 Deluxe.

     Notes about Nightlighting Effects

    These lots don't have any nightlighting.

     Disclaimer

    The usage of this download is on your own risk. We try to test our lots extensively, so they should work properly, but errors may still exist. The author and the [SimCityPlaza](http://www.simcityplaza.de), [SC4Devotion](http://www.sc4devotion.com) or [Simtropolis](http://www.simtropolis.com) owners are not responsible for any damages that may occur. Feel free to modify the lots for yourself and show them in your city journals, but please don't distribute them without asking us first.

