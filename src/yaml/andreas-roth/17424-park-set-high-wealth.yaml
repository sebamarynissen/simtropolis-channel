info:
  summary: Park Set High Wealth
  description: |-
    Like the SFBT Park Set by Andreas, this download contains a set of park trails with flowers, trees, and some new path textures. The grass is the same as it's used on the in-game high wealth lots, so this set allows your rich sims to take a walk through a lush green park. Apart from the standard orthogonal textures, you can also create diagonal paths, bends and gentle curves for more variety.  
      
    **Dependencies**

    -   BSC\_DAE\_ForestTracks\_props.dat from the [BSC Forest Lot series](https://www.simtropolis.com/stex/details.cfm?id=11032)
    -   [SFBT Essentials](https://www.simtropolis.com/stex/details.cfm?id=14212) November 2006 version

    **Lot Statistics**

    Lot size:

    1x1, 1x2, 1x3, 2x1, 2x2 tiles

    Menu position:

    Parks

    Plop cost:

    §15 to § 90

    Bulldoze cost:

    § 5 to § 20

    Monthly cost:

    § 5 to § 10

    Air pollution:

    \-2 over 2 tiles

    Water pollution:

    1 over 1 tiles
