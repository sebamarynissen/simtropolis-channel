info:
  summary: Diagonal industrial buildings of the Fractional Angle Building (FAB) series
  description: |-
    **FAB Diagonal Industrials**

    - Type: Landmark (I-M)
    - Menu: Landmarks
    - Lot size: 1x1 (overhanging building prop with right angle 45 degree trapezoid footprint)
    - Plop cost: 50
    - Bulldoze cost: 10
    - Capacity satisfied: 23
    - Prop family: 1, 2, 3, 4 story buildings in HD
    - Variations: Left and Right versions
    - Theme: 19th century/early 20th century/brown brick/W2W
    - Night lighting: Maxis

    **About:**

    Here is the first release in the Fractional Angle Building series, the FAB Diagonal Industrials. They fill the space next to any diagonal network. Mirrored left and right versions are included.

    The buildings use a prop family with between one to four stories appearing randomly on placement.
