info:
  summary: FA3 Factory
  description: |-
    Following the FA residentials, a large Victorian industrial lotted for FA3. It provides I-d jobs to 1000 sims and only minor pollution.   
    But wait, you prefer to keep things straight? Not to worry, the base is a separate prop which can be removed in the LE to make your own orthogonal lot.  
    As usual the models are suitable for all camera angles, and the all-inclusive file only weighs 148 KB.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Shops Diagonal Pack 1](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    Suggested for the lot:

    (BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props - Misc Vol02  
    BSC MEGA Props - MJB Vol01  
    BSC Mega Props - JES Vol05  
    BSC MEGA Props - SG Vol 01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Gizmo Vehicle Props](https://www.sc4evermore.com/index.php/downloads/download/22-dependencies/59-gizmo-vehicle-props)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/)

    [OrangeTSC MegaProp V.01](https://community.simtropolis.com/files/file/19953-orange-megaprop-v01/)

    If you enjoy these creations, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and as usual stay tuned for more coming to the STEX!

    justforfun
