info:
  summary: Automated Horse-drawn Carriage Automata Patch
  description: |-
    Do you still get a pesky white pick-up roaming your street despite using the full horse-drawn carriage set? It turns out the problem was caused by a mistake found by [@CorinaMarie](https://community.simtropolis.com/profile/737259-corinamarie/) in the Maxis exemplar 10910000. But now this file overrides the Maxis bug, replacing the pick-up with a carriage in a new colour variation.   
    Important: in case you have installed the Maxis Air Force Base, please make sure this patch loads after that.

    Do you enjoy these automata? Check out my other files and as usual stay tuned for more coming to the STEX!

    justforfun
