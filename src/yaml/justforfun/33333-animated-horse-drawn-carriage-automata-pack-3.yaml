info:
  summary: Animated Horse-drawn Carriage Automata Pack 3
  description: |-
    Third instalment of Victorian horse-drawn carriages, this time focusing on the working class:  
    6 wagons, 10 vans, and 5 floats all driven by working people and carrying crates, bags, vegetable boxes, dairy, demijohns, cans, bakery goods, and what not.

    These animated, articulated carriages will replace another chunk of Maxis car automata.   
    To ensure proper functionality it is essential that you download the first two packs:

    [https://community.simtropolis.com/files/file/33178-animated-horse-drawn-carriage-automata-pack-1/](https://community.simtropolis.com/files/file/33178-animated-horse-drawn-carriage-automata-pack-1/)

    [https://community.simtropolis.com/files/file/33234-animated-horse-drawn-carriage-automata-pack-2/](https://community.simtropolis.com/files/file/33234-animated-horse-drawn-carriage-automata-pack-2/)

    It is also advisable that you download the horse-riders who replace Maxis motorcycles:

    [https://community.simtropolis.com/files/file/33187-animated-horse-riding-gentlemen-automata/](https://community.simtropolis.com/files/file/33187-animated-horse-riding-gentlemen-automata/)

    IMPORTANT: Each pack contains a file named "MaxisCarsSuppressor\_optional", which allows you to suppress most of the remaining Maxis cars; please make sure you only keep the latest one contained in the present pack, or that it loads last.

    More packs are in the works to turn the clock of your cities some 150 years back. Please review if you like them!

    justforfun
