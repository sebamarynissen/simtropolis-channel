info:
  summary: Priory Primary
  description: |-
    Inspired by a former school in Colchester, a small red-brick Victorian primary for your little sims.   
    It sits on a 3x3 lot, and the trees in the garden will vary every time you plop it. The model can be enjoyed from any camera angle, and the all-inclusive file takes only 60 KB of disk space.

    DEPENDENCIES:

    Essential for the model:

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    Recommended for the lot textures, bike shelter and tree families:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - Jen\_P Vol01  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02  
    BSC Textures Vol 01  
    BSC Textures Vol 02) all contained in the  [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)  or later

    [BSC Mansion - Uppark Estate](https://cafe.naver.com/simcitysquare/34687)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    [has\_dependencies](https://community.simtropolis.com/files/file/37258-has_dependencies/)

    If you like these creations, stay tuned for more coming to the STEX!

    justforfun
