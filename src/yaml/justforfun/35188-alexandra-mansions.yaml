info:
  summary: Alexandra Mansions
  description: |-
    Inspired by London's Hyde Park Mansions on Cabbell Street, here is an apartment block for your $$$ sims. Since it is not an exact copy of the real building, I just gave it a fictional name. These classy flats grow on a 6x2 medium or high-density lot under Chicago tileset and provide residence to 200 sims.

    IMPORTANT: this model is an S3D, not a BAT, which means it looks like the ingame automata, with crisp textures yet no shading. It will stand out from other models and look sharper and brighter. Thanks to the "magic" of S3D, the whole file will take less than 17 KB of your disk space!

    DEPENDENCIES:

    Essential for the model and building:

    [JFF Victorian Row Shops Pack 01 version 1.1.0](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Barry Mansions](https://community.simtropolis.com/files/file/35180-barry-mansions/)

    For the plants and trees:

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [BSCBATPropsMatt325\_Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2383)

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC Mega Props - CP Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2790)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)

    If you enjoy these models, stay tuned for more coming to the STEX!

    justforfun
