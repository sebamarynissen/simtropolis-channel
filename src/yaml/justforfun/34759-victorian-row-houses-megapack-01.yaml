info:
  summary: Victorian Row Houses MegaPack 01
  description: |-
    Have you ever wanted to build a Victorian city or district, yet felt frustrated by lack of variety?  This pack is here to help, bringing to you no less than 100 new types of period row houses, namely 30 R$, 45 R$$, and 25 R$$$, many in several colour variations, plus a few wall and fence props which will allow you to create a wide variety of period streets.   
    All the models are w2w and most grow on a 4x2 medium-density lot under Chicago tileset.  
    The mews houses grow on a 2x4 or 1x4 lot.   
    Two R$$$ are grid-breaking diagonals that grow on a 1x1 lot. To build streets with these, I suggest using the "buildingplop" cheat (you'll find the set under "R$ JFF terrace", "R$$ JFF terrace", and "R$$$ JFF terrace" and following entries) and then the fantastic growification tool by [@smf\_16](https://community.simtropolis.com/profile/259789-smf_16/)  
    If you want to use the props in the Lot Editor, they are easily found under the prefix JFF.

    IMPORTANT: these models are S3Ds, not BATs, which means they look like the in-game automata, with crisp textures yet no shading. They will stand out from other models and look sharper and brighter.  There might be a future release in standard BAT format if the conversion is resumed.  Personally I use the S3Ds in game as I love the high definition and the tiny memory they require when compared to BATs - the whole pack inclusive of .desc and .lot files weighs less than 5MB!

    DEPENDENCIES: While all the house models are included, to enjoy the full variety of props in the gardens and yards you need the following prop packs, most of which you likely already have.  Many thanks to [@11241036](https://community.simtropolis.com/profile/353048-11241036/) for suggesting a technique to share my custom prop families without using actual families.

