info:
  summary: Post Offices Pack 2
  description: |-
    The ten post offices of the first pack weren't enough to cover your sprawling city? Here come ten more! Once again in various styles and lot sizes suitable for straight, diagonal, and corner settings.

    If you download the ploppable version you'll find the icons in the landmark menu, with descriptions of which layout each post office is suitable for and how many CO$$ or CO$$$ jobs it provides.  
    Alternatively you can download the growable version and plop these with the extracheats plugin, like I personally do. In this case you'll find them listed under "CO$$ JFF Post office", as they all share the same CO$$ building.

    Did you get the mail delivery van along with pack 1? Then also these new offices will spawn the little Morris automata.

    The growable version weighs 642KB and the ploppable one 724KB - the rest of the download is pictures!

    DEPENDENCIES

    Essential for the models:

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached House Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Victorian Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    Recommended:

    (BSC MEGA Props - CP Vol01

    BSC Mega Props - CP Vol02

    BSC MEGA Props - Gascooker Vol01

    BSC MEGA Props - SG Vol 01

    BSC Textures Vol03) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [anotn - Augustenborg Houses](https://community.simtropolis.com/files/file/27274-augustenborg-houses/)

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [Bombardiere - Clerkenwell Close](https://community.simtropolis.com/files/file/31011-clerkenwell-close-hd-version/)

    [Namspopof Props Pack Vol 2](https://www.toutsimcities.com/downloads/view/1882)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you enjoy this expanded mail service, please like and review and stay tuned for more coming to the STEX!

    Justforfun
