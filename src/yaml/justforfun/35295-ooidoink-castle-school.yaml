info:
  summary: Ooidoink Castle School
  description: |-
    This is a relot of [@Alex\_Bervoets](https://community.simtropolis.com/profile/311037-alex_bervoets/) beautiful Ooidoink Castle, here turned into a 10x14 private boarding school.  
    It is meant to fit with Simgoober's narrow canal, which runs at the front.  The other sides have been left with no fence so that the school grounds can be extended to one's liking by adding parks and canal pieces.

    DEPENDENCIES:

    [Castle of Ooidoink](https://community.simtropolis.com/files/file/27205-castle-of-ooidonk-belgium/)

    [BSC MEGA Props JBSimio Vol03](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1891)  for the boarding houses

    [BSC Canals Narrow Set](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=944)

