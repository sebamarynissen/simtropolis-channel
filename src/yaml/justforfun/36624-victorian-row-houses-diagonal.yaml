info:
  summary: Victorian Row Houses Diagonal
  description: |-
    Do your pesky diagonal networks look too empty? Fill them out with this set of 12 diagonal row houses featuring 5 R$, 6 R$$ and 1 R$$$.  
    These true-3d models overhang from 1x1 lots covering a width of 2 or 3 diagonal tiles. Some R$ terraces also come in 2x3 double lots to cover 3x2.5 diagonal tiles with houses facing both ways (see documentation images).  
    Unlike their straight counterparts, these rows are only suitable for flat terrain.  
    The all-inclusive file weighs less than 700 KB.

    HOW TO USE

    1\. Prompt the "Lotplop" extracheat ([Extra cheats plugin](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)), look for "JFF diag..." and select the terrace you want. Plop lots A,B,C, or D so that architectural features align.   
    2\. Growify the lots as medium-density residentials ([Growify cheat dll plugin](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/))  
    3\. Decorate the gardens with your favourite MMPs.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semi-detached Houses Pack 1](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01/)

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Roundabout set](https://community.simtropolis.com/files/file/35519-ow-roundabout-set/)

    Recommended for the plants, bins etc.:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props Jen\_P Vol01

    BSC Mega Props - JES Vol02  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - Misc Vol02

    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol 01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [davide1983it Outdoor Set V1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/)   (Crates.dat)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you enjoy these houses check out my other files and as usual stay tuned for more coming to the STEX!

    justforfun
