info:
  summary: Industrial Corners Pack 1
  description: |-
    Building wall-to-wall neighbourhoods is fun, but it can be hard along diagonal roads and corners. So here's a pack of 6 Victorian industrials coming in various shapes and sizes to plop around odd intersections. Each of them provides 50 IM jobs and low pollution levels.   
    As usual the models are suitable for all camera angles, and the whole pack weighs a mere 260 KB.

    HOW TO USE:

    1) Simply prompt the "[Buildingplop](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)" extracheat, find the lots listed under "IM JFF Small factory", and plop the one you want (you may want to keep the documentation images for easy reference);  
    2) Fill any empty pavement tiles with your favourite plaza lots;  
    3) It is then a good idea to use the handy "[Growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/)" extracheat.

    DEPENDENCIES (essential for the models to appear correctly):

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Tenement 04](https://community.simtropolis.com/files/file/36401-tenement-04-diagonal/)

    If you like these industrials, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and stay tuned for more coming to the STEX!

    justforfun
