info:
  summary: Vintage Routemaster bus reskin
  description: |-
    Here is a modified and expanded version of Bigbib's London Routemaster bus automata

    [https://community.simtropolis.com/files/file/4548-london-routemaster-bus/?do=embed](https://community.simtropolis.com/files/file/4548-london-routemaster-bus/?do=embed)
    This upload would not be possible without his great model, which I have reworked to include new skins, a new RT type of bus (a model that was actually in use before the Routemaster),  and the prop version of the automata for you to use in the Lot Editor.

    The upload contains 3 files:

    \-A red Routemaster bus that will replace the Maxis one;  
    \-a green Routemaster that will work as additional bus;  
    \-an RT bus, also as additional.

    You can choose to use any or all of the 3 buses simultaneously as they don't conflict with each other.   
    If you happen to have Bigbib's original files in your plugins folder, please make sure this upload loads afterwords. However you do not need the original files in order for this upload to work.

    Although I was unable to get hold of Bigbib I would like to thank him for the original models, as well as [@CorinaMarie](https://community.simtropolis.com/profile/737259-corinamarie/), [@Cyclone Boom](https://community.simtropolis.com/profile/533355-cyclone-boom/), [@T Wrecks](https://community.simtropolis.com/profile/48496-t-wrecks/), [@rsc204](https://community.simtropolis.com/profile/651629-rsc204/),  for taking the time to give me technical advice and approving this upload.

    Please note: due to limitations of the game, when you click on the UDI icons the buses will be selected randomly. So if you want to drive a specific bus, just repeat the selection process until you get the one you want.

    Dependencies: none.

    Happy vintage journeys!

    ~ ~ ~ VERSION 2.0  released 09 JULY 2025 ~ ~ ~

    New models made from scratch, with open rear platform and more accurate shape as seen in the screenshots.

    Diagonal props added.

    If you downloaded the old version simply replace it with this one and all props will be automatically updated.
