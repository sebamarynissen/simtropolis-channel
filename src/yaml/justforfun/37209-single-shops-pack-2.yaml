info:
  summary: Single Shops Pack 2
  description: |-
    Keep filling your high streets with 20 more character shops in Victorian, Georgian, and Tudor style, featuring pubs and eateries, realtors, opticians, bookstores, fur and cloth retailers and more!  
    Growing on 1x1, 1x2, or 2x1 lots under medium-density Chicago tileset, they provide each 20 Cs$, Cs$$, or Cs$$$ jobs, and eight of them are well-suited for moderate slopes.

    If you plan to use the LotPlop extracheat, look for "JFF Cs$/Cs$$/Cs$$$ single shop #"  
    Eight shop fronts are separate props which can be used in the LE like those contained in the shop parades.   
    As always these models are suitable for all camera angles, and claim just over 1 MB of disk space.

    DEPENDENCIES:

    Essential for the models and buildings:

    [JFF Commercial Corners Pack 1](https://community.simtropolis.com/files/file/36807-commercial-corners-pack-1/)

    [JFF Commercial Transitions Pack 1](https://community.simtropolis.com/files/file/36929-commercial-transitions-pack-1/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 04](https://community.simtropolis.com/files/file/36147-victorian-row-shops-pack-04/)

    [JFF Semidetached Houses Diagonal](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Semidetached Houses Pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    Recommended:

    (BSC MEGA Props - CP Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - JBSimio Vol02  
    BSC MEGA Props - Jen\_P Vol01  
    BSC Mega Props - JES Vol02) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/)   (Crates.dat)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you enjoy this commercial galore, check out my other files and stay tuned for more coming to the STEX!

    justforfun
