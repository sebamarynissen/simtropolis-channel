info:
  summary: Animated Horse-drawn Carriage Automata Pack 7 - Freight
  description: |-
    Finally some serious freight is here! The 7th instalment of Victorian carriages replaces Maxis trucks with horse-drawn automata. The pack contains a replacement for the in-game flatbed, the industrial van, and the 6 semis, for the transport of crates, sacks, coal, liquids, and lumber.  It also replaces the standard cement mixer that appears when new buildings are under construction with a detailed Victorian equivalent.  
    All carriages are drawn by strong and hairy draft horses, the big ones even by 4 of them in two rows, which means that for the first time the sets are double-articulated. In other words, they have two joints that turn independently.  
    The open trailers come both empty and with 10 different cargoes to add variety.   
    Sooo... with a total of 118 carriages and 139 characters featured in the 7 packs + Mounted Police and Riding Gentlemen, the Maxis vehicle replacement is now complete and you can -in fact you need to!- delete the Maxis\_cars\_suppressor\_optional.dat file featured in the previous pack.

    DEPENDENCIES:

    [https://community.simtropolis.com/files/file/33912-animated-horse-drawn-carriage-automata-pack-6/](https://community.simtropolis.com/files/file/33912-animated-horse-drawn-carriage-automata-pack-6/)

    At this point your Victorian streets should be properly crammed with all sorts of horsey vehicles.   
    Please review and... happy deliveries!

    justforfun
