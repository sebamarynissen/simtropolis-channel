info:
  summary: British Phone and Mailbox Replacement
  description: |-
    For fellow builders of London-themed cities, this mod replaces the Maxis phone booths of all wealth levels and the Maxis blue postboxes with Bombardiere's HD British red phone boxes and red small pillarboxes (https://community.simtropolis.com/files/file/29965-british-boxes/) .

    Dependencies: none, Bombardiere's models are included for convenience. If you already downloaded Bombardiere's British Boxes, to avoid duplicates you may want to delete all the files of this mod but the BritishPhoneMail.dat

    Enjoy!
