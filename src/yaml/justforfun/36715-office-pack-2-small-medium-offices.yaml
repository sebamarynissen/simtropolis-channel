info:
  summary: Office Pack 2 - Small/medium offices
  description: |-
    Your sims are still hunting for desk space? Put them to work with this pack of 6 CO$$ and 4 CO$$$ character offices in various styles from England and Benelux. These true-3d W2Ws grow on medium-density 1x1, 1x2, or 2x2 lots under Chicago tileset.  
    The small ones have the same stats as the first pack; the medium ones provide 60 CO$$ or 54 CO$$$ jobs each.   
    If using the "lotplop" extracheat, the CO$$$ office 5 can be plopped in multiple instances to create a bigger block.  
    The all-inclusive file weighs less than 500KB.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Semidetached Houses Diagonal](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Townhouses Pack 1](https://community.simtropolis.com/files/file/36513-townhouses-pack-01/)

    [JFF Office Pack 1](https://community.simtropolis.com/files/file/36185-office-pack-1-small-offices/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    Recommended:

    (BSC MEGA Props - CP Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02) contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Nams Props Pack Vol 1](https://www.toutsimcities.com/downloads/view/1780)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)

    If you enjoy this work, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and as usual stay tuned for more coming to the STEX!

    justforfun
