info:
  summary: Victorian Semi-detached Houses Pack 01
  description: |-
    To provide ever more content for your period cities, here is a pack of 12 semi-detached houses in Victorian/Georgian style.   
    Seven of them are R$$, five are R$$$. They grow on medium-density Chicago-tileset 4x2 lots, except for the R$$$ semi 03, which takes a 5x2 lot, and the R$$$ semi 05, which takes a 6x3 lot.

    IMPORTANT: these models are S3Ds, not BATs, which means they look like the ingame automata, with crisp textures yet no shading. They will stand out from other models and look sharper and brighter. Personally I love the high definition and the tiny memory they require when compared to BATs - the whole pack inclusive of .desc and .lot files weighs less than 500KB!

    DEPENDENCIES:

    The first two are essential because they contain textures shared by the models:

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)  Please note: you need version 1.1.0 updated today!

    If you want to enjoy the full variety of props in the gardens and yards you then need the same dependencies listed under the Victorian Row Houses Magapack 01, plus the following:

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [Bombardiere Clerkenwell Library](https://community.simtropolis.com/files/file/31404-clerkenwell-library/)  (only the base texture)

    If you enjoy these models, stay tuned for more packs coming to the STEX!

    justforfun
