info:
  summary: OW Roundabout Set
  description: |-
    Give some character to your one-way roundabouts with this set of 9 centrepieces in various designs.   
    They come in 1x1 lots, will be found in your park menu, and have minimal maintenance costs.   
    The models are set up so that MMPs can be plopped on top, as you can see in the pictures.  
    Two versions provided: one with the arrows pointing right (RHD traffic), and the other for Britain and countries with LHD.

    Dependencies (essential):

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    If you enjoy my creations stay tuned for more coming to the STEX!

    Justforfun
