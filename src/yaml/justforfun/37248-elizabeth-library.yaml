info:
  summary: Elizabeth Library
  description: |-
    Inspired by a former library now converted into a bank, this Elizabethan-style building from London's Kensington is still very much a public library in Simland. It has a coverage radius of 2600m, a monthly cost of 60, stained-glass cupolas, and an overhanging diagonal side handy for roundabouts or bendy roads. Especially suitable for w2w environments.

    DEPENDENCIES: (essential for the model)

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached Houses Diagonal](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    If your sims enjoy their new reading den, let me know through likes and reviews, and as usual stay tuned for more coming to the STEX!

    justforfun
