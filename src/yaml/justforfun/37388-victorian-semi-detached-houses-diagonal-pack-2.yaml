info:
  summary: Victorian Semi-detached Houses Diagonal Pack 2
  description: |-
    To celebrate the return of Simtropolis, a new pack of 8 diagonal semis featuring 6 R$$ and 2 R$.    
    These true-3d models overhang from 1x1, 1x2, or 2x1 A and B lots fitting different diagonal spaces (see documentation images for details).  
    Unlike their straight counterparts, these semis are only suitable for flat terrain.  
    The all-inclusive file weighs only 353 KB.

    HOW TO USE

    1\. Prompt the "[Lotplop](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)" extracheat,  look for "JFF diag R$/R$$..." and select the semi you want  
    2\. [Growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/) the lots as medium- or low-density residentials  
    3\. Decorate the gardens with your favourite MMPs.  
    And it gets better: if you use the fantastic Plop&Paint mod, you'll be able to decorate even the front yards!

    DEPENDENCIES:

    Essential for the models and buildings:

    [JFF OW Roundabout set](https://community.simtropolis.com/files/file/35519-ow-roundabout-set/)

    [JFF Pelham Mansions](https://community.simtropolis.com/files/file/37243-pelham-mansions/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    JFF Row Houses Megapack 02

    [JFF Row Shops Diagonal Pack 1](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Houses Diagonal Pack 1](https://community.simtropolis.com/files/file/36624-victorian-row-houses-diagonal/)

    [JFF Semidetached Houses Diagonal Pack 1](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Semidetached Houses pack 1](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Tenement 04](https://community.simtropolis.com/files/file/36401-tenement-04-diagonal/)

    [JFF Townhouses Pack 1](https://community.simtropolis.com/files/file/36513-townhouses-pack-01/)

    Recommended for prop variety:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props - Jen\_P Vol01  
    BSC MEGA Props - Jes Vol02  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - Misc Vol02  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02) all contained in the  [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)  or later

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)

    [BSC Mansion - Uppark Estate](https://cafe.naver.com/simcitysquare/34687)

