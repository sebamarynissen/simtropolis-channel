info:
  summary: FA (and ortho) Residentials
  description: |-
    Fractional-angle networks are a fantastic addition to the game, but finding suitable custom content to line them with can be a challenge. So here is a pack of 10 residentials including semi-detached, detached, and row houses of all wealth levels that can be plopped neatly along FA2 or FA3 roads.   
    For each model there is also an ortho version, handy to create consistent neighbourhoods or in case you just don't use FA networks.  
    Details on the lot sizes can be found in the included documentation images.  
    As usual the models are suitable for all camera angles, and the all-in-one file weighs just 524 KB.

    HOW TO USE:

    For the FA lots, simply prompt the "Lotplop" [extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/) , look for "JFF FA..." and select the residential you want.  
    Once plopped, [growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/) the lots as medium- or low-density residentials.

    For the orthogonal lots, you can use the same method or simply zone residential and make them grow randomly.

    DEPENDENCIES:

    Essential for the models to appear correctly: (if you follow my content you may already have them all)

