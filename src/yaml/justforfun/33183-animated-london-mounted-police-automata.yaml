  summary: Animated London Mounted Police Automata
  description: |-
    Here is a horse-riding London policeman (also known as "bobby") that will replace your standard police cars in patrolling your cities. The uniform is that of Victorian times, and he even sports appropriate moustache.

    My SC4 adventure with horses actually started with this fellow, and again I must thank [@rivit](https://community.simtropolis.com/profile/240203-rivit/) for his invaluable help in getting the bobby and horse to work together smoothly.

    Sim malefactors beware, the valiant mounted bobbies are out to get you!
