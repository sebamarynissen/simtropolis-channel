info:
  summary: Post Offices Pack 1 + mail van automata
  description: |-
    Give your sims a widespread and efficient mail network with this set of 10 post offices!  
    They come in a variety of styles and lot sizes suitable for straight, diagonal, corner, or roundabout settings.

    If you download the ploppable version you'll find the icons in the landmark menu, with descriptions of which layout each post office is suitable for and how many CO$$ or CO$$$ jobs it provides.  
    Alternatively you can download the growable version and plop these with the extracheats plugin, like I personally do. In this case you'll find them listed under CO$$ JFF Post office, as they all share the same CO$$ building.

    Additionally, if you want your post offices to spawn a vintage mail delivery van, you can download the separate file containing the UDI automaton. It is a 1950s Morris van upscaled 20% to make it fit with Maxis vehicles. The "Royal Mail" logo on its side isn't really noticeable so this little automaton can suit any vintage city.  
    Included in the file are also straight, diagonal, and 22.5-angled props of the van which you can use in the LE.

    Lastly, both the growable and ploppable versions weigh about 700KB, the rest of the download is pictures!

    DEPENDENCIES

    Essential for the models:

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached House Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    Textures:

    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)

    [Vortexture 1 - Base Set v1](https://www.sc4evermore.com/index.php/downloads/download/168-vortext-vortexture-1-2-base-set-grass-and-dirt)

    Recommended:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - SG Vol 01   
    BSCBATPropsMattb325\_Vol02) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [Bombardiere - Clerkenwell Close](https://community.simtropolis.com/files/file/31011-clerkenwell-close-hd-version/)

    [PorkieProps-Vol1](https://community.simtropolis.com/files/file/11421-jenx-porkie-expanded-porkie-props/)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you enjoy this new mail service, please like and review and stay tuned for more coming to the STEX!

    Justforfun
