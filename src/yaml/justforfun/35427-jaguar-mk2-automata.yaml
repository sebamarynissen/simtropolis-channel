  summary: Jaguar MK2 automata
  description: |-
    Make your sims travel in style with the iconic Jaguar MK2 from the 60s, the luxury sedan famous for combining grace, pace, and space. Complete with UDI icons, these automata add to the city traffic and are also available as LE props in a choice of dark blue, silver blue, emerald green, amaranth, taupe, and cream.

    Scale is 20% bigger than real life, to blend in with Maxis cars. Insurance not included.

    Please like, review, and subscribe - oh my, I'm sounding like a youtuber!
