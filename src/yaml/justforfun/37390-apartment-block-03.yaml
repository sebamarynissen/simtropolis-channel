info:
  summary: Apartment block 03
  description: |-
    Inspired by Cleveland Residences in London's Fitzrovia, this Victorian apartment building is meant for w2w environments and comes in 4 lots: a 1x2, a 2x2, and two 1x2 corners. In this way it can be used modularly to create consistent blocks.  
    The model is suitable for all camera angles, and the all-inclusive file weighs only 69 KB.

    HOW TO USE

    You can simply zone for medium or high-density Chicago tileset, or

    prompt the "[Lotplop](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)" extracheat, look for "R$$\_JFF Apartment block 03 ..." and "[Growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/)" as medium or high density residential.

    DEPENDENCIES:

    Essential for the models and buildings:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Semidetached Houses Diagonal Pack 1](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Semidetached Houses pack 1](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01/)

    Recommended for prop variety:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - Jen\_P Vol01  
    BSC MEGA Props - MJB Vol01) all contained in the  [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)  or later

    [BSC Mansion - Uppark Estate](https://cafe.naver.com/simcitysquare/34687)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    has\_dependencies

    If your sims enjoy their new city pads, check out my other files and stay tuned for more coming soon to the STEX!

    justforfun
