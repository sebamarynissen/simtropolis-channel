info:
  summary: Victorian Row Shops Diagonal
  description: |-
    Add visual interest and jobs to your diagonal networks with this set of 11 detailed shop parades!  
    They come in 1x1 lots with overhanging props in various lengths, covering from 3 to 5.5 diagonal tiles. Seven of them are Cs$$, one is Cs$$$, and three are Cs$.  
    The ploppable version includes icons in the landmark menu, and the description will tell you how many tiles each parade covers.  
    Alternatively you can download the growable version and plop these with the extracheats plugin, like I personally do. In this case you'll find them listed under Cs$$$/Cs$$/Cs$ JFF shop parade.  
    Both versions only weigh about 1900KB, the rest of the download is pictures!

    DEPENDENCIES

    Essential for the models:

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    Optional for the few props in the back:

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC MEGA Props - Jen\_P Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1259)

    [BSC MEGA Props - Misc Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=426)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/)  (Barrels.dat, Carts.dat, Crates.dat)

    [Murimk - Props Vol03 - Industrials](https://community.simtropolis.com/files/file/27698-murimk-props-vol03-industrials/)

    If you enjoy these models, stay tuned for more coming to the STEX!
