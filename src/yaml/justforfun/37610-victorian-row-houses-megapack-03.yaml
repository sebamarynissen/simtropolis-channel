info:
  summary: Victorian Row Houses MegaPack 03
  description: |-
    There isn't such a thing as having too many row-house designs, so this third instalment brings you 60 more historical w2w homes drawing from London, Cambridge, Birmingham, Philadelphia, Manhattan, Pittsburgh, Utrecht, Dublin and more! Some of them are quite iconic, like R$$$ 48 which comes from London's Holland Park, or R$$ 132-132a reproducing a scenic sloping street of Muswell Hill. The separate documentation pictures contain screenshots of all the models so you can tell which is which.

    To allow for greater flexibility, this time each style is arranged in lots of varying sizes (typically 4x2, 3x2 and 2x2, but sometimes 4x1, 2x1, 4x3, 2x3, with or without front yards, etc.) for a total of 172 lots, all growing under medium-density Chicago tileset.  
    If you want to create consistent streets of the same design, you can also plop these rows with the "[lotplop](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)" extracheat. In this case you'll find them listed under "R$$$/R$$/R$\_JFF terrace #". When lot "A" and "B" are listed, it means they are meant to be plopped in succession so that the architectural features align.

    These S3D models can be fully enjoyed from any camera angle without distortion, and the all-inclusive file only claims 2.65 MB of disk space.

    DEPENDENCIES: quite a number, as you would expect for a megapack, but likely you already have most of them.

