info:
  summary: Row Shops Diagonal Pack 2
  description: |-
    For fellow mayors who still have diagonal high streets to fill, a second set of 6 detailed shop parades.  
    They come in 1x1 lots with overhanging props in various lengths, covering from 2.5 to 5 diagonal tiles. Three of them are Cs$$ and three are Cs$.  Cs$$ parade 45 comes in lot A, B, and C each with different shops and layout, as they are meant to be placed with diagonal streets in between them.

    The ploppable version includes icons in the landmark menu, and the description will tell you how many tiles each parade covers.  
    Alternatively you can download the growable version and plop these with the LotPlop extracheat, like I personally do. In this case you'll find them listed under JFF\_Cs$$/Cs$\_shop parade (you may want to keep the documentation images for easy reference).  
    Both versions only weigh about 1200 KB, the rest of the download is pictures!

    Fun fact: remember when the total number of shop fronts from all parades was 1000? With these we reach 1068, and if we also count the shops from the commercial corners, diagonals, and transitions, we get past 1200. Seriously, isn't this con-sim-erism?

    DEPENDENCIES

    Essential for the models to appear correctly:

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Semidetached Houses Diagonal](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Tenement 4](https://community.simtropolis.com/files/file/36401-tenement-04-diagonal/)

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    Recommended:

    BSC MEGA Props - Misc Vol01 contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    If you enjoy these models, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and stay tuned for more coming to the STEX!

    Justforfun
