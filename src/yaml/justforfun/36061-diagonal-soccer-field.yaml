  summary: Diagonal Soccer Field
  description: |-
    Frustrated by the lack of diagonal sport facilities? This size-accurate soccer field is here to help.  
    It features handy changing rooms and benches, plus trees or other MMPs can be plopped on it as shown in the pictures.    
    Find it in your park menu and start kicking around!

