info:
  summary: Ct1999 Gazebo park
  description: |-
    This beautiful gazebo is one of CT1999's unreleased models which I've simply modded and lotted and am now uploading following his request.  
    It sits on a 3x3 pond park that can be used as stand-alone or within larger parks to create your quaint Chinese scene.  
    You'll find it in your park menu with a plop cost of 400 and monthly maintenance of 30.   
    Many thanks to CT1999 for both his modelling work and his decision to share!

    DEPENDENCIES:

    (BSC MEGA Props -  MJB Vol01  
    BSC MEGA Props - MJB Vol02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325 Vol02) all contained in the  [BSC Common Dependencies Pack](https://www.sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [OrangeTSC MegaProp V.01](https://community.simtropolis.com/files/file/19953-orange-megaprop-v01/)

    More will be coming soon!

    justforfun
