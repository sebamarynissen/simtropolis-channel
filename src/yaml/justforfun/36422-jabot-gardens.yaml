group: justforfun
name: jabot-gardens
version: "1.0.1"
subfolder: 660-parks
info:
  summary: Jabot Gardens
  description: |-
    Apparently there is demand for a diagonal park, so here I am uploading this floral composition which is meant to represent... a Christmas tree? Nope, it's a neck jabot, with the winding paths hopefully resembling the ruffles and the intricate bed flowers the lace.

    Lot size is 12x12, plop cost 1000, maintenance cost 400 (did you mayor think elegance comes cheap?)  
    As you may expect, this fancy display requires a bunch of dependencies, however you are likely to have most of them already:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSCBAT Props D66 Vol11  
    BSC MEGA Props -  MJB Vol02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02

    BSC Textures vol01  
    BSC Textures vol02  
    BSC Textures Vol03 v5) contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    BSC Park Textures from the [SC4D LEX Legacy - BSC Parks Collection](https://www.sc4evermore.com/index.php/downloads/download/14-park/283-sc4d-lex-legacy-bsc-parks-collection)

    [OrangeTSC MegaProp V.01](https://community.simtropolis.com/files/file/19953-orange-megaprop-v01/)

    [Marrast Diagonal Rail Stations](https://community.simtropolis.com/files/file/16793-marrast-diagonal-rail-stations/) (for the diagonal benches)

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)

    Big thanks to [@Tyberius06](https://community.simtropolis.com/profile/660284-tyberius06/) for upgrading the modding.

    If you like this, check out my other creations and stay tuned for more coming to the STEX!

    justforfun
