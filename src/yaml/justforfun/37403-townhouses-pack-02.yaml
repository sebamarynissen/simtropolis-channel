info:
  summary: Townhouses Pack 02
  description: |-
    TOWNHOUSES PACK 02

    Recreating historical town centres requires plenty of character homes, so here's a pack of 10 more w2ws based on buildings around England and colonial America. Townhouse R$$$ 03, for example, takes inspiration from the Norman Tower House of Bury St Edmund in Suffolk, while R$$ 10 and R$$$ 05 can be found in Richmond Upon Thames.  
    The set grow on 1x1, 1x2, or 2x2 lots under medium-density Chicago tileset, and can be enjoyed from any camera angle. The all-inclusive file weighs only 512 KB.

    DEPENDENCIES:

    Essential for the models and buildings:

    [JFF Pelham Mansions](https://community.simtropolis.com/files/file/37243-pelham-mansions/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

