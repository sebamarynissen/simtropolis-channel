info:
  summary: Pelham Mansions
  description: |-
    Inspired by Portman Mansions in London's Marylebone, these Victorian apartments are the abode of up to 200 R$$$ sims. They grow on a 4x3 medium- or high-density lot under Chicago tileset, or can be found listed as "R$$$\_JFF Mansion Block 08" in the ["LotPlop" extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/).  
    As always, the 3d model can be enjoyed from any camera angles, and the all-inclusive file weighs less than 200 KB.

    DEPENDENCIES:

    Essential for the model and building:

    [JFF Barry Mansions](https://community.simtropolis.com/files/file/35180-barry-mansions/)

    [JFF Commercial Corners Pack 2](https://community.simtropolis.com/files/file/36975-commercial-corners-pack-2/)

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Shops Pack 5](https://community.simtropolis.com/files/file/36484-victorian-row-shops-pack-05/)

    Recommended for trees variety:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325 Vol02) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)   or later

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)

    [BSC Uppark Estate](https://cafe.naver.com/simcitysquare/34687)

    HaS dependencies

    If you like these apartments, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and stay tuned for more coming to the STEX!

    justforfun
