info:
  summary: Animated Lowriders automata (gang cars)
  description: |-
    Since Cali is becoming popular on the STEX, I thought no L.A. scene would be complete without its famous lowriders. So I made two animated automata of the iconic 1964 Chevrolet Impala, a red one for the Bloods and a blue one for the Crips. Included are also static props of the cars to use in the LE. Scale is 20% bigger than real life, to blend in with Maxis cars.  
    Feel like cruisin' on LA boulevards? Just select the appropriate bandana in MySim vehicles and go bouncing up and down throughout your UDI.

    If you enjoy these creations, check out my other files and as usual stay tuned for more coming to the STEX!

    justforfun
