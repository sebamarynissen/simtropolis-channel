info:
  summary: Carlisle Mansions
  description: |-
    This classy 19th-century block grows on a 3x6 lot on medium or high-density Chicago tileset and can house 400 R$$$ sims.  
    The facade is virtually identical to the original in central London so I kept the real name.   
    Model and lot are contained in a single file that weighs barely 18 KB.

    DEPENDENCIES:

    Essential for the model and building:

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Victorian Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Landon Mansions](https://community.simtropolis.com/files/file/35496-landon-mansions/)

    Recommended for the plants and trees:

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [BSCBATPropsMatt325\_Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2383)

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC MEGA Props - CP Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2790)

    [BSC MEGA Props - D66 Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=396)

    [BSC MEGA Props - DAE Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=475)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)

    [BSC MEGA Props - SG Vol 01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)

    [BSC Mansion - Uppark Estate](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=144)

    [HaS dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    If you enjoy these models, stay tuned for more coming to the STEX!
