info:
  summary: Animated horse-drawn carriage automata Pack 1
  description: |-
    After countless weeks of work and many more headaches, here are the first horse-drawn carriage automata ever made for this wonderful game.  
    This pack consists of 20 Victorian carriages that will replace as many Maxis cars in roaming your cities, namely 13 Brougham, 2 Rockaway, 3 Stanhope, and 2 Victoria carriages. The best part is that they come with animated horses and most are trailer sets, so the front and back wheels move independently.

    I owe a HUUUGE thank you to [@rivit](https://community.simtropolis.com/profile/240203-rivit/) for his generous and extensive help in getting the modding to work. It took a considerable amount of experimentation to find the right positioning and rules, and this pack wouldn't be here without rivit's amazing help.

    I plan on making more packs in the future, with different types of carriages that will eventually override all Maxis cars. It may take some time though,  meanwhile hope you enjoy your chunk of Victorian traffic, whoa, whoa!

    justforfun
  author: justforfun
