info:
  summary: Victorian Row Shops Pack 05
  description: |-
    Since the 856 shop fronts contained in the previous packs didn't sound like a proper number, I decided to add 144 more and round up the total! So your sims can now browse 1000 (one thousand) different shop windows.  
    These additions are grouped in 12 new commercial parades (2 Cs$, 7 Cs$$, and 3 Cs$$$) growing on medium-density lots under Chicago style. The lots vary in size as specified in the documentation images, and share the dummy buildings of the other packs.  
    The models are true 3d as usual, and the all-inclusive file weighs just over 2 MB.

    Fun fact: "Sim's Steak House", featured in Cs$ parade 16, was until recently located on Lee High Road, South-East London.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House MegaPack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached House Pack 03](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    [JFF Row Shops Pack 04](https://community.simtropolis.com/files/file/36147-victorian-row-shops-pack-04/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    Recommended:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol01  
    BSC MEGA Props - swi21 Vol01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [davide1983it Outdoor Set V1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/) (Barrels.dat and Crates.dat)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    Let me know if you like the result of compulsive shop-hunting and modelling, and as usual stay tuned for more coming to the STEX!

    justforfun
