info:
  summary: Bus garage diagonal
  description: |-
    Every city has depots where buses are stored, refuelled, and maintained. This is a large diagonal one loosely inspired by the garage in Bow, East London. It works as bus stop with a capacity of 30,000 and provides jobs to hundreds of sims.

    Wait, your sims don't use the red double-deckers? No problem: the buses inside, both straight and diagonal, are separate props which can be easily replaced in the Lot Editor.   
    Lastly, the building model is a true 3d you can enjoy at different angles.

    DEPENDENCIES:

    For use with the routemaster bus props:

    [JFF VIntage Routemaster bus reskin](https://community.simtropolis.com/files/file/32967-vintage-routemaster-bus-reskin/)

    Otherwise... none!

    If you enjoy this grimy addition to your transport network let me know through likes and reviews, and as usual stay tuned for more coming to the STEX!

    justforfun
