info:
  summary: Bridge Skins Set 7.5 mt
  description: |-
    Give character and variety to your 7.5 mt viaducts with this set of 10 easy-to-use cosmetic skins inspired by various bridges around the UK!  Simply find them in the misc. transport menu and plop them on the slope next to the network as shown in the picture.   
    The lots are transparent therefore suitable for any terrain.  If you need to use them with some texture-based wall set, you can add the texture you want in the Lot Editor.  
    Since the lots are plopped on the slope, they don't take up any valuable space nor interfere with traffic in any way, plus they are designed to allow MMPs on top in order to blend seamlessly in your scene.   
    The pack includes 3 bridges covering a span of 1 tile, 5 bridges covering 2 tiles, and 2 covering 3 tiles.   
    Plop cost is respectively 75, 108, and 140; maintenance costs 5, 8, and 10. Like in real life, these bridges have a mild landmark effect.  
    The total pack size is only 186 KB and no dependencies are required.   
    If you enjoy these creations, stay tuned for more coming to the STEX!

    justforfun
