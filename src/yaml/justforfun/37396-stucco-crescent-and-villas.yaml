info:
  summary: Stucco Crescent & Villas
  description: |-
    Want to recreate a rounded garden square like those of central London? Here's a curved row of Regency stucco mansions you can plop once or twice around a crescent or an oval, complemented by the respective centrepieces.  
    Along with the 11x2 crescent lot I've also included a 4x3 orthogonal lot named "Stucco Villas".  
    These S3D models can be enjoyed from any camera angle, and the all-inclusive file weighs only 142 KB.

    HOW TO USE:

    1) Lay down a street crescent or oval as in the images  
    2) Prompt the "[BuildingPlop](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)" extracheat, look for "R$$$ JFF Stucco Crescent", and plop it to match the street layout  
    3) "[Growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/)" as low or medium density residential  
    4) Find the "Crescent Square" or the "Oval Square" in your parks menu and plop it at the centre  
    5) Decorate the gardens and square with your favourite MMPs. If you use the Plop&Paint mod, you'll be able to decorate even the bits overhanging the street, as I've done in the images.

    For the Villas, you can simply zone low or medium density Chicago tileset or plop them with the same extracheat.

    DEPENDENCIES:

    Essential for the models:

    [JFF Row Houses Diagonal Pack 1](https://community.simtropolis.com/files/file/36624-victorian-row-houses-diagonal/)

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    [JFF Semidetached Houses Diagonal Pack 1](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    Recommended for prop variety: (the usual ones)

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props - Jen\_P Vol01  
