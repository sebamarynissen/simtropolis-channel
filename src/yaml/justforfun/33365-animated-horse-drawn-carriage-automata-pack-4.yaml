info:
  summary: Animated Horse-Drawn Carriage Automata Pack 4
  description: |-
    Fourth instalment of Victorian horse-drawn carriages, to replace yet another number of Maxis car automata.

    The carriages are as always animated and articulated, and feature working people carrying crates, flour bags, coal, barrels, firewood, laundry, etc.  The pack contains 6 wagons, 3 vans, 2 dog carts, 1 governess cart, and 5 floats.  
       
    To ensure proper functionality it is essential that you download the first two packs:

    [https://community.simtropolis.com/files/file/33178-animated-horse-drawn-carriage-automata-pack-1/](https://community.simtropolis.com/files/file/33178-animated-horse-drawn-carriage-automata-pack-1/)

    [https://community.simtropolis.com/files/file/33234-animated-horse-drawn-carriage-automata-pack-2/](https://community.simtropolis.com/files/file/33234-animated-horse-drawn-carriage-automata-pack-2/)

    It is also advisable that you download the third pack and the horse-riders who replace Maxis motorcycles:

    [https://community.simtropolis.com/files/file/33333-animated-horse-drawn-carriages-pack-3/](https://community.simtropolis.com/files/file/33333-animated-horse-drawn-carriages-pack-3/)

    [https://community.simtropolis.com/files/file/33187-animated-horse-riding-gentlemen-automata/](https://community.simtropolis.com/files/file/33187-animated-horse-riding-gentlemen-automata/)

    IMPORTANT: Each pack contains a file named "MaxisCarsSuppressor\_optional", which allows you to   
    suppress most of the remaining Maxis cars; please make sure you only keep the latest one  
    contained in the present pack, or that it loads last.

    If you like them please review, and happy 2020 to everybody! Oops, I mean 1870!

    justforfun
