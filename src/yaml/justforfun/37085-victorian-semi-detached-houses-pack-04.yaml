  summary: Victorian Semi-detached Houses Pack 04
  description: |-
    All mayors know that variety of housing is never enough, so here comes a fourth pack of semi-detached homes featuring 4 R$$$, 7 R$$, and one R$. These models draw largely from London (for example, R$$$ 22 can be found on Nightingale Lane in Balham) and grow under Chicago tileset, mostly on medium-density lots of various sizes as detailed in the documentation pictures.   
    True 3d as usual, they come packed into a single file claiming just 700KB of your disk space.

    DEPENDENCIES:

    Essential for the models to appear correctly (if you follow my content you already have them all):

