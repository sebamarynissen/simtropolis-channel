info:
  summary: Criffel Mansion
  description: |-
    Named after Criffel Avenue in London's Streatham Hill, a R$$$ Victorian home growing on a 2x2, 2x2 corner, or 2x3 lot under low or medium-density Chicago tileset.  If you want to use the "LotPlop" extracheat, look for "R$$$\_JFF Mansion 03".  
    The model can be enjoyed from any camera angle, and the all-inclusive file weighs only 123 KB.

    DEPENDENCIES:

    Essential for the building:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    Recommended for prop variety:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props - Jen\_P Vol01  
    BSC Mega Props - JES Vol02  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - Misc Vol02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02  
    JENXPROP\_Tree\_Pack1) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)  
    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/) or later  
    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)  
    [BSC Mansion - Uppark Estate](https://cafe.naver.com/simcitysquare/34687)  
    [Davide outdoor set V1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)  
    HaS dependencies  
    [Nams props pack vol 2](https://www.toutsimcities.com/downloads/view/1882)

    If you like this new comfortable abode, let me know through likes and reviews, and as always stay tuned for more coming to the STEX!

    justforfun
