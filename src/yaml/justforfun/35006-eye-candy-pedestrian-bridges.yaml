info:
  summary: Eye-candy pedestrian bridges
  description: |-
    This is a set of three S3D suspension bridges in an ornate wrought-iron Victorian style. They sit on a 1x1 lot with the same base texture as the BSC park trails, which can be easily changed to suit different needs.  
    Simply plop them at the edge of your creeks so that the overhanging prop spans the gap. The first bridge spans 3 tiles, the second 4 tiles, and the third one is a diagonal to cross 3 diagonal tiles as displayed in the picture. The pylons extend down 16 mt so are not meant for deep canyons.  
    These bridges are found in the park menu and have minimal maintenance costs for the joy of all mayors!

    justforfun
  author: justforfun
