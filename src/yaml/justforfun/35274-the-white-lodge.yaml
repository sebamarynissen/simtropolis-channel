info:
  summary: The White Lodge
  description: |-
    This is a relot and repurposing of Pegasus' Chicken Ranch.  
    Pegasus' lovely model here comes as the "White Lodge", a stylish club with al fresco dining.  
    It grows on a 2x2 Chigago-tileset medium-density lot and provides 8 Cs$$$ jobs.  
       
    This download also contains the scaled-down version of two of CP's umbrella tables, with new IDs, however the original CP file is still necessary as a dependency.

    Dependencies:

    [PEG Chicken Ranch](https://community.simtropolis.com/files/file/12727-peg-chicken-ranch/)  (only the RESOURCE file)

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)  (flowers)

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)  (trees)

    [BSC MEGA Props - D66 Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=396)  (flowers and hedges)

    [BSC MEGA Props - DAE Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=475)  (fence)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407%20%20\(bush\))  (bush)

    [BSC MEGA Props - SG Vol 01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)  (azalea and boxes)

    [BSC MEGA Props - swi21 Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=403)  (lamps)

    [BSC MEGA Props - W2W Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=465)  (restaurant)

    [BSC Texture Megapack](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=90)

    [SFBT Essentials](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=750)  (bins)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/)  (only Barrels.dat)

    [LBT Mega Prop Pack vol 01](https://community.simtropolis.com/files/file/21770-lbt-mega-prop-pack-vol01/)  (trees and bicycle)
