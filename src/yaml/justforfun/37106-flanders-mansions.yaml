info:
  summary: Flanders Mansions
  description: |-
    A R$$$ mansion block with a diagonal side, overhanging from a 3x2 lot.   
    Suitable for all camera angles and weighing just 57KB!

    HOW TO USE:  
    Like most diagonals, it is unlikely this will grow in the right spot, so you may want to:  
    1\. Prompt the [Lotplop extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/),  select "JFF Mansion block 07", plop it in the appropriate place, and then  
    2\. [Growify](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/) the lot as high- or medium-density residential.

    DEPENDENCIES:

    Essential for the model and building:

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Houses Diagonal](https://community.simtropolis.com/files/file/36624-victorian-row-houses-diagonal)

    [JFF Semidetached Houses Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Roundabout set](https://community.simtropolis.com/files/file/35519-ow-roundabout-set/)

    [JFF Barry Mansions](https://community.simtropolis.com/files/file/35180-barry-mansions/)

    Recommended for the trees:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/) or later

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)

    BSC Mansion - Uppark Estate

    [HaS dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    If your sims enjoy their new stylish apartments, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and as usual stay tuned for more coming to the STEX!

    justforfun
