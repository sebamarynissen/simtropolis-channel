  summary: Tenement 05
  description: |-
    Looking for residentials with some depth? Here's a slum tenement that grows on a medium or high-density 1x5 lot under Chicago tileset and houses 80 R$ sims. Suitable as both stand-alone and w2w, it also comes as a 4x5 lot housing 320 sims.   
    True 3d as usual, it weighs 80 KB all included.

    DEPENDENCIES

    Essential for the model to appear correctly:

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    Recommended:

    (BSC MEGA Props - CP Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - SG Vol 01) contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you like this, check out my other creations and stay tuned for more coming to the STEX!

    justforfun
