  summary: Ct1999 Sacred Heart Cathedral
  description: |-
    This amazing gothic church is one of [@Ct1999](https://community.simtropolis.com/profile/778451-ct1999/)'s unreleased models which I've simply modded and lotted and am now uploading following his request.   
    You'll find it in your landmark menu with a lot size of 4x7, plop cost of 5000 and monthly maintenance of 100.   
    Many thanks to CT1999 for both his beautiful modelling work and his decision to share!

    DEPENDENCIES:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - swi21 Vol02  
    BSCBATProps KWK Vol 04  
    BSCBATProps Mattb325 Vol02) all contained in the [BSC Common Dependencies Pack](https://www.sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    More will be coming soon!

    justforfun
