info:
  summary: Commercial Diagonals Pack 1
  description: |-
    This is a pack of 20 w2w commercials to help fill your diagonal high streets with historical character buildings. These shops and offices cover each one diagonal tile, apart from #14 and #18 (The Sherlock Holmes pub) which cover one and a half.   
    As usual the models are suitable for all camera angles, and #9, 10, and 13 are moderately slop-friendly.   
    The all-inclusive file weighs 1.4 MB for the growable version and 1.6 MB for the ploppable.

    HOW TO USE:

    You can choose the ploppable version and find these in the landmarks menu, or go for the growable one - in this case you may want to plop these diagonals by prompting the ["Lotplop" extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/\)) and then looking for "JFF Commercial diagonal 01-20".   
    In either version, The Queen's Head pub (#12) has a back patio which comes as a separate landmark lot to plop behind the commercial (as seen in the pictures).

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row House Diagonal Pack 1](https://community.simtropolis.com/files/file/36624-victorian-row-houses-diagonal/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 04](https://community.simtropolis.com/files/file/36147-victorian-row-shops-pack-04/)

    [JFF Commercial Corners pack 1](https://community.simtropolis.com/files/file/36807-commercial-corners-pack-1/)

    [JFF Office Pack 01](https://community.simtropolis.com/files/file/36185-office-pack-1-small-offices/)   (only for the growable version)

    [JFF Office Pack 02](https://community.simtropolis.com/files/file/36715-office-pack-2-smallmedium-offices/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    Recommended:

    (BSC MEGA Props - CP Vol 01  
    BSC MEGA Props - CP Vol 02  
    BSC MEGA Props - D66 Vol 01  
    BSCBATProps D66 Vol 10  
    BSC MEGA Props - DAE Vol 01  
    BSC MEGA Props Jen\_P Vol 01  
    BSC MEGA Props - MJB Vol 01  
    BSC MEGA Props - MJB Vol 02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol 01  
    BSC MEGA Props - W2W Vol 01) contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    BSC Caliban Radcliffe Camera

    [Davide outdoor set 1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)

    [has\_dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/%20\(Crates.dat,%20Barrels.dat\))  (Crates.dat, Barrels.dat)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    [WMP Mega Props vol 01](https://community.simtropolis.com/files/file/33621-wmp-mega-props-vol-01-misc-general-props/)

    If you enjoy these commercials, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and as usual stay tuned for more coming to the STEX!

    justforfun
