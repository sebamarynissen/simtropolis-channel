info:
  summary: Victorian Row Shops Pack 04
  description: |-
    Whether your sims are looking for shoes, grocery, fish & chips, a haircut, a rare book, a violin, or a pub to chill, they are likely to find it all and much more in these 155 new shops arranged in 12 new commercial parades, which bring the total of all packs to 856 different shop windows.

    The lots use shared dummy buildings and grow on medium-density Chicago tileset, in various sizes as specified in the documentation images.

    As with previous packs, the shop fronts are individual S3D props that can be used in the Lot Editor.

    Models, exemplars, and lots are contained in a single file that only weighs 2.4 MB. The rest of the upload is pictures!

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House MegaPack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached House Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    Recommended for full prop variety (trees, crates, fences, etc.):

    (BSC MEGA Props - CP Vol01  
