info:
  summary: Townhouses Pack 01
  description: |-
    This is a pack of 10 w2w houses meant to add character and variety to your small-town streets.    
    There are 7 R$$, 2 R$$$ and 1 R$ growing on 1x2 lots under medium-density Chicago setting. Some have different lots for straight and corner versions.   
    The number of residents is lower, more realistic than Maxis standard, so let me know how these grow. Of course, you always have the option to plop them and then use the handy growification tools.   
    As usual these models can be enjoyed from all camera angles, and the all-inclusive file just weighs 420 KB.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 04](https://community.simtropolis.com/files/file/36147-victorian-row-shops-pack-04/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    Recommended for full variety of trees, fences, etc.:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props DBSSYMN Vol01  
    BSC MEGA Props - Gascooker Vol01  
    BSC MEGA Props Jen\_P Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - Misc Vol01  
    BSC MEGA Props - Misc Vol02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol01  
    BSCBATPropsMattb325\_Vol02  
    BSC VIP Girafe Urbanpack Vol01  
    JENXPROP Tree Pack 1) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    [AGC Environment DLC 3.0.0 or later](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)

    [BSC Mansion - Uppark Estate](https://cafe.naver.com/simcitysquare/34687)

    [davide1983it Outdoor Set V1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)

    [HaS dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    [Mntoes Proppack 1](https://community.simtropolis.com/files/file/12064-mntoes-proppack-1/)

    [Nams Props Pack Vol 1](https://www.toutsimcities.com/downloads/view/1780)

    [Nams props pack vol 2](https://www.toutsimcities.com/downloads/view/1882)

    [NDEX Base Texture Set 1](https://community.simtropolis.com/files/file/11617-ndex-texture-set-volume-1/)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    [Vortexture Set 1](https://www.sc4evermore.com/index.php/downloads/download/22-dependencies/168-vortext-vortexture-1-2-base-set-grass-and-dirt)

    If you enjoy these houses check out my other files and as usual stay tuned for more coming to the STEX!

