info:
  summary: Commercial Corners Pack 2
  description: |-
    Here come 16 more w2w commercials to plop around your roundabouts or wherever you need to fill diagonal corners of various shapes and sizes like those seen in the pictures.   
    Except for commercial #30, inspired by a Dutch building, these shops and offices all draw from British architecture. Commercial #33, for example, features the famous "White Lion" pub from London's Covent Garden.  
    As usual the models are suitable for all camera angles, and the all-inclusive file weighs just 1 MB!

    HOW TO USE:

    1) Simply prompt the ["Lotplop" extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/\)) and look for "JFF Commercial corner 21-36". - you may want to keep the documentation pictures for easy reference.  
    2) In order to get the appropriate pavement density, it is then advisable to use the handy ["Growify" extracheat](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/).

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Commercial Corners pack 1](https://community.simtropolis.com/files/file/36807-commercial-corners-pack-1/)

    [JFF Commercial Diagonals Pack 1](https://community.simtropolis.com/files/file/36884-commercial-diagonals-pack-1/)

    [JFF Office Pack 01](https://community.simtropolis.com/files/file/36185-office-pack-1-small-offices/)

    [JFF Office Pack 02](https://community.simtropolis.com/files/file/36715-office-pack-2-smallmedium-offices/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

