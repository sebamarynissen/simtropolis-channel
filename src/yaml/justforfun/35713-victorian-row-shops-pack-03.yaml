info:
  summary: Victorian Row Shops Pack 03
  description: |-
    Trying to make your sim high streets even more varied than those in real life? Then this pack of commercial parades featuring 163 new shop fronts will do the job, bringing the grand total of all packs to 700 different shops. Zoom in close and personal to savour the details!

    All 14 lots use shared dummy buildings and grow on medium-density Chicago tileset, in various sizes as specified in the documentation images. As with previous packs, the shop fronts are individual S3D props that can be used in the Lot Editor.

    Models, exemplars, and lots are contained in a single file that only weighs 2.3 MB.

    DEPENDENCIES

    Essential for the models to appear correctly:

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House MegaPack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Semidetached House Pack02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    Textures:

    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)

    [NDEX Base Texture Set 1](https://community.simtropolis.com/files/file/11617-ndex-texture-set-volume-1/)

    Recommended for full prop variety:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
