info:
  summary: Victorian Semi-detached Houses Pack 05
  description: |-
    After the diagonal semis, a fifth orthogonal instalment of this popular type of homes, featuring 3 R$$$, 8 R$$, and 1 R$. The designs are based on those found in various parts of London, from one of Kensington's most prestigious streets (R$$$ 25) to Sydenham (R$$ 42) and Sutton (R$ 4).   
    The lots are 4x2 or 4x3 as detailed in the documentation pictures, and grow under medium-density Chicago tileset - some under low density too.  
    These true-3d models come packed into a single file claiming just 661 KB of your disk space.

    DEPENDENCIES:

    Essential for the models and buildings:

    [JFF Pelham Mansions](https://community.simtropolis.com/files/file/37243-pelham-mansions/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    [JFF Semidetached Houses Diag pack 2](https://community.simtropolis.com/files/file/37388-victorian-semi-detached-houses-diagonal-pack-2/)

    [JFF Semidetached Houses Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Semidetached Houses pack 03](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

