info:
  summary: Victorian Row Houses MegaPack 01 - BAT version (Partial)
  description: |-
    This is the BAT version of the S3D row house set recently uploaded here:  [Victorian Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)  
      
    It is a partial conversion as it "only" contains about half the models: 6 R$, 30 R$$, and 13 R$$$.

    The conversion from S3D to BAT is the painstaking work of [@Raymond7cn](https://community.simtropolis.com/profile/780357-raymond7cn/), who even added beautiful cozy nightlights!  
    Unfortunately Raymond has been offline for a while, therefore couldn't convert the whole pack. Still, I decided it's good to share what is available now, and update this file later if the conversion will be resumed.  
    The models have been rendered in high definition, to maintain the detail of the original S3Ds.   
    The props and lots carry the same IDs as in the S3D pack so to avoid conflicts you want to make sure to use only one version.   
    The fence and hedge props have been purposedly left in S3D.

    As in the original pack, this set of row houses is meant to provide a wide variety of period residentials, to enable you to expand your Victorian cities or districts like never before.  
    Almost all grow on a 4x2 medium-density lot under Chicago tileset.  The "R$ 06" grows on a 1x2 lot. The "R$$$ terrace 02" is a grid-breaking diagonal that grows on a 1x1 lot and also comes in corner and mirror versions.   
    **Suggestion 1**: To build streets with R$$$ 02, I use the "buildingplop" cheat (you'll find the set under "R$$$ JFF terrace") and then the fantastic growification tool by [@smf\_16](https://community.simtropolis.com/profile/259789-smf_16/)   
    **Suggestion 2**: If you like to fill the diagonal garden at the back of the house, you can either use ploppable props or make a 1x1 park lot with the props families you like, and plop it on the empty tile behind the house, under the overhanging hedges.

    DEPENDENCIES: While all the house models are included, to enjoy the full variety of props in the gardens and yards you need the following prop packs, most of which you likely already have.

