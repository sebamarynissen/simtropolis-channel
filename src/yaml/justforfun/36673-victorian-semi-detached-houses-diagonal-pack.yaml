info:
  summary: Victorian Semi-detached Houses Diagonal Pack
  description: |-
    To complement the diagonal terraces, here is a pack of 8 semi-detached houses featuring 6 R$$ and 2 R$$$.  
    These true-3d models overhang from 1x1, 2x1, 1x2, or 2x2 A and B lots fitting different diagonal spaces (see documentation images).  
    Unlike their straight counterparts, these semis are only suitable for flat terrain.  
    The all-inclusive file weighs only 375 KB.

    HOW TO USE

    1\. Prompt the "Lotplop" extracheat ([Extracheats Plugin](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/)),  look for "JFF diag..." and select the semi you want.  
    2\. Growify the lots as medium- or low-density residentials ([Growify DLL](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/))  
    3\. Decorate the gardens with your favourite MMPs.

    DEPENDENCIES

    Essentials for the models to appear correctly:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Houses Diagonal](https://community.simtropolis.com/files/file/36624-victorian-row-houses-diagonal/)

    [JFF Semidetached Houses pack 1](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

