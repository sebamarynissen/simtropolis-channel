info:
  summary: Cunningham Mansions
  description: |-
    Inspired by Cunningham Court in London's Maida Vale, this elegant apartment block grows on a 3x5 medium or high-density lot under Chicago tileset and provides residence to 200 sims.

    As usual, both model and lot are included in a single file that will take just 32 KB of your disk space!

    DEPENDENCIES:

    Essential for the model and building:

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Barry Mansions](https://community.simtropolis.com/files/file/35180-barry-mansions/)

    Recommended for the plants and trees:

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [BSCBATProps KWK Vol 04](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1297)

    [BSCBATPropsMatt325\_Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2383)  
    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC Mega Props - CP Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2790)

    [BSC MEGA Props - Misc Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=426)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)  
    [BSC MEGA Props - SG Vol 01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)

    [HaS dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    If you enjoy these models let me know through likes and reviews, and stay tuned for more coming to the STEX!

    justforfun
