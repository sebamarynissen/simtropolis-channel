info:
  summary: Landon Mansions
  description: |-
    Inspired by the architecture of Hans Place, near Harrods in London, this R$$$ block grows on a 4x6 medium or high-density lot under Chicago tileset and provides residence to 400 sims.  I named it after Letitia Elizabeth Landon, 19th century poetess and novelist who was born in Hans Place.

    As usual, both model and lot are included in a single file that will take just 25 KB of your disk space.

    If you enjoy these models let me know through likes and reviews, and stay tuned for more coming to the STEX!

