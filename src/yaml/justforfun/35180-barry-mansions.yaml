info:
  summary: Barry Mansions
  description: |-
    For your affluent sims looking for elegant flats, here is a Victorian mansion block loosely inspired by a building in London.

    It grows on a 3x5 medium or high-density lot under Chicago tileset and provides stylish living for 200 sims.  
    I named it after Sir Charles Barry (1795-1860), the architect especially famous for building London's Houses of Parliament and the Big Ben tower.

    IMPORTANT: this model is an S3D, not a BAT, which means it looks like the ingame automata, with crisp textures yet no shading. It will stand out from other models and look sharper and brighter. Thanks to the "magic" of S3D, the whole file will take just 18 KB of your disk space!

    DEPENDENCIES:

    Essential for the model:

    [JFF Victorian Row Shops Pack 01 version 1.1.0](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    For the various plants and trees:

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)

    [BSCBATPropsMatt325\_Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2383)

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC Mega Props - CP Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2790)

    [BSC MEGA Props - D66 Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=396)

    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)

    [BSC MEGA Props - SG Vol 01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)

    If you enjoy these models, stay tuned for more coming to the STEX!

    justforfun
