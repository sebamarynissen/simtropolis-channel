info:
  summary: Commercial Diagonals Pack 2
  description: |-
    Here come 15 more w2w commercials to to help fill your diagonal high streets with historical character buildings from various parts of Britain. For example, the right portion of #23 features what was until recently the oldest English chemist in Knaresborough, Yorkshire; #24 is a wine whop from Hereford; #30 was loosely modelled after the "Board & Elbow" pub in Penrith, Cumbria, and #33 is the "Victoria Stakes" pub from Muswell Hill, in North London.  
    These shops and offices cover each one diagonal tile, except for #30 and #31, which cover one and a half, and #35, which is a half-tile filler meant to bridge the gaps between short and long diagonals.  
    As usual the models are suitable for all camera angles, and the all-inclusive file weighs just 770 KB.

    HOW TO USE:

    1) Simply prompt the ["Lotplop" extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/\)) and look for "JFF Commercial diagonal 21-35". - you may want to keep the documentation pictures for easy reference.  
    2) In order to get the appropriate pavement density, it is then advisable to use the handy ["Growify" extracheat](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/).

    DEPENDENCIES:

