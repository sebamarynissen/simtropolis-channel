info:
  summary: Beauchamp Department Store
  description: |-
    In need of a statement for your luxury shopping streets? The "Beauchamp" is a fictional department store in grand Victorian style, providing 200 Cs$$$ jobs and growing on a 4x4 medium or high-density corner lot under Chicago tileset.   
    Its costly merchandise will be delivered to your spoilt sims by a vintage purple van.   
    The model is full-geometry suitable for all camera angles, and only weighs 124 KB.

    DEPENDENCIES:

    Essential for the model to appear correctly:

    [JFF Semidetached House Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    Recommended:

    (BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - swi21 Vol01) contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    What do your sims think of their new boutique store and delivery service? Let me know through likes and reviews!

    justforfun
