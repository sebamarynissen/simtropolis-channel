info:
  summary: Victorian Row Shops Pack 01
  description: |-
    This pack contains 15 S3D Victorian shop parades of various lot size, featuring individual shopfronts and divided as follows:

    #3 Cs$ parades with 34 shop fronts,  
    #6 Cs$$ parades with 95 shop fronts,  
    #6 Cs$$$ parades with 72 shop fronts,

    for a grand total of \*201\* individual shop fronts. Do you think your sims have enough choice?  
    You can find both the props in the lot editor and the buildings in the "buildingplop" cheat as JFF Cs$/Cs$$/Cs$$$.   
    The lots use shared dummy buildings and all grow on medium density, please see the included pictures for detailed lot sizes.   
    Models, buildings and lots are all included in a single file that weighs less than 3MB, for the relief of your hard drive.

    IMPORTANT: these models are S3Ds, not BATs, which means they look like the ingame automata, with crisp textures yet no shading. They will stand out from other models and look sharper and brighter. Personally I love the high definition and the tiny memory they require when compared to BATs.

    DEPENDENCIES:

    [JFF Victorian Row Houses MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)  (essential)  
    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

    [BSC MEGA Props - D66 Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=396)

    [BSC MEGA Props - JBSimio Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1830)  
    [BSC MEGA Props - Jen\_P Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1259)  
    [BSC MEGA Props - MJB Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=407)  
    [BSC MEGA Props - SG Vol 01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=746)  
    [BSCBATPropsMatt325\_Vol02](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=2383)  
    [davide1983it Outdoor Set V1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)  
    [AGV Heuvelstraat 109 & Stationsstraat 41](https://community.simtropolis.com/files/file/31406-heuvelstraat-109-stationsstraat-41-tilburg/)  
    [SFBT Essentials](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=750)  
    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)  
    [NDEX Base Texture Set 1](https://community.simtropolis.com/files/file/11617-ndex-texture-set-volume-1/)  
    [Historic Harbor](https://community.simtropolis.com/files/file/29880-historic-harbor/) (Barrels, carts, crates, clock)  
    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [rp UK Tiny Terraces](https://community.simtropolis.com/files/file/18338-uk-tiny-terraces/)

    [WMP Cougar Fruit Packing](https://community.simtropolis.com/files/file/28015-the-cougar-fruit-packing-ltd/)

    This is my Christmas present to all users that can make use of S3D models. And to sim shoppers too!

    justforfun
