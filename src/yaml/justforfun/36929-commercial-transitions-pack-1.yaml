info:
  summary: Commercial Transitions Pack 1
  description: |-
    The STEX offers its fair share of diagonals, yet not many angled buildings to transition smoothly from ortho to diagonal and vice versa. This pack is here to provide 20 W2Ws for such purpose.  
    It features both shops and offices and both outer- and inner-corner transitions, in styles taken from the UK and the Netherlands.  
    As usual the models are suitable for all camera angles, and the all-inclusive file weighs just about 1 MB.

    HOW TO USE:

    For these you will need to prompt the ["Lotplop" extracheat](https://community.simtropolis.com/files/file/21118-simcity-4-extra-cheats-plugin/\)) and look for "JFF Commercial transition 01-20".   
    In order to get the appropriate pavement density, it is then advisable to use the handy ["Growify" extracheat](https://community.simtropolis.com/files/file/36180-growify-plopped-buildings-cheat-dll-plugin/).

    DEPENDENCIES:

    Essential for the models to appear correctly (if you follow my content you already have them all!):

    [JFF Commercial Corners pack 1](https://community.simtropolis.com/files/file/36807-commercial-corners-pack-1/)

    [JFF Commercial Diagonals Pack 1](https://community.simtropolis.com/files/file/36884-commercial-diagonals-pack-1/)

    [JFF Office Pack 01](https://community.simtropolis.com/files/file/36185-office-pack-1-small-offices/)

    [JFF Office Pack 02](https://community.simtropolis.com/files/file/36715-office-pack-2-smallmedium-offices/)

    [JFF Post Offices Pack 1](https://community.simtropolis.com/files/file/35797-post-offices-pack-1-mail-van-automata/)

    [JFF Post Offices Pack 2](https://community.simtropolis.com/files/file/36034-post-offices-pack-2/)

    [JFF Row House MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row House Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Row Shops Pack 03](https://community.simtropolis.com/files/file/35713-victorian-row-shops-pack-03/)

    [JFF Row Shops Pack 04](https://community.simtropolis.com/files/file/36147-victorian-row-shops-pack-04/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Semidetached Houses Pack 2](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Semidetached Houses pack 3](https://community.simtropolis.com/files/file/36373-semi-detached-houses-pack-03/)

    [JFF Semidetached Houses Diagonal](https://community.simtropolis.com/files/file/36673-victorian-semi-detached-houses-diagonal-pack/)

    [JFF Townhouses Pack 1](https://community.simtropolis.com/files/file/36513-townhouses-pack-01/)

    Recommended:

    (BSC MEGA Props - CP Vol 01  
    BSC MEGA Props - CP Vol 02  
    BSC MEGA Props - D66 Vol 01  
    BSCBATProps D66 Vol 10  
    BSC MEGA Props - DAE Vol 01  
    BSC MEGA Props Jen\_P Vol 01  
    BSC MEGA Props - MJB Vol 01  
    BSC MEGA Props - MJB Vol 02  
    BSC MEGA Props - SG Vol 01  
    BSC MEGA Props - swi21 Vol 01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    BSC Mansion - Uppark Estate

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/)  or later

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)

    [Davide outdoor set 1](https://community.simtropolis.com/files/file/34586-outdoor-set-v1/)

    [has\_dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)

    If you enjoy these bendy W2Ws, check out [my other files](https://community.simtropolis.com/profile/765771-justforfun/content/?type=downloads_file) and as usual stay tuned for more coming to the STEX!

