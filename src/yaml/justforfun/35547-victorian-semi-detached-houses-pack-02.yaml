info:
  summary: Victorian Semi-detached Houses Pack 02
  description: |-
    Give your cities more character with this second pack of 12 semi-detached houses: this time five R$$ and seven R$$$, two of which come in several colour variations.   
    They grow under Chicago tileset on medium or low-density 4x2, 5x2, or 4x3 lots as detailed in the Readme.

    All the models and lots are contained in a single file that will only claim 800 KB of your precious plugins folder, the rest of the upload is pictures.

    DEPENDENCIES

    Essential for the models and buildings:

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Victorian Row Shops Pack 02](https://community.simtropolis.com/files/file/35494-victorian-row-shops-pack-02/)

    [JFF Victorian Semi-detached Houses Pack 01](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01)

    Recommended for the garden props and textures:

    The same listed under Victorian Row Houses Megapack 01 and 02.

    If you like these creations, as usual stay tuned for more uploads!

    justforfun
