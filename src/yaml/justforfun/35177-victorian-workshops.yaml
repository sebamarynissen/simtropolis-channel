info:
  summary: Victorian Workshops
  description: |-
    Give your sims some hands-on jobs with these S3D Victorian workshops, featuring two building styles in red and brown bricks. Look closely and you'll see the sims at work at whatever it is they are making! (just Maxis animations used creatively).  
    These industrial estates grow on high-density zoning and provide each 1000 manufacturing jobs.   
    The first one comes in two 14x7 lot variations, the second one takes a 13x6 lot. Just zone accordingly holding the Ctrl key down and they'll likely pop up.   
    You can of course rearrange the models in the LE to make smaller or even bigger lots.

    IMPORTANT: these models are S3Ds, not BATs, which means they look like the ingame automata, with crisp textures yet no shading. They will stand out from other models and look sharper and brighter. As they weigh much less than BATs, you can enjoy all this industrial bounty for less than **75 KB** of disk space!

    DEPENDENCIES:

    [JFF Victorian Row Shops Pack 01 version 1.1.0](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/%20\(ESSENTIAL%20for%20the%20models\))  (ESSENTIAL for the models)

    [JFF Victorian Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/) (for the courtyard walls, the BAT version is also fine)

    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)

    [BSC MEGA Props - CP Vol01](https://www.sc4devotion.com/csxlex/lex_filedesc.php?lotGET=1180)

