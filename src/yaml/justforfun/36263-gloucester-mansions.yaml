info:
  summary: Gloucester Mansions
  description: |-
    Your sims keep pressing for more upscale residences? Try with this elegant Victorian block inspired by the buildings in London's Gloucester Walk and imaginatively named "Gloucester Mansions".   
    Coming with a manicured inner garden, these dwellings grow on a 3x5 medium or high-density lot under Chicago tileset, and offer classy urban living to up to 200 R$$$ sims.  
    The model is as usual a true 3d suitable for all camera rotations, and only weighs 98KB including the lot.

    DEPENDENCIES:

    Essential for the model to appear correctly:

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row House MegaPack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Semidetached House Pack 02](https://community.simtropolis.com/files/file/35547-victorian-semi-detached-houses-pack-02/)

    [JFF Barry Mansions](https://community.simtropolis.com/files/file/35180-barry-mansions/)

    Recommended for the trees and plants:

    (BSCBATPropsMatt325\_Vol02  
    BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - D66 Vol01  
    BSC MEGA Props - DAE Vol01  
    BSC MEGA Props - MJB Vol01  
    BSC MEGA Props - SG Vol 01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    BSC Mansion - Uppark Estate

    [AGC Environment DLC 3.0.0](https://community.simtropolis.com/files/file/34720-agc-environment-dlc/) or newer

    [HaS dependencies](https://web.archive.org/web/20250101000000/http://hide-inoki.com/bbs/archives/sc4_0372.html)

    Do your sims enjoy the view from their new pads? Let me know through likes and reviews, and stay tuned for more coming to the STEX!

    justforfun
