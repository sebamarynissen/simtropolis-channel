group: justforfun
name: brown-boxes-eraser
version: "1.0"
subfolder: 150-mods
info:
  summary: Brown Boxes Eraser
  warning: As this mod makes the brown boxes invisible, you will no longer see when some prop is missing. So it is recommended that you always check your dependencies lists carefully and, if in doubt, open your downloads in the LE to find out whether all the featured props are actually showing.
  description: |-
    If you want to get rid of those cumbersome brown boxes that keep showing in your cities no matter how painstakingly you search for your dependencies, simply unzip this small (28kB) file, place it in your plugins folder, and watch it instantly clean your cities from those brown eyesores!

    CAUTION: As this mod makes the brown boxes invisible, you will no longer see when some prop is missing. So it is recommended that you always check your dependencies lists carefully and, if in doubt, open your downloads in the LE to find out whether all the featured props are actually showing.
