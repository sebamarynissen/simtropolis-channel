info:
  summary: Crossroads Church
  description: |-
    A typical English church meant to fill the space between a straight and a diagonal road.  
    You can choose the version for flat terrain or the one meant for a little slope.

    The church and the ground are separate props so you can also make your own lots.

    HOW TO USE:

    For the flat lot, simply find the church in the landmarks menu and plop it!  
    For the version with stairs, make the straight road rise 3.5m as in the pictures, and then plop the church. It might take a bit of trial and error to get the right height.  
    Lastly you can decorate the lots with your favourite MMP trees and plants.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Row Houses Megapack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [OW Roundabout Set](https://community.simtropolis.com/files/file/35519-ow-roundabout-set/)

    [JFF Tenement 04](https://community.simtropolis.com/files/file/36401-tenement-04-diagonal/)  (only for the slope version)

    Recommended for the trees:

    (BSC MEGA Props - CP Vol01  
    BSC Mega Props - CP Vol02  
    BSC MEGA Props - SG Vol 01) all contained in the [BSC Common Dependencies Pack](https://sc4evermore.com/index.php/downloads/download/22-dependencies/3-sc4d-lex-legacy-bsc-common-dependencies-pack)

    If you enjoy these creations, check out my other files and as always stay tuned for more coming to the STEX!

    justforfun
