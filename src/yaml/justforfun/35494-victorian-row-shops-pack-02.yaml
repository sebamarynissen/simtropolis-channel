info:
  summary: Victorian Row Shops Pack 02
  description: |-
    If the 15 shop parades of pack 1 were not enough to quench your sims' commercial thirst, here is a pack of 16 more, divided as follows:

    #5 Cs$ parades with 50 shop fronts,  
    #7 Cs$$ parades with 106 shop fronts,  
    #4 Cs$$$ parades with 44 shop fronts,

    for a total of 20 lots and 200 shops selling all sorts of goods and services from clothing, hardware and stationery to food, antiques, plumbing, jewellery, flowers, spectacles, toys, and much more. These are all real shops hailing from London, Paris, New York, the Netherlands, and elsewhere. Browse their windows at zoom 6 or use the extra-cheats to zoom in further and enjoy the fine details allowed by S3D modelling!

    The lots use shared dummy buildings and grow on medium-density Chicago tileset, in various sizes as specified in the documentation images.   
    All models and lots are included in a single file that claims barely 3.16 MB of your disk.

    Fun fact: if plopped next to each other, the combined parades of the two packs form a strip of 401 shops that is exactly 3.2 km long, or about 2 miles.

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Victorian Row Houses MegaPack 01](https://community.simtropolis.com/files/file/34759-victorian-row-houses-megapack-01/)

    [JFF Victorian Row Houses Megapack 02](https://community.simtropolis.com/files/file/35406-victorian-row-houses-megapack-02/)

    [JFF Victorian Semi-detached House Pack 01](https://community.simtropolis.com/files/file/35172-victorian-semi-detached-houses-pack-01/)

    Textures:

    [11241036 Textures](https://community.simtropolis.com/files/file/33651-11241036-textures/)  
    [NDEX Base Texture Set 1](https://community.simtropolis.com/files/file/11617-ndex-texture-set-volume-1/)

