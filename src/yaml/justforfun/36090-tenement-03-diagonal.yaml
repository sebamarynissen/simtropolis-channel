info:
  summary: Tenement 03 Diagonal
  description: |-
    Have you found it hard to grow the diagonal residentials you want?

    No more!  Now you can zone a high-density 1x4 lot under Chicago tileset, and if there is enough R$ demand this diagonal tenement will soon spring up as you intended.  
    It houses up to 550 sims and allows trees and other MMPs to be plopped inside it. All this in just 66 KB!

    DEPENDENCIES:

    Essential for the models to appear correctly:

    [JFF Tenement 01](https://community.simtropolis.com/files/file/35763-tenement-1/)

    [JFF Victorian Row Shops Pack 01](https://community.simtropolis.com/files/file/34809-victorian-row-shops-pack-01/)

    [JFF Row Shops Diagonal](https://community.simtropolis.com/files/file/35527-victorian-row-shops-diagonal/)

    [JFF Roundabout set](https://community.simtropolis.com/files/file/35519-ow-roundabout-set/)

    Recommended:

    [Bombardiere British Boxes](https://community.simtropolis.com/files/file/29965-british-boxes/)  (for the bollards)

    [SFBT Essentials](https://sc4evermore.com/index.php/downloads/download/22-dependencies/13-sfbt-essentials)  (for the street boxes)

    If you enjoy these S3D models, stay tuned for more coming to the STEX!

    justforfun
