info:
  summary: Automata only disappear when far away or off-screen
  description: |-
    Changes the traffic algorithms so that cars and other automata, including trams and rail, only disappear when they have driven 30+ tiles or are off-screen. The game also spawns as many automata as it allows, so larger cities get realistic traffic jams and gridlock.

    Traffic on NAM puzzle pieces or NWM lanes with paths that do not match up still disappears, and buses still disappear at bus stops.

    It is inspired by the Persistent Automata Mod and replaces the settings of the NAM Automata Controller, so it is installed to load after it.
  conflicts: Incompatible with the Persistent Automata Mod.
  author: Fatherted
  website: https://community.simtropolis.com/files/file/29946-realistic-automata-mod/
