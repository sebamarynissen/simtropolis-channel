# info:
#   summary: WestWind Tram
#   description: |-
#     The WestWind Tram mod replaces the textures for the NAM's GLR network (v49, as of this release).  
#     WWTram offers the four variants: Network 1 Main and Network 2 Rural, plus two additional variations of Network 1, giving you four possible designs.

#     The mod includes not only TIA (Tram-in-Avenue) and TIR/TOR (Tram-in-Road/Tram-on-Road)  
#     but also a choice of four TIS (Tram-in/on-Street) styles:  
#     .. Maxis,  
#     .. TSR (Tarseled Street by Rivit),  
#     .. WWS (WestWindStreet!),  
#     .. Firenze (WWS-SAM 8 Firenze).

#     It also includes access ramps for FLUPs.

#     Street options available: Maxis, TSR, and WWS, as well as support for SAMs by NAM, Rivit, MGB, and WWS.

#     Additionally, there are components derived from other GLR texture creators via their stations, lots, and plugins; please refer to my file \[WWTram - LotSupport.dat\] .  
#     This list is by no means exhaustive, and I would be happy to update it if you provide me with the relevant information.

#     For **SENT users**, AKA has kindly provided a version adapted to his road(+) textures, included directly in [SENT 3](https://community.simtropolis.com/files/file/36877-sent/) .

#     **Production notes and aesthetic choices**  
#     You will notice that the set relies heavily on transparency, allowing the grass from your terrain mod to show through.  
#     However, due to their non-"FLEX" nature, certain pieces require a base texture. I chose to force this base texture to be "grass" rather than paving.  
#     Consequently, this release was produced using "SuddenValley" grass, while the paving is my own creation (plugin: WW-SideWalk4).  
#     I will soon provide the ***WWTram Fabrik***, allowing you to modify the paving and grass textures in this version.

#     One final point: .. on this day ..  **this version does not yet include the T21s I am currently working on**\*.

#     **Installation**  
#     Unzip into your Plugins folder.  
#     Keep the \_EU or \_US folder that applies to your setup.  
#     For optional streets ("\_opt"), keep only one file.  
#     For optional TIS, keep the folder you prefer.  
#     For xSAM\_override, keep the xSAM files that match your configuration.

#     **Dependencies**  
#     NAM 49 + .. Of course !

