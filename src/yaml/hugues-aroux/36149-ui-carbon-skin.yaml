group: hugues-aroux
name: ui-carbon-skin
version: "1.5.0"
subfolder: 900-overrides
info:
  summary: Scoty UI Carbon Skin
  description: |-
    ## This mod replaces the SC4 interface

    Its dominant colors are anthracite and gray.
    More than a simple graphic layer, CarbonSkin also retouches, corrects and repositions interface objects, slightly enlarges some fonts (+1 or 2 points) and adds a new icon set.
    Some «Budget» windows are generated by the EXE, where the text color is forced to Maxis blue.
    In addition, hundreds of query windows and buttons customized by other plugins (for example by the BSC team) keep the Maxis colors.

    ## What this interface does or does not do

    It does not support the small screen interface (800x600), «tutorial» mode, Developer mode or non-transparent mode.

    Scoty Carbon Skin **supports and adapts** the following plugins:
    - **DAMN Manager**: small buttons for easy navigation
    - **NAM**: more compact query windows
    - **GTM «GodMod»** (`pkg=warrior:god-terraforming-in-mayor-mode`)
    - **SAVE WARNING** button: only option A («Disabled»), with translations in 12 languages \*
    - **YELLOW PAUSE REMOVER**
    - **RAISE UI MOD** (`pkg=warrior:raise-the-ui-mod`): 40 px higher, see the "raise-ui" variant
    - **REGION CENSUS DLL**
    - **CENSUS REPOSITORY FACILITY v4.0** (`pkg=kel9509:census-repository`): see the "census-ui" variant
    - **RCI DLL Query Upgrade** (`pkg=kel9509:rci-query-upgrade`): styles A to E, see the "rci-query" variant
    - **Submenus DLL**
    - **Data View Extensions DLL**
    - **Extended Terrain DLL**
    - **Building Style Control UI for the Building Styles DLL**
    - **CAM 3 Core Files** and **CAM 3 Casino Specialization**

    ## Game setup

    This mod requires interface transparency: make sure this option is checked in the «Graphics options» panel. Otherwise the Maxis buttons come back.

    Japanese, Chinese and other languages with non-Latin characters are not translated.

    \* English, French, Dutch, German, Danish, Swedish, Norwegian, Finnish, Polish, Italian, Spanish, Portuguese
