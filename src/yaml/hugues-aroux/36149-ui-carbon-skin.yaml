name: ui-carbon-skin
version: "1.5.0"
subfolder: 900-overrides
info:
  summary: Scoty UI Carbon Skin
  description: |-
    ## This Mod replaces the SC4 interface

    Its dominant colors are Anthracite and Gray. And not only ...  
    More than a simple graphic layer, CarbonSkin offers light retouching, corrections and repositioning of interface objects. Also slight adjustments to fonts (+1|2 points).  
    Nothing too disruptive for this version (the next one perhaps ![:ooh:](https://community.simtropolis.com/assets/emoticons/default_31.gif ":ooh:")). And a new icon set. “old”\* players will find their way there.  
    The choice of gray, rather than full anthracite, is a compromise with my original intention. It should be noted that certain «Budget» windows are generated in the EXE  
    where the text color is forced to Maxis Blue. In addition, hundreds of query windows and buttons (partially) personalized in the plugins - follow my gaze to the BSC team ;-) - retain the Maxis colors, ... !!

    ## What this interface does or does not do

    *CarbonSkin doesn’t make your breakfast, even though its round head looks like a coffee maker.*

    It does not support the small screen interface (800x600), «tutorial» mode, Developer mode or non-transparent mode - details below. 
     
    Scoty Carbon Skin **supports|redeclares and adapts** the following plugins :  
    - **DAMN Manager** .. >> .. [STEX damn-manager](https://community.simtropolis.com/files/file/28205-damn-manager/) ... Small buttons for easy navigation  
    - **NAM (47... )** .. >> .. [SC4E NAM](https://www.sc4evermore.com/index.php/downloads/category/6-network-addon-mod-nam) ... More compact Queries-windows ... !  
    - **GTM «GodMod»** .. >> .. [STEX god-terraforming-in-mayor-mode](https://community.simtropolis.com/files/file/20092-god-terraforming-in-mayor-mode/)  
    - **SAVE WARNING** button .. >> .. [STEX save-warning](https://community.simtropolis.com/files/file/32812-save-warning/) ... Only the A option («Disabled») !! Added translation in 12 languages \*\*  
    - **YELLOW PAUSE REMOVER** .. >> .. [STEX smp-yellow-pause-thingy-remover](https://community.simtropolis.com/files/file/18680-smp-yellow-pause-thingy-remover/)  
    - **RAISE UI MOD** .. >> .. [STEX raise-the-ui-mod](https://community.simtropolis.com/files/file/23771-raise-the-ui-mod/) ... 40 px sup.  
    - **REGION CENSUS DLL** .. >> .. [STEX region-view-census-ui-dll-plugin](https://community.simtropolis.com/files/file/36145-region-view-census-ui-dll-plugin/)
    - **CAM 2.5 - RC2** **>>** Only on request  (PM on Simtropolis)  
    - **CENSUS REPOSITORY FACILITY v4.0** .. >> .. [STEX census-repository-facility-v40](https://community.simtropolis.com/files/file/36245-census-repository-facility-v40/) ... Choose \[... 4\_Expanded.dat\] **or** \[... 4\_Regular.dat\] as your plugin installation.
    - **RCI DLL Query Upgrade** .. >> .. [STEX rci\-dll-query-upgrade 3.0](https://community.simtropolis.com/files/file/36239-rci-dll-query-upgrade/) ... Choose one of the 5 window styles (A to E) as your installation of this plugin.
    - **Submenus DLL** .. >> .. [STEX submenus-dll](https://community.simtropolis.com/files/file/36142-submenus-dll/)
    - **Data View Extensions DLL** .. >> .. [STEX ExtendedDataWiew](https://community.simtropolis.com/files/file/36632-data-view-extensions-dll/)  
    - **Extended Terrain DLL** .. >> .. [STEX ExtendedTerrain](https://community.simtropolis.com/files/file/36614-extended-terrain-dll/)
    - **Building Style Control UI for the Building Styles DLL** .. >> ..  [STEX BuildingStyle UI](https://community.simtropolis.com/files/file/36962-building-style-control-ui-for-the-building-styles-dll/)  
    - **CAM 3 - Casino Specialization** .. >> ..  [STEX CAM Casino](https://community.simtropolis.com/files/file/36981-colossus-addon-mod-casino-specialization/)  
    - **CAM 3  Core Files** .. >> ..  [STEX CAM Core Files](https://community.simtropolis.com/files/file/36978-colossus-addon-mod-core-files/)

    ## Game setup  

    As mentioned above, this Mod requires being in Interface transparency. Make sure you have checked this option in the «Graphics options» panel. If not, nothing dramatic, just ... the ugly Maxis buttons come back, aaargh! So ...

    ![65dfa141c4bd2_Capturedcran2024-02-28221003.png.9d9807bbe0f8a19e7b212e41db897273.png](https://www.simtropolis.com/objects/attachments/monthly_2024_02/65dfa141c4bd2_Capturedcran2024-02-28221003.png.9d9807bbe0f8a19e7b212e41db897273.png)![65dfa163d9ee9_Capturedcran2024-02-28221049.png.ee01300bde061e50650ae5c3d1ba2938.png](https://www.simtropolis.com/objects/attachments/monthly_2024_02/65dfa163d9ee9_Capturedcran2024-02-28221049.png.ee01300bde061e50650ae5c3d1ba2938.png)

    *Due to lack of knowing how to do it properly, I did not translate into Japanese, Chinese, etc. Non-Roman Characters. Any help in this direction will be welcome.*

    \* if you play SC4 after 20 years, you’re not that young anymore.. sorry! As for the others, don’t smile, it will come quickly!! Waaaarf !  
    \*\* English, French, Dutch, German, Danish, Swedish, Norwegian, Finnish, Polish, Italian, Spanish, Portuguese
