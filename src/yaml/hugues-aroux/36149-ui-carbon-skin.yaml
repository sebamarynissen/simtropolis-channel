assets:
  - assetId: hugues-aroux-scoty-ui-carbon-skin
    withConditions:
      # Census Repository Facility v4.0
      - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "regular" }
        dependencies:
          - kel9509:census-repository
        exclude:
          - "/y_scoty_Carbon_CensusRepoQE_v4_Expanded\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "expanded" }
        dependencies:
          - kel9509:census-repository
        exclude:
          - "/y_scoty_Carbon_CensusRepoQE_v4_Regular\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "none" }
        exclude:
          - "/y_scoty_Carbon_CensusRepoQE_"

      # RCI DLL Query Upgrade: one skin file for each of the styles A to E
      # (the values match those of the `kel9509:rci-query-upgrade:style` variant)
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "vertical-bold-full" }
        dependencies:
          - kel9509:rci-query-upgrade
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0[BCDE]\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "vertical-bold-tooltips" }
        dependencies:
          - kel9509:rci-query-upgrade
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0[ACDE]\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "horizontal-bold" }
        dependencies:
          - kel9509:rci-query-upgrade
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0[ABDE]\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "vertical-light-full" }
        dependencies:
          - kel9509:rci-query-upgrade
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0[ABCE]\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "vertical-light-tooltips" }
        dependencies:
          - kel9509:rci-query-upgrade
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0[ABCD]\\.dat$"
      - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "none" }
        exclude:
          - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_"

      # Raise the UI Mod
      - ifVariant: { hugues-aroux:ui-carbon-skin:raise-ui: "yes" }
        dependencies:
          - warrior:raise-the-ui-mod
      - ifVariant: { hugues-aroux:ui-carbon-skin:raise-ui: "no" }
        exclude:
          - "/z_scoty_Carbon_RaiseUI\\.dat$"

variantInfo:
  - variantId: hugues-aroux:ui-carbon-skin:census-ui
    description: For users of `pkg=kel9509:census-repository`, choose the option that matches the installed UI.
    values:
      - value: regular
        description: Default view with information about Residential, Commercial and Industrial.
      - value: expanded
        description: Adds a City Budget Overview panel to the regular UI.
      - value: none
        description: For users who do not use the Census Repository Facility v4.0.
        default: true
  - variantId: hugues-aroux:ui-carbon-skin:rci-query
    description: For users of `pkg=kel9509:rci-query-upgrade`, choose the same style chosen for that package. The MINI styles are not supported by the skin, so choose "none" for them.
    values:
      - value: vertical-bold-full
        description: "Style A: vertical layout, bold font, full list of building styles."
      - value: vertical-bold-tooltips
        description: "Style B: vertical layout, bold font, building styles shown in a tooltip."
      - value: horizontal-bold
        description: "Style C: horizontal layout, bold font."
      - value: vertical-light-full
        description: "Style D: vertical layout, light font, full list of building styles."
      - value: vertical-light-tooltips
        description: "Style E: vertical layout, light font, building styles shown in a tooltip."
      - value: none
        description: For users who do not use the RCI DLL Query Upgrade, or use one of its MINI styles.
        default: true
  - variantId: hugues-aroux:ui-carbon-skin:raise-ui
    description: For users of `pkg=warrior:raise-the-ui-mod`, which raises the mayor mode UI by 40 px.
    values:
      - value: "yes"
        description: Raise the mayor mode UI.
      - value: "no"
        description: Do not raise the mayor mode UI.
        default: true

---
