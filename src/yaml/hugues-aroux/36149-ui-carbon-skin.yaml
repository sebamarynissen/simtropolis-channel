assets:
- assetId: "hugues-aroux-scoty-ui-carbon-skin"
  withConditions:
  - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "regular" }
    dependencies:
    - kel9509:census-repository
    exclude:
    - "/y_scoty_Carbon_CensusRepoQE_v4_Expanded.dat"
  - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "expanded" }
    dependencies:
    - kel9509:census-repository
    exclude:
    - "/y_scoty_Carbon_CensusRepoQE_v4_Regular.dat"
  - ifVariant: { hugues-aroux:ui-carbon-skin:census-ui: "none" }
    exclude:
    - "/y_scoty_Carbon_CensusRepoQE.*.dat"

  - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "vertical" }
    dependencies:
    - kel9509:rci-dll-query-upgrade 
    exclude:
    - "/y_scoty_Carbon_RCI-DLL.*.dat"
    include:
    - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0B.dat"
  - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "horizontal" }
    dependencies:
    - kel9509:rci-dll-query-upgrade
    exclude:
    - "/y_scoty_Carbon_RCI-DLL.*.dat"
    include:
    - "/y_scoty_Carbon_RCI-DLL-Qry-Upgrd_3-0C.dat"
  - ifVariant: { hugues-aroux:ui-carbon-skin:rci-query: "none" }
    exclude:
    - "/y_scoty_Carbon_RCI-DLL.*.dat"

  - ifVariant: { hugues-aroux:ui-carbon-skin:raise-ui: "yes" }
    include:
    - "/z_scoty_Carbon_RaiseUI.dat"
  - ifVariant: { hugues-aroux:ui-carbon-skin:raise-ui: "no" }
    exclude:
    - "/z_scoty_Carbon_RaiseUI.dat"

variantInfo:
  - variantId: "hugues-aroux:ui-carbon-skin:census-ui"
    description: "For users of `pkg=kel9509:census-repository`, choose the option to match the UI you have installed"
    values:
    - value: "regular"
      description: "Default view featuring information about Residential, Commercial, and Industrial"
    - value: "expanded"
      description: "Adds a City Budget Overview panel to the regular UI"
    - value: "none"
      description: "For users who do not have the Census Repository V4 installed"
      default: "true"
  - variantId: "hugues-aroux:ui-carbon-skin:rci-query"
    description: "For users of `pkg=kel9509:rci-dll-query-upgrade`, choose the option to match the UI you have installed"
    values:
    - value: "horizontal"
      description: "City + region information is below the building information."
    - value: "vertical"
      description: "City + region information is to the right of the building information."
    - value: "none"
      description: "For users who do not have the RCI DLL Query Upgrade installed"
      default: "true"
  - variantId: "hugues-aroux:ui-carbon-skin:raise-ui"
    description: "For users of `pkg=warrior:raise-the-ui-mod`, which raises the mayor mode UI up 40px vertically."
    values:
    - value: "yes"
      description: "Raise the mayor mode UI."
    - value: "no"
      description: "Do not raise the mayor mode UI."
      default: "true"

