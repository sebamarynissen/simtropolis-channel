info:
  summary: Sports Fields Textures
  description: |-
    **Base texture and overlay package** distributed across 18 files  
    for creating the following **outdoor sports field surfaces**:  
    **Athletics track**: ortho ; javelin, shot put, hammer throw variations, etc, which can accommodate Rugby, Football, ... game markings (off-center) in its center.  
    **Rugby**: ortho and dia ; plus off-center for athletics track.  
    **Football**: ortho (white, yellow) and dia ; plus off-center for athletics track.  
    **Junior Football**: ortho (white, yellow) ; plus off-center.  
    **American Football**: ortho and dia ; plus off-center for athletics track.  
    **Australian Football**: ortho.  
    **Cricket**: ortho.  
    **Lacrosse**: ortho, dia women's, men's (white, yellow) ; + off-center for athletics track.  
    **Field Hockey**: ortho, dia.  
    **Baseball**: ortho & dia ; 2 surface options available.  
    **Softball**: ortho and dia ; 2 surface options available.  
    **Basketball**: ortho, dia, half ; + centered ortho in various surfaces.  
    **Volleyball**: ortho, dia in various surfaces, sand, grass.  
    **Tennis**: ortho, dia and centered ortho in various surfaces.  
    **Handball**: ortho, dia (white, yellow) and artificial surface.  
    **Golf**: Tees, modular greens, modular fairways on a roof (with roof option).

    For several of these sports, I offer **various grass and surfaces**:  
    **4 patterned turfs**: 62 shapes (Soccer, Rugby, Baseball, Softball, Lacrosse).  
    **5 standard turfs**: 36 shapes (All sports).  
    **1 tennis turf**: ortho and dia, 10 shapes.  
    **5 surfaces of soil, sand and clay**: 20 shapes.  
    **4 artificial surfaces**: 20 shapes.  
    **Court wear**: (Soccer, Tennis, etc.) 17 shapes.

    Some textures incorporate «SuddenValley» grass, which can be recalculated using the Fabrik.  
    Note that many textures, such as line colors and the 9 main types of grass .. and more .. are easily modifiable in the >> [**Fabrik**](https://1drv.ms/f/s!AlD-_0WBCRHjiyfobnRthZ2S9PHX) << (50+ BMPs are accessible and editable).

    The scale of each field is a clever compromise between its actual dimensions, its integration into the Maxis grid, and the ability to combine it with 130% scale Buildings and Props.

    To see what's in this package: details ([Scoty\_SFT\_notice.pdf](https://1drv.ms/f/s!AlD-_0WBCRHjiyfobnRthZ2S9PHX)) are available on my drive.
