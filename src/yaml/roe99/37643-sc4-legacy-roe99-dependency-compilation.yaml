group: roe99
name: model-mega-pack-vol01
version: "1.0.0"
subfolder: 100-props-textures
info:
  summary: roe99 Model MEGA Pack vol01 (residential)
  description: |-
    Building models by roe99, part of the SC4 Legacy roe99 Dependency Compilation.
    Contains the residential models from:
    - DaVinci Tower V2
    - Elsha Condoz
    - Regatta Towers
    - The Peak part1
    - The Peak final
  conflicts: |-
    Contains the same building models as the original roe99 uploads (`pkg=roe99:da-vinci-update`, `pkg=roe99:elsha-condoz`, `pkg=roe99:regatta`, `pkg=roe99:the-peak-part1`, `pkg=roe99:the-peak-final`), which also include the original lots. Install only one of the two.
  author: roe99
  website: https://community.simtropolis.com/files/file/37643-sc4-legacy-roe99-dependency-compilation/
  images:
    - https://www.simtropolis.com/objects/screens/monthly_2026_10/6ac6de66c9799_Roe99ModelMEGAPackvol01_index.jpg.83837ff48023d8e882410c2a4f4e6391.jpg

conflicting:
  # these packages include the same building models together with their original lots
  - roe99:da-vinci-update
  - roe99:elsha-condoz
  - roe99:regatta
  - roe99:the-peak-part1
  - roe99:the-peak-final

assets:
  - assetId: roe99-dependency-compilation
    include:
      - "/Roe99 Model MEGA Pack vol01\\.dat$"

