version: "1.0"
subfolder: 700-transit
info:
  summary: West wing of Shinjuku Station in Tokyo
  description: |-
    Shinjuku Station is a station located in Tokyo, Japan. Serving almost 4 million people daily, Shinjuku Station is the busiest train station in the world.

    12 different subway and ground level train lines converge on Shinjuku Station from all directions. Shinjuku is the main transfer point for residents of Tokyo heading East from the suburban Western Tokyo.

    Enjoy my rendition of this magnificent station.

    The station has a capacity of 4 million, and also acts as a subway and bus terminal.

    The station is divided into two blocks, the West and East Wing. It is best to use the two at the same time next to each other, otherwise it will look rather strange.

    A special thanks to all those in the HKABT team, you guys were really helpful.
  author: tepodon
  website: https://community.simtropolis.com/files/file/24569-tky-shinjuku-station-west-wing/
  images:
    - https://www.simtropolis.com/objects/screens/0012/64b6ae86e691f3dbe9babc0c74eb3ea3-Shinjuku%20WEST.jpg
    - https://www.simtropolis.com/objects/screens/0012/64b6ae86e691f3dbe9babc0c74eb3ea3-Shinjuku%20WEST1.jpg
# TODO: the lot uses the textures 0xc9000020 and 0x258f2000, whose package is still unknown (formerly LEX 638)
