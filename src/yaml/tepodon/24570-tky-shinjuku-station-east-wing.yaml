info:
  summary: East wing of Shinjuku Station in Tokyo
  description: |-
    Shinjuku Station is a train station located in Tokyo, Japan. Serving almost 4 million people every day, it is the busiest train station in the world.

    12 different subway and ground level train lines converge on Shinjuku Station. Shinjuku is the main transfer point for residents of Tokyo heading into central Tokyo from the suburban western Tokyo.

    Enjoy my rendition of Shinjuku Station.

    The station functions as both a bus and subway terminal in addition to being a passenger rail station, its capacity is 4 million.

    For maximum enjoyment you should use both the East and West Wing next to each other, otherwise it will look rather strange.

    A special thanks to all those in the HKABT team, you guys were really helpful.
  author: tepodon
  website: https://community.simtropolis.com/files/file/24570-tky-shinjuku-station-east-wing/
